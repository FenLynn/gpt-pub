[package]
name = "figurestudio"
version = "0.2.0"
description = "FigureStudio scientific plotting desktop shell"
authors = ["FenLynn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
