[package]
name = "codex-handoff"
version = "1.0.0-alpha.1"
description = "Read-only Codex project handoff exporter"
authors = ["FenLynn"]
edition = "2021"

[lib]
name = "codex_handoff_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "CodexHandoff"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
