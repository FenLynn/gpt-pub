<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;box-sizing:border-box}
.prev,.cur{box-sizing:border-box;text-align:center;max-width:90%;word-break:break-word}
.prev{font-size:18px;line-height:1.35;font-weight:400;margin-bottom:4px}
.cur{font-size:28px;line-height:1.34;font-weight:500;padding:2px 6px;border-radius:6px}
.prev:empty,.cur:empty{display:none}
mark{background:#ffe66d;color:#111;border-radius:3px;padding:0 2px;text-shadow:none;-webkit-text-stroke:0 transparent}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div id="prev" class="prev"></div><div id="cur" class="cur"></div></div>
<script>
window.LocalSub={setSubtitle:function(x){
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let cur=esc(x.current);
 (x.keywords||[]).filter(Boolean).forEach(k=>{let ek=esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');cur=cur.replace(new RegExp(ek,'gi'),m=>'<mark>'+m+'</mark>')});
 const style=x.style||{}; const curEl=document.getElementById('cur'); const prevEl=document.getElementById('prev');
 const maxWidth=(style.maxWidthPercent||90)+'%'; curEl.style.maxWidth=maxWidth; prevEl.style.maxWidth=maxWidth;
 const fontSize=Number(style.fontSize||28);
 curEl.style.fontSize=fontSize+'px';
 prevEl.style.fontSize=Math.max(12,Math.round(fontSize*Math.max(.4,Math.min(1,Number(style.previousScalePercent||66)/100))))+'px';
 curEl.style.color=style.currentColor||'#FFFFFF';
 prevEl.style.color=style.previousColor||'#D8D8D8';
 curEl.style.fontWeight=String(style.currentWeight||500);
 prevEl.style.fontWeight=String(style.previousWeight||400);
 prevEl.style.opacity=String(Math.max(0,Math.min(1,Number(style.previousOpacity==null?72:style.previousOpacity)/100)));
 const outlineWidth=Math.max(0,Math.min(4,Number(style.outlineWidth==null?1.5:style.outlineWidth)));
 const outlineColor=style.outlineColor||'#000000';
 const shadowOpacity=Math.max(0,Math.min(1,Number(style.shadowOpacity==null?55:style.shadowOpacity)/100));
 [curEl,prevEl].forEach(el=>{
   el.style.webkitTextStroke=outlineWidth>0?(outlineWidth+'px '+outlineColor):'0 transparent';
   el.style.paintOrder='stroke fill';
   el.style.textShadow=shadowOpacity>0?('0 2px 4px rgba(0,0,0,'+shadowOpacity+')'):'none';
 });
 const opacity=Math.max(0,Math.min(70,style.backgroundOpacity||0))/100;
 if(style.background==='Light'){curEl.style.background='rgba(0,0,0,'+Math.max(.12,opacity)+')';curEl.style.padding='4px 10px'}
 else if(style.background==='Dark'){curEl.style.background='rgba(0,0,0,'+Math.max(.35,opacity)+')';curEl.style.padding='5px 12px'}
 else{curEl.style.background='transparent';curEl.style.padding='2px 6px'}
 curEl.innerHTML=cur; prevEl.textContent=x.previous||'';
}};
</script>
</body>
</html>
