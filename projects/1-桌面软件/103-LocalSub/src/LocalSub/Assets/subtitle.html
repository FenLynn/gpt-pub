<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px 24px;box-sizing:border-box}
.prev{font-size:20px;color:rgba(255,255,255,.55);margin-bottom:5px;text-shadow:0 1px 3px #000}
.cur{max-width:95%;font-size:34px;line-height:1.35;font-weight:600;color:white;text-align:center;padding:7px 16px;border-radius:10px;background:rgba(0,0,0,.34);text-shadow:0 2px 5px #000}
mark{background:#ffe66d;color:#111;border-radius:4px;padding:0 2px}
</style></head><body><div class="wrap"><div id="prev" class="prev"></div><div id="cur" class="cur">LocalSub</div></div>
<script>
window.LocalSub={setSubtitle:function(x){const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cur=esc(x.current);(x.keywords||[]).filter(Boolean).forEach(k=>{let ek=esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');cur=cur.replace(new RegExp(ek,'gi'),m=>'<mark>'+m+'</mark>')});document.getElementById('cur').innerHTML=cur;document.getElementById('prev').textContent=x.previous||'';}};
</script></body></html>
