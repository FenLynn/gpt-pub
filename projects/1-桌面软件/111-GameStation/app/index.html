<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f7fb">
  <meta name="description" content="GameStation · 完全离线的个人游戏工作台">
  <title>GameStation</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="./index.html" aria-label="GameStation 首页">
      <span class="brand-mark" aria-hidden="true">G</span>
      <strong>GameStation</strong>
    </a>
    <nav class="side-nav" aria-label="游戏导航">
      <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>首页</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-category="all"><span class="nav-icon">▦</span><span>全部游戏</span><b id="count-all">19</b></button>
      <button class="nav-item" data-category="board"><span class="nav-icon">♟</span><span>棋类对战</span><b id="count-board">6</b></button>
      <button class="nav-item" data-category="puzzle"><span class="nav-icon">▧</span><span>益智解谜</span><b id="count-puzzle">5</b></button>
      <button class="nav-item" data-category="arcade"><span class="nav-icon">◉</span><span>街机动作</span><b id="count-arcade">4</b></button>
      <button class="nav-item" data-category="card"><span class="nav-icon">♣</span><span>卡牌桌游</span><b id="count-card">4</b></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item settings-link" id="settingsButton"><span class="nav-icon">⚙</span><span>全局设置</span></button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" id="mobileMenu" aria-label="打开导航">☰</button>
        <div class="breadcrumbs" aria-label="当前位置">
          <span>GameStation</span><i id="crumbCategorySep">›</i><strong id="breadcrumbCategory">首页</strong>
          <i id="crumbGameSep" class="hidden">›</i><strong id="breadcrumbGame" class="hidden"></strong>
        </div>
      </div>
      <div class="game-controls hidden" id="gameControls">
        <div class="cycle-control hidden" id="modeControl" aria-label="对战模式">
          <button id="modePrev" aria-label="上一种模式">‹</button>
          <span id="modeLabel">人机对战</span>
          <button id="modeNext" aria-label="下一种模式">›</button>
        </div>
        <div class="cycle-control hidden" id="difficultyControl" aria-label="难度">
          <button id="difficultyPrev" aria-label="降低难度">‹</button>
          <span id="difficultyLabel">中等</span>
          <button id="difficultyNext" aria-label="提高难度">›</button>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="round-actions hidden" id="gameActions">
          <button class="top-action start-action" id="startButton" disabled>开始</button><span class="elapsed-label" id="gameElapsed">00:00</span>
          <button class="top-action" id="newGameButton" disabled>新局</button>
          <button class="top-action" id="pauseButton" disabled>暂停</button>
        </div>
        <button class="icon-action" id="helpButton" title="游戏帮助" aria-label="游戏帮助">?</button>
        <button class="icon-action" id="fullscreenButton" title="浏览器全屏" aria-label="浏览器全屏">⛶</button>
      </div>
    </header>

    <section class="home-view view-panel" id="homeView">
      <div class="home-layout">
        <section class="home-main">
          <div class="home-date">
            <div class="date-line"><strong id="homeDate">2026年11月4日</strong><span id="homeTime">18:00</span></div>
            <div class="weekday-line" id="homeWeekday">星期三</div>
            <div class="today-summary" id="todaySummary">今天还没有游戏记录</div>
          </div>

          <section class="activity-panel">
            <div class="panel-heading">
              <h2>游戏活动</h2>
              <span id="activitySummary">过去一年</span>
            </div>
            <div class="heatmap-layout">
              <div class="heatmap-weekdays" aria-hidden="true"><span>一</span><span>三</span><span>五</span></div>
              <div class="heatmap-content">
                <div class="heatmap-months" id="heatmapMonths"></div>
                <div class="heatmap-grid" id="heatmapGrid" aria-label="过去一年游戏活动"></div>
                <div class="heatmap-legend"><span>少</span><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><span>多</span></div>
              </div>
            </div>
          </section>
          <div class="home-art" aria-hidden="true">
            <div class="art-orbit art-orbit-one"></div><div class="art-orbit art-orbit-two"></div>
            <div class="art-card art-card-back"><span>♟</span></div>
            <div class="art-card art-card-mid"><span>2</span><span>4</span><span>8</span></div>
            <div class="art-card art-card-front"><span>G</span><i></i><i></i><i></i></div>
          </div>
        </section>

        <aside class="ranking-panel">
          <div class="ranking-heading"><h2>排行榜</h2></div>
          <div class="ranking-tabs" role="tablist" aria-label="排行榜类型">
            <button class="active" data-ranking="score" role="tab" aria-selected="true">最高分</button>
            <button data-ranking="time" role="tab" aria-selected="false">时长</button>
            <button data-ranking="plays" role="tab" aria-selected="false">次数</button>
          </div>
          <ol class="ranking-list" id="rankingList"></ol>
          <div class="ranking-empty hidden" id="rankingEmpty">开始游戏后，这里会记录你的成绩。</div>
        </aside>
      </div>
    </section>

    <section class="library-view view-panel hidden" id="libraryView">
      <div class="library-heading">
        <div><h1 id="libraryTitle">全部游戏</h1><span id="libraryCount">19 款</span></div>
        <label class="search-box"><span>⌕</span><input id="gameSearch" type="search" placeholder="搜索游戏" autocomplete="off"></label>
      </div>
      <div class="game-grid" id="gameGrid" aria-live="polite"></div>
      <div class="empty-state hidden" id="emptyState">没有找到匹配的游戏。</div>
    </section>

    <section class="workspace-view view-panel hidden" id="workspaceView">
      <div class="game-stage" id="gameStage">
        <div class="stage-loading" id="stageLoading"><span class="loading-spinner"></span><span>正在载入</span></div>
        <iframe id="gameFrame" title="GameStation 游戏区域" sandbox="allow-scripts allow-same-origin" allow="fullscreen"></iframe>
      </div>
    </section>
  </main>
</div>

<section class="help-panel hidden" id="helpPanel" role="dialog" aria-modal="false" aria-labelledby="helpTitle">
  <header class="help-header" id="helpHeader">
    <strong id="helpTitle">游戏帮助</strong>
    <button id="helpClose" aria-label="关闭帮助">×</button>
  </header>
  <div class="help-content" id="helpContent"></div>
</section>

<div class="settings-backdrop hidden" id="settingsBackdrop">
  <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="settings-heading"><h2 id="settingsTitle">全局设置</h2><button id="settingsClose" aria-label="关闭">×</button></header>
    <section class="settings-section">
      <h3>界面</h3>
      <label class="setting-row"><span>界面字号</span><select id="uiScale"><option value="1">标准</option><option value="1.08">较大</option><option value="1.16">最大</option></select></label>
    </section>
    <section class="settings-section">
      <h3>本地数据</h3>
      <div class="setting-actions"><button id="exportData">导出数据备份</button><button id="importData">导入数据备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
      <button class="danger-action" id="clearData">清空本机游戏记录</button>
      <p>数据只保存在当前浏览器中，不会上传。建议定期导出备份。</p>
    </section>
    <div class="settings-footer"><span>完全离线 · 本地运行</span><button id="settingsDone">完成</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./js/app.js"></script>
</body>
</html>
