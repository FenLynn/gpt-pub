<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="2048"><main class="game-root" id="game"><header class="game-head"><div><strong>2048</strong><div class="game-sub">方向键或滑动 · 合并相同数字</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">分数 <strong id="score">0</strong></span><span class="metric-pill">最高 <strong id="best">0</strong></span><button class="game-btn primary" id="reset">新游戏</button><button class="game-btn" id="undo">撤销一步</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(4,minmax(54px,76px));width:max-content;margin:auto;background:#cbd4e2;padding:7px;border-radius:12px"></div></div><div class="game-hint">← ↑ → ↓ 移动方块。两个相同数字碰撞时合并，合并后数值翻倍。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
