<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="./2048.css?v=2048-r1"></head><body data-game="2048"><main class="game-root game-layout game2048-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">2048</div><h2>移动提示</h2><p>使用方向键或触摸滑动，让相同数字方块碰撞并合并。</p><div class="guide-note">尽量把最大数字固定在角落，并保持其他数字有序排列。</div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" role="grid" aria-label="2048 棋盘" style="grid-template-columns:repeat(4,minmax(0,1fr));margin:auto"></div></div></section><aside class="game-tools"><div class="game-tools-heading">本局数据</div><div class="game-status" id="status">准备开始</div><div class="side-score"><div><span>当前分数</span><strong id="score">0</strong></div><div><span>最高分</span><strong id="best">0</strong></div></div><button class="game-btn" id="undo">撤销一步</button></aside></main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js"></script></body></html>
