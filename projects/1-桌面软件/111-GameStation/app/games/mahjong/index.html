<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻将</title><link rel="stylesheet" href="../shared/game.css"></head>
<body data-game="mahjong"><main class="game-root" id="game">
 <div class="game-row" id="opponents"></div>
 <section class="game-panel" style="width:min(100%,1120px);display:flex;flex-direction:column;gap:8px">
  <div class="game-row" style="justify-content:space-between;width:100%"><span class="metric-pill">牌墙 <strong id="wallCount">83</strong></span><span class="metric-pill">回合 <strong id="turnLabel">你</strong></span><span class="metric-pill">副露 <strong id="meldCount">0</strong></span></div>
  <div class="status-banner" id="tableInfo">庄家先打牌</div>
  <div class="mahjong-area"><div id="melds" class="mahjong-melds"></div><div id="discards" class="mahjong-discards"></div></div>
  <div class="game-row" id="gameControls"><button class="game-btn primary" id="drawButton">摸牌</button><button class="game-btn" id="huButton">胡牌</button><span class="metric-pill" id="phaseLabel">等待出牌</span></div>
  <div class="game-row hidden" id="claimBar"><button class="game-btn primary" id="claimHu">胡</button><button class="game-btn" id="claimKong">杠</button><button class="game-btn" id="claimPong">碰</button><button class="game-btn" id="claimChi">吃</button><button class="game-btn" id="claimPass">过</button></div>
  <div class="mahjong-hand" id="hand" style="max-height:24vh;overflow:hidden"></div>
  <details id="rulePanel" style="width:100%;text-align:left"><summary style="cursor:pointer;color:#607b90;font-size:13px;padding:4px 2px">规则选项</summary><div class="game-row" style="justify-content:flex-start;padding:5px 0"><label class="rule-toggle"><input id="ruleChi" type="checkbox" checked> 允许吃牌</label><label class="rule-toggle"><input id="ruleSevenPairs" type="checkbox" checked> 七对胡牌</label><label class="rule-toggle"><input id="ruleKong" type="checkbox" checked> 允许杠牌</label><button class="game-btn" id="applyRules">应用规则</button></div></details>
 </section>
</main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
