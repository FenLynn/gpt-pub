<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="pong"><main class="game-root" id="game"><header class="game-head"><div><strong>Pong</strong><div class="game-sub">W / S 或方向键控制球拍 · 先得 7 分获胜</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">你 <strong id="playerScore">0</strong></span><span class="metric-pill">电脑 <strong id="aiScore">0</strong></span><button class="game-btn primary" id="start">开始 / 重开</button><button class="game-btn" id="pause">暂停</button></div><div class="canvas-panel"><canvas id="canvas" class="arcade-canvas" width="640" height="360" tabindex="0" style="width:min(82vw,640px)"></canvas></div><div class="game-hint">W / S 或 ↑ / ↓ 移动球拍，也可在画布内使用鼠标。先得 7 分获胜。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
