<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="pong"><main class="game-root game-layout pong-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">PONG</div><h2>操作提示</h2><p>使用 W / S 或 ↑ / ↓ 移动左侧球拍，也可在游戏画布内移动鼠标。</p><div class="guide-note">率先得到 7 分的一方获胜。顶部工具栏负责开始、暂停和下一局。</div></aside><section class="game-main-board"><div class="canvas-panel"><canvas id="canvas" class="arcade-canvas" width="640" height="360" tabindex="0" aria-label="Pong 游戏区域"></canvas></div></section><aside class="game-tools"><div class="game-tools-heading">比赛状态</div><div class="game-status" id="status">准备开始</div><div class="side-score"><div><span>你</span><strong id="playerScore">0</strong></div><div><span>电脑</span><strong id="aiScore">0</strong></div></div></aside></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
