<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="tetris"><main class="game-root game-layout tetris-layout" id="game">
<aside class="game-guide"><div class="game-guide-kicker">KEYBOARD</div><h2>操作按键</h2><div class="key-instruction"><strong>← / →</strong><span>左右移动</span></div><div class="key-instruction"><strong>↑</strong><span>顺时针旋转</span></div><div class="key-instruction"><strong>↓</strong><span>加速下落</span></div><div class="key-instruction"><strong>Space</strong><span>直接落底</span></div><div class="key-instruction"><strong>Enter / P</strong><span>统一开始 / 暂停快捷键</span></div><div class="guide-note">点击中间游戏区域后即可使用键盘。顶部工具栏也可暂停和结束本局。</div></aside>
<section class="game-main-board"><div class="canvas-panel"><canvas class="arcade-canvas" id="canvas" width="300" height="600" tabindex="0" aria-label="俄罗斯方块游戏区域"></canvas></div></section>
<aside class="game-tools"><div class="game-tools-heading">本局数据</div><div class="game-status" id="status">准备开始</div><div class="tetris-metrics"><div><span>分数</span><strong id="score">0</strong></div><div><span>消行</span><strong id="lines">0</strong></div><div><span>等级</span><strong id="level">1</strong></div></div><div class="game-tool-note">每消除 10 行提升一个等级，下落速度逐步增加。</div></aside>
</main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
