<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="./style.css?v=game-rails-20261113"><link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css?v=workspace-polish-20261113"></head><body data-game="tetris"><main class="game-root game-layout tetris-layout" id="game" data-mode="classic">
<aside class="game-guide"><h2>操作按键</h2><div class="key-instruction"><strong>← / →</strong><span>左右移动</span></div><div class="key-instruction"><strong>↑ / Z</strong><span>顺时针 / 逆时针旋转</span></div><div class="key-instruction"><strong>↓ / 空格</strong><span>加速下落 / 直接落底</span></div><div class="key-instruction"><strong>C</strong><span>暂存方块，每块限一次</span></div><div class="key-instruction"><strong>Enter / P</strong><span>开始、暂停或继续</span></div></aside>
<section class="game-main-board"><div class="canvas-panel"><div class="tetris-stage">
<div class="tetris-playfield"><canvas class="arcade-canvas" id="canvas" width="300" height="600" tabindex="0" aria-label="俄罗斯方块游戏区域"></canvas></div>
<aside class="tetris-inboard-sidebar" aria-label="本局进度和方块预览">
 <section class="tetris-card tetris-scorecard" aria-label="本局成绩">
  <div class="tetris-inboard-score"><span>分数</span><strong id="score">0</strong></div>
  <div class="tetris-metrics"><div><span id="lineLabel">消行</span><strong id="lines">0</strong></div><div><span>等级</span><strong id="level">1</strong></div></div>
  <progress id="levelProgress" value="0" max="10" aria-label="升级进度"></progress>
 </section>
 <section class="tetris-card"><h2 id="previewTitle">下一块</h2><div class="tetris-next-frame"><canvas id="nextCanvas" width="128" height="96" role="img" aria-label="下一个方块"></canvas><canvas id="nextSecond" width="96" height="68" role="img" aria-label="第二个方块"></canvas><canvas id="nextThird" width="96" height="68" role="img" aria-label="第三个方块"></canvas></div></section>
 <section class="tetris-card tetris-hold-card"><h2>暂存 <kbd>C</kbd></h2><button class="tetris-hold" id="holdButton" type="button" aria-label="暂存或交换当前方块"><canvas id="holdCanvas" width="128" height="70" aria-hidden="true"></canvas><span id="holdEmpty">暂存当前方块</span></button></section>
</aside>
</div></div></section>
<aside class="game-tools"><div class="game-status" id="status">准备开始</div></aside>
</main><script src="../shared/bridge.js?v=workspace-layout-20261113"></script><script src="../shared/workspace.js?v=workspace-layout-20261113"></script><script src="./game.js?v=game-rails-20261113"></script></body></html>
