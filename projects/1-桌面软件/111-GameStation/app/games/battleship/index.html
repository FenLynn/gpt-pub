<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海战棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/turn-clock.css"></head><body data-game="battleship"><main class="game-root game-layout battleship-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">BATTLESHIP</div><h2>攻击提示</h2><p>点击敌方海域进行攻击。命中和未命中会分别标记。</p><div class="guide-note">舰队长度为 5、4、3、3、2。命中后优先检查相邻格，再沿直线追击。</div></aside><section class="game-main-board"><div class="fleet-boards"><div class="fleet-board"><div class="fleet-title">敌方海域 · 点击攻击</div><div id="enemy" class="game-grid" style="grid-template-columns:repeat(10,minmax(0,1fr));width:min(42vh,100%);aspect-ratio:1"></div></div><div class="fleet-board"><div class="fleet-title">己方舰队</div><div id="own" class="game-grid" style="grid-template-columns:repeat(10,minmax(0,1fr));width:min(42vh,100%);aspect-ratio:1"></div></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="game-tools-heading">战况统计</div><div class="side-score"><div><span>命中</span><strong id="hits">0</strong></div><div><span>已攻击</span><strong id="shots">0</strong></div></div></aside></main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="../shared/turn-clock.js"></script><script src="./game.js"></script></body></html>
