<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海战棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="battleship"><main class="game-root" id="game"><header class="game-head"><div><strong>海战棋</strong><div class="game-sub">寻找隐藏舰队 · 命中全部舰船即可获胜</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">命中 <strong id="hits">0</strong></span><span class="metric-pill">已攻击 <strong id="shots">0</strong></span><button class="game-btn primary" id="reset">重新布阵</button></div><div class="game-row" style="align-items:flex-start;gap:24px"><div><div class="game-sub" style="text-align:center;margin-bottom:7px">敌方海域 · 点击攻击</div><div id="enemy" class="game-grid" style="grid-template-columns:repeat(10,clamp(21px,3.6vw,31px));width:max-content"></div></div><div><div class="game-sub" style="text-align:center;margin-bottom:7px">己方舰队</div><div id="own" class="game-grid" style="grid-template-columns:repeat(10,clamp(21px,3.6vw,31px));width:max-content"></div></div></div><div class="game-hint">舰队长度：5、4、3、3、2。双方舰船自动布置；AI 会在你的回合后反击。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
