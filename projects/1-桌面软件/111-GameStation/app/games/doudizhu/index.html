<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗地主</title><link rel="stylesheet" href="../shared/game.css"></head>
<body data-game="doudizhu"><main class="game-root" id="game">
 <div class="game-row" id="opponents"></div>
 <section class="game-panel" style="width:min(100%,1120px);gap:10px;display:flex;flex-direction:column">
  <div class="game-row" style="justify-content:space-between;width:100%"><span class="metric-pill">阶段 <strong id="phaseLabel">叫地主</strong></span><span class="metric-pill">地主 <strong id="landlordLabel">未定</strong></span><span class="metric-pill">倍数 <strong id="multiplier">×1</strong></span><span class="metric-pill">我的手牌 <strong id="handCount">17</strong></span></div>
  <div class="status-banner" id="tableInfo">等待叫地主</div>
  <div class="game-row" id="bidControls"><button class="game-btn" id="bid0">不叫</button><button class="game-btn" id="bid1">1 分</button><button class="game-btn" id="bid2">2 分</button><button class="game-btn primary" id="bid3">3 分</button></div>
  <div class="game-row hidden" id="playControls"><button class="game-btn primary" id="play">出牌</button><button class="game-btn" id="pass">不出</button><button class="game-btn" id="hint">提示</button></div>
  <div class="game-row" id="lastPlayArea"><span class="metric-pill">上一手 <strong id="lastPlay">尚未出牌</strong></span><span class="metric-pill">底牌 <strong id="bottomCards">未揭示</strong></span></div>
  <div class="card-hand" id="hand" style="width:100%;min-height:64px;max-height:28vh;overflow:hidden"></div>
  <div class="game-row" id="scoreLine"></div>
 </section></main>
<script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
