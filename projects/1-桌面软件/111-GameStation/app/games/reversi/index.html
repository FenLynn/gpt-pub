<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑白棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="reversi"><main class="game-root" id="game"><header class="game-head"><div><strong>黑白棋</strong><div class="game-sub">8×8 棋盘 · 翻转对手棋子，占领更多格子</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">黑棋 <strong id="black">2</strong></span><span class="metric-pill">白棋 <strong id="white">2</strong></span><button class="game-btn" id="mode">人机对战</button><button class="game-btn primary" id="reset">新对局</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(8,clamp(35px,7.5vw,58px));width:max-content;margin:auto;background:#247a63;padding:6px;border-radius:10px"></div></div><div class="game-hint">黑棋先行。只能落在能够夹住至少一枚白棋的位置；无合法步时自动跳过。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
