<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑白棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/workspace.css"><link rel="stylesheet" href="../shared/turn-clock.css"></head><body data-game="reversi"><main class="game-root game-layout reversi-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">REVERSI</div><h2>翻转提示</h2><p>只能落在能够夹住至少一枚对方棋子的位置。落子后夹住的棋子会全部翻转。</p><div class="guide-note">无合法步时自动跳过；双方均无合法步时结束。</div></aside><aside class="reversi-record-rail" aria-label="黑白棋操作历史"><div class="reversi-record-heading"><strong>操作历史</strong><span id="reversiHistoryCount">0 步</span></div><div class="reversi-record-columns"><span>回合</span><span>落子方</span><span>用时</span></div><div class="reversi-record-scroll"><ol id="reversiMoveList" aria-label="逐步操作历史"></ol></div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(8,minmax(0,1fr));width:min(78vh,100%);aspect-ratio:1;margin:auto;background:#247a63;padding:6px;border-radius:10px"></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="gs-board-tip"><span class="reversi-hint-dot" aria-hidden="true"></span>浅绿色圆点代表可落子的位置，夹住对方棋子即可翻转。</div><button class="game-btn" id="undoButton" disabled>悔棋</button><div class="game-tools-heading">棋子数量</div><div class="side-score reversi-side-score" aria-label="黑白棋子数量"><div class="reversi-count-row" data-side="black"><span class="reversi-disc reversi-count-disc black" aria-hidden="true"></span><span class="reversi-count-name">黑色棋子</span><strong id="black">2</strong></div><div class="reversi-count-row" data-side="white"><span class="reversi-disc reversi-count-disc white" aria-hidden="true"></span><span class="reversi-count-name">白色棋子</span><strong id="white">2</strong></div></div></aside></main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="../shared/turn-clock.js"></script><script src="./game.js"></script></body></html>
