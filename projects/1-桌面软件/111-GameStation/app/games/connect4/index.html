<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四子棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="connect4"><main class="game-root game-layout connect4-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">CONNECT FOUR</div><h2>落子提示</h2><p>点击棋盘任意列，棋子会落入该列最低的空位。先连成四枚的一方获胜。</p><div class="guide-note">留意对手下一步可能形成的横向、纵向或斜向连线。</div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(7,minmax(0,1fr));width:min(82vh,100%);aspect-ratio:7/6;margin:auto;background:#42669a;padding:7px;border-radius:12px"></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="game-tools-heading">棋子数量</div><div class="side-score"><div><span>红方</span><strong id="red">0</strong></div><div><span>黄方</span><strong id="yellow">0</strong></div></div></aside></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
