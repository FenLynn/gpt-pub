<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四子棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="connect4"><main class="game-root" id="game"><header class="game-head"><div><strong>四子棋</strong><div class="game-sub">7 列落子 · 先连成四枚棋子的一方获胜</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">红方 <strong id="red">0</strong></span><span class="metric-pill">黄方 <strong id="yellow">0</strong></span><button class="game-btn" id="mode">人机对战</button><button class="game-btn primary" id="reset">新对局</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(7,clamp(38px,7vw,58px));width:max-content;margin:auto;background:#42669a;padding:7px;border-radius:12px"></div></div><div class="game-hint">点击棋盘列即可落子。人机模式下你执红棋，AI 会优先阻挡和完成连线。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
