<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="memory"><main class="game-root" id="game"><header class="game-head"><div><strong>记忆翻牌</strong><div class="game-sub">翻开卡片 · 找到全部相同图案的配对</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">步数 <strong id="moves">0</strong></span><span class="metric-pill">配对 <strong id="pairs">0 / 8</strong></span><span class="metric-pill">用时 <strong id="time">0:00</strong></span><button class="game-btn primary" id="reset">重新洗牌</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(4,minmax(62px,94px));width:max-content;margin:auto"></div></div><div class="game-hint">每次翻开两张卡片，记住图案的位置。配对成功后卡片会保持翻开。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
