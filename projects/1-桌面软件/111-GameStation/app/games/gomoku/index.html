<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五子棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="gomoku"><main class="game-root game-layout gomoku-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">GOMOKU</div><h2>落子提示</h2><p>点击棋盘交叉点落子。黑棋先行，率先连成五子的一方获胜。</p><div class="guide-note">人机模式下你执黑棋。顶部可切换本机双人及 AI 难度。</div></aside><section class="game-main-board"><div class="board-wrap"><div class="gomoku-board" id="board" aria-label="五子棋棋盘"></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="game-tools-heading">棋盘操作</div><button class="game-btn" id="undoButton">悔棋</button><div class="game-tool-note">悔棋会撤回最近一步；人机模式下会同步撤回 AI 的回应。</div></aside></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
