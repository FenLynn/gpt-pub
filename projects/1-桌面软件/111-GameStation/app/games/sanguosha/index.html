<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三国杀</title><link rel="stylesheet" href="../shared/game.css"></head>
<body data-game="sanguosha"><main class="game-root" id="game">
 <div class="game-row" id="players"></div>
 <section class="game-panel" style="width:min(100%,1120px);display:flex;flex-direction:column;gap:9px">
  <div class="game-row" style="justify-content:space-between;width:100%"><span class="metric-pill">角色 <strong>小乔 · 忠臣</strong></span><span class="metric-pill">技能 <strong>红颜 / 天香</strong></span><span class="metric-pill">回合 <strong id="turnLabel">你</strong></span><span class="metric-pill">牌堆 <strong id="deckCount">60</strong></span></div>
  <div class="status-banner" id="tableInfo">你的回合</div>
  <div class="game-row" id="targetPanel"></div>
  <div class="game-row" id="responseBar" style="display:none"><span id="responseText"></span><button class="game-btn primary" id="respondYes">响应</button><button class="game-btn" id="respondNo">不响应</button></div>
  <div class="game-row" id="tianxiangPanel" style="display:none;flex-direction:column"><span>天香：弃置一张红桃（黑桃视为红桃），将伤害转移给其他角色</span><div class="game-row" id="tianxiangCards"></div><div class="game-row" id="tianxiangTargets"></div><button class="game-btn" id="tianxiangCancel">不发动</button></div>
  <div class="game-row" id="savePanel" style="display:none"><span>你濒死了，是否使用桃自救？</span><button class="game-btn primary" id="saveYes">使用桃</button><button class="game-btn" id="saveNo">放弃</button></div>
  <div class="game-row" id="actionPanel"><span class="metric-pill" id="selectedCard">未选择手牌</span><button class="game-btn primary" id="useCard" disabled>使用</button><button class="game-btn" id="cancelCard">取消选择</button><button class="game-btn" id="endTurn">结束回合</button></div>
  <div class="card-hand" id="hand" style="width:100%;max-height:24vh;overflow:hidden"></div>
  <div class="status-banner" id="skillText">红颜：黑桃视为红桃。天香：受到伤害时，可弃红桃转移伤害并令目标摸牌。</div>
  <div id="gameLog" style="width:100%;max-height:90px;overflow:hidden;text-align:left;color:#71869a;font-size:12px;line-height:1.5"></div>
 </section>
</main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
