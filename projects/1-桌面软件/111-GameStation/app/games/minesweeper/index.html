<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫雷</title>
<link rel="stylesheet" href="../shared/game.css">
<link rel="stylesheet" href="./minesweeper.css?v=mine-r44">
</head>
<body data-game="minesweeper">
<main class="game-root game-layout minesweeper-layout" id="game">
 <section class="game-main-board" aria-label="扫雷游戏区域">
  <div class="mine-classic">
   <div class="mine-grid" id="board" aria-label="扫雷棋盘" role="group"></div>
   <div class="mine-bottom-panel" aria-label="游戏状态">
    <div class="mine-bottom-stat mine-bottom-time">
     <span class="mine-medallion mine-time-medallion" aria-hidden="true">
      <svg viewBox="0 0 36 36">
       <circle cx="18" cy="19" r="13.2" fill="url(#watchFace)" stroke="#6f8495" stroke-width="1.4"/>
       <path d="M14 3.5h8M18 4v3" stroke="#60788a" stroke-width="2.2" stroke-linecap="round"/>
       <path d="M18 8v2M28.8 19h-2M18 29v-2M7.2 19h2" stroke="#70899c" stroke-width="1"/>
       <path d="M18 19l6-5M18 19l-1 7" stroke="#416a93" stroke-width="1.8" stroke-linecap="round"/>
       <circle cx="18" cy="19" r="1.7" fill="#416a93"/>
       <defs><radialGradient id="watchFace" cx="34%" cy="25%"><stop stop-color="#fff"/><stop offset=".58" stop-color="#e5edf2"/><stop offset="1" stop-color="#aebdca"/></radialGradient></defs>
      </svg>
     </span>
     <div class="mine-counter" id="timer" title="首次翻格后开始计时（秒）" aria-label="本局用时秒数">000</div>
    </div>
    <div class="mine-bottom-stat mine-bottom-mines">
     <span class="mine-medallion mine-bomb-medallion" aria-hidden="true">
      <svg viewBox="0 0 36 36">
       <path d="M18 2.5v5M18 28.5v5M2.5 18h5M28.5 18h5M6.8 6.8l3.8 3.8M25.4 25.4l3.8 3.8M29.2 6.8l-3.8 3.8M10.6 25.4l-3.8 3.8" stroke="#303b46" stroke-width="2.3" stroke-linecap="round"/>
       <path d="M14.5 8.4l3.5-2.3 3.5 2.3" fill="none" stroke="#4a5966" stroke-width="2.2" stroke-linecap="round"/>
       <circle cx="18" cy="19" r="10.2" fill="#1d252d" stroke="#10161c" stroke-width="1.5"/>
       <ellipse cx="14.4" cy="15.2" rx="3.2" ry="2.4" fill="#aebbc4"/>
       <circle cx="23" cy="22.6" r="1.2" fill="#05090d"/>
      </svg>
     </span>
     <div class="mine-counter" id="counter" title="剩余地雷" aria-label="剩余地雷">040</div>
    </div>
   </div>
  </div>
 </section>
 <div class="mine-accessibility-data" aria-hidden="true">
  <span id="status">点击任意方格开始</span><span id="mineHeadline">点击任意方格开始</span>
  <span id="level">中级</span><span id="openedCount">0</span><span id="remaining">040</span>
  <span id="mineBestInline">最佳 —</span><span id="mineRecordBest">—</span>
  <span id="mineRecordPlayed">0</span><span id="mineRecordWin">—</span>
  <button class="mine-face" id="reset" type="button" aria-label="重新开始"></button>
 </div>
</main>
<script src="../shared/bridge.js"></script>
<script src="../shared/workspace.js"></script>
<script src="./game.js?v=mine-r45"></script>
</body>
</html>
