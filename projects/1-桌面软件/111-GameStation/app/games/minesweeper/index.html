<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="./minesweeper.css?v=mine-r29"></head><body data-game="minesweeper"><main class="game-root game-layout minesweeper-layout" id="game">
<aside class="game-guide"><div class="game-guide-kicker">WINDOWS 7 BLUE</div><h2>扫雷操作</h2><div class="key-instruction"><strong>左键</strong><span>翻开方格</span></div><div class="key-instruction"><strong>右键</strong><span>插旗 / 取消旗帜</span></div><div class="key-instruction"><strong>中键 / 双击</strong><span>在已翻开的数字格上操作，先闪烁提示；旗帜数正确时展开周围方格</span></div><div class="guide-note">首击优先展开安全区域；双击数字格、中键或同时按下左右键，可闪烁提示周围未翻开的方格。旗帜数量与数字一致时展开。</div></aside>
<section class="game-main-board"><div class="mine-classic"><div class="mine-grid" id="board" aria-label="扫雷棋盘" role="group"></div><div class="mine-bottom-panel"><div class="mine-bottom-stat mine-bottom-left"><span class="mine-medallion mine-flag-medallion" aria-hidden="true">⚑</span><div class="mine-counter" id="counter" title="剩余地雷" aria-label="剩余地雷">040</div><span class="mine-status-summary" role="status" aria-live="polite"><span class="mine-status-led" aria-hidden="true"></span><strong id="mineHeadline">点击任意方格开始</strong></span></div><button class="mine-face" id="reset" type="button" aria-label="重新开始">🙂</button><div class="mine-bottom-stat mine-bottom-right"><span class="mine-personal-best" id="mineBestInline">最佳 —</span><div class="mine-counter" id="timer" title="首次翻格后开始计时（秒）" aria-label="本局用时秒数">000</div><span class="mine-medallion mine-time-medallion" aria-hidden="true">◷</span></div></div></div></section>
<aside class="game-tools"><div class="game-tools-heading">当前状态</div><div class="game-status" id="status">点击任意格子开始</div><div class="mine-side-stats"><div><span>难度</span><strong id="level">中级</strong></div><div><span>已翻开</span><strong id="openedCount">0</strong></div><div><span>剩余地雷</span><strong id="remaining">040</strong></div><div><span>个人最快</span><strong id="mineRecordBest">—</strong></div><div><span>已玩局数</span><strong id="mineRecordPlayed">0</strong></div><div><span>通关率</span><strong id="mineRecordWin">—</strong></div></div><div class="game-tool-note">初级 9×9 / 10 雷<br>中级 16×16 / 40 雷<br>高级 30×16 / 99 雷</div></aside>
</main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js?v=mine-r29"></script></body></html>
