<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="minesweeper"><main class="game-root game-layout minesweeper-layout" id="game">
<aside class="game-guide"><div class="game-guide-kicker">WINDOWS 7 BLUE</div><h2>扫雷操作</h2><div class="key-instruction"><strong>左键</strong><span>翻开方格</span></div><div class="key-instruction"><strong>右键</strong><span>插旗 / 取消旗帜</span></div><div class="key-instruction"><strong>中键</strong><span>数字周围旗帜数正确时，快速翻开周围方格</span></div><div class="guide-note">第一次翻开保证安全。数字表示周围八格内的地雷数量。</div></aside>
<section class="game-main-board"><div class="mine-classic"><div class="mine-grid" id="board" aria-label="扫雷棋盘"></div><div class="mine-top-panel mine-bottom-panel"><div class="mine-bottom-stat"><span class="mine-medallion" aria-hidden="true">◷</span><div class="mine-counter" id="counter" aria-label="剩余地雷">040</div></div><button class="mine-face" id="reset" type="button" aria-label="重新开始">🙂</button><div class="mine-bottom-stat"><div class="mine-counter" id="timer" aria-label="用时秒数">000</div><span class="mine-medallion" aria-hidden="true">✹</span></div></div></div></section>
<aside class="game-tools"><div class="game-tools-heading">当前状态</div><div class="game-status" id="status">点击任意格子开始</div><div class="mine-side-stats"><div><span>难度</span><strong id="level">中级</strong></div><div><span>已翻开</span><strong id="openedCount">0</strong></div><div><span>剩余地雷</span><strong id="remaining">040</strong></div></div><div class="game-tool-note">初级 9×9 / 10 雷<br>中级 16×16 / 40 雷<br>高级 30×16 / 99 雷</div></aside>
</main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js"></script></body></html>
