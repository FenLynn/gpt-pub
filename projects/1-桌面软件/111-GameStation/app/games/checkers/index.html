<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国际跳棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="checkers"><main class="game-root game-layout checkers-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">CHECKERS</div><h2>走棋提示</h2><p>点击己方棋子，再点击合法目标格。存在吃子机会时必须吃子，连续吃子应继续完成。</p><div class="guide-note">棋子到达对方底线后升变为王，王可以沿斜线移动。</div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(8,minmax(0,1fr));width:min(78vh,100%);aspect-ratio:1;margin:auto"></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="game-tools-heading">棋子数量</div><div class="side-score"><div><span>红方</span><strong id="red">12</strong></div><div><span>黑方</span><strong id="black">12</strong></div></div></aside></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
