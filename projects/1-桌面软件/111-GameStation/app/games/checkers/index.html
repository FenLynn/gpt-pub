<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国际跳棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="checkers"><main class="game-root" id="game"><header class="game-head"><div><strong>国际跳棋</strong><div class="game-sub">强制吃子 · 走到底线升变为王</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">红方 <strong id="red">12</strong></span><span class="metric-pill">黑方 <strong id="black">12</strong></span><button class="game-btn" id="mode">人机对战</button><button class="game-btn primary" id="reset">新对局</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(8,clamp(35px,6.8vw,54px));width:max-content;margin:auto"></div></div><div class="game-hint">红方先行。点击己方棋子，再点击目标格；有吃子机会时必须吃子。到达底线升变为王。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
