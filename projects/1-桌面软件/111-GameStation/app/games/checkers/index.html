<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国际跳棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/turn-clock.css"><link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css?v=workspace-layout-20261113"></head><body data-game="checkers"><main class="game-root game-layout gs-tools-open checkers-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">CHECKERS</div><h2>走棋提示</h2><p>点击己方棋子，再点击合法目标格。存在吃子机会时必须吃子，连续吃子应继续完成。</p><div class="guide-note">棋子到达对方底线后升变为王，王可以沿斜线移动。</div></aside><aside class="reversi-record-rail" aria-label="西洋跳棋操作历史"><div class="reversi-record-heading"><strong>操作历史</strong><span id="reversiHistoryCount">0 步</span></div><div class="reversi-record-columns"><span>步数</span><span>操作方</span><span>用时</span></div><div class="reversi-record-scroll"><ol id="reversiMoveList" aria-label="西洋跳棋逐次操作历史"></ol></div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(8,minmax(0,1fr));width:min(78vh,100%);aspect-ratio:1;margin:auto"></div></div></section><aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="game-status" id="status">准备开始</div><div class="gs-board-tip">选择己方棋子，再点击高亮落点；有吃子机会时必须吃子。</div><button class="game-btn" id="undoButton" disabled>悔棋</button><div class="game-tools-heading">棋子数量</div><div class="side-score reversi-side-score" aria-label="双方剩余棋子数量"><div class="reversi-count-row" data-side="red"><span class="checkers-disc reversi-count-disc red" aria-hidden="true"></span><span class="reversi-count-name">红方棋子</span><strong id="red">12</strong></div><div class="reversi-count-row" data-side="black"><span class="checkers-disc reversi-count-disc black" aria-hidden="true"></span><span class="reversi-count-name">黑方棋子</span><strong id="black">12</strong></div></div></aside></main><script src="../shared/bridge.js?v=workspace-layout-20261113"></script><script src="../shared/workspace.js?v=workspace-layout-20261113"></script><script src="../shared/turn-clock.js"></script><script src="./game.js"></script></body></html>
