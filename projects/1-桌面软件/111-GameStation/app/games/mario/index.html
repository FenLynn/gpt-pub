<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级玛丽 · GameStation</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="./style.css?v=mario-nes-20261113"><link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css?v=workspace-polish-20261113"></head>
<body data-game="mario">
<main class="game-root game-layout mario-layout" id="game">
 <aside class="game-guide">
  <span class="game-guide-kicker">PIXEL PLATFORMER</span><h2>超级玛丽</h2>
  <p>穿过平台、收集金币，踩过敌人并抵达关卡终点。</p>
  <div class="key-instruction"><strong>A / D</strong><span>左右移动</span></div>
  <div class="key-instruction"><strong>← / →</strong><span>左右移动</span></div>
  <div class="key-instruction"><strong>Space</strong><span>跳跃</span></div>
  <div class="key-instruction"><strong>Shift</strong><span>加速奔跑</span></div>
  <div class="guide-note">原创像素角色与关卡素材，采用经典横版平台跳跃玩法。</div>
 </aside>
 <section class="game-main-board"><div class="canvas-panel"><div class="mario-viewport"><canvas id="canvas" class="arcade-canvas" width="960" height="540" tabindex="0" aria-label="横版平台跳跃游戏"></canvas>
  <div class="nes-panel" id="nesPanel" hidden>
   <canvas id="nesScreen" width="256" height="240" tabindex="0" aria-label="NES 卡带画面"></canvas>
   <div class="nes-picker" id="nesPicker"><div class="nes-picker-card"><h2>原版卡带</h2><p>选择本机 <code>.nes</code> 文件，进入卡带自带的关卡。</p><label class="nes-file-button" for="nesFile">选择 NES 卡带</label></div></div>
  </div>
 </div></div></section>
 <aside class="game-tools">
  <div class="game-status" id="status">准备出发</div>
  <div class="side-score mario-original">
   <div><span>世界</span><strong id="world">1-1</strong></div>
   <div><span>金币</span><strong id="coins">0</strong></div>
   <div><span>生命</span><strong id="lives">3</strong></div>
   <div><span>得分</span><strong id="score">0</strong></div>
  </div>
  <div class="mario-nes-tools">
   <label class="nes-file-button">选择卡带<input id="nesFile" type="file" accept=".nes,application/octet-stream"></label>
   <button class="game-btn" id="nesStart" type="button" disabled>主机开始 <kbd>R</kbd></button>
   <button class="game-btn" id="nesSelect" type="button" disabled>选择 <kbd>Q</kbd></button>
   <button class="game-btn" id="nesSound" type="button" disabled>开启声音</button>
   <p id="nesStatus" role="status"></p>
  </div>
 </aside>
</main>
<script src="../shared/bridge.js?v=workspace-layout-20261113"></script><script src="../shared/workspace.js?v=workspace-layout-20261113"></script><script src="./vendor/jsnes-core.js"></script><script src="./cartridge.js?v=mario-nes-20261113"></script><script src="./game.js?v=mario-nes-20261113"></script>
</body></html>
