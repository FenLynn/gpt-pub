<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国际象棋 · GameStation</title>
<link rel="stylesheet" href="../shared/game.css">
<link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css?v=chess-cleanup-20261112-r1">
<link rel="stylesheet" href="./style.css?v=chess-r2">
<link rel="stylesheet" href="../shared/turn-clock.css"></head>
<body data-game="chess">
<main class="game-root game-layout chess-layout" id="game">
  <aside class="chess-notation-rail" aria-label="国际象棋操作棋谱">
  <div class="move-panel">
   <div class="move-panel-title"><strong>操作历史</strong><span id="chessHistoryCount">0 步</span></div>
   <ol id="moveList" aria-label="国际象棋逐步棋谱"></ol>
  </div>
 </aside>
 <section class="game-main-board">
  <div class="board-wrap">
   <div class="chess-frame"><div class="chess-board" id="board" role="grid" aria-label="国际象棋棋盘"></div></div>
  </div>
 </section>
 <aside class="game-tools">
  <div class="turn-indicator"><span class="turn-dot" id="turnDot"></span><strong id="turnText">白方走棋</strong></div>
  <div class="side-score">
   <div><span>白方</span><strong id="whiteCaptured">0</strong></div>
   <div><span>黑方</span><strong id="blackCaptured">0</strong></div>
   <div><span>回合</span><strong id="moveNumber">1</strong></div>
   <div><span>状态</span><strong id="checkState">正常</strong></div>
  </div>
  <button class="game-btn" id="undoButton" type="button">悔棋</button>
  <button class="game-btn" id="flipButton" type="button">翻转棋盘</button>
  <div class="game-tool-note">白色棋子先行。人机模式由你执白；双人模式可在同一台设备轮流操作。</div>
 </aside>
</main>
<script src="../shared/bridge.js"></script><script src="../shared/workspace.js?v=chess-cleanup-20261112-r1"></script>
<script src="../shared/turn-clock.js"></script><script src="./game.js"></script>
</body>
</html>
