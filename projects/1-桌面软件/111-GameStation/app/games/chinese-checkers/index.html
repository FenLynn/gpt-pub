<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国跳棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/turn-clock.css"></head><body data-game="chinese-checkers">
<main class="game-root game-layout chinese-checkers-layout" id="game">
<aside class="game-guide"><h2>中国跳棋</h2><p>轮流移动十枚棋子，率先将全部棋子迁入对面三角营地者获胜。可以跨过相邻棋子连续跳跃，不吃棋。</p></aside>
<aside class="reversi-record-rail" aria-label="中国跳棋操作历史"><div class="reversi-record-heading"><strong>操作历史</strong><span id="reversiHistoryCount">0 步</span></div><div class="reversi-record-columns"><span>步数</span><span>操作方</span><span>用时</span></div><div class="reversi-record-scroll"><ol id="reversiMoveList" aria-label="中国跳棋逐次操作历史"></ol></div></aside><section class="game-main-board"><div class="board-wrap"><svg id="board" class="star-checkers-board" viewBox="0 0 900 900" role="group" aria-label="121 孔六角星形中国跳棋"></svg></div></section>
<aside class="game-tools"><div class="game-tools-heading">对局</div><div id="status" class="game-status" aria-live="polite">准备开始</div><div class="star-player-setting" aria-label="中国跳棋人数设置"><span>参与人数</span><div class="star-player-options" id="starPlayerOptions"><button type="button" data-players="2" aria-pressed="true">2人</button><button type="button" data-players="3" aria-pressed="false">3人</button><button type="button" data-players="4" aria-pressed="false">4人</button><button type="button" data-players="6" aria-pressed="false">6人</button></div></div><div class="gs-board-tip">棋盘固定：1号玩家始终在下方。人数按逆时针编号，人机模式由电脑接管其余座位，当前玩家编号闪烁提示。</div><button id="undoButton" class="game-btn" disabled>悔棋</button><div class="side-score reversi-side-score" id="starCounters" aria-label="各方进入终点营地棋子数"><div class="reversi-count-row" data-side="red"><span class="star-count-disc reversi-count-disc red" aria-hidden="true"></span><span class="reversi-count-name">红方入营</span><strong id="redArrived">0</strong></div><div class="reversi-count-row" data-side="blue"><span class="star-count-disc reversi-count-disc blue" aria-hidden="true"></span><span class="reversi-count-name">蓝方入营</span><strong id="blueArrived">0</strong></div></div></aside>
</main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="../shared/turn-clock.js"></script><script src="./game.js"></script></body></html>
