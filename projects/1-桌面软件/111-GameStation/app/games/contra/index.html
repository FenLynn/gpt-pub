<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原创横版射击</title><link rel="stylesheet" href="../shared/game.css"></head>
<body data-game="contra"><main class="game-root" id="game" style="gap:8px">
 <div class="game-row" style="width:min(100%,980px);justify-content:space-between"><span class="metric-pill">关卡 <strong id="stage">1 / 3</strong></span><span class="metric-pill">武器 <strong id="weapon">脉冲枪</strong></span><span class="metric-pill">生命 <strong id="lives">3</strong></span><span class="metric-pill">得分 <strong id="score">0</strong></span></div>
 <canvas id="canvas" width="800" height="450" tabindex="0" style="width:min(94vw,980px);max-height:68vh;aspect-ratio:16/9;border-radius:12px;outline:1px solid #dbe4ea"></canvas>
 <div class="game-row"><span id="status">A/D 移动 · W/空格跳跃 · J 射击 · K 手雷</span><button class="game-btn" id="start">开始/重开</button><button class="game-btn" id="pause">暂停</button></div>
</main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
