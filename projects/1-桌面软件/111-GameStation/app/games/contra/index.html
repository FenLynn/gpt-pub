<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横版射击 · 原创模式</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="contra"><main class="game-root" id="game"><header class="game-head"><div><strong>横版射击 · 原创模式</strong><div class="game-sub">原创像素风动作原型 · 不包含原作素材或 ROM</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">得分 <strong id="score">0</strong></span><span class="metric-pill">生命 <strong id="lives">3</strong></span><button class="game-btn primary" id="start">开始 / 重开</button><button class="game-btn" id="pause">暂停</button></div><div class="canvas-panel"><canvas id="canvas" class="arcade-canvas" width="640" height="360" tabindex="0" style="width:min(88vw,720px)"></canvas></div><div class="game-hint">A / D 移动，W 或空格跳跃，J 射击。此为原创玩法原型，未使用魂斗罗原作图像、音乐或 ROM。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
