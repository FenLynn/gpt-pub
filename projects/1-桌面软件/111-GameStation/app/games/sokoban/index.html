<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推箱子</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="sokoban"><main class="game-root" id="game"><header class="game-head"><div><strong>推箱子</strong><div class="game-sub">推动所有箱子到目标点 · 不要把箱子推入死角</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">关卡 <strong id="level">1 / 4</strong></span><span class="metric-pill">步数 <strong id="moves">0</strong></span><button class="game-btn" id="undo">撤销一步</button><button class="game-btn" id="reset">重置关卡</button><button class="game-btn primary" id="next">下一关 →</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(9,clamp(30px,5.5vw,48px));width:max-content;margin:auto"></div></div><div class="game-hint">方向键移动。推动箱子覆盖全部目标点即可通关；Z 撤销，R 重置。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
