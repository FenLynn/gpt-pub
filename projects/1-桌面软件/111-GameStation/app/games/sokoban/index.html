<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推箱子</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="sokoban"><main class="game-root game-layout sokoban-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">SOKOBAN</div><h2>移动提示</h2><p>方向键移动，只能推动箱子，不能拉动。把所有箱子推到目标点即可通关。</p><div class="guide-note">不要把箱子推入无法离开的角落。Z 撤销一步，R 重置关卡。</div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(9,minmax(0,1fr));width:min(84vh,100%);aspect-ratio:9/7;margin:auto"></div></div></section><aside class="game-tools"><div class="game-tools-heading">关卡状态</div><div class="game-status" id="status">准备开始</div><div class="side-score"><div><span>关卡</span><strong id="level">1 / 4</strong></div><div><span>步数</span><strong id="moves">0</strong></div></div><div class="game-tools-heading">关卡操作</div><button class="game-btn" id="undo">撤销一步</button><button class="game-btn" id="reset">重置关卡</button><button class="game-btn primary" id="next">下一关</button></aside></main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js"></script></body></html>
