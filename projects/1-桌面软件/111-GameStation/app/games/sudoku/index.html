<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="sudoku"><main class="game-root game-layout sudoku-layout" id="game"><aside class="game-guide"><div class="game-guide-kicker">SUDOKU</div><h2>解题提示</h2><p>每行、每列和每个 3×3 宫都必须填入 1–9，且不能重复。</p><div class="guide-note">先观察候选数较少的格子，再逐步排除不可能的数字。</div></aside><section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(9,minmax(0,1fr));width:min(82vh,100%);aspect-ratio:1;margin:auto"></div></div></section><aside class="game-tools"><div class="game-tools-heading">本局数据</div><div class="game-status" id="status">准备开始</div><div class="side-score"><div><span>难度</span><strong id="level">标准</strong></div><div><span>已填</span><strong id="filled">0 / 81</strong></div></div><div class="game-tools-heading">数字输入</div><div class="number-pad" id="numbers"></div><button class="game-btn" id="hint">提示</button><button class="game-btn" id="check">检查</button></aside></main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js"></script></body></html>
