<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="./sudoku.css?v=sudoku-r48"></head><body data-game="sudoku"><main class="game-root game-layout sudoku-layout" id="game">
<aside class="game-guide"><div class="game-guide-kicker">SUDOKU</div><h2>数独规则</h2>
<p class="key-instruction">每一行必须包含 1–9，且不能重复。</p>
<p class="key-instruction">每一列必须包含 1–9，且不能重复。</p>
<p class="key-instruction">每个 3×3 宫也必须包含 1–9，且不能重复。</p>
<p class="key-instruction">点击空格后，点击右侧数字或按键盘 1–9 输入；方向键切换格子，退格键清除。</p>
<div class="game-tool-note">蓝色区域表示同一行、列或宫；相同数字会同步高亮。红色表示冲突或检查出的错误。提示只告诉你答案，不会擅自填入。</div></aside>
<section class="game-main-board"><div class="game-panel"><div id="board" class="game-grid" role="grid" aria-label="九宫格数独棋盘"></div></div></section>
<aside class="game-tools">
 <div class="game-tools-heading">当前进度</div>
 <div class="game-status sudoku-status" id="sudokuStatus" aria-live="polite">选择空格，再点数字或按键盘 1–9 填写。</div>
 <div class="sudoku-metrics">
  <div><span>难度</span><strong id="level">标准</strong></div>
  <div><span>已填</span><strong id="filled">30 / 81</strong></div>
  <div><span>剩余</span><strong id="remaining">51</strong></div>
  <div><span>冲突格</span><strong id="conflicts">0</strong></div>
  <div><span>提示次数</span><strong id="hintCount">0</strong></div>
 </div>
 <div class="game-tools-heading">数字输入</div>
 <div class="number-pad" id="numbers" aria-label="数字输入键盘"></div>
 <div class="game-tools-heading">辅助操作</div>
 <button class="game-btn" id="hint">提示</button>
 <button class="game-btn" id="check">检查</button>
 <button class="game-btn" id="undo">撤销一步</button>
 <div class="sudoku-footnote">提示不会自动填数；检查会标出错误。可随时撤销自己的填写。</div>
</aside></main>
<script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="./game.js?v=sudoku-r48"></script></body></html>
