<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="sudoku"><main class="game-root" id="game"><header class="game-head"><div><strong>数独</strong><div class="game-sub">9×9 数字逻辑 · 选择空格并输入 1–9</div></div><div class="game-status" id="status">准备开始</div></header><div class="game-row"><span class="metric-pill">难度 <strong id="level">标准</strong></span><span class="metric-pill">已填 <strong id="filled">0 / 81</strong></span><button class="game-btn" id="hint">提示</button><button class="game-btn" id="check">检查</button><button class="game-btn primary" id="reset">新题</button></div><div class="game-panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(9,clamp(29px,5.2vw,43px));width:max-content;margin:auto"></div></div><div class="number-pad" id="numbers"></div><div class="game-hint">选择空白格，再点数字键或直接输入键盘数字。粗线分隔 3×3 宫。</div></main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
