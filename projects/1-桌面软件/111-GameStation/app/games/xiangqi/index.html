<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国象棋 · GameStation</title>
<link rel="stylesheet" href="../shared/game.css">
<link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css">
<link rel="stylesheet" href="./xiangqi.css?v=xq-layout-ready-20261112-r1">
<link rel="stylesheet" href="../shared/turn-clock.css"></head>
<body data-game="xiangqi">
<main class="game-root game-layout xiangqi-layout" id="game">
  <aside class="xiangqi-record-rail" aria-label="对局棋谱">
    <div class="xiangqi-record-heading"><strong>对局棋谱</strong><span id="moveCount">0 步</span></div>
    <div class="xiangqi-record-head"><span>回合（用时）</span><span>红方</span><span>黑方</span></div>
    <div class="xiangqi-record-scroll"><ol id="moveList" aria-label="中国象棋中式棋谱" aria-live="polite"></ol><div class="xiangqi-scroll-indicator" id="xiangqiScrollCue" hidden aria-hidden="true"><span class="xiangqi-scroll-thumb" id="xiangqiScrollThumb"></span></div></div>
    <div class="xiangqi-record-foot">红方用中文路数 · 黑方用数字路数</div>
  </aside>
  <section class="game-main-board">
    <div class="board-wrap">
      <div class="xiangqi-board" id="board" aria-label="中国象棋棋盘">
        <section class="xiangqi-result" id="xiangqiResult" hidden aria-live="assertive">
          <div class="xiangqi-result-card">
            <div class="xiangqi-result-seal" id="xiangqiResultSeal">勝</div>
            <span class="xiangqi-result-eyebrow">本局结算</span>
            <h2 id="xiangqiResultTitle">红方获胜</h2>
            <p id="xiangqiResultDescription"></p>
            <div class="xiangqi-result-buttons">
              <button id="xiangqiReplay" type="button">再开一局</button>
              <button id="xiangqiLeave" type="button">离开</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div id="status" class="game-status sr-only" aria-live="polite">红方先行</div>
  </section>
  <aside class="game-tools" aria-label="对局操作">
    <button type="button" class="game-btn" id="undoButton">悔棋</button>
    <button type="button" class="game-btn" id="flip">交换视角</button>
    <button type="button" class="game-btn" id="resignButton">认输结束</button>
  </aside>
</main>
<script src="../shared/bridge.js"></script>
<script src="../shared/workspace.js"></script>
<script src="../shared/turn-clock.js"></script><script src="./game.js?v=xq-layout-ready-20261112-r1"></script>
</body>
</html>
