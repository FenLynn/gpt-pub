<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国象棋</title><link rel="stylesheet" href="../shared/game.css"></head><body data-game="xiangqi"><main class="game-root game-layout xiangqi-layout" id="game">
<aside class="game-guide"><div class="game-guide-kicker">CHINESE CHESS</div><h2>行棋提示</h2><p>点击己方棋子，再点击棋盘交叉点上的合法落点。</p><div class="guide-note">棋子位于横线与竖线的交点，不是方格中央。</div><div class="guide-note">将帅不能照面；将军时必须立即应将。</div></aside>
<section class="game-main-board"><div class="board-wrap"><div class="xiangqi-board" id="board" aria-label="中国象棋棋盘"></div></div></section>
<aside class="game-tools"><div class="game-tools-heading">对局状态</div><div class="turn-indicator"><span class="turn-dot red" id="turnDot"></span><strong id="turnText">轮到红方走</strong></div><div class="game-status" id="status">红方先行</div><div class="game-tools-heading">棋盘操作</div><button class="game-btn" id="undoButton">悔棋</button><button class="game-btn" id="flip">交换视角</button><div class="game-tool-note">顶部可切换人机对战/本机双人，以及 AI 难度。</div></aside>
</main><script src="../shared/bridge.js"></script><script src="./game.js"></script></body></html>
