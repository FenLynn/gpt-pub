<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞行棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/turn-clock.css"><link id="gameWorkspaceStyles" rel="stylesheet" href="../shared/workspace.css?v=workspace-layout-20261113"><link rel="stylesheet" href="./flight.css?v=flight-board-r69"></head>
<body data-game="flight-chess"><main class="game-root game-layout gs-tools-open flight-chess-layout" id="game" data-board-measured="false">
<aside class="game-guide"><h2>飞行棋</h2><p>红蓝双方各四架飞机；掷出六点起飞，沿52格主跑道前进。落在己方普通颜色格可跳四格；落在飞行箭头入口则沿虚线飞越12格；撞机回机场，精确点数进入中央HOME。</p></aside>
<aside class="reversi-record-rail" aria-label="飞行棋操作历史"><div class="reversi-record-heading"><strong>操作历史</strong><span id="reversiHistoryCount">0 步</span></div><div class="reversi-record-columns"><span>步数</span><span>操作方</span><span>用时</span></div><div class="reversi-record-scroll"><ol id="reversiMoveList" aria-label="飞行棋逐次操作历史"></ol></div></aside>
<section class="game-main-board"><div class="board-wrap"><div class="flight-stage">
<svg id="board" class="flight-board" viewBox="0 0 900 900" role="group" aria-label="经典四角飞行棋地图、52格环形跑道与红蓝双方飞机"></svg>
</div></div></section>
<aside class="game-tools"><div class="game-tools-heading">飞行棋</div><div class="game-status" id="status">等待开局</div><p class="flight-move-help" id="flightMoveHelp">掷骰后选择飞机查看绿色编号路线，点击终点确认。</p><div class="flight-play-controls"><div id="turnText" class="flight-turn">红方先行</div><div class="flight-dice" id="diceFace" role="img" aria-label="骰子：1点"></div><div class="flight-dice-caption" id="flightDiceCaption">点数 1</div><button id="rollButton" class="game-btn primary">掷骰子</button></div><button id="undoButton" class="game-btn" disabled>悔棋</button><div class="side-score reversi-side-score" aria-label="双方抵达终点的飞机数"><div class="reversi-count-row" data-side="red"><span class="flight-side-disc red" aria-hidden="true"></span><span class="reversi-count-name">红方抵达</span><strong id="redArrived">0</strong></div><div class="reversi-count-row" data-side="blue"><span class="flight-side-disc blue" aria-hidden="true"></span><span class="reversi-count-name">蓝方抵达</span><strong id="blueArrived">0</strong></div></div><section class="flight-move-panel" aria-label="可操作飞机"><div class="flight-move-heading"><strong>可操作飞机</strong><span id="flightMoveCount">0 个</span></div><div id="flightMoveOptions" class="flight-move-options"></div></section></aside>
</main><script src="../shared/bridge.js?v=workspace-layout-20261113"></script><script src="../shared/workspace.js?v=workspace-layout-20261113"></script><script src="../shared/turn-clock.js"></script><script src="./game.js?v=flight-board-r69"></script></body></html>
