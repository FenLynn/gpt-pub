<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞行棋</title><link rel="stylesheet" href="../shared/game.css"><link rel="stylesheet" href="../shared/turn-clock.css"></head>
<body data-game="flight-chess"><main class="game-root game-layout flight-chess-layout" id="game">
<aside class="game-guide"><h2>飞行棋</h2><p>红蓝双方各四架飞机，掷出六点起飞；到达对应颜色格子可前进四格，特殊飞行通道额外前进。撞到非安全格上的敌机将其送回机场。</p></aside>
<aside class="reversi-record-rail" aria-label="飞行棋操作历史"><div class="reversi-record-heading"><strong>操作历史</strong><span id="reversiHistoryCount">0 步</span></div><div class="reversi-record-columns"><span>步数</span><span>操作方</span><span>用时</span></div><div class="reversi-record-scroll"><ol id="reversiMoveList" aria-label="飞行棋逐次操作历史"></ol></div></aside>
<section class="game-main-board"><div class="board-wrap"><div class="flight-stage">
<svg id="board" class="flight-board" viewBox="0 0 900 900" role="group" aria-label="飞行棋单一棋盘、52 格环形跑道与两队飞机"></svg>
</div></div></section>
<aside class="game-tools"><div class="game-tools-heading">飞行棋</div><div class="game-status" id="status">等待开局</div><div class="flight-play-controls"><div id="turnText" class="flight-turn">红方先行</div><div class="flight-dice" id="diceFace" role="img" aria-label="骰子：1点"></div><button id="rollButton" class="game-btn primary">掷骰子</button></div><button id="undoButton" class="game-btn" disabled>悔棋</button><div class="side-score reversi-side-score" aria-label="双方抵达终点的飞机数"><div class="reversi-count-row" data-side="red"><span class="flight-side-disc red" aria-hidden="true"></span><span class="reversi-count-name">红方抵达</span><strong id="redArrived">0</strong></div><div class="reversi-count-row" data-side="blue"><span class="flight-side-disc blue" aria-hidden="true"></span><span class="reversi-count-name">蓝方抵达</span><strong id="blueArrived">0</strong></div></div><div class="gs-board-tip">掷出 6 点可起飞；掷骰后点击高亮飞机。6 点再投一次，进入终点需恰好到达。</div></aside>
</main><script src="../shared/bridge.js"></script><script src="../shared/workspace.js"></script><script src="../shared/turn-clock.js"></script><script src="./game.js"></script></body></html>
