name: Finalize Mediova v4.1.0 once

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/p101-v410-finalize-trigger.txt'

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: p101-v410-finalize
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Wait for and merge exp to stable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pr=(gh pr list --repo $env:GITHUB_REPOSITORY --state open --base p101-stable --head p101-exp --json number --jq '.[0].number').Trim()
          if (-not $pr) { throw 'Open p101-exp -> p101-stable PR not found.' }
          gh pr checks $pr --repo $env:GITHUB_REPOSITORY --watch --fail-fast
          if ($LASTEXITCODE -ne 0) { throw 'Stable candidate checks failed.' }
          gh pr merge $pr --repo $env:GITHUB_REPOSITORY --merge --delete-branch=false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to merge stable candidate PR.' }

      - name: Create, validate and merge stable to main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main p101-stable
          $pr=(gh pr list --repo $env:GITHUB_REPOSITORY --state open --base main --head p101-stable --json number --jq '.[0].number').Trim()
          if (-not $pr) {
            $body=@'
          ## 目标

          将已经通过稳定候选 Linux 与完整 Windows 原生准入的 Mediova v4.1.0 合入 `main`。

          ## 内容

          - 界面视觉与交互统一；
          - 输出母目录、最近目录与浏览入口；
          - 真实输入/输出体积比例和黄色优先颜色规则；
          - 轻量透明 Runtime 与独立 Data；
          - Runtime 清单、第三方说明、完整 Runtime ZIP和保守组件迁移；
          - v4.1.0 长期 CI、测试隔离和完整文档。

          本 PR 只涉及 P101，不修改 AtlasDesk。
          '@
            $bodyPath=Join-Path $env:RUNNER_TEMP 'p101-v410-main-pr.md'
            Set-Content $bodyPath $body -Encoding UTF8
            gh pr create --repo $env:GITHUB_REPOSITORY --base main --head p101-stable --title 'P101｜发布 Mediova v4.1.0 正式主线' --body-file $bodyPath
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create stable -> main PR.' }
            $pr=(gh pr list --repo $env:GITHUB_REPOSITORY --state open --base main --head p101-stable --json number --jq '.[0].number').Trim()
          }
          if (-not $pr) { throw 'Stable -> main PR was not resolved.' }
          gh pr checks $pr --repo $env:GITHUB_REPOSITORY --watch --fail-fast
          if ($LASTEXITCODE -ne 0) { throw 'Main admission checks failed.' }
          gh pr merge $pr --repo $env:GITHUB_REPOSITORY --merge --delete-branch=false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to merge stable -> main PR.' }
          "MAIN_PR=$pr" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout final main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate final source with isolated Data
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-WithIsolatedData([scriptblock]$Action) {
            $root=Join-Path $env:RUNNER_TEMP ('Mediova-Final-' + [guid]::NewGuid().ToString('N'))
            New-Item $root -ItemType Directory -Force | Out-Null
            $oldAppData=$env:APPDATA
            $oldLocal=$env:LOCALAPPDATA
            $oldXdg=$env:XDG_CONFIG_HOME
            $oldRuntime=$env:MEDIOVA_RUNTIME_DIR
            try {
              $env:APPDATA=$root
              $env:LOCALAPPDATA=$root
              $env:XDG_CONFIG_HOME=$root
              $env:MEDIOVA_RUNTIME_DIR=Join-Path $root 'Runtime'
              & $Action
              if ($LASTEXITCODE -ne 0) { throw "command failed with exit code $LASTEXITCODE" }
            } finally {
              $env:APPDATA=$oldAppData
              $env:LOCALAPPDATA=$oldLocal
              $env:XDG_CONFIG_HOME=$oldXdg
              $env:MEDIOVA_RUNTIME_DIR=$oldRuntime
              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Invoke-WithIsolatedData { go test -count=1 ./... }
          Invoke-WithIsolatedData { go test -race -count=1 ./internal/config ./internal/media }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Final go vet failed.' }

      - name: Download real FFmpeg Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archive=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl.zip'
          $expanded=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl'
          $downloaded=$false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $archive -Headers @{'User-Agent'='Mediova-v4.1.0-Release'}
              $downloaded=$true
              break
            } catch {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $downloaded) { throw 'Unable to download BtbN FFmpeg package.' }
          Expand-Archive $archive -DestinationPath $expanded -Force
          $ffmpeg=Get-ChildItem $expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem $expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or $ffmpeg.Directory.FullName -ne $ffprobe.Directory.FullName) {
            throw 'Downloaded package does not contain a colocated FFmpeg pair.'
          }
          & $ffmpeg.FullName -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded FFmpeg is not runnable.' }
          "FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and verify final Runtime
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.1.0.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          $build=Join-Path $PWD 'build'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $zip=Join-Path $build 'Mediova-v4.1.0-Runtime.zip'
          $report=Join-Path $build 'release_self_test.json'
          if (!(Test-Path $exe) -or !(Test-Path $zip)) { throw 'Final Runtime artifact missing.' }
          $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test',"--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(480000)) { Stop-Process -Id $proc.Id -Force; throw 'Final self-test timeout.' }
          if (!(Test-Path $report)) { throw 'Final self-test report missing.' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.1.0' -or $checks.Count -lt 57) { throw 'Final native self-test failed.' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'Final self-test contains failed checks.' }
          $manifest=Get-Content (Join-Path $runtime 'runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.1.0' -or $manifest.deployment -ne 'folder-runtime') { throw 'Final manifest identity mismatch.' }
          foreach ($entry in $manifest.files) {
            $path=Join-Path $runtime ($entry.path -replace '/', '\')
            if (!(Test-Path $path -PathType Leaf)) { throw "Final manifest file missing: $($entry.path)" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Final manifest hash mismatch: $($entry.path)" }
            if ((Get-Item $path).Length -ne [int64]$entry.size) { throw "Final manifest size mismatch: $($entry.path)" }
          }
          foreach ($private in @('config.json','history.json','session.json','crash.log','settings.json','task-history.json','security.json','vault.bin')) {
            if (Get-ChildItem $runtime -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "Private Data leaked into final Runtime: $private" }
          }
          $exeHash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSize=(Get-Item $exe).Length
          $zipSize=(Get-Item $zip).Length
          @(
            "$exeHash  Mediova.exe",
            "$zipHash  Mediova-v4.1.0-Runtime.zip"
          ) | Set-Content (Join-Path $build 'SHA256.txt') -Encoding Ascii
          $values=[ordered]@{
            run_id=[string]$env:GITHUB_RUN_ID
            main_pr=[string]$env:MAIN_PR
            exe_sha256=$exeHash
            zip_sha256=$zipHash
            exe_size=[int64]$exeSize
            zip_size=[int64]$zipSize
            self_test_checks=[int]$checks.Count
            self_test_elapsed_ms=[int]$json.elapsed_ms
          }
          $values | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'p101-v410-release-values.json') -Encoding UTF8

      - name: Finalize P101 release documents
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json, os
          values=json.loads((Path(os.environ['RUNNER_TEMP'])/'p101-v410-release-values.json').read_text(encoding='utf-8-sig'))
          root=Path('projects/1-桌面软件/101-Mediova')
          def edit(path, replacements, append=''):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in text:
                      raise SystemExit(f'marker not found in {p}: {old!r}')
                  text=text.replace(old,new,1)
              if append and append not in text:
                  text=text.rstrip()+"\n\n"+append.strip()+"\n"
              p.write_text(text,encoding='utf-8',newline='\n')

          run=values['run_id']; main_pr=values['main_pr']; eh=values['exe_sha256']; zh=values['zip_sha256']
          es=values['exe_size']; zs=values['zip_size']; checks=values['self_test_checks']; elapsed=values['self_test_elapsed_ms']

          edit(root/'工作记录.md',[
              ('| 当前正式版本 | v4.0.0 |','| 当前正式版本 | v4.1.0 |'),
              ('| 当前候选版本 | v4.1.0 |','| 当前候选版本 | 无 |'),
              ('| 当前正式标签 | `p101-v4.0.0` |','| 当前正式标签 | `p101-v4.1.0` |'),
              ('| 当前状态 | v4.1.0 产品实现、完整 Runtime 构建和首轮 Windows 原生验证已完成；正在完成文档、长期 CI 和正式晋级发布 |','| 当前状态 | v4.1.0 已完成稳定候选、正式主线准入与 Release；正在执行发布后分支回流和临时设施清理 |'),
              ('| [ ] | 进行中 | 6 | 文档闭环 |','| [x] | 完成 | 6 | 文档闭环 |'),
              ('| [ ] | 计划 | 7 | 稳定候选晋级 |','| [x] | 完成 | 7 | 稳定候选晋级 |'),
              ('| [ ] | 计划 | 8 | 正式发布 |','| [x] | 完成 | 8 | 正式发布 |'),
              ('| [ ] | 计划 | 9 | 发布后回流与清理 |','| [ ] | 进行中 | 9 | 发布后回流与清理 |'),
          ],append=f'''## v4.1.0 正式发布结果

- 正式主线 PR：`#{main_pr}`；
- 最终发布运行：`{run}`；
- `Mediova.exe`：{es:,} 字节；
- EXE SHA-256：`{eh}`；
- `Mediova-v4.1.0-Runtime.zip`：{zs:,} 字节；
- Runtime ZIP SHA-256：`{zh}`；
- 正式原生自检：{checks} 项全部通过，耗时 {elapsed} ms；
- 标签与 Release：`p101-v4.1.0`。''')

          edit(root/'README.md',[
              ('当前正式版本为 **v4.0.0**，当前候选版本为 **v4.1.0**。v4.1.0 已完成界面统一、输出母目录增强、真实压缩体积条和轻量 Runtime/Data 分离，正在按正式分支流程完成准入与发布。','当前正式版本为 **v4.1.0**。本版本完成界面统一、输出母目录增强、真实压缩体积条和轻量 Runtime/Data 分离，并以完整 Runtime ZIP 正式交付。'),
          ])

          edit(root/'开发约束.md',[
              ('- 当前正式版本：v4.0.0；当前候选版本：v4.1.0。','- 当前正式版本：v4.1.0；当前无未发布候选版本。'),
          ])

          edit(root/'阶段记录.md',[
              ('- 当前正式版本：`Mediova v4.0.0`；','- 当前正式版本：`Mediova v4.1.0`；'),
              ('- 当前候选版本：`Mediova v4.1.0`；','- 当前候选版本：无；'),
              ('- v4.1.0 状态：**产品实现、完整 Runtime 构建、首轮 Windows 原生验证、长期 CI 和核心文档已完成，正在进入稳定候选与正式发布。**','- v4.1.0 状态：**已完成稳定候选、正式主线准入、最终 Runtime 构建和公开 Release。**'),
              ('- 当前正式标签与 Release：`p101-v4.0.0`；','- 当前正式标签与 Release：`p101-v4.1.0`；'),
              ('- v4.1.0 目标标签：`p101-v4.1.0`。','- 上一正式标签：`p101-v4.0.0`。'),
          ],append=f'''## v4.1.0 正式发布结果

- 正式主线 PR：`#{main_pr}`；
- 最终发布运行：`{run}`；
- `Mediova.exe`：{es:,} 字节；
- EXE SHA-256：`{eh}`；
- `Mediova-v4.1.0-Runtime.zip`：{zs:,} 字节；
- Runtime ZIP SHA-256：`{zh}`；
- Runtime 清单逐文件大小和 SHA-256：通过；
- 私人 Data 泄漏扫描：通过；
- 原生自检：{checks} 项全部通过，耗时 {elapsed} ms；
- 标签与 Release：`p101-v4.1.0`。''')

          edit(root/'Mediova_v4.1.0_版本说明.md',[
              ('> 当前状态：稳定候选准备中。本文记录已经实现并通过首轮 Windows 验证的功能与架构变化；正式 Release 完成后补充最终运行编号、Artifact、文件大小和 SHA-256。','> 当前状态：已正式发布。正式标签与 Release 为 `p101-v4.1.0`。'),
              ('这些是实现阶段候选结果。正式 Release 会从最终 `main` 已验证 Artifact 发布，并在本文补充最终运行编号、文件大小和 SHA-256。','以上为实现阶段候选结果；最终正式发布结果如下。'),
              ('- 正式标签目标：`p101-v4.1.0`；','- 正式标签：`p101-v4.1.0`；'),
          ],append=f'''## 正式 Release 固定结果

- 正式主线 PR：`#{main_pr}`；
- 最终发布运行：`{run}`；
- `Mediova.exe`：{es:,} 字节；
- EXE SHA-256：`{eh}`；
- `Mediova-v4.1.0-Runtime.zip`：{zs:,} 字节；
- Runtime ZIP SHA-256：`{zh}`；
- 原生自检：{checks} 项全部通过，耗时 {elapsed} ms；
- Release 资产：完整 Runtime ZIP 与 `SHA256.txt`。''')

          edit(root/'软件开发总结.md',[
              ('v4.1.0 产品实现和首轮 Windows 原生验证已经完成，当前进入稳定候选晋级、最终主线准入和正式 Release。','v4.1.0 已完成稳定候选、正式主线准入、最终 Runtime 构建和公开 Release。'),
          ],append=f'''## v4.1.0 正式发布固定结果

Mediova v4.1.0 已从最终 `main` 构建完整 Runtime 并建立 `p101-v4.1.0` Release。最终发布运行 `{run}` 通过 Runtime 清单、私人 Data 泄漏检查和 {checks} 项原生自检。正式 `Mediova.exe` SHA-256 为 `{eh}`，完整 Runtime ZIP SHA-256 为 `{zh}`。''')

          edit('目录.md',[
              ('| P101 | [Mediova](projects/1-桌面软件/101-Mediova/) | v4.0.0 已正式发布 |','| P101 | [Mediova](projects/1-桌面软件/101-Mediova/) | v4.1.0 已正式发布 |'),
              ('- P101 已完成 Mediova v4.0.0 公开迁移、标签、Release、长期分支和仓库收尾，后续按 `p101-exp → p101-stable → main` 正式维护；','- P101 已正式发布 Mediova v4.1.0 完整 Runtime，后续按 `p101-exp → p101-stable → main` 持续维护；'),
          ])
          edit('projects/1-桌面软件/README.md',[
              ('| P101 | [Mediova](101-Mediova/) | v4.0.0 已正式发布 |','| P101 | [Mediova](101-Mediova/) | v4.1.0 已正式发布 |'),
          ])
          '@ | python -
          Remove-Item '.maintenance/p101-v410-finalize-trigger.txt' -Force -ErrorAction SilentlyContinue

      - name: Commit final release records
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/1-桌面软件/101-Mediova' '目录.md' 'projects/1-桌面软件/README.md' '.maintenance/p101-v410-finalize-trigger.txt'
          git commit -m 'P101｜登记 Mediova v4.1.0 正式发布结果'
          git push origin HEAD:main
          "FINAL_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create v4.1.0 tag and Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $build='projects/1-桌面软件/101-Mediova/代码/build'
          $zip=Resolve-Path (Join-Path $build 'Mediova-v4.1.0-Runtime.zip')
          $sha=Resolve-Path (Join-Path $build 'SHA256.txt')
          $notes=Resolve-Path 'projects/1-桌面软件/101-Mediova/Mediova_v4.1.0_版本说明.md'
          if (gh release view 'p101-v4.1.0' --repo $env:GITHUB_REPOSITORY 2>$null) { throw 'Release p101-v4.1.0 already exists.' }
          gh release create 'p101-v4.1.0' $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:FINAL_SHA --title 'Mediova v4.1.0' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create Mediova v4.1.0 Release.' }

      - name: Align P101 branches and remove temporary branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git push origin "$env:FINAL_SHA`:refs/heads/p101-stable" --force
          git push origin "$env:FINAL_SHA`:refs/heads/p101-exp" --force
          $branches=@(
            'agent/p101-v410-main-runner',
            'agent/p101-v410-run-trigger',
            'agent/p101-v410-runner-diagnostics',
            'agent/p101-v410-run-v2-trigger',
            'agent/p101-v410-observable-pr-runner',
            'agent/p101-v410-execute-v3',
            'agent/p101-v410-fix-escape-test-runner',
            'agent/p101-v410-execute-v4',
            'agent/p101-v410-prepatch-runner',
            'agent/p101-v410-prepatch-v1',
            'agent/p101-v410-update-working-runner',
            'agent/p101-v410-ci-cleanup',
            'agent/p101-v410-runner-diagnostics',
            'agent/p101-v410-finalize-runner'
          )
          foreach ($branch in $branches) {
            git push origin --delete $branch 2>$null
          }
          foreach ($number in @(56,61)) {
            gh pr close $number --repo $env:GITHUB_REPOSITORY --comment 'Mediova v4.1.0 已通过正式流程完成，关闭旧的一次性执行 PR。' 2>$null
          }

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.1.0-Release
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova-v4.1.0-Runtime.zip
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/release_self_test.json
            projects/1-桌面软件/101-Mediova/代码/build/Runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 90
