name: Apply P101 Mediova v4.2.2 contrast v3 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v422-contrast-v3-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v422-contrast-v3-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout registered script
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout latest P101 experiment branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply and validate per-glyph contrast
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tooling/.github/scripts/p101_v422_contrast_v3.py
          cd work
          python ../tooling/.github/scripts/p101_v422_contrast_v3.py
      - name: Verify scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/winapi_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changes:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/winapi_windows.go
          git commit -m 'P101: 以逐字符配色修复 v4.2.2 进度文字'
          git push origin HEAD:p101-exp
