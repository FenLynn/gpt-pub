name: Fix P101 Mediova v4.2.1 native bar contract once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-native-bar-contract-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v421-native-bar-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact P101 experimental branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace obsolete native bar self-test
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          source_path = root / 'cmd/mediaworkbench/main_windows.go'
          hashes_path = root / 'SOURCE_FILES_SHA256.txt'
          source = source_path.read_text(encoding='utf-8')

          start_marker = '\treport.Checks["list_progress_cells_use_full_row_height"] ='
          end_marker = '\treport.Checks["status_grid_two_rows"] ='
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('native bar self-test markers are not unique')
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          replacement = '''\tcenteredPreferredBar := func(cell, bar rect) bool {
          \t\tinsets := listCellBarInsets()
          \t\tavailable := cell.Bottom - cell.Top - 2*scaleDPI(insets.Vertical)
          \t\twantHeight := scaleDPI(24)
          \t\tif wantHeight > available {
          \t\t\twantHeight = available
          \t\t}
          \t\tif minimum := scaleDPI(insets.MinimumHeight); wantHeight < minimum && available >= minimum {
          \t\t\twantHeight = minimum
          \t\t}
          \t\tif wantHeight < 1 {
          \t\t\twantHeight = 1
          \t\t}
          \t\ttopGap := bar.Top - cell.Top
          \t\tbottomGap := cell.Bottom - bar.Bottom
          \t\tgapDelta := topGap - bottomGap
          \t\tif gapDelta < 0 {
          \t\t\tgapDelta = -gapDelta
          \t\t}
          \t\treturn bar.Left == cell.Left+scaleDPI(insets.Horizontal) &&
          \t\t\tbar.Right == cell.Right-scaleDPI(insets.Horizontal) &&
          \t\t\tbar.Bottom-bar.Top == wantHeight && gapDelta <= 1
          \t}
          \treport.Checks["list_progress_cells_centered_preferred_height"] = rowOK && compressionOK && progressOK &&
          \t\tcompressionCell.Top == row.Top && compressionCell.Bottom == row.Bottom &&
          \t\tprogressCell.Top == row.Top && progressCell.Bottom == row.Bottom &&
          \t\tcenteredPreferredBar(compressionCell, compressionBar) &&
          \t\tcenteredPreferredBar(progressCell, progressBar)
          \tif !report.Checks["list_progress_cells_centered_preferred_height"] {
          \t\treport.Details["list_progress_cells_centered_preferred_height"] = fmt.Sprintf("row=%+v compression=%+v bar=%+v progress=%+v bar=%+v", row, compressionCell, compressionBar, progressCell, progressBar)
          \t}
          '''

          source = source[:start] + replacement + source[end:]
          if 'list_progress_cells_use_full_row_height' in source:
              raise SystemExit('obsolete native bar self-test name remains')
          source_path.write_text(source, encoding='utf-8', newline='\n')
          PY
          gofmt -w cmd/mediaworkbench/main_windows.go
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          rel = 'cmd/mediaworkbench/main_windows.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          text = hashes.read_text(encoding='utf-8')
          digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          pattern = rf'^[0-9a-f]{{64}}  {re.escape(rel)}$'
          text, count = re.subn(pattern, f'{digest}  {rel}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('main_windows.go hash entry is not unique')
          hashes.write_text(text, encoding='utf-8', newline='\n')
          print(f'main_windows.go sha256={digest}')
          PY

      - name: Run full portable gates and Windows compilation
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Verify exact scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          if grep -RFn 'list_progress_cells_use_full_row_height' projects/1-桌面软件/101-Mediova/代码; then
            echo 'Obsolete native bar self-test remains.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          git commit -m 'P101: 更新 v4.2.1 原生条形居中自检'
          git push origin HEAD:p101-exp
