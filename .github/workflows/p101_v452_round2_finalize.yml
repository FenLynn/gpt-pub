name: P101 Finalize v4.5.2 Round 2

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'p101-v452-round2-list-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round2-list-lifecycle
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Fix callback initialization and regenerate manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          visual = code / 'cmd/mediaworkbench/v452_list_visual_windows.go'
          text = visual.read_text(encoding='utf-8')
          old = '\tv452ListApps          sync.Map // map[uintptr]*application\n\tv452ListSubclassCB    = syscall.NewCallback(v452ListSubclassProc)\n)\n\nfunc v452InstallListVisuals'
          new = '\tv452ListApps       sync.Map // map[uintptr]*application\n\tv452ListSubclassCB uintptr\n)\n\nfunc init() {\n\tv452ListSubclassCB = syscall.NewCallback(v452ListSubclassProc)\n}\n\nfunc v452InstallListVisuals'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one callback initialization block, found {count}')
          visual.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def refresh_manifest(path: Path) -> None:
              rows = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  parts = line.split(maxsplit=1)
                  if len(parts) != 2:
                      raise SystemExit(f'invalid manifest row in {path}: {line!r}')
                  rel = parts[1]
                  target = code / rel
                  if not target.is_file():
                      raise SystemExit(f'manifest target missing: {target}')
                  rows.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {rel}')
              path.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')

          refresh_manifest(code / 'V452_ROUND2_LIST_LIFECYCLE_FILES_SHA256.txt')
          refresh_manifest(code / 'SOURCE_FILES_SHA256.txt')
          PY

          cd projects/1-桌面软件/101-Mediova/代码
          gofmt -w cmd/mediaworkbench/v452_list_visual_windows.go
          python - <<'PY'
          from pathlib import Path
          import hashlib

          code = Path('.')
          def refresh_manifest(path: Path) -> None:
              rows = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  digest, rel = line.split(maxsplit=1)
                  rows.append(f'{hashlib.sha256((code / rel).read_bytes()).hexdigest()}  {rel}')
              path.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')

          refresh_manifest(Path('V452_ROUND2_LIST_LIFECYCLE_FILES_SHA256.txt'))
          refresh_manifest(Path('SOURCE_FILES_SHA256.txt'))
          PY
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_round2_tests.exe
          test -s /tmp/Mediova_round2_tests.exe
          cd ../../../..

          rm -f .github/workflows/p101_v452_round2_finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜修复列表回调初始化并同步源码清单'
          git push origin HEAD:p101-v452-round2-list-lifecycle
