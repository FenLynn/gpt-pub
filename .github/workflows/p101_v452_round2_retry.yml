name: P101 Retry v4.5.2 Round 2

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  retry:
    if: github.event.pull_request.head.ref == 'p101-v452-round2-list-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round2-list-lifecycle
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Correct signatures, synchronize contracts and apply round 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "    replace_once(main_file, 'case 8:\\n', 'case taskColOutputSize:\\n')\n": "    replace_once(main_file, 'if cd.ISubItem == 8 {', 'if cd.ISubItem == taskColOutputSize {')\n",
              "    replace_once(main_file, 'case 9:\\n', 'case taskColProgress:\\n')\n": "    replace_once(main_file, 'if cd.ISubItem == 9 {', 'if cd.ISubItem == taskColProgress {')\n",
              "    replace_once(main_file, 'case 10:\\n', 'case taskColStatus:\\n')\n": "    replace_once(main_file, 'label := a.taskTexts(&task)[10]', 'label := a.taskTexts(&task)[taskColStatus-1]')\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one script correction, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          text, count = re.subn(
              r'\n    round2 = CMD / "v452_round2_windows.go".*?round2.write_text\(round_text, encoding=\x27utf-8\x27, newline=\x27\\n\x27\)\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one obsolete helper-signature migration, found {count}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round2.py

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          cmd = code / 'cmd/mediaworkbench'

          contract = cmd / 'v422_source_contract_test.go'
          text = contract.read_text(encoding='utf-8')
          replacements = {
              '\t\t`{"分辨率", 100}, {"时长", 76}`,\n': '\t\t`var taskListColumns = v452TaskListColumns`,\n',
              '\t\t`cd.ISubItem != 8 && cd.ISubItem != 9 && cd.ISubItem != 10`,\n': '\t\t`taskColOutputSize && cd.ISubItem != taskColProgress && cd.ISubItem != taskColStatus`,\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one legacy contract row, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          contract.write_text(text, encoding='utf-8', newline='\n')

          manifest = code / 'V452_ROUND1_UI_STATE_FILES_SHA256.txt'
          rows = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) != 2:
                  raise SystemExit(f'invalid round-one manifest row: {line!r}')
              rel = parts[1]
              digest = hashlib.sha256((code / rel).read_bytes()).hexdigest()
              rows.append(f'{digest}  {rel}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          manifest_digest = hashlib.sha256(manifest.read_bytes()).hexdigest()

          manifest_test = cmd / 'v452_round1_manifest_test.go'
          test_text = manifest_test.read_text(encoding='utf-8')
          test_text, count = re.subn(
              r'const v452Round1ManifestSHA256 = "[0-9a-f]{64}"',
              f'const v452Round1ManifestSHA256 = "{manifest_digest}"',
              test_text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one round-one manifest digest constant, found {count}')
          manifest_test.write_text(test_text, encoding='utf-8', newline='\n')
          PY

          cd projects/1-桌面软件/101-Mediova/代码
          gofmt -w cmd/mediaworkbench/v422_source_contract_test.go cmd/mediaworkbench/v452_round1_manifest_test.go
          go test -count=1 ./...
          cd ../../../..
          rm -f .github/workflows/p101_v452_round2_retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜完成 v4.5.2 第二轮列表与生命周期接线'
          git push origin HEAD:p101-v452-round2-list-lifecycle
