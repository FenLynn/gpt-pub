name: Apply Mediova v4.1.0 via observable PR fix 1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-pr-execute-fix1.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p101-v410-execute-v4'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reconstruct and apply verified transformer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import base64,gzip,hashlib,py_compile
          root=Path('.maintenance/p101-v410/small')
          b64=b''.join((root/f'{i:02d}').read_bytes() for i in range(24))
          if hashlib.sha256(b64).hexdigest()!='beeb0701ad077cdab3d8750c988a51c2b6eeba12334cfd21299eb6c89604c64c': raise SystemExit('payload mismatch')
          script=gzip.decompress(base64.b64decode(b64))
          if hashlib.sha256(script).hexdigest()!='ea412d8c6a56021795a6ca39bf31f82ece76cc36fa26c3d40252fd8a5dbfb1f2': raise SystemExit('transformer mismatch')
          p=Path('.maintenance/p101-v410/apply.py'); p.write_bytes(script); py_compile.compile(str(p),doraise=True)
          '@ | python -
          python .maintenance/p101-v410/apply.py

          @'
          from pathlib import Path
          main=Path('projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go')
          text=main.read_text(encoding='utf-8')
          text=text.replace('Components\\FFmpeg 目录。','Components\\\\FFmpeg 目录。')
          main.write_text(text,encoding='utf-8',newline='\n')

          test=Path('projects/1-桌面软件/101-Mediova/代码/internal/media/recovery_features_test.go')
          text=test.read_text(encoding='utf-8')
          old='''\tcleanRoot := strings.ToLower(filepath.Clean(dataRoot))
\tif !strings.HasPrefix(strings.ToLower(filepath.Clean(ff)), cleanRoot) || !strings.HasPrefix(strings.ToLower(filepath.Clean(fp)), cleanRoot) {
\t\tt.Fatalf("test escaped isolated data root: ffmpeg=%s ffprobe=%s root=%s", ff, fp, dataRoot)
\t}
'''
          new='''\tcleanRoot := strings.ToLower(filepath.Clean(dataRoot))
\truntimeSuffix := strings.ToLower(filepath.Clean(filepath.Join("Components", "FFmpeg", "bin")))
\tcleanFF := strings.ToLower(filepath.Clean(ff))
\tcleanFP := strings.ToLower(filepath.Clean(fp))
\tif !strings.Contains(cleanFF, runtimeSuffix) || !strings.Contains(cleanFP, runtimeSuffix) {
\t\tt.Fatalf("components were not installed into Runtime: ffmpeg=%s ffprobe=%s", ff, fp)
\t}
\tif strings.HasPrefix(cleanFF, cleanRoot) || strings.HasPrefix(cleanFP, cleanRoot) {
\t\tt.Fatalf("Runtime component leaked into Data: ffmpeg=%s ffprobe=%s root=%s", ff, fp, dataRoot)
\t}
'''
          if old not in text: raise SystemExit('legacy FFmpeg assertion not found')
          test.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          '@ | python -

          Set-Location 'projects/1-桌面软件/101-Mediova/代码'
          gofmt -w ./cmd ./internal
          @'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'SOURCE_FILES_SHA256.txt'; lines=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p==manifest or 'build' in p.parts: continue
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          manifest.write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          '@ | python -

      - name: Validate Go source
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          go test -count=1 ./...
          go test -race -count=1 ./internal/config ./internal/media
          go vet -unsafeptr=false ./...

      - name: Locate real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          $ff=Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          $fp=Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          if (-not $ff -or -not $fp) {
            $tools=Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
            $ff=Get-ChildItem $tools -Recurse -Filter ffmpeg.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
            $fp=Get-ChildItem $tools -Recurse -Filter ffprobe.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          }
          if (-not $ff -or -not $fp) { throw 'real FFmpeg pair not found' }
          $dir=if ($ff.Source) { Split-Path $ff.Source -Parent } else { $ff.Directory.FullName }
          "FFMPEG_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and validate complete Runtime
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.1.0.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          $build=Join-Path $PWD 'build'; $runtime=Join-Path $build 'Runtime'; $exe=Join-Path $runtime 'Mediova.exe'; $report=Join-Path $build 'apply_self_test.json'
          $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test',"--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(480000)) { Stop-Process -Id $proc.Id -Force; throw 'self-test timeout' }
          $json=Get-Content $report -Raw | ConvertFrom-Json; $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.1.0' -or $checks.Count -lt 57) { throw 'self-test failed' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'self-test contains failed checks' }
          $manifest=Get-Content (Join-Path $runtime 'runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.1.0' -or $manifest.deployment -ne 'folder-runtime') { throw 'manifest mismatch' }
          if (!(Test-Path (Join-Path $build 'Mediova-v4.1.0-Runtime.zip'))) { throw 'Runtime ZIP missing' }

      - name: Commit verified P101 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item '.maintenance/p101-v410' -Recurse -Force
          Remove-Item '.github/workflows/p101-v410-apply-once.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'projects/1-桌面软件/101-Mediova' '.github/workflows/p101-mediova-ci.yml' '.github/workflows/p101-v410-apply-once.yml' '.maintenance/p101-v410'
          git commit -m 'P101｜实现 Mediova v4.1.0 界面与 Runtime 架构'
          git push origin HEAD:p101-exp

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.1.0-fix1
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova-v4.1.0-Runtime.zip
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/apply_self_test.json
          if-no-files-found: error
          retention-days: 14
