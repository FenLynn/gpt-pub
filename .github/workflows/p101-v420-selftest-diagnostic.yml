name: Diagnose P101 Mediova v4.2.0 self-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-selftest-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'repo-p101-v420-selftest-diagnostic-trigger'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated result branch
        uses: actions/checkout@v4
        with:
          ref: repo-p101-v420-selftest-results
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archive=Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $expanded=Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri $uri -OutFile $archive -Headers @{'User-Agent'='Mediova-v4.2.0-diagnostic'}
          Expand-Archive $archive -DestinationPath $expanded -Force
          $ffmpeg=Get-ChildItem $expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem $expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or $ffmpeg.Directory.FullName -ne $ffprobe.Directory.FullName) { throw 'FFmpeg pair missing' }
          "FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Runtime and run self-test
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.2.0.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          $build=Join-Path $PWD 'build'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $report=Join-Path $build 'ci_self_test_diagnostic.json'
          $dataRoot=Join-Path $env:RUNNER_TEMP ('Mediova-diagnostic-' + [guid]::NewGuid().ToString('N'))
          New-Item $dataRoot -ItemType Directory -Force | Out-Null
          $env:APPDATA=$dataRoot
          $env:LOCALAPPDATA=$dataRoot
          $env:XDG_CONFIG_HOME=$dataRoot
          $env:MEDIOVA_RUNTIME_DIR=$runtime
          $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test', "--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(480000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native self-test timeout'
          }
          if (!(Test-Path $report)) { throw 'Native self-test report missing' }
          $raw=Get-Content $report -Raw
          Write-Host $raw
          $json=$raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          $failed=@($checks | Where-Object {-not [bool]$_.Value} | ForEach-Object {$_.Name})
          Write-Host "passed=$($json.passed) version=$($json.version) checks=$($checks.Count) failed=$($failed.Count)"
          if ($failed.Count -gt 0) { Write-Host ('failed checks: ' + ($failed -join ', ')) }
          Copy-Item $report (Join-Path $PWD '..\v420_self_test_diagnostic.json') -Force

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/1-桌面软件/101-Mediova/v420_self_test_diagnostic.json'
          git commit -m 'P101: 记录 v4.2.0 原生自检诊断'
          git push origin HEAD:repo-p101-v420-selftest-results
