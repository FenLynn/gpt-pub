name: Build Ringtone Cutter APK
on:
  push:
    branches: [build/ringtone-cutter-apk]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore source
        run: |
          cat scratch/ringtone-parts/part*.txt | base64 -d > scratch/RingtoneCutter-source.zip
          rm -rf scratch/build && mkdir -p scratch/build
          unzip -q scratch/RingtoneCutter-source.zip -d scratch/build
      - name: Build installable debug APK
        working-directory: scratch/build/RingtoneCutter
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package
        run: cp scratch/build/RingtoneCutter/app/build/outputs/apk/debug/app-debug.apk RingtoneCutter-v1.0.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RingtoneCutter-APK
          path: RingtoneCutter-v1.0.0-arm64.apk
          if-no-files-found: error
