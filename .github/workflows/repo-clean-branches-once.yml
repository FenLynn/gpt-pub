name: Cleanup completed repository branches

on:
  push:
    branches:
      - main
    paths:
      - '.maintenance/branch-cleanup-2026-08-01.txt'

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete completed branches
        uses: actions/github-script@v7
        with:
          script: |
            const deleteBranches = [
              'p102-finalize-public-v073-v2',
              'p102-finalize-public-v073',
              'p102-import-v073',
              'repo-adopt-category-and-branch-model',
              'repo-cleanup-p102-v073-temporary-files',
              'repo-decouple-independent-numbering',
              'repo-fix-p101-import-shards',
              'repo-fix-p102-import-synchronize',
              'repo-fix-p102-import-trigger',
              'repo-fix-p102-release-redirect-auth',
              'repo-fix-p102-release-runner',
              'repo-fix-p102-release-text-normalization',
              'repo-init-public-hub',
              'repo-register-p101-importer',
              'repo-register-p102-public-importer',
              'repo-release-p102-v073',
              'repo-run-p102-release-v073',
              'repo-clean-existing-branches'
            ];
            const kept = ['main', 'p102-stable', 'p102-exp', 'p101-migration-payload'];
            const deleted = [];
            const missing = [];
            const failures = [];

            for (const branch of deleteBranches) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
              } catch (error) {
                if (error.status === 404) {
                  missing.push(branch);
                  continue;
                }
                failures.push(`${branch}: lookup ${error.message}`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                deleted.push(branch);
              } catch (error) {
                failures.push(`${branch}: delete ${error.message}`);
              }
            }

            const body = [
              'BRANCH_CLEANUP_RESULT',
              `run_id=${context.runId}`,
              `deleted=${deleted.join(',') || '(none)'}`,
              `already_missing=${missing.join(',') || '(none)'}`,
              `kept=${kept.join(',')}`,
              `failures=${failures.join(' | ') || '(none)'}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 18,
              body
            });

            if (failures.length > 0) {
              core.setFailed(`Branch cleanup failures: ${failures.join(' | ')}`);
            }
