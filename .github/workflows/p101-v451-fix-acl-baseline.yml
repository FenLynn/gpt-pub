name: P101 Fix ACL Baseline Order

on:
  push:
    branches: [p101-v451-verification]
    paths:
      - '.github/workflows/p101-v451-fix-acl-baseline.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v451-verification
          fetch-depth: 0
      - name: Read baseline before applying deny ACE
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/1-桌面软件/101-Mediova/代码/cmd/nativefaultcheck/main_windows.go')
          source = path.read_text(encoding='utf-8')
          old = '''\tdenyArg := identity + ":(OI)(CI)(W,M)"
          \tdenyOut, denyErr := exec.Command("icacls", dataDir, "/deny", denyArg).CombinedOutput()
          \tif denyErr != nil {
          \t\treturn fmt.Errorf("icacls deny failed: %v: %s", denyErr, strings.TrimSpace(string(denyOut)))
          \t}
          \taclBefore, _ := os.ReadFile(path)
          \taclSaveErr := config.Save(settingsWithOutput("acl-change"))
          '''
          new = '''\taclBefore, aclBeforeErr := os.ReadFile(path)
          \tif aclBeforeErr != nil {
          \t\treturn fmt.Errorf("read ACL baseline: %w", aclBeforeErr)
          \t}
          \tdenyArg := identity + ":(OI)(CI)(W,M)"
          \tdenyOut, denyErr := exec.Command("icacls", dataDir, "/deny", denyArg).CombinedOutput()
          \tif denyErr != nil {
          \t\treturn fmt.Errorf("icacls deny failed: %v: %s", denyErr, strings.TrimSpace(string(denyOut)))
          \t}
          \taclSaveErr := config.Save(settingsWithOutput("acl-change"))
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one ACL baseline block, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/p101-v451-fix-acl-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/1-桌面软件/101-Mediova/代码/cmd/nativefaultcheck/main_windows.go \
                  .github/workflows/p101-v451-fix-acl-baseline.yml
          git diff --cached --check
          git commit -m 'Mediova｜修正 ACL 探针基线读取顺序'
          git push origin HEAD:p101-v451-verification
