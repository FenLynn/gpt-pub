name: P101 Retry v4.5.2 Round 1 Contract

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

# This no-op revision intentionally retriggers the workflow after GitHub has
# registered it from the preceding pull-request synchronize event.
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p101-v452-round1-ui-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round1-ui-state
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Update the superseded lamp contract and apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round1.py')
          lines = script.read_text(encoding='utf-8').splitlines()
          replacement = '''        r'\\tglyph := "[^"]*E768"\\n\\tif dis\\.HwndItem != a\\.hStart \\{\\n\\t\\tglyph = secondaryButtonGlyph\\(dis\\.HwndItem\\)\\n\\t\\}\\n\\tlabel := getText\\(dis\\.HwndItem\\)\\n','''
          matches = 0
          for i, line in enumerate(lines):
              if 'glyph :=' in line and 'E768' in line and 'secondaryButtonGlyph' in line:
                  lines[i] = replacement
                  matches += 1
          if matches != 1:
              raise SystemExit(f'expected one start-glyph matcher line, found {matches}')
          script.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          contract = Path('projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go')
          text = contract.read_text(encoding='utf-8')
          old = 'for _, want := range []string{`drawCenteredText(hdc, "●"`, `for i, unit := range units`'
          new = 'for _, want := range []string{`v452DrawTrueStatusLamp(hdc, rc, color)`, `for i, unit := range units`'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy lamp contract, found {text.count(old)}')
          text = text.replace(old, new, 1)
          guard = '''\tif strings.Contains(helper, `drawCenteredText(hdc, "●"`) {
\t\tt.Fatal("font-rendered status lamp returned")
\t}
'''
          anchor = '''\tif strings.Contains(helper, "withRoundedClip(hdc, fill") {
'''
          if text.count(anchor) != 1:
              raise SystemExit('unable to insert status-lamp regression guard')
          text = text.replace(anchor, guard + anchor, 1)
          contract.write_text(text, encoding='utf-8', newline='\n')
          PY

          python projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round1.py
          rm -f \
            .github/workflows/p101-v452-round1-retry.yml \
            .github/workflows/p101-v452-round1-retry-contract.yml
          gofmt -w projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go
          cd projects/1-桌面软件/101-Mediova/代码
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('SOURCE_FILES_SHA256.txt')
          paths = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2:
                  paths.append(parts[1])
          manifest.write_text('\n'.join(
              f'{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}'
              for rel in sorted(set(paths))
          ) + '\n', encoding='utf-8', newline='\n')
          PY
          go test -count=1 ./...
          cd ../../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜完成 v4.5.2 第一轮 UI 状态接线'
          git push origin HEAD:p101-v452-round1-ui-state
