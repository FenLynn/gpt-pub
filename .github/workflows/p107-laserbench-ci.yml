name: P107 LaserBench CI

on:
  push:
    branches: [p107-exp, p107-stable]
    paths:
      - 'projects/1-桌面软件/107-LaserBench/**'
      - '.github/workflows/p107-laserbench-ci.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  pull_request:
    branches: [p107-exp, p107-stable, main]
    paths:
      - 'projects/1-桌面软件/107-LaserBench/**'
      - '.github/workflows/p107-laserbench-ci.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p107-laserbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PROJECT_ROOT: 'projects/1-桌面软件/107-LaserBench'

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce P107 pull-request scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          bad=$(git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ev '^(projects/1-桌面软件/107-LaserBench/|projects/1-桌面软件/README\.md$|目录\.md$|\.github/workflows/p107-laserbench-ci\.yml$)' || true)
          if [[ -n "$bad" ]]; then
            echo 'Out-of-scope P107 changes:'
            echo "$bad"
            exit 1
          fi

  windows-build:
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read product version
        id: product-version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [xml]$xml=Get-Content "$env:PROJECT_ROOT/src/Directory.Build.props" -Raw
          $version=@($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'LaserBench <Version> is missing.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify acquisition vector source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUi/src/App.vue" -Raw
          $css=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUi/src/styles.css" -Raw
          $count=([regex]::Matches($app,'class="acq-vector')).Count
          if ($count -ne 4) { throw "Expected 4 top acquisition vector icons, found $count." }
          if ($app -match 'acq-(power|spectrum|scope|beam)\.gif' -or $app -match 'AcqGif|acqGif') {
            throw 'App.vue still depends on animated GIF assets.'
          }
          if ($app -match '<animate|animateTransform') { throw 'SMIL animation nodes remain in App.vue.' }
          if ($css -notmatch '@keyframes lbPowerBar1' -or $css -notmatch '@keyframes lbBeamRing' -or $css -notmatch '@keyframes lbSpectrumPeak' -or $css -notmatch '@keyframes lbScopeFlow') {
            throw 'Verified CSS vector keyframes are missing.'
          }
          if ($css -notmatch 'lbSpectrumPeak 4\.8s' -or $css -notmatch 'lbScopeFlow 6\.4s linear') {
            throw 'Spectrum/Scope acquisition motion semantics regressed.'
          }

      - name: Verify workstation UI contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUi/src/App.vue" -Raw
          $css=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUi/src/styles.css" -Raw
          $types=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUi/src/types.ts" -Raw
          $backend=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/InstrumentBackends.cs" -Raw
          $hostSource=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/WebUiHost.cs" -Raw
          $required=@(
            'class="metric-value-chip"',
            'class="module-config-dock workstation-config module-side-pane"',
            'module-side-tabs',
            'folder-picker-btn',
            'app.pickExperimentFolder',
            'powerRangeStartPct',
            'powerRangeEndPct',
            'powerAverageSamples',
            '波长范围',
            'M² 分析',
            '触发 / 采集',
            'powerInterfaceEnabled',
            'spectrumInterfaceEnabled',
            'beamInterfaceEnabled',
            'scopeInterfaceEnabled',
            'osaSamplePoints',
            'osaVideoBandwidthHz',
            'osaTraceMode',
            'scope-fft-plot',
            'scope-time-plot',
            'interface-live',
            'app.probeInterfaces',
            '立即重新探测',
            'show-axis-labels',
            "activePage==='dashboard'"
          )
          foreach($needle in $required){ if($app -notlike "*$needle*"){ throw "Workstation UI contract missing: $needle" } }
          foreach($needle in @('powerAverageSamples','osaResolution','beamWidthMethod','scopeVoltsDiv','osaSamplePoints','osaVideoBandwidthHz','osaTraceMode','InstrumentInterfaceState','powerInterfaceEnabled','spectrumInterfaceEnabled','beamInterfaceEnabled','scopeInterfaceEnabled')){
            if($types -notlike "*$needle*"){ throw "Web UI config type missing: $needle" }
          }
          foreach($needle in @('FolderBrowserDialog','app.pickExperimentFolder','OsaSamplePoints','OsaVideoBandwidthHz','OsaTraceMode')){ if($hostSource -notlike "*$needle*"){ throw "WebUiHost workstation contract missing: $needle" } }
          foreach($needle in @('Ophir Juno','Yokogawa AQ6370D','BeamSquared','Tektronix MSO44','InstrumentProviderFactory')){
            if($backend -notlike "*$needle*"){ throw "Instrument backend contract missing: $needle" }
          }
          if($css -notmatch 'grid-template-columns:minmax\(0,1fr\) 360px' -or $css -notmatch 'module-side-tabs' -or $css -notmatch 'metric-value-chip'){
            throw 'Workstation layout / side-pane / Dashboard metric-chip CSS missing.'
          }

      - name: Verify real-hardware driver contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $runtime=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/InstrumentRuntime.cs" -Raw
          $juno=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/OphirJunoDriver.cs" -Raw
          $aq=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/Aq6370dDriver.cs" -Raw
          $tek=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/TektronixMso44Driver.cs" -Raw
          $beam=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/BeamSquaredDriver.cs" -Raw
          $hybrid=Get-Content "$env:PROJECT_ROOT/src/LaserBench.App/HybridInstrumentProvider.cs" -Raw
          $bridge=Get-Content "$env:PROJECT_ROOT/src/LaserBench.BeamSquaredBridge/Program.cs" -Raw

          foreach($needle in @('ScanUSB','OpenUSBDevice','GetMeasurementMode','SetMeasurementMode','StartStream','GetData','CoLMMeasurement')){
            if($juno -notlike "*$needle*"){ throw "Ophir Juno driver contract missing: $needle" }
          }
          foreach($needle in @('10001','open \"anonymous\"',':STAT:OPER:EVEN?',':TRACE:DATA:X? TRA',':TRACE:DATA:Y? TRA','*IDN?')){
            if($aq -notlike "*$needle*"){ throw "AQ6370D driver contract missing: $needle" }
          }
          foreach($needle in @('4000',':ACQUIRE:STOPAFTER RUNSTOP',':ACQUIRE:STATE RUN',':WFMOUTPRE:XINCR?',':WFMOUTPRE:XZERO?',':WFMOUTPRE:PT_OFF?',':CURVE?','SignalMath.Fft')){
            if($tek -notlike "*$needle*"){ throw "Tektronix MSO44 driver contract missing: $needle" }
          }
          foreach($needle in @('M2.Automation.dll','LaserBench.BeamSquaredBridge.exe','SNAPSHOT')){
            if($beam -notlike "*$needle*"){ throw "BeamSquared driver contract missing: $needle" }
          }
          foreach($needle in @('M2.Automation.AutomatedBeamSquared','QuantitativeResults','BeamWidthX','LaserResults','M2X')){
            if($bridge -notlike "*$needle*"){ throw "BeamSquared .NET Framework bridge contract missing: $needle" }
          }
          foreach($needle in @('MIXED','WAITING','OphirJunoWorker','Aq6370dWorker','BeamSquaredWorker','TektronixMso44Worker')){
            if($hybrid -notlike "*$needle*"){ throw "Hybrid provider contract missing: $needle" }
          }
          foreach($needle in @('TcpClient','InstrumentEndpoint','DataPlaneReady','FailureCount')){
            if($runtime -notlike "*$needle*"){ throw "Instrument runtime contract missing: $needle" }
          }

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_ROOT/src/LaserBench.App/LaserBench.App.csproj"
          dotnet restore "$env:PROJECT_ROOT/src/LaserBench.Launcher/LaserBench.Launcher.csproj"
          dotnet restore "$env:PROJECT_ROOT/src/LaserBench.BeamSquaredBridge/LaserBench.BeamSquaredBridge.csproj"

      - name: Build BeamSquared .NET Framework bridge
        shell: pwsh
        run: |
          dotnet build "$env:PROJECT_ROOT/src/LaserBench.BeamSquaredBridge/LaserBench.BeamSquaredBridge.csproj" -c Release --no-restore -o build/BeamSquaredBridge
          if (!(Test-Path 'build/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe' -PathType Leaf)) { throw 'LaserBench.BeamSquaredBridge.exe missing.' }
          $missingVendor=Join-Path $env:RUNNER_TEMP 'missing-M2.Automation.dll'
          $stdout=Join-Path $env:RUNNER_TEMP 'beam-bridge-stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'beam-bridge-stderr.txt'
          $proc=Start-Process -FilePath (Resolve-Path 'build/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe') -ArgumentList "--assembly","$missingVendor" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $text=(Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
          if($proc.ExitCode -eq 0 -or $text -notmatch 'FATAL'){ if(Test-Path $stderr){Get-Content $stderr -Raw|Write-Host}; throw 'BeamSquared bridge dependency-failure contract did not produce FATAL.' }

      - name: Build main application
        shell: pwsh
        run: dotnet build "$env:PROJECT_ROOT/src/LaserBench.App/LaserBench.App.csproj" -c Release --no-restore

      - name: Publish main application
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_ROOT/src/LaserBench.App/LaserBench.App.csproj" `
            -c Release -r win-x64 --self-contained false --no-restore `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded `
            -o build/App
          if (!(Test-Path 'build/App/LaserBench.App.exe' -PathType Leaf)) { throw 'LaserBench.App.exe missing.' }

      - name: Publish NativeAOT dependency launcher
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_ROOT/src/LaserBench.Launcher/LaserBench.Launcher.csproj" `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishAot=true -p:StripSymbols=true `
            -o build/Launcher
          if (!(Test-Path 'build/Launcher/LaserBench.exe' -PathType Leaf)) { throw 'LaserBench.exe launcher missing.' }

      - name: Run isolated application self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('LaserBench-SelfTest-' + [guid]::NewGuid().ToString('N'))
          $report=Join-Path $root 'self-test.json'
          New-Item $root -ItemType Directory -Force | Out-Null
          $oldRoot=$env:LASERBENCH_ROOT
          try {
            $env:LASERBENCH_ROOT=$root
            $proc=Start-Process -FilePath (Resolve-Path 'build/App/LaserBench.App.exe') -ArgumentList "--self-test=$report" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
              throw "LaserBench self-test exit code $($proc.ExitCode)"
            }
            $json=Get-Content $report -Raw | ConvertFrom-Json
            $json | ConvertTo-Json -Depth 8 | Write-Host
            if (-not $json.ok) { throw 'LaserBench self-test reported failure.' }
            if (-not $json.webUiEmbedded) { throw 'Embedded WebUi self-test failed.' }
            if (-not $json.neverOverwrite) { throw 'Never-overwrite self-test failed.' }
            if (-not $json.simulator) { throw 'Simulator self-test failed.' }
            if (-not $json.driverCore) { throw 'Driver-core self-test evidence missing.' }
            if ([math]::Abs([double]$json.driverCore.fftPeakCh1Khz - 5.0) -gt 0.15) { throw 'Driver-core FFT CH1 self-test failed.' }
            if ([math]::Abs([double]$json.driverCore.fftPeakCh2Khz - 12.0) -gt 0.15) { throw 'Driver-core FFT CH2 self-test failed.' }
            if ($json.captureFiles.Count -lt 7) { throw 'Capture self-test produced too few files.' }
          } finally {
            $env:LASERBENCH_ROOT=$oldRoot
          }
          New-Item build/TestEvidence -ItemType Directory -Force | Out-Null
          Copy-Item $report build/TestEvidence/self-test.json -Force
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run real GUI startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('LaserBench-GuiSmoke-' + [guid]::NewGuid().ToString('N'))
          New-Item $root -ItemType Directory -Force | Out-Null
          $oldRoot=$env:LASERBENCH_ROOT
          $proc=$null
          try {
            $env:LASERBENCH_ROOT=$root
            $proc=Start-Process -FilePath (Resolve-Path 'build/App/LaserBench.App.exe') -PassThru
            $startup=Join-Path $root 'logs/startup.log'
            $crash=Join-Path $root 'logs/crash.log'
            $deadline=(Get-Date).AddSeconds(30)
            $ready=$false
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                if (Test-Path $startup) { Get-Content $startup -Raw | Write-Host }
                if (Test-Path $crash) { Get-Content $crash -Raw | Write-Host }
                throw "LaserBench GUI exited during startup with code $($proc.ExitCode)."
              }
              if (Test-Path $startup -PathType Leaf) {
                $startupText=Get-Content $startup -Raw
                if ($startupText -match 'workspace-ready') {
                  $ready=$true
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $startup -PathType Leaf)) { throw 'GUI startup did not create startup.log.' }
            $startupText=Get-Content $startup -Raw
            $startupText | Write-Host
            if ($startupText -notmatch 'window-shown') { throw 'GUI startup never reached window-shown.' }
            if ($startupText -notmatch 'webui-acq-vectors.*verified') {
              if (Test-Path $crash) { Get-Content $crash -Raw | Write-Host }
              throw 'WebView2 acquisition vector render-state verification failed.'
            }
            if ($startupText -notmatch 'webui-ready') {
              if (Test-Path $crash) { Get-Content $crash -Raw | Write-Host }
              throw 'GUI startup never reached webui-ready.'
            }
            if (-not $ready -or $startupText -notmatch 'workspace-ready') {
              if (Test-Path $crash) { Get-Content $crash -Raw | Write-Host }
              throw 'GUI startup never reached workspace-ready within 30 seconds.'
            }
            Copy-Item $startup build/TestEvidence/gui-startup.log -Force
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            $env:LASERBENCH_ROOT=$oldRoot
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Assemble portable package
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.value }}
        run: |
          $ErrorActionPreference='Stop'
          $pkg='build/Portable'
          New-Item $pkg -ItemType Directory -Force | Out-Null
          Copy-Item 'build/Launcher/LaserBench.exe' "$pkg/LaserBench.exe" -Force
          Copy-Item 'build/App/LaserBench.App.exe' "$pkg/LaserBench.App.exe" -Force
          New-Item "$pkg/runtime/BeamSquaredBridge" -ItemType Directory -Force | Out-Null
          Copy-Item 'build/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe' "$pkg/runtime/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe" -Force
          if(Test-Path 'build/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe.config'){
            Copy-Item 'build/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe.config' "$pkg/runtime/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe.config" -Force
          }
          New-Item "$pkg/tools" -ItemType Directory -Force | Out-Null
          Copy-Item "$env:PROJECT_ROOT/tools/install-dotnet8.ps1" "$pkg/tools/install-dotnet8.ps1" -Force
          Copy-Item "$env:PROJECT_ROOT/tools/install-webview2.ps1" "$pkg/tools/install-webview2.ps1" -Force
          Copy-Item "$env:PROJECT_ROOT/OFFLINE-DEPENDENCIES.txt" "$pkg/OFFLINE-DEPENDENCIES.txt" -Force
          Copy-Item "$env:PROJECT_ROOT/README.md" "$pkg/README.md" -Force
          foreach ($dir in @('config','data/exp','data/pic','data/video','logs','runtime')) {
            New-Item (Join-Path $pkg $dir) -ItemType Directory -Force | Out-Null
          }
          $versionInfo=[ordered]@{
            product='LaserBench'
            version=$env:PRODUCT_VERSION
            commit=$env:GITHUB_SHA
            buildUtc=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            runtime='.NET 8 Desktop x64 + WebView2 Evergreen'
            launcher='NativeAOT x64'
            hardware='Juno COM + AQ6370D SCPI + BeamSquared net48 bridge + MSO44 SCPI'
          }
          $versionInfo | ConvertTo-Json | Set-Content "$pkg/version.json" -Encoding utf8

      - name: Verify portable Runtime boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pkg='build/Portable'
          foreach ($required in @('LaserBench.exe','LaserBench.App.exe','runtime/BeamSquaredBridge/LaserBench.BeamSquaredBridge.exe','OFFLINE-DEPENDENCIES.txt','tools/install-dotnet8.ps1','tools/install-webview2.ps1','version.json')) {
            if (!(Test-Path (Join-Path $pkg $required) -PathType Leaf)) { throw "Missing package file: $required" }
          }
          $unexpected=Get-ChildItem $pkg -Recurse -File | Where-Object { $_.Extension -in '.dll','.pdb' }
          if ($unexpected) {
            $unexpected | Select-Object FullName,Length | Format-Table
            throw 'Base Portable package unexpectedly contains loose DLL/PDB payload.'
          }
          foreach ($private in @('app.json','app.json.bak','*.csv','*.png','*.avi','*.log')) {
            if (Get-ChildItem $pkg -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "Runtime contains generated/private Data matching $private" }
          }

      - name: Verify dependency launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:RUNNER_TEMP 'laserbench-launcher-check.json'
          $proc=Start-Process -FilePath (Resolve-Path 'build/Portable/LaserBench.exe') -WorkingDirectory (Resolve-Path 'build/Portable') -ArgumentList "--check=$report" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report -Raw | Write-Host }; throw "Launcher check failed: $($proc.ExitCode)" }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $json | ConvertTo-Json | Write-Host
          if (-not $json.ok -or -not $json.appExists -or -not $json.dotnetDesktop8 -or -not $json.webView2Runtime -or -not $json.portable) { throw 'Launcher dependency check returned an invalid result.' }
          Copy-Item $report build/TestEvidence/launcher-check.json -Force

      - name: Create manifest, ZIP and SHA-256
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.value }}
        run: |
          $ErrorActionPreference='Stop'
          $pkg=Resolve-Path 'build/Portable'
          $manifest=@()
          foreach ($file in Get-ChildItem $pkg -Recurse -File | Sort-Object FullName) {
            $relative=[IO.Path]::GetRelativePath($pkg.Path,$file.FullName).Replace('\','/')
            $manifest += [ordered]@{
              path=$relative
              bytes=$file.Length
              sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content build/manifest.json -Encoding utf8
          $zip="build/LaserBench_v$env:PRODUCT_VERSION`_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'build/Portable/*' -DestinationPath $zip -CompressionLevel Optimal
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytes=(Get-Item $zip).Length
          "$(Split-Path $zip -Leaf)  $zipBytes bytes  sha256=$zipHash" | Set-Content build/SHA256.txt -Encoding utf8
          Get-Content build/SHA256.txt | Write-Host

      - name: Upload LaserBench candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaserBench-v${{ steps.product-version.outputs.value }}-win-x64
          path: |
            build/LaserBench_v${{ steps.product-version.outputs.value }}_portable.zip
            build/SHA256.txt
            build/manifest.json
            build/TestEvidence/*
          if-no-files-found: error
          retention-days: 14