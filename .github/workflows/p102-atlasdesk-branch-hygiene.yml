name: P102 AtlasDesk Branch Hygiene

on:
  push:
    branches:
      - main
      - repo-p102-branch-hygiene
    paths:
      - '.github/workflows/p102-atlasdesk-branch-hygiene.yml'
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate-current-state:
    if: github.event_name == 'push' && github.ref == 'refs/heads/repo-p102-branch-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify post-cleanup P102 branch set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t branches < <(git branch -r --format='%(refname:short)' --list 'origin/p102-*' | sed 's#^origin/##' | sort -u)
          expected=(
            'p102-exp'
            'p102-stable'
            'p102-v081-dashboard-dialog-fix'
          )

          if [[ "${branches[*]}" != "${expected[*]}" ]]; then
            echo "::error::Unexpected P102 branch set: ${branches[*]}"
            exit 1
          fi

          unique='p102-v081-dashboard-dialog-fix'
          if git merge-base --is-ancestor "refs/remotes/origin/${unique}" origin/main; then
            echo "::error::Known unique branch is now contained in main; review it explicitly before changing policy: $unique"
            exit 1
          fi

          echo "P102 branch set is intentionally reduced to: ${branches[*]}"

  cleanup-bootstrap-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete completed repo bootstrap branch safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          branch='repo-p102-branch-hygiene'
          if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            echo "Bootstrap branch already absent: $branch"
            exit 0
          fi

          if ! git merge-base --is-ancestor "refs/remotes/origin/${branch}" origin/main; then
            echo "::error::Refusing to delete bootstrap branch with commits outside main: $branch"
            exit 1
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          echo "Deleted completed bootstrap branch: $branch"

      - name: Report remaining P102 refs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/p102-" --jq '.[].ref' | sed 's#refs/heads/##' | sort

  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'p102-exp' &&
      startsWith(github.event.pull_request.head.ref, 'p102-') &&
      github.event.pull_request.head.ref != 'p102-exp' &&
      github.event.pull_request.head.ref != 'p102-stable'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete exact merged P102 task head
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            echo "Merged task branch is already absent: $BRANCH"
            exit 0
          fi

          if ! git merge-base --is-ancestor "refs/remotes/origin/${BRANCH}" origin/p102-exp; then
            echo "::error::Refusing to delete merged head not contained in p102-exp: $BRANCH"
            exit 1
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null
          echo "Deleted merged transient AtlasDesk branch: $BRANCH"

  audit-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report P102 branch hygiene without deleting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t branches < <(git branch -r --format='%(refname:short)' --list 'origin/p102-*' | sed 's#^origin/##' | sort -u)

          for branch in "${branches[@]}"; do
            [[ "$branch" == 'p102-exp' || "$branch" == 'p102-stable' ]] && continue
            if git merge-base --is-ancestor "refs/remotes/origin/${branch}" origin/main; then
              echo "STALE_MAIN $branch"
            elif git merge-base --is-ancestor "refs/remotes/origin/${branch}" origin/p102-exp; then
              echo "MERGED_TO_EXP $branch"
            else
              echo "UNIQUE $branch"
            fi
          done
