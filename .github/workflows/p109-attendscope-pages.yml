name: P109 AttendScope CI

on:
  push:
    branches:
      - p109-exp
    paths:
      - "projects/1-桌面软件/109-AttendScope/**"
      - ".github/workflows/p109-attendscope-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p109-attendscope-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject any project-level Pages deployment
        shell: bash
        run: |
          if awk '/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*actions\/deploy-pages@/ {bad=1} /^[[:space:]]+pages:[[:space:]]+write([[:space:]]|$)/ {bad=1} END{exit bad ? 0 : 1}' .github/workflows/p109-attendscope-pages.yml; then
            echo "::error::P109 must not overwrite shared P108/P109 Pages"
            exit 1
          fi
      - name: Scope gate
        shell: bash
        run: |
          git fetch origin main
          while IFS= read -r file; do
            case "$file" in
              projects/1-桌面软件/109-AttendScope/*|.github/workflows/p109-attendscope-pages.yml|目录.md|projects/1-桌面软件/README.md) ;;
              *) echo "::error file=$file::Out-of-scope P109 change"; exit 1 ;;
            esac
          done < <(git -c core.quotepath=false diff --name-only origin/main...HEAD)
      - name: Strict offline guard
        shell: bash
        run: |
          APP="projects/1-桌面软件/109-AttendScope"
          test -f "$APP/index.html"
          test -f "$APP/src/core/xlsx-lite.js"
          test -f "$APP/src/vendor/echarts.min.js"
          test -f "$APP/src/vendor/ECHARTS-LICENSE.txt"
          test -f "$APP/src/vendor/tabulator.min.js"
          test -f "$APP/src/vendor/tabulator.min.css"
          test -f "$APP/src/vendor/TABULATOR-LICENSE.txt"
          test -f "$APP/src/vendor/xlsx.full.min.js"
          test -f "$APP/src/vendor/SHEETJS-LICENSE.txt"
          test -f "$APP/src/app/35-workbench.js"
          test -f "$APP/src/app/25-echarts.js"
          test -f "$APP/tests/smoke.cjs"
          if grep -InE 'https?://' "$APP/index.html"; then echo "::error::Remote HTML dependencies"; exit 1; fi
          if grep -RInE 'https?://' "$APP/src/app" "$APP/src/css"; then echo "::error::Remote application URLs"; exit 1; fi
          if grep -RInE 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|EventSource[[:space:]]*\(|sendBeacon[[:space:]]*\(' "$APP/src/app" "$APP/src/core"; then echo "::error::Runtime network call"; exit 1; fi
      - name: Syntax and ECharts runtime
        shell: bash
        run: |
          node --check "projects/1-桌面软件/109-AttendScope/src/core/xlsx-lite.js"
          node --check "projects/1-桌面软件/109-AttendScope/src/vendor/echarts.min.js"
          node --check "projects/1-桌面软件/109-AttendScope/src/vendor/tabulator.min.js"
          node --check "projects/1-桌面软件/109-AttendScope/src/vendor/xlsx.full.min.js"
          grep -q "Tabulator v6.3.1" "projects/1-桌面软件/109-AttendScope/src/vendor/tabulator.min.js"
          for f in projects/1-桌面软件/109-AttendScope/src/app/*.js; do node --check "$f"; done
          node --check "projects/1-桌面软件/109-AttendScope/tests/smoke.cjs"
          grep -q "./src/vendor/tabulator.min.js" "projects/1-桌面软件/109-AttendScope/index.html"
          grep -q "./src/vendor/xlsx.full.min.js" "projects/1-桌面软件/109-AttendScope/index.html"
          node - <<'NODE'
          const e=require('./projects/1-桌面软件/109-AttendScope/src/vendor/echarts.min.js');
          if(e.version!=='6.1.0'||typeof e.init!=='function')throw Error('Local ECharts invalid');
          NODE
          grep -q 'series.custom' "projects/1-桌面软件/109-AttendScope/src/vendor/echarts.min.js"
          grep -q 'dataZoom.slider' "projects/1-桌面软件/109-AttendScope/src/vendor/echarts.min.js"
          node - <<'NODE'
          const x=require('./projects/1-桌面软件/109-AttendScope/src/vendor/xlsx.full.min.js');
          if(x.version!=='0.20.3'||typeof x.read!=='function'||typeof x.utils.sheet_to_json!=='function')throw Error('Local SheetJS invalid');
          NODE
      - name: Install CJK fonts for accurate visual screenshots
        timeout-minutes: 5
        shell: bash
        run: |
          if test -z "$(fc-list :lang=zh family)"; then
            font="$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 2 --retry-max-time 190 \
              'https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o "$font"
            test "$(git hash-object "$font")" = 'dc15562470b4f842321894787a0d066879ccff8b'
            mkdir -p "$HOME/.local/share/fonts"
            install -m 644 "$font" "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
            fc-cache -f "$HOME/.local/share/fonts"
          fi
          test -n "$(fc-list :lang=zh family)"
          fc-list :lang=zh family | sed -n '1,3p'
      - name: Set up real Chromium browser test
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/p109-playwright" --no-save --no-audit --no-fund playwright@1.58.2
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Test actual offline UI and SVG arrows
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p109-playwright/node_modules/playwright
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          node "projects/1-桌面软件/109-AttendScope/tests/smoke.cjs"
      - name: Build verified offline upgrade candidate
        shell: bash
        run: |
          APP="projects/1-桌面软件/109-AttendScope"
          python3 "$APP/tests/package-audit.py"
          python3 "$APP/tools/package-release.py" "$APP" "$RUNNER_TEMP/p109-candidate/P109-upgrade.zip"
          cd "$RUNNER_TEMP/p109-candidate"
          sha256sum P109-upgrade.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p109-offline-upgrade-candidate
          path: ${{ runner.temp }}/p109-candidate
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p109-offline-browser-screenshots
          path: p109-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

