name: Import P101 Mediova v4.0.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

jobs:
  import-and-linux-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-migration-payload'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-migration-payload
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Download and verify sanitized public artifact
        shell: bash
        run: |
          set -euo pipefail
          url=$(python - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          body = event.get('pull_request', {}).get('body') or ''
          prefix = 'P101_PUBLIC_URL='
          values = [line[len(prefix):].strip() for line in body.splitlines() if line.startswith(prefix)]
          if len(values) != 1 or not values[0].startswith('https://'):
              raise SystemExit('exactly one HTTPS P101_PUBLIC_URL line is required')
          print(values[0])
          PY
          )
          curl -L --fail --silent --show-error "$url" -o /tmp/public-artifact.zip
          test "$(sha256sum /tmp/public-artifact.zip | cut -d' ' -f1)" = 'b1c1c1550a4ac288fa6ad729801d42337b3b2bf3488f14d7c93e742a27ae6cae'
          mkdir -p /tmp/public-artifact /tmp/payload
          unzip -q /tmp/public-artifact.zip -d /tmp/public-artifact
          test -f /tmp/public-artifact/Mediova-public-payload.tar.gz
          test -f /tmp/public-artifact/public_payload_manifest.json
          test "$(stat -c '%s' /tmp/public-artifact/Mediova-public-payload.tar.gz)" -eq 187478
          test "$(sha256sum /tmp/public-artifact/Mediova-public-payload.tar.gz | cut -d' ' -f1)" = '65431485f36ca4ab59059b55facbe08c6a9646b1accdfcc249c3714401bb3cae'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/public-artifact/public_payload_manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          expected = {
              'product': 'Mediova',
              'version': '4.0.0',
              'project_path': 'projects/1-桌面软件/101-Mediova',
              'project_files': 60,
              'project_bytes': 764326,
              'payload_bytes': 187478,
              'payload_sha256': '65431485f36ca4ab59059b55facbe08c6a9646b1accdfcc249c3714401bb3cae',
              'private_provenance_included': False,
              'license_file_included': False,
          }
          if m != expected:
              raise SystemExit(f'public payload manifest mismatch: {m!r}')
          PY
          tar -xzf /tmp/public-artifact/Mediova-public-payload.tar.gz -C /tmp/payload

      - name: Verify public tree and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          project='/tmp/payload/projects/1-桌面软件/101-Mediova'
          test -f "$project/代码/go.mod"
          test -f /tmp/payload/README.md
          test -f /tmp/payload/目录.md
          test -f '/tmp/payload/projects/1-桌面软件/README.md'
          test -f '/tmp/payload/.github/workflows/p101-mediova-ci.yml'
          count=$(find "$project" -type f | wc -l)
          bytes=$(find "$project" -type f -printf '%s\n' | awk '{s+=$1} END{print s}')
          test "$count" -eq 60
          test "$bytes" -eq 764326
          test ! -e "$project/LICENSE"
          test ! -e "$project/SOURCE_PROVENANCE.md"
          if grep -RIn -E 'gpt-hub|agent-foundry|mediaworkbench-ci-v381-layout|bc05f8d|private-user-images|artifact_url|BEGIN [A-Z ]*PRIVATE KEY|(^|[^A-Za-z])P002([^A-Za-z]|$)|(^|[^A-Za-z])p002([^A-Za-z]|$)' /tmp/payload; then
            echo 'Forbidden private-source marker found in public payload' >&2
            exit 1
          fi

      - name: Validate Linux source and Windows cross-build
        working-directory: /tmp/payload/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./internal/config ./internal/media
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Create clean P101 product baseline branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C p101-import-v400 origin/main
          mkdir -p 'projects/1-桌面软件'
          cp -a '/tmp/payload/projects/1-桌面软件/101-Mediova' 'projects/1-桌面软件/'
          git config user.name 'GPT-Pub Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'projects/1-桌面软件/101-Mediova'
          git commit -m 'P101: establish Mediova v4.0.0 product baseline'
          git push --force origin HEAD:refs/heads/p101-import-v400

  windows-native-release:
    needs: import-and-linux-validate
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-import-v400
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test and build Mediova v4.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'projects/1-桌面软件/101-Mediova/代码'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows go test failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows go vet failed' }
          ./build_v4.0.0.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Mediova v4.0.0 build failed' }
          $exe = Resolve-Path 'build/Mediova_v4.0.0.exe'
          $info = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion) ProductName=$($info.ProductName)"
          if (($info.FileVersion -notlike '4.0.0*') -or ($info.ProductVersion -notlike '4.0.0*')) { throw 'Version resource mismatch' }
          if ($info.ProductName -notlike '*Mediova*') { throw 'Product resource was not renamed to Mediova' }

      - name: Provide real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $tools -Recurse -Filter ffmpeg.exe -File | Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          $ffprobe = Get-ChildItem $tools -Recurse -Filter ffprobe.exe -File | Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real FFmpeg not found' }
          $build = 'projects/1-桌面软件/101-Mediova/代码/build'
          Copy-Item $ffmpeg.FullName (Join-Path $build 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $build 'ffprobe.exe') -Force
          & (Join-Path $build 'ffmpeg.exe') -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Release-adjacent FFmpeg is not runnable' }

      - name: Run native self-test and package release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $PWD 'projects/1-桌面软件/101-Mediova'
          $build = Join-Path $project '代码/build'
          $exe = Join-Path $build 'Mediova_v4.0.0.exe'
          $report = Join-Path $build 'release_self_test.json'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', "--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(420000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native self-test timeout'
          }
          if (-not (Test-Path $report)) { throw 'Native self-test report missing' }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          $checks = @($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.0.0' -or $checks.Count -lt 57) {
            throw 'Native self-test failed, version mismatch, or too few checks'
          }
          $failed = @($checks | Where-Object { -not [bool]$_.Value })
          if ($failed.Count -gt 0) { throw "Native self-test failed checks: $($failed.Name -join ', ')" }

          Remove-Item (Join-Path $build 'ffmpeg.exe'), (Join-Path $build 'ffprobe.exe') -Force -ErrorAction SilentlyContinue
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content (Join-Path $build 'SHA256.txt') -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($hash -ne $expected) { throw 'EXE hash changed after native validation' }
          $manifest = [ordered]@{
            product = 'Mediova'
            version = '4.0.0'
            platform = 'Windows x64'
            source_commit = (git rev-parse HEAD).Trim()
            exe_sha256 = $hash
            authenticode_status = [string](Get-AuthenticodeSignature $exe).Status
            self_test_passed = $true
            self_test_checks = $checks.Count
            self_test_elapsed_ms = [int]$json.elapsed_ms
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $build 'release_manifest.json') -Encoding UTF8
          Copy-Item (Join-Path $project 'Mediova_v4.0.0_版本说明.md') (Join-Path $build 'Mediova_v4.0.0_版本说明.md') -Force
          $zip = Join-Path $build 'Mediova_v4.0.0_Windows_x64.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path @(
            $exe,
            (Join-Path $build 'SHA256.txt'),
            $report,
            (Join-Path $build 'release_manifest.json'),
            (Join-Path $build 'Mediova_v4.0.0_版本说明.md')
          ) -DestinationPath $zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.0.0-import-candidate
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0.exe
            projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0_Windows_x64.zip
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/release_self_test.json
            projects/1-桌面软件/101-Mediova/代码/build/release_manifest.json
            projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0_版本说明.md
          if-no-files-found: error
          retention-days: 90
