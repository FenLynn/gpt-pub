name: Finalize AtlasDesk v0.8.0 branches once

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/p102-v080-cleanup-trigger.txt'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove residual triggers and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .maintenance/p102-v080-release-trigger.txt
          rm -f .maintenance/p102-v080-cleanup-trigger.txt
          rm -f .github/workflows/p102-v080-cleanup-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '仓库｜完成 AtlasDesk v0.8.0 发布收尾'
            git push origin HEAD:main
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Align maintained P102 branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$FINAL_SHA:refs/heads/p102-stable" --force
          git push origin "$FINAL_SHA:refs/heads/p102-exp" --force

      - name: Delete temporary v0.8.0 branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            p102-v080-ci-materialize
            p102-v080-direct
            repo-apply-p102-v080
            repo-fix-p102-v080-apply
            repo-fix-p102-v080-trigger-context
            repo-issue-trigger-p102-v080
            repo-release-p102-v080
            repo-trigger-p102-v080-release
            repo-trigger-p102-v080
            repo-finalize-p102-v080
            repo-trigger-p102-v080-cleanup
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
