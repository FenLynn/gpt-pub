name: Apply P101 Mediova v4.2.0 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-apply-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v420-apply-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact P101 task branch
        uses: actions/checkout@v4
        with:
          ref: p101-v420-queue-workflow
          fetch-depth: 0

      - name: Apply exact source transform
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova/代码'
          python3 tools_v420_transform.py
          rm tools_v420_transform.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          gofmt -w cmd/mediaworkbench/main_windows.go cmd/mediaworkbench/v420_windows.go cmd/mediaworkbench/v420_context_windows.go internal/model/model.go internal/model/v420_queue_test.go internal/workflow/queue.go internal/workflow/queue_test.go internal/config/config.go

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova/代码'
          go test ./...
          go test -race ./...
          go vet ./...
          mkdir -p build/check
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o build/check/Mediova-v4.2.0-check.exe ./cmd/mediaworkbench
          test -s build/check/Mediova-v4.2.0-check.exe

      - name: Enforce exact change scope
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotepath false
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          test ${#changed[@]} -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              projects/1-桌面软件/101-Mediova/*) ;;
              *) echo "Out-of-scope path: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              *tools_v420_transform.py|*__pycache__*) echo "Temporary file remains: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit validated implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/1-桌面软件/101-Mediova'
          git diff --cached --quiet && { echo 'No validated changes to commit'; exit 1; }
          git commit -m 'P101: 接入 v4.2.0 队列工作流基础'
          git push origin HEAD:p101-v420-queue-workflow
