name: Prepare P101 Mediova v4.2.0 candidate once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-apply-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v420-apply-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact P101 task branch
        uses: actions/checkout@v4
        with:
          ref: p101-v420-queue-workflow
          fetch-depth: 0

      - name: Apply candidate version and CI transform
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova/代码'
          python3 tools_v420_candidate.py
          rm tools_v420_candidate.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          gofmt -w cmd/mediaworkbench/main_windows.go cmd/mediaworkbench/v420_preview_windows.go
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths = subprocess.check_output(['git','ls-files','--','.'], text=True).splitlines()
          include = []
          for raw in paths:
              p = Path(raw)
              if raw == 'SOURCE_FILES_SHA256.txt' or not p.is_file():
                  continue
              if p.parts and p.parts[0] == 'build':
                  continue
              if p.suffix.lower() in {'.go','.py','.ps1','.mod','.sum','.mwrsrc','.ico'}:
                  include.append(raw)
          lines = []
          for raw in sorted(include):
              digest = hashlib.sha256(Path(raw).read_bytes()).hexdigest()
              lines.append(f'{digest}  {raw}')
          Path('SOURCE_FILES_SHA256.txt').write_text('\n'.join(lines)+'\n', encoding='ascii')
          PY

      - name: Validate candidate source and workflow
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova/代码'
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test ./...
          go test -race ./...
          go vet ./...
          mkdir -p build/check
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o build/check/Mediova-v4.2.0-check.exe ./cmd/mediaworkbench
          test -s build/check/Mediova-v4.2.0-check.exe
          cd ../../../..
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/p101-mediova-ci.yml')"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/p101-mediova-ci.yml')
          text=path.read_text(encoding='utf-8')
          required=['build_v4.2.0.ps1','Mediova-v4.2.0-Runtime.zip','Mediova-v4.2.0-image-1450x820.png','Mediova-v4.2.0-held-1450x820.png','P101-Mediova-v4.2.0-CI']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('CI missing: '+', '.join(missing))
          payload=Path('projects/1-桌面软件/101-Mediova/p101-mediova-ci-v420.candidate.yml')
          payload.write_text(text, encoding='utf-8')
          PY
          git checkout HEAD -- .github/workflows/p101-mediova-ci.yml

      - name: Enforce exact product change scope
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotepath false
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          test ${#changed[@]} -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              projects/1-桌面软件/101-Mediova/*) ;;
              *) echo "Out-of-scope path: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              *tools_v420_*.py|*__pycache__*)
                if [[ -e "$path" ]]; then
                  echo "Temporary file remains: $path" >&2
                  exit 1
                fi
                ;;
            esac
          done

      - name: Commit validated candidate preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/1-桌面软件/101-Mediova'
          git diff --cached --quiet && { echo 'No validated changes to commit'; exit 1; }
          git commit -m 'P101: 准备 v4.2.0 完整候选与 CI 载荷'
          git push origin HEAD:p101-v420-queue-workflow
