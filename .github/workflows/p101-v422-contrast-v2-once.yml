name: Apply P101 Mediova v4.2.2 contrast v2 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v422-contrast-v2-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v422-contrast-v2-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest P101 experiment branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install per-glyph contrast renderer and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          helper = code / 'cmd/mediaworkbench/v422_windows.go'
          contract = code / 'cmd/mediaworkbench/v422_source_contract_test.go'
          winapi = code / 'cmd/mediaworkbench/winapi_windows.go'
          hashes = code / 'SOURCE_FILES_SHA256.txt'

          text = helper.read_text(encoding='utf-8')
          if 'withRoundedClip(hdc, fill' not in text:
              raise SystemExit('clipping-based contrast renderer is not present')
          if '"unsafe"' not in text:
              old_import = '\t"time"\n'
              if text.count(old_import) != 1:
                  raise SystemExit('helper import anchor is not unique')
              text = text.replace(old_import, old_import + '\t"unsafe"\n', 1)
          pattern = r'// drawContrastCenteredText .*?\nfunc drawContrastCenteredText\(hdc uintptr, text string, bar, fill rect, font uintptr\) \{.*?\n\}\n\nfunc taskDurationText'
          replacement = r'''// drawContrastCenteredText measures the complete label, keeps it centred, and
          // paints every glyph according to the background under its centre. This avoids
          // ListView/PrintWindow clipping inconsistencies while preserving white text on
          // blue fill and dark text on the light remainder of partially filled bars.
          func drawContrastCenteredText(hdc uintptr, text string, bar, fill rect, font uintptr) {
          \tif text == "" {
          \t\treturn
          \t}
          \toldFont, _, _ := procSelectObject.Call(hdc, font)
          \tdefer func() {
          \t\tif oldFont != 0 {
          \t\t\tprocSelectObject.Call(hdc, oldFont)
          \t\t}
          \t}()
          \tprocSetBkMode.Call(hdc, TRANSPARENT)

          \tunits := []rune(text)
          \twidths := make([]int32, len(units))
          \tvar total int32
          \tfor i, unit := range units {
          \t\tmeasure := rect{Right: 32767, Bottom: bar.Bottom - bar.Top}
          \t\tunitText := string(unit)
          \t\tprocDrawTextW.Call(hdc, uintptr(unsafe.Pointer(p(unitText))), ^uintptr(0), uintptr(unsafe.Pointer(&measure)), DT_LEFT|DT_SINGLELINE|DT_CALCRECT)
          \t\twidth := measure.Right - measure.Left
          \t\tif width <= 0 {
          \t\t\twidth = scaleDPI(8)
          \t\t}
          \t\twidths[i] = width
          \t\ttotal += width
          \t}

          \tx := bar.Left + (bar.Right-bar.Left-total)/2
          \tdark := colorRef(35, 51, 74)
          \tlight := colorRef(255, 255, 255)
          \tfor i, unit := range units {
          \t\twidth := widths[i]
          \t\tcolour := dark
          \t\tcentre := x + width/2
          \t\tif fill.Right > fill.Left && centre >= fill.Left && centre <= fill.Right {
          \t\t\tcolour = light
          \t\t}
          \t\tprocSetTextColor.Call(hdc, colour)
          \t\tunitRC := rect{Left: x, Top: bar.Top, Right: x + width + 1, Bottom: bar.Bottom}
          \t\tunitText := string(unit)
          \t\tprocDrawTextW.Call(hdc, uintptr(unsafe.Pointer(p(unitText))), ^uintptr(0), uintptr(unsafe.Pointer(&unitRC)), DT_LEFT|DT_VCENTER|DT_SINGLELINE)
          \t\tx += width
          \t}
          }

          func taskDurationText'''
          updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'contrast function replacement count={count}')
          helper.write_text(updated, encoding='utf-8', newline='\n')

          winapi_text = winapi.read_text(encoding='utf-8')
          if 'DT_CALCRECT' not in winapi_text:
              anchor = '\tDT_SINGLELINE                = 0x00000020\n'
              if winapi_text.count(anchor) != 1:
                  raise SystemExit('DT_CALCRECT anchor is not unique')
              winapi_text = winapi_text.replace(anchor, anchor + '\tDT_CALCRECT                  = 0x00000400\n', 1)
          winapi.write_text(winapi_text, encoding='utf-8', newline='\n')

          contract_text = contract.read_text(encoding='utf-8')
          old = '`withRoundedClip(hdc, fill, 4`'
          if contract_text.count(old) != 1:
              raise SystemExit(f'old clipping contract count={contract_text.count(old)}')
          contract_text = contract_text.replace(old, '`for i, unit := range units`, `DT_LEFT|DT_SINGLELINE|DT_CALCRECT`, `centre >= fill.Left && centre <= fill.Right`', 1)
          anchor = 'if !strings.Contains(rules, `kind == model.KindImage`)'
          if contract_text.count(anchor) != 1:
              raise SystemExit('contract tail anchor is not unique')
          contract_text = contract_text.replace(anchor, 'if strings.Contains(helper, "withRoundedClip(hdc, fill") {\n\t\tt.Fatal("progress text returned to unreliable clipping")\n\t}\n\t' + anchor, 1)
          contract.write_text(contract_text, encoding='utf-8', newline='\n')

          subprocess.run(['gofmt', '-w', str(helper), str(contract), str(winapi)], check=True)
          paths = []
          for line in hashes.read_text(encoding='utf-8').splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2:
                  paths.append(parts[1])
          refreshed = []
          for rel in sorted(set(paths)):
              path = code / rel
              if not path.is_file():
                  raise SystemExit(f'hash source path missing: {rel}')
              refreshed.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}')
          hashes.write_text('\n'.join(refreshed) + '\n', encoding='utf-8', newline='\n')
          PY
          cd projects/1-桌面软件/101-Mediova/代码
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_v422_contrast_v2_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova_v422_contrast_v2.exe ./cmd/mediaworkbench

      - name: Verify scope and push
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/winapi_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changes:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/winapi_windows.go
          git commit -m 'P101: 以逐字符配色修复 v4.2.2 进度文字'
          git push origin HEAD:p101-exp
