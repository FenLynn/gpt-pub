name: P101 Apply v4.5.2 Round 2

on:
  pull_request:
    branches: [p101-stable]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p101-v452-round2-list-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round2-list-lifecycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Apply exact list, queue and thumbnail wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round2.py')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n    round2 = CMD / "v452_round2_windows.go".*?round2.write_text\(round_text, encoding=\x27utf-8\x27, newline=\x27\\n\x27\)\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'unable to remove obsolete helper-signature patch block: {count}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round2.py
          cd projects/1-桌面软件/101-Mediova/代码
          go test -count=1 ./...
          cd ../../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜完成 v4.5.2 第二轮列表与生命周期接线'
          git push origin HEAD:p101-v452-round2-list-lifecycle
