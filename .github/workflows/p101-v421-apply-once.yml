name: Apply P101 Mediova v4.2.1 polish once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-polish-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v421-polish-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout latest p101-exp worktree
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat tooling/.github/scripts/p101_v421_patch.part* | base64 -d | gzip -d > /tmp/p101_v421_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/p101_v421_patch.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '# Preserve the directory tree after the output file has been committed and file times restored.\n'
          end_marker = '# 8. Versioned build entry and CI identity.\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('timestamp patch markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r"""# Preserve the directory tree after the output file has been committed and file times restored.
          replace_once(
              main,
              '''\tif settings.PreserveTimes {
          \t\t_ = media.PreserveTimes(input, out)
          \t}''',
              '''\tif settings.PreserveTimes {
          \t\tif err := media.PreserveTimes(input, out); err != nil {
          \t\t\ta.postUI(func() { setText(a.hStatusText, "输出已完成，但文件时间戳恢复失败："+short(err.Error(), 180)) })
          \t\t}
          \t\toutputRoot := settings.OutputDirFor(kind)
          \t\tif taskSnapshot.Queue != nil && strings.TrimSpace(taskSnapshot.Queue.OutputRoot) != "" {
          \t\t\toutputRoot = taskSnapshot.Queue.OutputRoot
          \t\t}
          \t\tif err := media.PreserveOutputTreeTimes(input, root, outputRoot); err != nil {
          \t\t\ta.postUI(func() { setText(a.hStatusText, "输出已完成，但目录时间戳恢复失败："+short(err.Error(), 180)) })
          \t\t}
          \t}''',
          )

          # The prior layout patch already removes the old control creation. Remove
          # every remaining handle/ID reference so the orphan control cannot return.
          _apply_text = main.read_text(encoding='utf-8')
          _apply_lines = [
              line for line in _apply_text.splitlines(keepends=True)
              if 'IDC_APPLY_SELECTED' not in line and 'hApplySelected = createControl' not in line
          ]
          _apply_text = ''.join(_apply_lines)
          for old in (
              ', hApplySelected',
              'hApplySelected, ',
              ', a.hApplySelected',
              'a.hApplySelected, ',
              ', app.hApplySelected',
              'app.hApplySelected, ',
          ):
              _apply_text = _apply_text.replace(old, '')
          if 'hApplySelected' in _apply_text or 'IDC_APPLY_SELECTED' in _apply_text:
              _leftovers = [line.strip() for line in _apply_text.splitlines() if 'hApplySelected' in line or 'IDC_APPLY_SELECTED' in line]
              raise SystemExit('obsolete bottom apply references remain: ' + ' | '.join(_leftovers))
          main.write_text(_apply_text, encoding='utf-8', newline='\n')

          """
          new_text = text[:start] + replacement + text[end:]
          test_call = 'subprocess.run(["go", "test", "-count=1", "./..."], cwd=CODE, check=True)'
          if new_text.count(test_call) != 1:
              raise SystemExit('go test footer is not unique')
          diagnostics = r'''_diag_test = CODE / "cmd" / "mediaworkbench" / "v421_source_contract_test.go"
          if not _diag_test.exists():
              raise SystemExit("missing v421_source_contract_test.go")
          _contract_text = _diag_test.read_text(encoding="utf-8")
          _old_contract = '''\tif strings.Contains(main, `createControl("BUTTON", "应用到选中"`) {
          \t\tt.Fatal("orphan bottom 应用到选中 control returned")
          \t}
          '''
          _new_contract = '''\tif strings.Contains(main, "hApplySelected") || strings.Contains(main, "IDC_APPLY_SELECTED") {
          \t\tt.Fatal("orphan bottom 应用到选中 control returned")
          \t}
          \tif !strings.Contains(main, `a.hTaskApply = createControl("BUTTON", "应用到选中"`) {
          \t\tt.Fatal("right-panel 应用到选中 control missing")
          \t}
          '''
          if _contract_text.count(_old_contract) != 1:
              raise SystemExit("old v4.2.1 apply-control contract is not unique")
          _diag_test.write_text(_contract_text.replace(_old_contract, _new_contract, 1), encoding="utf-8", newline="\n")
          print("=== V421 SOURCE CONTRACT TEST ===")
          print(_diag_test.read_text(encoding="utf-8"))
          print("=== APPLY-SELECTED SOURCE REFERENCES ===")
          for _diag_file in sorted((CODE / "cmd" / "mediaworkbench").glob("*.go")):
              _diag_source = _diag_file.read_text(encoding="utf-8")
              for _diag_no, _diag_line in enumerate(_diag_source.splitlines(), 1):
                  if any(_token in _diag_line for _token in ("应用到选中", "hApplySelected", "IDC_APPLY_SELECTED", "1286, 730")):
                      print(f"{_diag_file.name}:{_diag_no}:{_diag_line}")
          print("=== END V421 DIAGNOSTICS ===")
          '''
          new_text = new_text.replace(test_call, diagnostics + '\n' + test_call, 1)
          path.write_text(new_text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile /tmp/p101_v421_patch.py
          cd work
          python /tmp/p101_v421_patch.py

      - name: Verify P101-only scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(projects/1-桌面软件/101-Mediova/|\.github/workflows/p101-mediova-ci\.yml$)' || true)"
          if [[ -n "$bad" ]]; then
            echo 'Out-of-scope changes:'
            echo "$bad"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova .github/workflows/p101-mediova-ci.yml
          git commit -m 'P101: 修复 v4.2.1 桌面交互与完整目录树'
          git push origin HEAD:p101-exp
