name: Clean final P101 v4.1.0 refs once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-branch-cleanup-trigger.txt'

permissions:
  contents: write

concurrency:
  group: p101-v410-final-ref-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-v410-branch-cleanup-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify release and delete final exact refs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          gh release view p101-v4.1.0 --repo "$repo" \
            --json tagName,isDraft,isPrerelease,targetCommitish >/tmp/p101-release.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/p101-release.json', encoding='utf-8'))
          assert data['tagName']=='p101-v4.1.0'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert data['targetCommitish']=='27435598978ec8e16944742ce0de7c56f489dded'
          PY

          branches=(
            p101-v410-branch-cleanup-remove
            p101-v410-branch-cleanup-trigger
            p101-v410-final-ref-cleanup-runner
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              p101-v410-branch-cleanup-remove|p101-v410-branch-cleanup-trigger|p101-v410-final-ref-cleanup-runner) ;;
              *) echo "Refusing unexpected branch: $branch"; exit 1 ;;
            esac
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote("heads/"+sys.argv[1], safe=""))' "$branch")
            if gh api "repos/$repo/git/ref/$encoded" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api -X DELETE "repos/$repo/git/refs/$encoded"
            else
              echo "Already absent: $branch"
            fi
          done

          for branch in "${branches[@]}"; do
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote("heads/"+sys.argv[1], safe=""))' "$branch")
            if gh api "repos/$repo/git/ref/$encoded" >/dev/null 2>&1; then
              echo "Residual branch still exists: $branch"
              exit 1
            fi
          done
          echo 'Final P101 v4.1.0 temporary refs removed.'
