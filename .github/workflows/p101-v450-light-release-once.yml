name: Release P101 Mediova v4.5.0 light package once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

concurrency:
  group: p101-v450-light-release-once
  cancel-in-progress: false

jobs:
  release:
    if: github.head_ref == 'repo-p101-v450-release-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORMAL_COMMIT: 878e0463fe7329beb0f027401ae6f8821fe09e51
      FORMAL_CI_HEAD: 57bb58b97c459b262f28a0a80957d913b24fc299
      FORMAL_RUN_ID: '30776363913'
      FORMAL_ARTIFACT_ID: '8842198229'
      FORMAL_ARTIFACT_SHA256: 3aa7508a61c4f905755b98d2d09fca0f92887758ef09100061536fb19eb01216
      FORMAL_RUNTIME_SHA256: dd401303d4c96e8db9b390a78a7ad88d4a44ce0290d28dc8c78623b00a493b1e
      FORMAL_EXE_SHA256: 0de7f28ba734c130fd7ded0b7155aa84d7c22268c365e39b3b9b05539e41fd44
      TAG: p101-v4.5.0
      ZIP_NAME: Mediova-v4.5.0-Light.zip
      SHA_NAME: Mediova-v4.5.0-Light-SHA256.txt
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify formal source and CI identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FORMAL_COMMIT}^{commit}"
          test "$(git show -s --format=%s "$FORMAL_COMMIT")" = 'P101｜正式发布 Mediova v4.5.0'
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMAL_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$FORMAL_CI_HEAD"
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          artifact_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FORMAL_ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$artifact_json")" = "$FORMAL_RUN_ID"
          test "$(jq -r '.expired' <<<"$artifact_json")" = 'false'
          test "$(jq -r '.name' <<<"$artifact_json")" = 'P101-Mediova-v4.5.0-CI'

      - name: Download and verify formal artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-work/artifact release-work/runtime release-work/light
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FORMAL_ARTIFACT_ID}/zip" \
            -o release-work/formal-artifact.zip
          echo "${FORMAL_ARTIFACT_SHA256}  release-work/formal-artifact.zip" | sha256sum -c -
          unzip -q release-work/formal-artifact.zip -d release-work/artifact
          test -f release-work/artifact/Mediova-v4.5.0-Runtime.zip
          echo "${FORMAL_RUNTIME_SHA256}  release-work/artifact/Mediova-v4.5.0-Runtime.zip" | sha256sum -c -
          test -f release-work/artifact/ci_self_test.json
          jq -e '.version == "4.5.0" and .passed == true and ([.checks[]] | length) >= 62 and ([.checks[] | select(. != true)] | length) == 0' release-work/artifact/ci_self_test.json >/dev/null
          for image in \
            Mediova-v4.5.0-video-wide-1650x930.png \
            Mediova-v4.5.0-video-compact-1120x720.png \
            Mediova-v4.5.0-image-1450x820.png \
            Mediova-v4.5.0-held-1450x820.png; do
            test -s "release-work/artifact/ui-preview/${image}"
          done
          unzip -q release-work/artifact/Mediova-v4.5.0-Runtime.zip -d release-work/runtime
          echo "${FORMAL_EXE_SHA256}  release-work/runtime/Mediova.exe" | sha256sum -c -
          test -f release-work/runtime/THIRD_PARTY_NOTICES.md

      - name: Build deterministic light overlay package
        shell: bash
        run: |
          set -euo pipefail
          cp release-work/runtime/Mediova.exe release-work/light/Mediova.exe
          cp release-work/runtime/THIRD_PARTY_NOTICES.md release-work/light/THIRD_PARTY_NOTICES.md
          cat > release-work/light/README.txt <<'EOF'
          Mediova v4.5.0 轻量覆盖更新包

          1. 完全退出 Mediova。
          2. 保留原安装目录中的 Components\FFmpeg\bin。
          3. 将本压缩包内四个文件解压到原 Mediova 根目录并覆盖同名文件。
          4. 重新运行 Mediova.exe。

          本包不包含 FFmpeg、FFprobe、Components 目录或任何用户 Data。
          首次安装时，请在软件中选择已有 FFmpeg/FFprobe，或自行放入 Components\FFmpeg\bin。
          EOF
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path('release-work/light')
          exe = root / 'Mediova.exe'
          readme = root / 'README.txt'
          notices = root / 'THIRD_PARTY_NOTICES.md'
          manifest = {
              'product': 'Mediova',
              'version': '4.5.0',
              'platform': 'Windows x64',
              'deployment': 'light-overlay',
              'preserve': ['Components/FFmpeg/bin', 'Data'],
              'files': [],
          }
          for path in (exe, readme, notices):
              manifest['files'].append({
                  'path': path.name,
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          (root / 'runtime-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          names = ['Mediova.exe', 'README.txt', 'runtime-manifest.json', 'THIRD_PARTY_NOTICES.md']
          output = Path(os.environ['ZIP_NAME'])
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  data = (root / name).read_bytes()
                  info = zipfile.ZipInfo(name, date_time=(2026, 8, 3, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 0
                  info.external_attr = 0
                  archive.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path

          archive = Path(os.environ['ZIP_NAME'])
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              expected = ['Mediova.exe', 'README.txt', 'runtime-manifest.json', 'THIRD_PARTY_NOTICES.md']
              if names != expected:
                  raise SystemExit(f'Light package boundary mismatch: {names}')
              lowered = '\n'.join(names).lower()
              for forbidden in ('ffmpeg', 'ffprobe', 'components/', 'data/'):
                  if forbidden in lowered:
                      raise SystemExit(f'Forbidden path in light package: {forbidden}')
          if archive.stat().st_size >= 10 * 1024 * 1024:
              raise SystemExit('Light package unexpectedly exceeds 10 MiB')
          zip_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          exe_sha = hashlib.sha256(Path('release-work/light/Mediova.exe').read_bytes()).hexdigest()
          if exe_sha != os.environ['FORMAL_EXE_SHA256']:
              raise SystemExit('Light EXE hash does not match formal CI')
          Path(os.environ['SHA_NAME']).write_text(
              f'{zip_sha}  {archive.name}\n{exe_sha}  Mediova.exe\n',
              encoding='utf-8',
              newline='\n',
          )
          print(f'LIGHT_SIZE={archive.stat().st_size}')
          print(f'LIGHT_SHA256={zip_sha}')
          print(f'EXE_SHA256={exe_sha}')
          PY

      - name: Create immutable tag and light-only Release
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
            test "$(git rev-list -n1 "$TAG")" = "$FORMAL_COMMIT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$FORMAL_COMMIT" -m 'Mediova v4.5.0 formal release'
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite."
            exit 1
          fi
          light_sha="$(head -n1 "$SHA_NAME" | awk '{print $1}')"
          light_size="$(stat -c %s "$ZIP_NAME")"
          cat > release-notes.md <<EOF
          ## Mediova v4.5.0

          本轮从 v4.2.3 连续推进到 v4.5.0：修复视频与图片右下角按钮错位和禁用态残影；增强裁剪比例、居中适配、键盘微调与批量应用；支持图片裁剪及 HEIC/HEIF/AVIF 解码预检；升级长队列会话恢复、备份回退和文件级 0% 重启。

          默认下载为不含 FFmpeg 的轻量覆盖包。更新时保留原安装目录中的 \`Components\\FFmpeg\\bin\`，解压覆盖四个同名文件即可。

          - 原生 self-test：62/62
          - 恢复压力测试：2500 项
          - Mediova.exe SHA-256：\`${FORMAL_EXE_SHA256}\`
          - 轻量 ZIP 大小：\`${light_size} bytes\`
          - 轻量 ZIP SHA-256：\`${light_sha}\`

          完整 FFmpeg Runtime 只作为正式 CI 证据保留，不作为用户 Release 资产。
          EOF
          gh release create "$TAG" "$ZIP_NAME" "$SHA_NAME" \
            --verify-tag \
            --title 'Mediova v4.5.0' \
            --notes-file release-notes.md
          mapfile -t assets < <(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | sort)
          expected=("$SHA_NAME" "$ZIP_NAME")
          if [[ "${assets[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected Release assets: %s\n' "${assets[*]}"
            exit 1
          fi
          test "$(git rev-list -n1 "$TAG")" = "$FORMAL_COMMIT"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
