name: P103 DavBridge CI

on:
  push:
    branches: [p103-exp, p103-stable]
    paths:
      - 'projects/1-桌面软件/103-DavBridge/**'
      - '.github/workflows/p103-davbridge-ci.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  pull_request:
    branches: [p103-exp, p103-stable, main]
    paths:
      - 'projects/1-桌面软件/103-DavBridge/**'
      - '.github/workflows/p103-davbridge-ci.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p103-davbridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce P103 pull-request scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          bad=$(git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ev '^(projects/1-桌面软件/103-DavBridge/|projects/1-桌面软件/README\.md$|目录\.md$|\.github/workflows/p103-davbridge-ci\.yml$)' || true)
          if [[ -n "$bad" ]]; then echo 'Out-of-scope P103 changes:'; echo "$bad"; exit 1; fi

  core-smoke:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify solution membership
        shell: bash
        run: |
          set -euo pipefail
          sln='projects/1-桌面软件/103-DavBridge/代码/DavBridge.sln'
          listing=$(dotnet sln "$sln" list)
          echo "$listing"
          grep -F 'DavBridge.Core/DavBridge.Core.csproj' <<<"$listing"
          grep -F 'DavBridge/DavBridge.csproj' <<<"$listing"
          grep -F 'DavBridge.Smoke/DavBridge.Smoke.csproj' <<<"$listing"
      - name: Restore core smoke
        run: dotnet restore 'projects/1-桌面软件/103-DavBridge/代码/DavBridge.Smoke/DavBridge.Smoke.csproj'
      - name: Run core smoke
        run: dotnet run --project 'projects/1-桌面软件/103-DavBridge/代码/DavBridge.Smoke/DavBridge.Smoke.csproj' -c Release --no-restore

  frontend:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/1-桌面软件/103-DavBridge/代码/DavBridge/WebUi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned UI dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build Vue UI
        run: npm run build
      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
      - name: Render browser visual previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/WebUiPreview"
          python3 -m http.server 4173 --directory dist >/tmp/davbridge-webui-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.3; done
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=900,620 --screenshot="$GITHUB_WORKSPACE/build/WebUiPreview/overview-900x620.png" http://127.0.0.1:4173/
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1200,760 --screenshot="$GITHUB_WORKSPACE/build/WebUiPreview/overview-1200x760.png" http://127.0.0.1:4173/
          test $(stat -c%s "$GITHUB_WORKSPACE/build/WebUiPreview/overview-900x620.png") -gt 10000
          test $(stat -c%s "$GITHUB_WORKSPACE/build/WebUiPreview/overview-1200x760.png") -gt 10000
      - name: Upload Vue visual previews
        uses: actions/upload-artifact@v4
        with:
          name: DavBridge-v0.4.0-webui-preview
          path: build/WebUiPreview/*.png
          if-no-files-found: error
          retention-days: 14

  windows-build:
    needs: [scope, core-smoke, frontend]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build embedded Vue UI
        shell: pwsh
        working-directory: projects/1-桌面软件/103-DavBridge/代码/DavBridge/WebUi
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Read product version
        id: product-version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'
          [xml]$xml=Get-Content $project -Raw
          $version=@($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'DavBridge <Version> is missing' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Windows app
        shell: pwsh
        run: dotnet restore 'projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'

      - name: Publish framework-dependent single EXE
        shell: pwsh
        run: >-
          dotnet publish 'projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'
          -c Release -r win-x64 --self-contained false --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded
          -o build/DavBridge

      - name: Verify Runtime boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='build/DavBridge/DavBridge.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'DavBridge.exe missing' }
          $unexpected=Get-ChildItem 'build/DavBridge' -File | Where-Object { $_.Name -ne 'DavBridge.exe' }
          if ($unexpected) { $unexpected | Select-Object Name,Length | Format-Table; throw 'Default P103 Runtime must remain a single-file delivery.' }
          foreach ($private in @('config.json','state.json','state.json.bak','secrets.dat','reconcile.json','DavBridge.log')) {
            if (Get-ChildItem 'build/DavBridge' -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "Private Data leaked into Runtime: $private" }
          }

      - name: Run isolated native-host self-test
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.product-version.outputs.value }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('DavBridge-SelfTest-' + [guid]::NewGuid().ToString('N'))
          $roaming=Join-Path $root 'Roaming'; $local=Join-Path $root 'Local'; $report=Join-Path $root 'self-test.json'
          New-Item $roaming,$local -ItemType Directory -Force | Out-Null
          $oldAppData=$env:APPDATA; $oldLocal=$env:LOCALAPPDATA
          try {
            $env:APPDATA=$roaming; $env:LOCALAPPDATA=$local
            $proc=Start-Process -FilePath (Resolve-Path 'build/DavBridge/DavBridge.exe') -ArgumentList "--self-test=$report" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report -Raw | Write-Host }; throw "DavBridge self-test exit code $($proc.ExitCode)" }
            $json=(Get-Content $report -Raw) | ConvertFrom-Json
            if (-not $json.ok -or -not $json.webUiEmbedded -or -not $json.bridgeWhitelistValidated -or $json.coreLogicMovedToJavaScript) { throw 'DavBridge v0.4 native-host self-test failed' }
            if (-not $json.version.StartsWith($env:EXPECTED_VERSION + '.')) { throw "Self-test version mismatch: $($json.version)" }
          } finally { $env:APPDATA=$oldAppData; $env:LOCALAPPDATA=$oldLocal; Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe='build/DavBridge/DavBridge.exe'
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); $bytes=(Get-Item $exe).Length
          "DavBridge.exe  $bytes bytes  sha256=$hash" | Set-Content 'build/DavBridge/SHA256.txt' -Encoding utf8
          "DAVBRIDGE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DAVBRIDGE_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: DavBridge-v${{ steps.product-version.outputs.value }}-win-x64
          path: |
            build/DavBridge/DavBridge.exe
            build/DavBridge/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## P103 DavBridge v${{ steps.product-version.outputs.value }}
          - UI: Vue 3 + TypeScript + Vite inside WebView2
          - Native host and business core: existing C# / .NET 8
          - Core migration logic: unchanged
          - Deployment: framework-dependent single EXE, Windows x64
          - Stable rollback baseline: v0.1.7 on main
          - Candidate: ${{ github.sha }}
          - EXE bytes: $env:DAVBRIDGE_BYTES
          - EXE SHA-256: $env:DAVBRIDGE_SHA256
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
