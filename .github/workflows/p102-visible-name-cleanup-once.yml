name: Normalize P102 visible product name

on:
  push:
    branches:
      - main
    paths:
      - '.maintenance/p102-visible-name-cleanup-main.txt'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout p102-exp
        uses: actions/checkout@v4
        with:
          ref: p102-exp
          fetch-depth: 0

      - name: Replace exact legacy visible phrase
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('projects/1-桌面软件/102-AtlasDesk/代码')
          extensions = {'.cs', '.xaml', '.go', '.txt', '.md'}
          old = 'Personal' + ' Workbench'
          new = 'AtlasDesk'
          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')
              changed.append(path.as_posix())

          remaining = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.suffix.lower() in extensions:
                  if old in path.read_text(encoding='utf-8-sig'):
                      remaining.append(path.as_posix())
          if remaining:
              raise SystemExit('Legacy visible phrase remains: ' + ', '.join(remaining))
          if not changed:
              raise SystemExit('No files required normalization.')
          print('Changed files:')
          print('\n'.join(changed))
          PY

      - name: Commit normalized product wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'projects/1-桌面软件/102-AtlasDesk/代码'
          git diff --cached --quiet && { echo 'No staged changes.'; exit 1; }
          git commit -m 'P102｜清理残留的旧产品可见称谓'
          git push origin HEAD:p102-exp
