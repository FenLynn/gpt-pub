name: Fix P101 Mediova v4.2.1 visible list bars v2 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-bar-render-v2-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v421-bar-render-v2-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout latest P101 experimental branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make list bars visibly render and extend native gate
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          main = root / 'cmd/mediaworkbench/main_windows.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          source = main.read_text(encoding='utf-8')

          if source.count('list_progress_cells_centered_preferred_height') < 2:
              raise SystemExit('current centered list-bar native contract is missing')
          if 'list_progress_cells_custom_draw_active' in source:
              raise SystemExit('custom-draw native contract already exists')

          old_globals = '''var taskbarCreatedMessage uint32
          var uiDPI uint32 = 96
          '''
          new_globals = '''var taskbarCreatedMessage uint32
          var uiDPI uint32 = 96
          var listCompressionDrawCount atomic.Int64
          var listProgressDrawCount atomic.Int64
          '''
          if source.count(old_globals) != 1:
              raise SystemExit(f'global drawing counter anchor expected once, found {source.count(old_globals)}')
          source = source.replace(old_globals, new_globals, 1)

          old_progress = '''\tbar := fullCellBarRect(rc)
          \twithRoundedClip(hdc, bar, 3, func() {
          \t\tfillSolid(hdc, bar, colorRef(247, 249, 252))
          \t\tif fraction > 0 {
          \t\t\tfill := bar
          \t\t\tfill.Right = fill.Left + int32(float64(fill.Right-fill.Left)*fraction)
          \t\t\tif fill.Right < fill.Left+3 {
          \t\t\t\tfill.Right = fill.Left + 3
          \t\t\t}
          \t\t\tdrawHorizontalGradient(hdc, fill, colorRef(169, 204, 243), colorRef(76, 138, 220))
          \t\t}
          \t})
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 74))
          '''
          new_progress = '''\tbar := fullCellBarRect(rc)
          \t// ListView custom-draw and PrintWindow can expose an HDC whose
          \t// inherited clipping state rejects a newly selected GDI region.
          \t// Draw the compact track and fill directly, then add a rounded
          \t// border so the bar is visible in the real window and previews.
          \tfillSolid(hdc, bar, colorRef(239, 243, 248))
          \tif fraction > 0 {
          \t\tfill := bar
          \t\tfill.Right = fill.Left + int32(float64(fill.Right-fill.Left)*fraction)
          \t\tif fill.Right < fill.Left+3 {
          \t\t\tfill.Right = fill.Left + 3
          \t\t}
          \t\tdrawHorizontalGradient(hdc, fill, colorRef(169, 204, 243), colorRef(76, 138, 220))
          \t}
          \tdrawRoundedBorder(hdc, bar, 3, colorRef(218, 225, 234))
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 74))
          '''
          if source.count(old_progress) != 1:
              raise SystemExit(f'progress clipped drawing block expected once, found {source.count(old_progress)}')
          source = source.replace(old_progress, new_progress, 1)

          old_compression = '''\tbar := fullCellBarRect(rc)
          \twithRoundedClip(hdc, bar, 3, func() {
          \t\tif task == nil || task.InputSize <= 0 || task.OutputSize <= 0 {
          \t\t\tfillSolid(hdc, bar, colorRef(247, 249, 252))
          \t\t\treturn
          \t\t}
          \t\tvisual := compressionVisualFor(task.InputSize, task.OutputSize)
          \t\tsplit := bar.Left + int32(float64(bar.Right-bar.Left)*visual.InputFraction)
          \t\tif split <= bar.Left {
          \t\t\tsplit = bar.Left + 1
          \t\t}
          \t\tif split >= bar.Right {
          \t\t\tsplit = bar.Right - 1
          \t\t}
          \t\tleft := bar
          \t\tleft.Right = split
          \t\tright := bar
          \t\tright.Left = split
          \t\tfillSolid(hdc, left, colorRef(247, 249, 251))
          \t\tstart, finish := compressionColorPair(visual)
          \t\tdrawHorizontalGradient(hdc, right, start, finish)
          \t})
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 70))
          '''
          new_compression = '''\tbar := fullCellBarRect(rc)
          \tfillSolid(hdc, bar, colorRef(239, 243, 248))
          \tif task != nil && task.InputSize > 0 && task.OutputSize > 0 {
          \t\tvisual := compressionVisualFor(task.InputSize, task.OutputSize)
          \t\tsplit := bar.Left + int32(float64(bar.Right-bar.Left)*visual.InputFraction)
          \t\tif split <= bar.Left {
          \t\t\tsplit = bar.Left + 1
          \t\t}
          \t\tif split >= bar.Right {
          \t\t\tsplit = bar.Right - 1
          \t\t}
          \t\tleft := bar
          \t\tleft.Right = split
          \t\tright := bar
          \t\tright.Left = split
          \t\tfillSolid(hdc, left, colorRef(247, 249, 251))
          \t\tstart, finish := compressionColorPair(visual)
          \t\tdrawHorizontalGradient(hdc, right, start, finish)
          \t}
          \tdrawRoundedBorder(hdc, bar, 3, colorRef(218, 225, 234))
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 70))
          '''
          if source.count(old_compression) != 1:
              raise SystemExit(f'compression clipped drawing block expected once, found {source.count(old_compression)}')
          source = source.replace(old_compression, new_compression, 1)

          old_cell = '''\t\tcell := cd.NMCD.Rc
          \t\tif exact, ok := listSubItemBounds(a.hList, int(cd.NMCD.ItemSpec), int(cd.ISubItem)); ok {
          \t\t\tcell = exact
          \t\t}
          '''
          new_cell = '''\t\tcell := cd.NMCD.Rc
          \t\tif exact, ok := listSubItemBounds(a.hList, int(cd.NMCD.ItemSpec), int(cd.ISubItem)); ok {
          \t\t\t// Keep the custom-draw vertical band because it matches the HDC
          \t\t\t// clipping region; use exact ListView bounds only for columns.
          \t\t\tcell.Left = exact.Left
          \t\t\tcell.Right = exact.Right
          \t\t}
          '''
          if source.count(old_cell) != 1:
              raise SystemExit(f'custom-draw cell anchor expected once, found {source.count(old_cell)}')
          source = source.replace(old_cell, new_cell, 1)

          old_comp_branch = '''\t\tif cd.ISubItem == 7 {
          \t\t\t_, label, _ := compressionCellMetrics(&task)
          '''
          new_comp_branch = '''\t\tif cd.ISubItem == 7 {
          \t\t\tlistCompressionDrawCount.Add(1)
          \t\t\t_, label, _ := compressionCellMetrics(&task)
          '''
          if source.count(old_comp_branch) != 1:
              raise SystemExit('compression custom-draw branch is not unique')
          source = source.replace(old_comp_branch, new_comp_branch, 1)

          old_prog_branch = '''\t\tif cd.ISubItem == 8 {
          \t\t\tfraction, label := progressCellMetrics(&task)
          '''
          new_prog_branch = '''\t\tif cd.ISubItem == 8 {
          \t\t\tlistProgressDrawCount.Add(1)
          \t\t\tfraction, label := progressCellMetrics(&task)
          '''
          if source.count(old_prog_branch) != 1:
              raise SystemExit('progress custom-draw branch is not unique')
          source = source.replace(old_prog_branch, new_prog_branch, 1)

          marker = '\treport.Checks["status_grid_two_rows"] ='
          if source.count(marker) != 1:
              raise SystemExit(f'status-grid insertion marker expected once, found {source.count(marker)}')
          draw_gate = '''\tcompressionDrawBefore := listCompressionDrawCount.Load()
          \tprogressDrawBefore := listProgressDrawCount.Load()
          \tprocRedrawWindow.Call(a.hList, 0, 0, RDW_INVALIDATE|RDW_ERASE|RDW_UPDATENOW|RDW_ALLCHILDREN)
          \tcompressionDrawAfter := listCompressionDrawCount.Load()
          \tprogressDrawAfter := listProgressDrawCount.Load()
          \treport.Checks["list_progress_cells_custom_draw_active"] = compressionDrawAfter > compressionDrawBefore && progressDrawAfter > progressDrawBefore
          \tif !report.Checks["list_progress_cells_custom_draw_active"] {
          \t\treport.Details["list_progress_cells_custom_draw_active"] = fmt.Sprintf("compression=%d->%d progress=%d->%d", compressionDrawBefore, compressionDrawAfter, progressDrawBefore, progressDrawAfter)
          \t}
          '''
          source = source.replace(marker, draw_gate + marker, 1)

          main.write_text(source, encoding='utf-8', newline='\n')
          PY
          gofmt -w cmd/mediaworkbench/main_windows.go
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          rel = 'cmd/mediaworkbench/main_windows.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          text = hashes.read_text(encoding='utf-8')
          digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          pattern = rf'^[0-9a-f]{{64}}  {re.escape(rel)}$'
          text, count = re.subn(pattern, f'{digest}  {rel}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('main_windows.go hash entry is not unique')
          hashes.write_text(text, encoding='utf-8', newline='\n')
          print(f'main_windows.go sha256={digest}')
          PY

      - name: Run portable gates and Windows cross-builds
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Verify exact P101 scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          grep -Fq 'list_progress_cells_custom_draw_active' projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          if grep -Fq 'withRoundedClip(hdc, bar, 3' projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go; then
            echo 'Clipped list-bar drawing path still remains.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          git commit -m 'P101: 修复 v4.2.1 列表条形真实绘制'
          git push origin HEAD:p101-exp
