name: GPT-Pub AttendScope Pages

on:
  workflow_run:
    workflows: [P109 AttendScope CI]
    types: [completed]
    branches: [p109-exp]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repository-pages.yml"
      - "docs/repository-pages.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-pages.yml"
      - "docs/repository-pages.md"

permissions:
  contents: read

concurrency:
  group: gpt-pub-one-pages-site
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve validated AttendScope source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ref="p109-exp"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            ref="$TRIGGER_SHA"
          elif curl -fsSL --retry 2 "https://fenlynn.github.io/gpt-pub/preview-build.txt" -o "$RUNNER_TEMP/preview-build.txt"; then
            previous="$(awk -F= '$1=="P109_SHA"{print $2}' "$RUNNER_TEMP/preview-build.txt" | tr -d '\r')"
            [[ "$previous" =~ ^[0-9a-f]{40}$ ]] && ref="$previous"
          fi
          echo "P109_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout AttendScope
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P109_REF }}
          path: source-p109
          persist-credentials: false

      - name: Validate offline source
        shell: bash
        run: |
          set -euo pipefail
          APP="source-p109/projects/1-桌面软件/109-AttendScope"
          test -s "$APP/index.html"
          test -s "$APP/project.json"
          test -s "$APP/src/vendor/echarts.min.js"
          test -s "$APP/src/vendor/tabulator.min.js"
          test -s "$APP/src/app/00-state.js"
          test -s "$APP/src/core/xlsx-lite.js"
          if grep -InE 'https?://' "$APP/index.html"; then exit 1; fi
          if grep -RInE 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|EventSource[[:space:]]*\(|sendBeacon[[:space:]]*\(' "$APP/src/app" "$APP/src/core"; then exit 1; fi
          for f in "$APP"/src/app/*.js; do node --check "$f"; done
          node --check "$APP/src/core/xlsx-lite.js"
          echo "P109_SHA=$(git -C source-p109 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assemble public preview and migration links
        shell: bash
        run: |
          set -euo pipefail
          APP="source-p109/projects/1-桌面软件/109-AttendScope"
          mkdir -p _site/p109 _site/p108 _site/p111
          cp "$APP/index.html" "$APP/project.json" _site/p109/
          cp -a "$APP/src" "$APP/config" _site/p109/
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("_site/p109/index.html")
          content = path.read_text(encoding="utf-8")
          token = os.environ["P109_SHA"][:12]
          content = re.sub(r"(\./src/[^\x22\x27]+)", lambda match: f"{match.group(1)}?v={token}", content)
          path.write_text(content, encoding="utf-8")
          links = {
              "p108": ("FigureStudio 已迁移", "https://github.com/FenLynn/figurestudio"),
              "p111": ("GameStation 已迁移", "https://github.com/FenLynn/game"),
          }
          for folder, (title, destination) in links.items():
              Path(f"_site/{folder}/index.html").write_text(
                  '<!doctype html><html lang="zh-CN"><meta charset="utf-8">'
                  f'<title>{title}</title><main><h1>{title}</h1>'
                  f'<p>源码和后续开发已迁至独立仓库。</p><a href="{destination}">打开独立仓库</a></main></html>',
                  encoding="utf-8")
          Path("_site/index.html").write_text(
              '<!doctype html><html lang="zh-CN"><meta charset="utf-8">'
              '<title>GPT-Pub</title><h1>GPT-Pub 在线预览</h1>'
              '<p><a href="./p109/">AttendScope 考勤工作台</a></p>'
              '<p>FigureStudio、GameStation 已迁至各自仓库；旧预览入口保留迁移提示。</p>'
              '<p><a href="./p108/">FigureStudio</a> · <a href="./p111/">GameStation</a></p>',
              encoding="utf-8")
          Path("_site/preview-build.txt").write_text(f'P109_SHA={os.environ["P109_SHA"]}\n', encoding="utf-8")
          PY
          test -s _site/p109/index.html
          test -s _site/p108/index.html
          test -s _site/p111/index.html
          if find _site -type d | grep -Ei '/(raw|working|snapshots|branches|output)(/|$)'; then
            echo "::error::Private project data directory in public artifact"
            exit 1
          fi

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload complete site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
