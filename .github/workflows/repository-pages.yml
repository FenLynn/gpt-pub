name: GPT-Pub Unified Pages

# One repository, one complete Pages deployment. Project CI never deploys.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repository-pages.yml"
      - "docs/repository-pages.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-pages.yml"
      - "docs/repository-pages.md"
  workflow_run:
    workflows:
      - P108 FigureStudio CI
      - P109 AttendScope CI
    types: [completed]
    branches: [p108-exp, p109-exp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-pub-one-pages-site
  cancel-in-progress: false

jobs:
  build:
    name: Build complete P108 + P109 site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve independent project source refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          p108_ref="p108-exp"
          p109_ref="p109-exp"
          current_p108=""
          current_p109=""
          state_file="$RUNNER_TEMP/preview-build.txt"

          if curl -fsSL --retry 2 --retry-delay 1 "https://fenlynn.github.io/gpt-pub/preview-build.txt" -o "$state_file"; then
            current_p108="$(awk -F= '$1=="P108_SHA"{print $2}' "$state_file" | tr -d '\r')"
            current_p109="$(awk -F= '$1=="P109_SHA"{print $2}' "$state_file" | tr -d '\r')"
          fi

          if [[ "$EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "P109 AttendScope CI" ]]; then
            p109_ref="$TRIGGER_SHA"
            [[ -n "$current_p108" ]] && p108_ref="$current_p108"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "P108 FigureStudio CI" ]]; then
            p108_ref="$TRIGGER_SHA"
            [[ -n "$current_p109" ]] && p109_ref="$current_p109"
          elif [[ -n "$current_p108" && -n "$current_p109" ]]; then
            p108_ref="$current_p108"
            p109_ref="$current_p109"
          fi

          echo "P108_REF=$p108_ref" >> "$GITHUB_ENV"
          echo "P109_REF=$p109_ref" >> "$GITHUB_ENV"
          printf 'Resolved preview refs: P108=%s P109=%s\n' "$p108_ref" "$p109_ref"

      - name: Checkout P108 preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P108_REF }}
          path: source-p108
          persist-credentials: false

      - name: Checkout P109 preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P109_REF }}
          path: source-p109
          persist-credentials: false

      - name: Capture exact source commits
        shell: bash
        run: |
          set -euo pipefail
          echo "P108_SHA=$(git -C source-p108 rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "P109_SHA=$(git -C source-p109 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build P108 React application
        shell: bash
        run: |
          set -euo pipefail
          APP="source-p108/projects/1-桌面软件/108-FigureStudio/web"
          npm --prefix "$APP" install --no-audit --no-fund
          npm --prefix "$APP" run build
          test -s "$APP/dist/index.html"
          test -d "$APP/dist/assets"

      - name: Validate P109 offline application
        shell: bash
        run: |
          set -euo pipefail
          APP="source-p109/projects/1-桌面软件/109-AttendScope"
          test -s "$APP/index.html"
          test -s "$APP/project.json"
          test -s "$APP/src/vendor/echarts.min.js"
          test -s "$APP/src/vendor/ECHARTS-LICENSE.txt"
          test -s "$APP/src/vendor/tabulator.min.js"
          test -s "$APP/src/vendor/tabulator.min.css"
          test -s "$APP/src/vendor/TABULATOR-LICENSE.txt"
          test -s "$APP/src/app/35-workbench.js"
          test -s "$APP/src/core/xlsx-lite.js"
          test -s "$APP/src/app/00-state.js"
          test -s "$APP/src/app/25-echarts.js"
          if grep -InE 'https?://' "$APP/index.html"; then
            echo "::error::P109 HTML unexpectedly requests a remote URL"
            exit 1
          fi
          if grep -RInE 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|EventSource[[:space:]]*\(|sendBeacon[[:space:]]*\(' "$APP/src/app" "$APP/src/core"; then
            echo "::error::P109 runtime source contains a network API"
            exit 1
          fi
          node --check "$APP/src/core/xlsx-lite.js"
          node --check "$APP/src/vendor/echarts.min.js"
          node --check "$APP/src/vendor/tabulator.min.js"
          grep -q "Tabulator v6.3.1" "$APP/src/vendor/tabulator.min.js"
          test -s "$APP/tests/smoke.cjs"
          node --check "$APP/tests/smoke.cjs"
          grep -q 'series.custom' "$APP/src/vendor/echarts.min.js"
          grep -q 'dataZoom.slider' "$APP/src/vendor/echarts.min.js"
          for f in "$APP"/src/app/*.js; do node --check "$f"; done
          node - <<'NODE'
          const echarts = require('./source-p109/projects/1-桌面软件/109-AttendScope/src/vendor/echarts.min.js');
          if (echarts.version !== '6.1.0' || typeof echarts.init !== 'function') throw new Error('P109 ECharts bundle validation failed');
          NODE

      - name: Assemble entire public site
        shell: bash
        run: |
          set -euo pipefail
          P108="source-p108/projects/1-桌面软件/108-FigureStudio/web/dist"
          P109="source-p109/projects/1-桌面软件/109-AttendScope"
          mkdir -p "_site/p108" "_site/p109"
          cp -a "$P108/." "_site/p108/"
          # Explicit runtime allowlist avoids exposing any project data, raw
          # attendance, internal histories, snapshots or unpublished records.
          cp "$P109/index.html" "$P109/project.json" "_site/p109/"
          cp -a "$P109/src" "$P109/config" "_site/p109/"
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("_site/p109/index.html")
          s = p.read_text(encoding="utf-8")
          token = os.environ["P109_SHA"][:12]
          s = re.sub(r'(\./src/[^"\']+)(["\'])', lambda m: f"{m.group(1)}?v={token}{m.group(2)}", s)
          p.write_text(s, encoding="utf-8")
          PY
          cat > "_site/index.html" <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>GPT-Pub 在线预览</title>
            <style>
              body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f9fb;color:#202833;margin:0;padding:10vh 24px}
              main{max-width:650px;margin:auto}
              h1{font-size:26px;letter-spacing:-.5px}
              a{display:block;padding:22px 26px;margin:16px 0;border:1px solid #dbe2ea;border-radius:14px;background:#fff;color:#2067a0;text-decoration:none;box-shadow:0 3px 14px #152b4810}
              a:hover{border-color:#7ea5c7}
              small{display:block;color:#667789;margin-top:6px}
            </style>
          </head>
          <body><main>
            <h1>GPT-Pub 在线预览</h1>
            <p>两个项目独立更新，同时在线。</p>
            <a href="./p108/">P108 · FigureStudio<small>科研矢量绘图编辑器</small></a>
            <a href="./p109/">P109 · AttendScope<small>离线考勤分析工作台</small></a>
          </main></body></html>
          HTML
          cat > "_site/preview-build.txt" <<EOF
          P108_SHA=$P108_SHA
          P109_SHA=$P109_SHA
          EOF

      - name: Assert both public entries are present
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/p108/index.html
          test -s _site/p109/index.html
          test -d _site/p108/assets
          test -s _site/p109/src/app/00-state.js
          test -s _site/p109/src/vendor/echarts.min.js
          test -s _site/p109/src/vendor/tabulator.min.js
          test -s _site/p109/src/vendor/tabulator.min.css
          test -s _site/p109/src/vendor/TABULATOR-LICENSE.txt
          test -s _site/preview-build.txt
          if find _site -type d | grep -Ei '/(raw|working|snapshots|branches|output)(/|$)'; then
            echo "::error::Potential private data directory present in public artifact"
            exit 1
          fi
          printf 'P108 %s, P109 %s\n' "$P108_SHA" "$P109_SHA"

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload the complete Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish complete site
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy exactly one complete site
        id: deployment
        uses: actions/deploy-pages@v4
