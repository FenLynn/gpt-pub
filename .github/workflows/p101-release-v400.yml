name: Release P101 Mediova v4.0.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-release-v400'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build final Mediova v4.0.0 EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'projects/1-桌面软件/101-Mediova/代码'
          ./build_v4.0.0.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Mediova v4.0.0 build failed' }
          $exe=Resolve-Path 'build/Mediova_v4.0.0.exe'
          $info=(Get-Item $exe).VersionInfo
          if (($info.FileVersion -notlike '4.0.0*') -or ($info.ProductVersion -notlike '4.0.0*') -or ($info.ProductName -notlike '*Mediova*')) { throw 'Version resource mismatch' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8598af6b5e999ba29f5a6f02df16f4ebb2a3801b240c3d627429709ae7828423') { throw "Unexpected final EXE SHA-256: $hash" }

      - name: Provide real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          $tools=Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg=Get-ChildItem $tools -Recurse -Filter ffmpeg.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          $ffprobe=Get-ChildItem $tools -Recurse -Filter ffprobe.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real FFmpeg not found' }
          $build='projects/1-桌面软件/101-Mediova/代码/build'
          Copy-Item $ffmpeg.FullName (Join-Path $build 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $build 'ffprobe.exe') -Force

      - name: Run final native self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $PWD 'projects/1-桌面软件/101-Mediova/代码/build'
          $exe=Join-Path $build 'Mediova_v4.0.0.exe'
          $report=Join-Path $build 'release_self_test.json'
          $proc=Start-Process -FilePath $exe -ArgumentList @('--self-test', "--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(420000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Native self-test timeout' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.0.0' -or $checks.Count -ne 57) { throw 'Native self-test failed or check count changed' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'Native self-test contains failed checks' }
          Remove-Item (Join-Path $build 'ffmpeg.exe'),(Join-Path $build 'ffprobe.exe') -Force -ErrorAction SilentlyContinue
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8598af6b5e999ba29f5a6f02df16f4ebb2a3801b240c3d627429709ae7828423') { throw 'EXE changed during validation' }

      - name: Create tag and public Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $exe=Resolve-Path 'projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0.exe'
          if (gh release view 'p101-v4.0.0' --repo $env:GITHUB_REPOSITORY 2>$null) { throw 'Release p101-v4.0.0 already exists' }
          $notes=@'
          Mediova v4.0.0 是 P101 在 GPT-Pub 的首个正式公开版本。

          - 正式名称统一为 Mediova；
          - 保留视频、图片、批量转码、压缩、裁剪、多音轨、字幕、VFR和动态并发能力；
          - 新数据目录兼容迁移旧 VideoUpright 数据，不删除旧目录、不覆盖新文件；
          - Windows x64 正式 EXE 原生自检 57/57 通过；
          - EXE SHA-256：8598af6b5e999ba29f5a6f02df16f4ebb2a3801b240c3d627429709ae7828423；
          - 本项目未附带 LICENSE，保留全部权利。
          '@
          $notesPath=Join-Path $env:RUNNER_TEMP 'p101-v4.0.0-notes.md'
          Set-Content $notesPath $notes -Encoding UTF8
          gh release create 'p101-v4.0.0' $exe --repo $env:GITHUB_REPOSITORY --target 'main' --title 'Mediova v4.0.0' --notes-file $notesPath

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.0.0-Release
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0.exe
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/release_self_test.json
          if-no-files-found: error
          retention-days: 90
