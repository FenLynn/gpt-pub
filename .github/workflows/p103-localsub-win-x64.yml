name: LocalSub win-x64 portable
on:
  workflow_dispatch:
  push:
    branches: [ p103-localsub-exp ]
    paths:
      - 'projects/1-桌面软件/103-LocalSub/**'
      - '.github/workflows/p103-localsub-win-x64.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish net8 single-file app
        shell: pwsh
        working-directory: projects/1-桌面软件/103-LocalSub/src/LocalSub
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained false -o ../../publish
      - name: Prepare portable layout
        shell: pwsh
        working-directory: projects/1-桌面软件/103-LocalSub
        run: |
          New-Item -ItemType Directory -Force publish/ASR | Out-Null
          Copy-Item src/LocalSub/ASR-README.txt publish/ASR/README.txt
          if (Get-ChildItem publish/ASR -Filter *.onnx -Recurse -ErrorAction SilentlyContinue) { throw 'Model files must not be bundled' }
          if (Test-Path publish/hostfxr.dll) { throw '.NET runtime must not be bundled' }
          if (Test-Path publish/onnxruntime.dll) { throw 'ASR runtime must not be bundled' }
      - name: Smoke test LocalSub startup
        shell: pwsh
        working-directory: projects/1-桌面软件/103-LocalSub
        run: |
          $env:LOCALSUB_SMOKE_TEST = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "LocalSub exited during startup smoke test. ExitCode=$($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
      - name: Package portable ZIP
        shell: pwsh
        working-directory: projects/1-桌面软件/103-LocalSub
        run: |
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath LocalSub-v0.1.0-dev-win-x64-net8.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSub-v0.1.0-dev-win-x64-net8
          path: projects/1-桌面软件/103-LocalSub/LocalSub-v0.1.0-dev-win-x64-net8.zip
