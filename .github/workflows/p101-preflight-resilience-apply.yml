name: P101 preflight resilience apply

on:
  pull_request:
    branches: [p101-exp]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/triggers/p101-preflight-resilience.txt'

permissions:
  contents: write

concurrency:
  group: p101-preflight-resilience-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'p101-preflight-resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact resilience branch
        uses: actions/checkout@v4
        with:
          ref: p101-preflight-resilience
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Apply recovery and process-control hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('projects/1-桌面软件/101-Mediova/代码')

          recovery = root / 'internal/workflow/recovery.go'
          text = recovery.read_text(encoding='utf-8')
          if 'func LoadSessionWithBackup(' not in text:
              anchor = '\nfunc SaveSessionAtomic('
              if text.count(anchor) != 1:
                  raise SystemExit('SaveSessionAtomic anchor mismatch')
              helper = r'''
func LoadSessionWithBackup(path string) (SessionEnvelope, bool, bool, error) {
	if path == "" {
		return SessionEnvelope{}, false, false, errors.New("empty session path")
	}
	primaryData, primaryReadErr := os.ReadFile(path)
	if primaryReadErr == nil {
		envelope, legacy, primaryDecodeErr := DecodeSession(primaryData)
		if primaryDecodeErr == nil {
			return envelope, legacy, false, nil
		}
		backupData, backupReadErr := os.ReadFile(path + ".bak")
		if backupReadErr != nil {
			return SessionEnvelope{}, false, false, fmt.Errorf("decode primary session: %w; read backup session: %v", primaryDecodeErr, backupReadErr)
		}
		backupEnvelope, backupLegacy, backupDecodeErr := DecodeSession(backupData)
		if backupDecodeErr != nil {
			return SessionEnvelope{}, false, false, fmt.Errorf("decode primary session: %v; decode backup session: %w", primaryDecodeErr, backupDecodeErr)
		}
		return backupEnvelope, backupLegacy, true, nil
	}

	backupData, backupReadErr := os.ReadFile(path + ".bak")
	if backupReadErr != nil {
		if os.IsNotExist(primaryReadErr) && os.IsNotExist(backupReadErr) {
			return SessionEnvelope{}, false, false, os.ErrNotExist
		}
		return SessionEnvelope{}, false, false, fmt.Errorf("read primary session: %v; read backup session: %w", primaryReadErr, backupReadErr)
	}
	backupEnvelope, backupLegacy, backupDecodeErr := DecodeSession(backupData)
	if backupDecodeErr != nil {
		return SessionEnvelope{}, false, false, fmt.Errorf("read primary session: %v; decode backup session: %w", primaryReadErr, backupDecodeErr)
	}
	return backupEnvelope, backupLegacy, true, nil
}
'''
              text = text.replace(anchor, '\n' + helper + anchor, 1)
              recovery.write_text(text, encoding='utf-8', newline='\n')

          main = root / 'cmd/mediaworkbench/main_windows.go'
          text = main.read_text(encoding='utf-8')
          fn_start = text.index('func (a *application) loadSession()')
          old_start = text.index('\tdata, err := os.ReadFile(path)', fn_start)
          summary_start = text.index('\tsummary := workflow.RecoverTasks', old_start)
          replacement = '''\tenvelope, legacy, backupUsed, loadErr := workflow.LoadSessionWithBackup(path)\n\tif loadErr != nil {\n\t\tif os.IsNotExist(loadErr) {\n\t\t\treturn\n\t\t}\n\t\ta.runtimeNotice = "会话快照读取或恢复失败：" + short(loadErr.Error(), 160)\n\t\treturn\n\t}\n'''
          text = text[:old_start] + replacement + text[summary_start:]
          main.write_text(text, encoding='utf-8', newline='\n')

          process_control = root / 'internal/media/process_control.go'
          process_control.write_text(r'''package media

import (
	"context"
	"os"
	"sync"
)

type processControllerKey struct{}
type processSignalFunc func(int) error

// ProcessController tracks FFmpeg child processes belonging to one conversion run.
// State changes and operating-system signals are serialized under one lock so a
// concurrent Pause/Resume cannot leave the real process state behind the UI state.
type ProcessController struct {
	mu        sync.Mutex
	processes map[int]*os.Process
	paused    bool
	suspend   processSignalFunc
	resume    processSignalFunc
}

func NewProcessController() *ProcessController {
	return &ProcessController{
		processes: make(map[int]*os.Process),
		suspend:   suspendProcess,
		resume:    resumeProcess,
	}
}

func WithProcessController(ctx context.Context, c *ProcessController) context.Context {
	if c == nil {
		return ctx
	}
	return context.WithValue(ctx, processControllerKey{}, c)
}

func processControllerFromContext(ctx context.Context) *ProcessController {
	if ctx == nil {
		return nil
	}
	c, _ := ctx.Value(processControllerKey{}).(*ProcessController)
	return c
}

func (c *ProcessController) suspendPID(pid int) error {
	if c.suspend == nil {
		return suspendProcess(pid)
	}
	return c.suspend(pid)
}

func (c *ProcessController) resumePID(pid int) error {
	if c.resume == nil {
		return resumeProcess(pid)
	}
	return c.resume(pid)
}

func (c *ProcessController) register(p *os.Process) {
	if c == nil || p == nil {
		return
	}
	c.mu.Lock()
	defer c.mu.Unlock()
	if c.processes == nil {
		c.processes = make(map[int]*os.Process)
	}
	c.processes[p.Pid] = p
	if c.paused {
		_ = c.suspendPID(p.Pid)
	}
}

func (c *ProcessController) unregister(p *os.Process) {
	if c == nil || p == nil {
		return
	}
	c.mu.Lock()
	delete(c.processes, p.Pid)
	c.mu.Unlock()
}

func (c *ProcessController) Pause() error {
	if c == nil {
		return nil
	}
	c.mu.Lock()
	defer c.mu.Unlock()
	c.paused = true
	var first error
	for pid := range c.processes {
		if err := c.suspendPID(pid); err != nil && first == nil {
			first = err
		}
	}
	return first
}

func (c *ProcessController) Resume() error {
	if c == nil {
		return nil
	}
	c.mu.Lock()
	defer c.mu.Unlock()
	c.paused = false
	var first error
	for pid := range c.processes {
		if err := c.resumePID(pid); err != nil && first == nil {
			first = err
		}
	}
	return first
}

func (c *ProcessController) IsPaused() bool {
	if c == nil {
		return false
	}
	c.mu.Lock()
	defer c.mu.Unlock()
	return c.paused
}
''', encoding='utf-8', newline='\n')

          (root / 'internal/workflow/recovery_backup_test.go').write_text(r'''package workflow

import (
	"errors"
	"os"
	"path/filepath"
	"testing"
	"time"

	"mediaworkbench/internal/model"
)

func sessionForReason(reason string) SessionEnvelope {
	return NewSessionEnvelope([]*model.Task{{Input: reason + ".mp4", Status: model.StatusReady}}, "4.5.0", false, reason, time.Now())
}

func TestLoadSessionWithBackupUsesBackupWhenPrimaryMissing(t *testing.T) {
	path := filepath.Join(t.TempDir(), "session.json")
	if err := SaveSessionAtomic(path, sessionForReason("backup-only")); err != nil {
		t.Fatal(err)
	}
	if err := os.Rename(path, path+".bak"); err != nil {
		t.Fatal(err)
	}
	envelope, _, backupUsed, err := LoadSessionWithBackup(path)
	if err != nil || !backupUsed || envelope.Reason != "backup-only" {
		t.Fatalf("env=%+v backup=%v err=%v", envelope, backupUsed, err)
	}
}

func TestLoadSessionWithBackupUsesBackupWhenPrimaryCorrupt(t *testing.T) {
	path := filepath.Join(t.TempDir(), "session.json")
	if err := SaveSessionAtomic(path, sessionForReason("backup")); err != nil {
		t.Fatal(err)
	}
	if err := os.Rename(path, path+".bak"); err != nil {
		t.Fatal(err)
	}
	if err := os.WriteFile(path, []byte("{broken"), 0o644); err != nil {
		t.Fatal(err)
	}
	envelope, _, backupUsed, err := LoadSessionWithBackup(path)
	if err != nil || !backupUsed || envelope.Reason != "backup" {
		t.Fatalf("env=%+v backup=%v err=%v", envelope, backupUsed, err)
	}
}

func TestLoadSessionWithBackupPrefersValidPrimary(t *testing.T) {
	dir := t.TempDir()
	path := filepath.Join(dir, "session.json")
	backupPath := filepath.Join(dir, "backup.json")
	if err := SaveSessionAtomic(path, sessionForReason("primary")); err != nil {
		t.Fatal(err)
	}
	if err := SaveSessionAtomic(backupPath, sessionForReason("backup")); err != nil {
		t.Fatal(err)
	}
	backup, err := os.ReadFile(backupPath)
	if err != nil {
		t.Fatal(err)
	}
	if err := os.WriteFile(path+".bak", backup, 0o644); err != nil {
		t.Fatal(err)
	}
	envelope, _, backupUsed, err := LoadSessionWithBackup(path)
	if err != nil || backupUsed || envelope.Reason != "primary" {
		t.Fatalf("env=%+v backup=%v err=%v", envelope, backupUsed, err)
	}
}

func TestLoadSessionWithBackupReturnsNotExistWhenBothMissing(t *testing.T) {
	path := filepath.Join(t.TempDir(), "session.json")
	_, _, _, err := LoadSessionWithBackup(path)
	if !errors.Is(err, os.ErrNotExist) {
		t.Fatalf("err=%v", err)
	}
}

func TestLoadSessionWithBackupRejectsTwoCorruptSnapshots(t *testing.T) {
	path := filepath.Join(t.TempDir(), "session.json")
	if err := os.WriteFile(path, []byte("bad-primary"), 0o644); err != nil {
		t.Fatal(err)
	}
	if err := os.WriteFile(path+".bak", []byte("bad-backup"), 0o644); err != nil {
		t.Fatal(err)
	}
	if _, _, _, err := LoadSessionWithBackup(path); err == nil {
		t.Fatal("expected two-corrupt-snapshot error")
	}
}
''', encoding='utf-8', newline='\n')

          (root / 'internal/media/process_control_test.go').write_text(r'''package media

import (
	"os"
	"sync"
	"testing"
	"time"
)

func TestProcessControllerSerializesPauseAndResumeSignals(t *testing.T) {
	suspendEntered := make(chan struct{})
	releaseSuspend := make(chan struct{})
	resumeEntered := make(chan struct{})
	var onceSuspend, onceResume sync.Once
	controller := &ProcessController{
		processes: map[int]*os.Process{42: &os.Process{Pid: 42}},
		suspend: func(int) error {
			onceSuspend.Do(func() { close(suspendEntered) })
			<-releaseSuspend
			return nil
		},
		resume: func(int) error {
			onceResume.Do(func() { close(resumeEntered) })
			return nil
		},
	}

	pauseDone := make(chan error, 1)
	go func() { pauseDone <- controller.Pause() }()
	<-suspendEntered
	resumeAttempted := make(chan struct{})
	resumeDone := make(chan error, 1)
	go func() {
		close(resumeAttempted)
		resumeDone <- controller.Resume()
	}()
	<-resumeAttempted
	select {
	case <-resumeEntered:
		t.Fatal("resume signal overtook an in-flight pause signal")
	case <-time.After(100 * time.Millisecond):
	}
	close(releaseSuspend)
	if err := <-pauseDone; err != nil {
		t.Fatal(err)
	}
	select {
	case <-resumeEntered:
	case <-time.After(time.Second):
		t.Fatal("resume signal did not run after pause completed")
	}
	if err := <-resumeDone; err != nil {
		t.Fatal(err)
	}
	if controller.IsPaused() {
		t.Fatal("controller remained paused after serialized resume")
	}
}

func TestProcessControllerSerializesPausedRegistrationAndResume(t *testing.T) {
	suspendEntered := make(chan struct{})
	releaseSuspend := make(chan struct{})
	resumeEntered := make(chan struct{})
	controller := &ProcessController{
		processes: make(map[int]*os.Process),
		paused:    true,
		suspend: func(int) error {
			close(suspendEntered)
			<-releaseSuspend
			return nil
		},
		resume: func(int) error {
			close(resumeEntered)
			return nil
		},
	}
	registered := make(chan struct{})
	go func() {
		controller.register(&os.Process{Pid: 7})
		close(registered)
	}()
	<-suspendEntered
	resumeDone := make(chan error, 1)
	go func() { resumeDone <- controller.Resume() }()
	select {
	case <-resumeEntered:
		t.Fatal("resume overtook paused process registration")
	case <-time.After(100 * time.Millisecond):
	}
	close(releaseSuspend)
	<-registered
	select {
	case <-resumeEntered:
	case <-time.After(time.Second):
		t.Fatal("resume did not reconcile the newly registered process")
	}
	if err := <-resumeDone; err != nil {
		t.Fatal(err)
	}
	if controller.IsPaused() {
		t.Fatal("controller remained paused after registration race")
	}
}
''', encoding='utf-8', newline='\n')

          (root / 'internal/workflow/queue_interleaving_test.go').write_text(r'''package workflow

import (
	"fmt"
	"sync"
	"testing"
	"time"

	"mediaworkbench/internal/model"
)

func TestQueueInterleavingStress(t *testing.T) {
	const total = 1800
	settings := model.DefaultSettings()
	errs := make(chan error, total)
	var wg sync.WaitGroup
	for i := 0; i < total; i++ {
		wg.Add(1)
		go func(i int) {
			defer wg.Done()
			task := &model.Task{ID: int64(i + 1), Input: fmt.Sprintf("input-%d.mp4", i), Kind: model.KindVideo, Status: model.StatusReady}
			if err := FreezeForQueue(task, settings, "out", int64(i+1), time.Unix(int64(i), 0)); err != nil {
				errs <- fmt.Errorf("freeze %d: %w", i, err)
				return
			}
			switch i % 4 {
			case 0:
				task.Status = model.StatusProcessing
			case 1:
				task.Status = model.StatusPaused
			default:
				task.Status = model.StatusQueued
			}
			original := task.Options
			sequence := task.Queue.Sequence
			if err := HoldForEdit(task, time.Now()); err != nil {
				errs <- fmt.Errorf("hold %d: %w", i, err)
				return
			}
			switch i % 3 {
			case 0:
				updated := original
				updated.Resolution = "720P"
				immediate, err := ApplyHeldOptions(task, updated, time.Now())
				if err != nil || task.Status != model.StatusQueued || task.Queue == nil || task.Queue.Sequence != sequence || task.Queue.Options.Resolution != "720P" {
					errs <- fmt.Errorf("apply %d immediate=%v err=%v task=%+v", i, immediate, err, task)
					return
				}
				wantImmediate := i%4 == 0
				if immediate != wantImmediate {
					errs <- fmt.Errorf("apply %d immediate=%v want=%v", i, immediate, wantImmediate)
				}
			case 1:
				immediate, err := CancelHeldEdit(task, time.Now())
				if err != nil || task.Status != model.StatusQueued || task.Queue == nil || task.Queue.Sequence != sequence || task.Options != original {
					errs <- fmt.Errorf("cancel %d immediate=%v err=%v task=%+v", i, immediate, err, task)
					return
				}
				wantImmediate := i%4 == 0
				if immediate != wantImmediate {
					errs <- fmt.Errorf("cancel %d immediate=%v want=%v", i, immediate, wantImmediate)
				}
			case 2:
				if !StopRunReturnsHeldToReady(task, settings) || task.Status != model.StatusReady || task.Queue != nil || task.Hold != nil {
					errs <- fmt.Errorf("stop %d task=%+v", i, task)
				}
			}
		}(i)
	}
	wg.Wait()
	close(errs)
	for err := range errs {
		t.Error(err)
	}
}
''', encoding='utf-8', newline='\n')

