name: Cleanup P102 v0.7.4 temporary branches

on:
  push:
    branches:
      - main
    paths:
      - '.maintenance/p102-v0.7.4-branch-cleanup.txt'

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete completed temporary branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'repo-finalize-p102-v074',
              'repo-register-p102-visible-name-cleanup',
              'repo-release-p102-v074',
              'repo-trigger-p102-visible-name-cleanup'
            ];
            const deleted = [];
            const missing = [];
            const failures = [];
            for (const branch of branches) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
              } catch (error) {
                if (error.status === 404) {
                  missing.push(branch);
                  continue;
                }
                failures.push(`${branch}: lookup ${error.message}`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                deleted.push(branch);
              } catch (error) {
                failures.push(`${branch}: delete ${error.message}`);
              }
            }
            const body = [
              'P102_V074_BRANCH_CLEANUP',
              `run_id=${context.runId}`,
              `deleted=${deleted.join(',') || '(none)'}`,
              `already_missing=${missing.join(',') || '(none)'}`,
              'kept=main,p102-stable,p102-exp,p101-migration-payload',
              `failures=${failures.join(' | ') || '(none)'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 24,
              body
            });
            if (failures.length) core.setFailed(failures.join(' | '));
