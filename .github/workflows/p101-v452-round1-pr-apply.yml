name: P101 Apply v4.5.2 Round 1 From PR

on:
  pull_request:
    branches: [p101-stable]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p101-v452-round1-ui-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round1-ui-state
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Apply, validate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round1.py
          cd projects/1-桌面软件/101-Mediova/代码
          go test -count=1 ./...
          cd ../../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜完成 v4.5.2 第一轮 UI 状态接线'
          git push origin HEAD:p101-v452-round1-ui-state
