name: Apply Mediova v4.1.0 via observable PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-pr-execute.txt'

permissions:
  contents: write

concurrency:
  group: p101-v410-apply-v2
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p101-v410-execute-v3'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify and reconstruct transformer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import base64, gzip, hashlib, py_compile
          root=Path('.maintenance/p101-v410/small')
          parts=[]
          for i in range(24):
              p=root/f'{i:02d}'
              if not p.is_file(): raise SystemExit(f'missing part {i:02d}')
              parts.append(p.read_bytes())
          b64=b''.join(parts)
          got=hashlib.sha256(b64).hexdigest()
          if got!='beeb0701ad077cdab3d8750c988a51c2b6eeba12334cfd21299eb6c89604c64c':
              raise SystemExit(f'joined payload mismatch: {got}')
          script=gzip.decompress(base64.b64decode(b64))
          got=hashlib.sha256(script).hexdigest()
          if got!='ea412d8c6a56021795a6ca39bf31f82ece76cc36fa26c3d40252fd8a5dbfb1f2':
              raise SystemExit(f'transformer mismatch: {got}')
          path=Path('.maintenance/p101-v410/apply.py')
          path.write_bytes(script)
          py_compile.compile(str(path),doraise=True)
          print(f'validated transformer: {len(script)} bytes')
          '@ | python -

      - name: Apply source transformation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .maintenance/p101-v410/apply.py
          python .maintenance/p101-v410/post_patch.py
          Set-Location 'projects/1-桌面软件/101-Mediova/代码'
          gofmt -w ./cmd ./internal
          @'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'SOURCE_FILES_SHA256.txt'
          lines=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p==manifest or 'build' in p.parts: continue
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          manifest.write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          '@ | python -

      - name: Validate Go source
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          go test -race -count=1 ./internal/config ./internal/media
          if ($LASTEXITCODE -ne 0) { throw 'race test failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }

      - name: Locate real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          $ff=Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          $fp=Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          if (-not $ff -or -not $fp) {
            $tools=Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
            $ff=Get-ChildItem $tools -Recurse -Filter ffmpeg.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
            $fp=Get-ChildItem $tools -Recurse -Filter ffprobe.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          }
          if (-not $ff -or -not $fp) { throw 'real FFmpeg pair not found' }
          $dir=if ($ff.Source) { Split-Path $ff.Source -Parent } else { $ff.Directory.FullName }
          "FFMPEG_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and validate complete Runtime
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.1.0.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          $build=Join-Path $PWD 'build'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $report=Join-Path $build 'apply_self_test.json'
          $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test',"--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(480000)) { Stop-Process -Id $proc.Id -Force; throw 'self-test timeout' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.1.0' -or $checks.Count -lt 57) { throw 'self-test failed' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'self-test contains failed checks' }
          $manifest=Get-Content (Join-Path $runtime 'runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.1.0' -or $manifest.deployment -ne 'folder-runtime') { throw 'manifest identity mismatch' }
          if (!(Test-Path (Join-Path $runtime 'Components/FFmpeg/bin/ffmpeg.exe'))) { throw 'runtime ffmpeg missing' }
          if (!(Test-Path (Join-Path $build 'Mediova-v4.1.0-Runtime.zip'))) { throw 'runtime zip missing' }
          foreach ($private in @('config.json','history.json','session.json','crash.log','settings.json','vault.bin')) {
            if (Get-ChildItem $runtime -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "private data leaked: $private" }
          }

      - name: Commit verified P101 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item '.maintenance/p101-v410' -Recurse -Force
          Remove-Item '.github/workflows/p101-v410-apply-once.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'projects/1-桌面软件/101-Mediova' '.github/workflows/p101-mediova-ci.yml' '.github/workflows/p101-v410-apply-once.yml' '.maintenance/p101-v410'
          git commit -m 'P101｜实现 Mediova v4.1.0 界面与 Runtime 架构'
          git push origin HEAD:p101-exp

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.1.0-implementation
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova-v4.1.0-Runtime.zip
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/apply_self_test.json
            projects/1-桌面软件/101-Mediova/代码/build/Runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14
