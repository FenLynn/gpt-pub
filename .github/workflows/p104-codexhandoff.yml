name: P104 CodexHandoff Windows

on:
  push:
    branches: [p104-exp, p104-stable]
    paths:
      - 'projects/1-桌面软件/104-CodexHandoff/**'
      - '.github/workflows/p104-codexhandoff.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  pull_request:
    branches: [p104-exp, p104-stable, main]
    paths:
      - 'projects/1-桌面软件/104-CodexHandoff/**'
      - '.github/workflows/p104-codexhandoff.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: p104-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: projects/1-桌面软件/104-CodexHandoff

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report temporary CI run id
        if: github.event_name == 'push' && github.ref == 'refs/heads/p104-exp'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 392,
              body: `P104_TEMP_CI_RUN=${context.runId}\nHEAD=${context.sha}`
            })

      - name: Scope gate
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          $files = git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD"
          $bad = $files | Where-Object {
            $_ -notlike 'projects/1-桌面软件/104-CodexHandoff/*' -and
            $_ -ne '.github/workflows/p104-codexhandoff.yml' -and
            $_ -ne '目录.md' -and
            $_ -ne 'projects/1-桌面软件/README.md'
          }
          if ($bad) {
            Write-Host 'Out-of-scope files:'
            $bad | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck and build
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read-only source guard
        run: |
          $source = Get-Content src-tauri/src/codex.rs -Raw
          $forbidden = @('remove_file(', 'rename(', 'OpenOptions::new', 'File::create(', 'write(true)', 'append(true)')
          foreach ($needle in $forbidden) {
            if ($source.Contains($needle)) {
              Write-Error "Source reader contains forbidden write primitive: $needle"
              exit 1
            }
          }

      - name: Build portable Windows EXE
        run: npm run tauri build -- --no-bundle

      - name: Hash portable EXE
        run: |
          $exe = 'src-tauri/target/release/CodexHandoff.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-FileHash $exe -Algorithm SHA256 | Select-Object Hash | ConvertTo-Json | Set-Content CodexHandoff.sha256.json

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: P104-CodexHandoff-windows-x64-${{ github.sha }}
          path: |
            projects/1-桌面软件/104-CodexHandoff/src-tauri/target/release/CodexHandoff.exe
            projects/1-桌面软件/104-CodexHandoff/CodexHandoff.sha256.json
          if-no-files-found: error
          retention-days: 7
