name: P105 LocalSub Windows CI

on:
  workflow_dispatch:
    inputs:
      formal_release:
        description: 'Create a formal GitHub Release. Use only after explicit user authorization.'
        required: false
        type: boolean
        default: false
      release_version:
        description: 'Exact version to release, for example 0.2.0'
        required: false
        type: string
      release_confirm:
        description: 'Type RELEASE to confirm formal publication'
        required: false
        type: string
  push:
    branches: [ p105-exp, main ]
    paths:
      - 'projects/1-桌面软件/105-LocalSub/src/**'
      - 'projects/1-桌面软件/105-LocalSub/RELEASE.md'
      - '.github/workflows/p105-localsub-ci.yml'
  pull_request:
    branches: [ p105-stable, main ]
    paths:
      - 'projects/1-桌面软件/105-LocalSub/**'
      - '.github/workflows/p105-localsub-ci.yml'
      - 'projects/1-桌面软件/README.md'
      - '目录.md'

permissions:
  contents: read

concurrency:
  group: p105-localsub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce P105 source and target
        shell: bash
        run: |
          set -euo pipefail
          head_ref='${{ github.head_ref }}'
          base_ref='${{ github.base_ref }}'
          if [[ "$base_ref" == 'p105-stable' ]]; then
            [[ "$head_ref" == 'p105-exp' ]] || { echo "P105 stable admission must be p105-exp -> p105-stable"; exit 1; }
          elif [[ "$base_ref" == 'main' ]]; then
            [[ "$head_ref" == 'p105-stable' ]] || { echo "P105 main admission must be p105-stable -> main"; exit 1; }
          else
            echo "Unexpected P105 PR target: $base_ref"
            exit 1
          fi
      - name: Enforce P105 path scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS=$'\t' read -r status path; do
            case "$path" in
              projects/1-桌面软件/105-LocalSub/*|.github/workflows/p105-localsub-ci.yml|projects/1-桌面软件/README.md|目录.md)
                ;;
              *)
                echo "Out-of-scope P105 path: $status $path"
                bad=1
                ;;
            esac
          done < <(git -c core.quotepath=false diff --name-status "$base_sha" "$head_sha")
          [[ "$bad" -eq 0 ]]
      - name: Reject old P103 LocalSub identifiers in active source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '103-LocalSub|p103-localsub' 'projects/1-桌面软件/105-LocalSub/src'; then
            echo 'Old P103 LocalSub identifiers remain in active P105 source.'
            exit 1
          fi

  build:
    needs: scope
    if: always() && (needs.scope.result == 'success' || needs.scope.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Typecheck and build Vue WebUi
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub/src/LocalSub/WebUi
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          foreach ($file in @('dist/index.html','dist/assets/app.js','dist/assets/app.css')) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "WebUi bundle missing $file" }
          }
          $index = Get-Content dist/index.html -Raw
          if ($index -notmatch './assets/app\.js' -or $index -notmatch './assets/app\.css') {
            throw 'WebUi index.html does not reference deterministic production assets.'
          }

      - name: Capture WebUi browser previews
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub/src/LocalSub/WebUi
        run: |
          $ErrorActionPreference='Stop'
          $edgeCandidates = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge was not found for WebUi visual preview.' }
          New-Item -ItemType Directory -Force preview | Out-Null
          $uri = [Uri]::new((Resolve-Path 'dist/index.html').Path).AbsoluteUri
          foreach ($spec in @(
            @{ Name='live-1100x825'; Size='1100,825'; Page='live' },
            @{ Name='batch-1100x825'; Size='1100,825'; Page='batch' },
            @{ Name='models-1100x825'; Size='1100,825'; Page='models' },
            @{ Name='settings-1100x825'; Size='1100,825'; Page='settings' },
            @{ Name='docs-1100x825'; Size='1100,825'; Page='docs' },
            @{ Name='live-900x675'; Size='900,675'; Page='live' }
          )) {
            $shot = (Resolve-Path 'preview').Path + "\localsub-$($spec.Name).png"
            $args = @(
              '--headless',
              '--disable-gpu',
              '--hide-scrollbars',
              '--no-first-run',
              '--allow-file-access-from-files',
              "--window-size=$($spec.Size)",
              "--screenshot=$shot",
              ($uri + '?page=' + $spec.Page)
            )
            $p = Start-Process -FilePath $edge -ArgumentList $args -PassThru -Wait
            if ($p.ExitCode -ne 0 -or -not (Test-Path $shot) -or (Get-Item $shot).Length -lt 10000) {
              throw "WebUi preview failed for $($spec.Name)"
            }
          }

      - name: Verify release identity inputs
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          [xml]$shell=Get-Content 'src/LocalSub/LocalSub.csproj' -Raw
          [xml]$core=Get-Content 'src/LocalSub.CoreWorker/LocalSub.CoreWorker.csproj' -Raw
          $shellVersion=@($shell.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $coreVersion=@($core.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($shellVersion) -or $shellVersion -ne $coreVersion) {
            throw "Shell/Core version mismatch: shell=$shellVersion core=$coreVersion"
          }
          if (Test-Path 'RELEASE.md') {
            $text=Get-Content 'RELEASE.md' -Raw
            $m=[regex]::Match($text,'(?m)^Version:\s*([^\s]+)\s*$')
            if (-not $m.Success) { throw 'RELEASE.md must contain Version: x.y.z' }
            $releaseVersion=$m.Groups[1].Value
            try {
              $sourceSemVer=[version]$shellVersion
              $releaseSemVer=[version]$releaseVersion
            } catch {
              throw "Invalid source or RELEASE.md version: source=$shellVersion release=$releaseVersion"
            }
            if ($sourceSemVer -lt $releaseSemVer) {
              throw "Development source version must not be older than the latest formal Release marker: source=$shellVersion release=$releaseVersion"
            }
            $formalRelease = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.formal_release }}' -eq 'true'
            if ($formalRelease -and $releaseVersion -ne $shellVersion) {
              throw "Formal release requires RELEASE.md to match source: release=$releaseVersion source=$shellVersion"
            }
            if ($releaseVersion -ne $shellVersion) {
              Write-Host "Development candidate $shellVersion is ahead of formal Release marker $releaseVersion."
            }
          }

      - name: Verify v0.1.5 visual layout contract
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $app = Get-Content 'src/LocalSub/WebUi/src/App.vue' -Raw
          $style = Get-Content 'src/LocalSub/WebUi/src/style.css' -Raw
          $host = Get-Content 'src/LocalSub/UI/WebShellForm.cs' -Raw

          foreach ($required in @(
            'class="sidebar"',
            'class="side-nav"',
            '<Teleport to="body">',
            'class="global-tooltip"'
          )) {
            if ($app -notmatch [regex]::Escape($required)) {
              throw "v0.1.5 Web UI contract missing: $required"
            }
          }

          foreach ($required in @(
            'grid-template-columns:225px minmax(0,1fr)',
            'z-index:2147483000'
          )) {
            if ($style -notmatch [regex]::Escape($required)) {
              throw "v0.1.5 style contract missing: $required"
            }
          }

          foreach ($required in @(
            'Width = 1100;',
            'Height = 825;'
          )) {
            if ($host -notmatch [regex]::Escape($required)) {
              throw "v0.1.5 4:3 host contract missing: $required"
            }
          }

          if ($app -match 'class="top-tabs"') {
            throw 'Primary navigation must remain in the left sidebar, not move back to top tabs.'
          }

      - name: Verify default WebUi and legacy backup startup policy
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $program = Get-Content 'src/LocalSub/Program.cs' -Raw
          foreach ($required in @(
            'RunWebShell(startup);',
            'IsBatchUiSmokeTest || IsLegacyUiRequested',
            '--legacy-ui',
            'LOCALSUB_LEGACY_UI',
            'TrayController.Attach(webShell)'
          )) {
            if ($program -notmatch [regex]::Escape($required)) {
              throw "Default WebUi startup policy is missing: $required"
            }
          }
          if ($program -match 'if \(IsWebUiSmokeTest \|\| IsWebUiPreview\)') {
            throw 'WebUi must no longer require preview or smoke mode to become the primary startup path.'
          }

      - name: Verify realtime compile-time isolation
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $shellText = Get-Content 'src/LocalSub/LocalSub.csproj' -Raw
          $coreText = Get-Content 'src/LocalSub.CoreWorker/LocalSub.CoreWorker.csproj' -Raw
          $mainFormText = Get-Content 'src/LocalSub/UI/MainForm.cs' -Raw
          $heavy = @(
            'AllAudioCaptureService',
            'ResilientPotPlayerCaptureService',
            'ProcessLoopbackCaptureService',
            'StreamingParaformerService',
            'SenseVoiceSimulatedStreamingService',
            'FunAsrNanoSimulatedStreamingService'
          )
          foreach ($name in $heavy) {
            $remove = 'Compile Remove="Services\{0}.cs"' -f $name
            if ($shellText -notmatch [regex]::Escape($remove)) {
              throw "$name is not excluded from LocalSub.exe compilation"
            }
            $include = '..\LocalSub\Services\{0}.cs' -f $name
            if ($coreText -notmatch [regex]::Escape($include)) {
              throw "$name is not compiled into LocalSub.Core.exe"
            }
          }
          foreach ($name in @('LiveAsrPipeline','ProcessLoopbackCaptureService')) {
            $include = '..\LocalSub\Services\{0}.cs' -f $name
            if ($coreText -notmatch [regex]::Escape($include)) {
              throw "$name is missing from LocalSub.Core.exe compilation"
            }
          }
          if ($coreText -notmatch 'LOCALSUB_CORE_WORKER') {
            throw 'LocalSub.CoreWorker must define LOCALSUB_CORE_WORKER'
          }
          if ($shellText -notmatch [regex]::Escape('Compile Remove="Services\ModelManager.cs"')) {
            throw 'Heavy ModelManager implementation must be excluded from LocalSub.exe compilation'
          }
          if ($coreText -notmatch [regex]::Escape('..\LocalSub\Services\ModelManager.cs')) {
            throw 'Heavy ModelManager implementation must be compiled into LocalSub.Core.exe'
          }
          if ($shellText -match 'SharpCompress') {
            throw 'SharpCompress must not remain a LocalSub.exe package dependency after model heavy-work isolation'
          }
          if (-not (Test-Path 'src/LocalSub/Services/ModelManager.Proxy.cs')) {
            throw 'Shell-side ModelManager proxy is missing'
          }
          if ($mainFormText -notmatch [regex]::Escape('readonly LiveAsrPipeline _liveAsr = new(CoreWorkerBroker.Shared);')) {
            throw 'Legacy WinForms realtime must share CoreWorkerBroker with batch and model operations'
          }

      - name: Publish net8 shell app
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub/src/LocalSub
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained false -o ../../publish

      - name: Publish isolated core worker
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub/src/LocalSub.CoreWorker
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained false -o ../../core-publish

      - name: Prepare portable layout
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item publish/onnxruntime*.dll -Force -ErrorAction SilentlyContinue
          Remove-Item publish/sherpa-onnx-c-api.dll -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path core-publish/LocalSub.Core.exe)) { throw 'LocalSub.Core.exe was not published' }
          Copy-Item core-publish/LocalSub.Core.exe publish/LocalSub.Core.exe -Force
          New-Item -ItemType Directory -Force publish/ASR | Out-Null
          Copy-Item src/LocalSub/ASR-README.txt publish/ASR/README.txt -Force
          if (Get-ChildItem publish/ASR -Filter *.onnx -Recurse -ErrorAction SilentlyContinue) { throw 'Model files must not be bundled' }
          if (Test-Path publish/hostfxr.dll) { throw '.NET runtime must not be bundled' }
          if (Get-ChildItem publish -Filter 'onnxruntime*.dll' -File -ErrorAction SilentlyContinue) { throw 'ONNX Runtime must not be bundled' }
          if (Test-Path publish/sherpa-onnx-c-api.dll) { throw 'sherpa native runtime must not be bundled' }

      - name: Smoke test LocalSub.Core IPC
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $pipeName = "LocalSub.Core.CI.$PID.$([guid]::NewGuid().ToString('N'))"
          Remove-Item publish/Logs/core.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.Core.exe') -WorkingDirectory (Resolve-Path 'publish') -ArgumentList @('--pipe', $pipeName, '--parent', "$PID") -PassThru
          try {
            $client = [System.IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut, [System.IO.Pipes.PipeOptions]::Asynchronous)
            $client.Connect(8000)
            $reader = [System.IO.StreamReader]::new($client)
            $writer = [System.IO.StreamWriter]::new($client)
            $writer.AutoFlush = $true
            $writer.WriteLine('{"kind":"request","id":"ci-ping","method":"ping","payload":{}}')
            $line = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($line)) { throw 'Core IPC returned no ping response' }
            $message = $line | ConvertFrom-Json
            if ($message.kind -ne 'response' -or $message.id -ne 'ci-ping' -or -not $message.ok) { throw "Unexpected Core IPC response: $line" }
            [xml]$coreProject = Get-Content 'src/LocalSub.CoreWorker/LocalSub.CoreWorker.csproj' -Raw
            $expectedVersion = @($coreProject.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if ($message.payload.version -ne $expectedVersion) { throw "Unexpected Core version: $($message.payload.version), expected $expectedVersion" }
            $writer.WriteLine('{"kind":"request","id":"ci-stop","method":"shutdown","payload":{}}')
            $stopLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($stopLine)) { throw 'Core IPC returned no shutdown response' }
            $writer.Dispose(); $reader.Dispose(); $client.Dispose()
            if (-not $p.WaitForExit(5000)) { throw 'LocalSub.Core did not exit after shutdown' }
            if ($p.ExitCode -ne 0) { throw "LocalSub.Core exited with $($p.ExitCode)" }
          } catch {
            if (Test-Path publish/Logs/core.log) { Get-Content publish/Logs/core.log }
            try { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } } catch { }
            throw
          }

      - name: Smoke test model operation IPC state machine
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $pipeName = "LocalSub.Core.ModelCI.$PID.$([guid]::NewGuid().ToString('N'))"
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.Core.exe') -WorkingDirectory (Resolve-Path 'publish') -ArgumentList @('--pipe', $pipeName, '--parent', "$PID") -PassThru
          try {
            $client = [System.IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut, [System.IO.Pipes.PipeOptions]::Asynchronous)
            $client.Connect(8000)
            $reader = [System.IO.StreamReader]::new($client)
            $writer = [System.IO.StreamWriter]::new($client)
            $writer.AutoFlush = $true

            $writer.WriteLine('{"kind":"request","id":"ci-model-download","method":"model.download","payload":{"modelId":"__ci_missing_model__"}}')
            $downloadLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($downloadLine)) { throw 'model.download returned no response' }
            $download = $downloadLine | ConvertFrom-Json
            if ($download.kind -ne 'response' -or $download.id -ne 'ci-model-download' -or $download.ok -or $download.error -notmatch 'catalog') {
              throw "Invalid model.download did not fail cleanly: $downloadLine"
            }

            Start-Sleep -Milliseconds 100
            $writer.WriteLine('{"kind":"request","id":"ci-model-delete","method":"model.delete","payload":{"modelId":"__ci_missing_model__"}}')
            $deleteLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($deleteLine)) { throw 'model.delete returned no response' }
            $delete = $deleteLine | ConvertFrom-Json
            if ($delete.kind -ne 'response' -or $delete.id -ne 'ci-model-delete' -or $delete.ok -or $delete.error -notmatch 'catalog') {
              throw "Invalid model.delete did not fail cleanly: $deleteLine"
            }

            $writer.WriteLine('{"kind":"request","id":"ci-model-ping","method":"ping","payload":{}}')
            $pingLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($pingLine)) { throw 'Core did not answer ping after model operation failures' }
            $ping = $pingLine | ConvertFrom-Json
            if ($ping.kind -ne 'response' -or $ping.id -ne 'ci-model-ping' -or -not $ping.ok) {
              throw "Core unhealthy after model operation failures: $pingLine"
            }

            $writer.WriteLine('{"kind":"request","id":"ci-model-shutdown","method":"shutdown","payload":{}}')
            $shutdownLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($shutdownLine)) { throw 'Core returned no shutdown response after model operation smoke' }
            $writer.Dispose(); $reader.Dispose(); $client.Dispose()
            if (-not $p.WaitForExit(5000)) { throw 'LocalSub.Core did not exit after model operation smoke shutdown' }
            if ($p.ExitCode -ne 0) { throw "LocalSub.Core model operation smoke exited with $($p.ExitCode)" }
          } catch {
            if (Test-Path publish/Logs/core.log) { Get-Content publish/Logs/core.log }
            try { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } } catch { }
            throw
          }
      - name: Smoke test realtime IPC state machine
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $pipeName = "LocalSub.Core.LiveCI.$PID.$([guid]::NewGuid().ToString('N'))"
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.Core.exe') -WorkingDirectory (Resolve-Path 'publish') -ArgumentList @('--pipe', $pipeName, '--parent', "$PID") -PassThru
          try {
            $client = [System.IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut, [System.IO.Pipes.PipeOptions]::Asynchronous)
            $client.Connect(8000)
            $reader = [System.IO.StreamReader]::new($client)
            $writer = [System.IO.StreamWriter]::new($client)
            $writer.AutoFlush = $true

            $writer.WriteLine('{"kind":"request","id":"ci-live-stop-empty","method":"live.stop","payload":{"sessionId":"missing-session"}}')
            $stopLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($stopLine)) { throw 'Realtime IPC returned no idempotent stop response' }
            $stop = $stopLine | ConvertFrom-Json
            if ($stop.kind -ne 'response' -or $stop.id -ne 'ci-live-stop-empty' -or -not $stop.ok -or $stop.payload.stopped) {
              throw "Unexpected empty live.stop response: $stopLine"
            }

            $writer.WriteLine('{"kind":"request","id":"ci-live-start-1","method":"live.start","payload":{"modelId":"__ci_missing_model__","processId":null}}')
            $startLine1 = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($startLine1)) { throw 'Realtime IPC returned no failed start response' }
            $start1 = $startLine1 | ConvertFrom-Json
            if ($start1.kind -ne 'response' -or $start1.id -ne 'ci-live-start-1' -or $start1.ok) {
              throw "Invalid model live.start must fail cleanly: $startLine1"
            }
            if ([string]::IsNullOrWhiteSpace($start1.error) -or $start1.error -notmatch 'catalog') {
              throw "Invalid model live.start returned an unclear error: $startLine1"
            }

            Start-Sleep -Milliseconds 150
            $writer.WriteLine('{"kind":"request","id":"ci-live-start-2","method":"live.start","payload":{"modelId":"__ci_missing_model__","processId":null}}')
            $startLine2 = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($startLine2)) { throw 'Realtime IPC returned no second failed start response' }
            $start2 = $startLine2 | ConvertFrom-Json
            if ($start2.kind -ne 'response' -or $start2.id -ne 'ci-live-start-2' -or $start2.ok) {
              throw "Realtime operation slot did not recover after failed start: $startLine2"
            }

            $writer.WriteLine('{"kind":"request","id":"ci-live-ping","method":"ping","payload":{}}')
            $pingLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($pingLine)) { throw 'Core did not answer ping after realtime failures' }
            $ping = $pingLine | ConvertFrom-Json
            if ($ping.kind -ne 'response' -or $ping.id -ne 'ci-live-ping' -or -not $ping.ok) {
              throw "Core unhealthy after realtime failures: $pingLine"
            }

            $writer.WriteLine('{"kind":"request","id":"ci-live-shutdown","method":"shutdown","payload":{}}')
            $shutdownLine = $reader.ReadLine()
            if ([string]::IsNullOrWhiteSpace($shutdownLine)) { throw 'Core returned no shutdown response after realtime smoke' }

            $writer.Dispose(); $reader.Dispose(); $client.Dispose()
            if (-not $p.WaitForExit(5000)) { throw 'LocalSub.Core did not exit after realtime smoke shutdown' }
            if ($p.ExitCode -ne 0) { throw "LocalSub.Core realtime smoke exited with $($p.ExitCode)" }
          } catch {
            if (Test-Path publish/Logs/core.log) { Get-Content publish/Logs/core.log }
            try { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } } catch { }
            throw
          }

      - name: Smoke test Shell Core crash recovery
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALSUB_CORE_RECOVERY_SMOKE = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          Remove-Item publish/Logs/core.log -Force -ErrorAction SilentlyContinue
          Remove-Item publish/Logs/core-client.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            if (Test-Path publish/Logs/core.log) { Get-Content publish/Logs/core.log }
            if (Test-Path publish/Logs/core-client.log) { Get-Content publish/Logs/core-client.log }
            throw "Core crash recovery smoke test failed. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Core crash recovery smoke test wrote a crash log.' }
          if (-not (Test-Path publish/Logs/core-client.log)) { throw 'Core crash recovery smoke test did not create core-client.log.' }
          $clientLog = Get-Content publish/Logs/core-client.log -Raw
          if ($clientLog -notmatch 'DISCONNECTED generation=1') { throw 'Core crash recovery smoke test did not record generation 1 disconnect.' }
          if ($clientLog -notmatch 'CONNECTED generation=2') { throw 'Core crash recovery smoke test did not reconnect as generation 2.' }

      - name: Smoke test WebView2 Vue host and bridge
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALSUB_WEBUI_SMOKE = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          Remove-Item publish/Logs/webui-smoke-ready.txt -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
            $p.Refresh()
            if ($p.HasExited) { break }
            if (Test-Path publish/Logs/webui-smoke-ready.txt) { break }
          }
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "WebUi host exited before ready. ExitCode=$($p.ExitCode)"
          }
          if (-not (Test-Path publish/Logs/webui-smoke-ready.txt)) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw 'WebUi host did not complete a real app.getSnapshot bridge round trip.'
          }
          $ready = Get-Content publish/Logs/webui-smoke-ready.txt -Raw
          if ($ready -notmatch 'bridge=app.getSnapshot' -or $ready -notmatch 'bridge=live.stop' -or $ready -notmatch 'bridge=live.start' -or $ready -notmatch 'bridge=model.list' -or $ready -notmatch 'bridge=model.select' -or $ready -notmatch 'bridge=model.download' -or $ready -notmatch 'bridge=model.cancel' -or $ready -notmatch 'bridge=model.delete' -or $ready -notmatch 'webview2=ready') {
            throw "Unexpected WebUi smoke marker: $ready"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'WebUi host wrote a crash log.' }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test LocalSub startup
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALSUB_SMOKE_TEST = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "LocalSub exited during startup smoke test. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Startup smoke test wrote a crash log.' }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test legacy WinForms backup
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:LOCALSUB_SMOKE_TEST -ErrorAction SilentlyContinue
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -ArgumentList '--legacy-ui' -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "Legacy WinForms backup exited during startup smoke test. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Legacy WinForms backup wrote a crash log.' }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test background workspace
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALSUB_BATCH_UI_SMOKE = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -ArgumentList '--legacy-ui' -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "Batch workspace smoke test exited. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Batch workspace wrote a crash log.' }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test Windows process loopback
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALSUB_PROCESS_LOOPBACK_SMOKE = '1'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "Process loopback smoke test failed. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Process loopback smoke test wrote a crash log.' }

      - name: Verify sherpa win-x64 runtime package
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'localsub-sherpa-runtime-test'
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $testRoot | Out-Null
          $pkg = Join-Path $testRoot 'runtime.nupkg'
          $zip = Join-Path $testRoot 'runtime.zip'
          $expanded = Join-Path $testRoot 'expanded'
          $url = 'https://api.nuget.org/v3-flatcontainer/org.k2fsa.sherpa.onnx.runtime.win-x64/1.13.4/org.k2fsa.sherpa.onnx.runtime.win-x64.1.13.4.nupkg'
          Invoke-WebRequest -Uri $url -OutFile $pkg
          Copy-Item $pkg $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $native = Join-Path $expanded 'runtimes/win-x64/native'
          $capi = Join-Path $native 'sherpa-onnx-c-api.dll'
          if (-not (Test-Path $capi)) { throw 'sherpa runtime package is missing sherpa-onnx-c-api.dll' }
          [Environment]::SetEnvironmentVariable('PATH', "$native;$env:PATH", 'Process')
          $handle = [System.Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path $capi))
          if ($handle -eq [IntPtr]::Zero) { throw 'Unable to load sherpa-onnx-c-api.dll' }
          [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
          Remove-Item $testRoot -Recurse -Force

      - name: Smoke test native offline ASR
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'localsub-offline-asr-smoke'
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $testRoot | Out-Null
          $pkg = Join-Path $testRoot 'runtime.nupkg'
          $zip = Join-Path $testRoot 'runtime.zip'
          $expanded = Join-Path $testRoot 'runtime-expanded'
          $runtimeUrl = 'https://api.nuget.org/v3-flatcontainer/org.k2fsa.sherpa.onnx.runtime.win-x64/1.13.4/org.k2fsa.sherpa.onnx.runtime.win-x64.1.13.4.nupkg'
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $pkg
          Copy-Item $pkg $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $native = Join-Path $expanded 'runtimes/win-x64/native'
          $archive = Join-Path $testRoot 'tdnn.tar.bz2'
          $modelUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-tdnn-yesno.tar.bz2'
          Invoke-WebRequest -Uri $modelUrl -OutFile $archive
          & tar.exe -xf $archive -C $testRoot
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract TDNN smoke model.' }
          $modelRoot = Join-Path $testRoot 'sherpa-onnx-tdnn-yesno'
          $env:LOCALSUB_OFFLINE_ASR_SMOKE = '1'
          $env:LOCALSUB_OFFLINE_ASR_MODEL = (Resolve-Path (Join-Path $modelRoot 'model-epoch-14-avg-2.onnx'))
          $env:LOCALSUB_OFFLINE_ASR_TOKENS = (Resolve-Path (Join-Path $modelRoot 'tokens.txt'))
          $env:LOCALSUB_OFFLINE_ASR_WAV = (Resolve-Path (Join-Path $modelRoot 'test_wavs/0_0_0_1_0_0_0_1.wav'))
          $env:LOCALSUB_OFFLINE_ASR_RUNTIME = (Resolve-Path $native)
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path 'publish/LocalSub.exe') -WorkingDirectory (Resolve-Path 'publish') -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log }
            throw "Native offline ASR smoke test failed. ExitCode=$($p.ExitCode)"
          }
          if (Test-Path publish/LocalSub-crash.log) { Get-Content publish/LocalSub-crash.log; throw 'Native offline ASR smoke test wrote a crash log.' }
          Remove-Item $testRoot -Recurse -Force

      - name: Package portable candidate and verify manifest
        shell: pwsh
        working-directory: projects/1-桌面软件/105-LocalSub
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item publish/LocalSub-crash.log -Force -ErrorAction SilentlyContinue
          Remove-Item publish/Logs -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($private in @('config.json','state.json','history.json')) {
            if (Get-ChildItem publish -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "Private Data leaked into portable package: $private" }
          }
          if (-not (Test-Path publish/LocalSub.exe)) { throw 'LocalSub.exe missing from portable package' }
          if (-not (Test-Path publish/LocalSub.Core.exe)) { throw 'LocalSub.Core.exe missing from portable package' }
          if (Get-ChildItem publish/ASR -Include *.dll,*.onnx -Recurse -ErrorAction SilentlyContinue) { throw 'ASR runtime or model files must not be bundled' }
          if (Get-ChildItem publish -Filter 'onnxruntime*.dll' -File -ErrorAction SilentlyContinue) { throw 'ONNX Runtime leaked into portable package' }
          if (Test-Path publish/sherpa-onnx-c-api.dll) { throw 'sherpa native runtime leaked into portable package' }
          if (Test-Path publish/Components/FFmpeg/bin/ffmpeg.exe) { throw 'FFmpeg must remain an optional downloaded component' }
          $root=(Resolve-Path 'publish').Path
          $manifest=@()
          foreach ($file in Get-ChildItem publish -File -Recurse | Sort-Object FullName) {
            $rel=$file.FullName.Substring($root.Length).TrimStart('\','/') -replace '\\','/'
            $hash=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "$rel`t$($file.Length)`t$hash"
          }
          $manifest | Set-Content publish/MANIFEST-SHA256.txt -Encoding utf8
          Compress-Archive -Path publish/* -DestinationPath LocalSub-candidate-win-x64-net8.zip -CompressionLevel Optimal -Force
          $verify=Join-Path $env:RUNNER_TEMP 'localsub-package-verify'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive LocalSub-candidate-win-x64-net8.zip -DestinationPath $verify -Force
          foreach ($line in Get-Content (Join-Path $verify 'MANIFEST-SHA256.txt')) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts=$line -split "`t"
            if ($parts.Count -ne 3) { throw "Invalid manifest line: $line" }
            $file=Join-Path $verify ($parts[0] -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path $file -PathType Leaf)) { throw "Manifest file missing after re-extract: $($parts[0])" }
            if ((Get-Item $file).Length -ne [int64]$parts[1]) { throw "Manifest size mismatch: $($parts[0])" }
            $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $parts[2]) { throw "Manifest hash mismatch: $($parts[0])" }
          }
          Remove-Item $verify -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: P105-LocalSub-win-x64-net8-candidate
          path: projects/1-桌面软件/105-LocalSub/LocalSub-candidate-win-x64-net8.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: P105-LocalSub-WebUi-preview
          path: projects/1-桌面软件/105-LocalSub/src/LocalSub/WebUi/preview/*.png
          retention-days: 14

  release:
    needs: build
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.formal_release == true &&
      inputs.release_confirm == 'RELEASE' &&
      needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify explicit manual release gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $requested='${{ inputs.release_version }}'
          $confirm='${{ inputs.release_confirm }}'
          if ([string]::IsNullOrWhiteSpace($requested)) { throw 'release_version is required for a formal Release.' }
          if ($confirm -ne 'RELEASE') { throw 'release_confirm must equal RELEASE.' }
          Write-Host "Explicit manual release gate accepted for version $requested on main $env:GITHUB_SHA"

      - name: Resolve and guard release identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $requested='${{ inputs.release_version }}'
          [xml]$shell=Get-Content 'projects/1-桌面软件/105-LocalSub/src/LocalSub/LocalSub.csproj' -Raw
          [xml]$core=Get-Content 'projects/1-桌面软件/105-LocalSub/src/LocalSub.CoreWorker/LocalSub.CoreWorker.csproj' -Raw
          $version=@($shell.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $coreVersion=@($core.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($version -ne $coreVersion) { throw "Shell/Core version mismatch: $version vs $coreVersion" }
          if ($version -ne $requested) { throw "Requested release version does not match source: requested=$requested source=$version" }
          $marker=Get-Content 'projects/1-桌面软件/105-LocalSub/RELEASE.md' -Raw
          $m=[regex]::Match($marker,'(?m)^Version:\s*([^\s]+)\s*$')
          if (-not $m.Success -or $m.Groups[1].Value -ne $version) { throw 'RELEASE.md version does not match source version.' }
          $tag="p105-v$version"
          $PSNativeCommandUseErrorActionPreference=$false
          gh release view $tag *> $null
          $releaseExit=$LASTEXITCODE
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          $tagExit=$LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference=$true
          if ($releaseExit -eq 0) { throw "Release $tag already exists; formal releases must never be reused." }
          if ($releaseExit -ne 1) { throw "Unable to verify whether Release $tag exists. ExitCode=$releaseExit" }
          if ($tagExit -eq 0) { throw "Tag $tag already exists; formal tags must never be reused." }
          if ($tagExit -ne 1) { throw "Unable to verify whether tag $tag exists. ExitCode=$tagExit" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/download-artifact@v4
        with:
          name: P105-LocalSub-win-x64-net8-candidate
          path: release-input

      - name: Prepare immutable release assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='${{ steps.identity.outputs.version }}'
          New-Item release,release/incremental,release/runtime -ItemType Directory -Force | Out-Null
          $candidate=Resolve-Path 'release-input/LocalSub-candidate-win-x64-net8.zip'
          $full="release/LocalSub-v$version-win-x64-net8.zip"
          Copy-Item $candidate $full -Force
          Expand-Archive $candidate -DestinationPath release/runtime -Force
          foreach ($name in @('LocalSub.exe','LocalSub.Core.exe')) {
            $src=Join-Path 'release/runtime' $name
            if (-not (Test-Path $src -PathType Leaf)) { throw "$name missing from release runtime" }
            Copy-Item $src (Join-Path 'release/incremental' $name) -Force
          }
          $shellHash=(Get-FileHash 'release/runtime/LocalSub.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreHash=(Get-FileHash 'release/runtime/LocalSub.Core.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "LocalSub.exe`t$shellHash",
            "LocalSub.Core.exe`t$coreHash"
          ) | Set-Content 'release/incremental/SHA256.txt' -Encoding utf8
          $inc="release/LocalSub-v$version-incremental-two-exe.zip"
          Compress-Archive -Path release/incremental/* -DestinationPath $inc -CompressionLevel Optimal -Force
          $fullHash=(Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
          $incHash=(Get-FileHash $inc -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "LocalSub-v$version-win-x64-net8.zip`t$fullHash",
            "LocalSub-v$version-incremental-two-exe.zip`t$incHash",
            "LocalSub.exe`t$shellHash",
            "LocalSub.Core.exe`t$coreHash"
          ) | Set-Content "release/LocalSub-v$version-SHA256.txt" -Encoding utf8
          @"
          ## LocalSub v$version

          LocalSub v$version is a formal P105 release of the dual-process architecture.

          Highlights:
          * `LocalSub.exe` remains the Windows shell and UI host.
          * `LocalSub.Core.exe` isolates media analysis and background ASR heavy workloads.
          * Core crash recovery uses connection generations so a dead worker cannot poison a new connection.
          * Cancellation timeout cleanup and graceful Shell-to-Core shutdown are included.
          * The selected main commit is rebuilt on Windows and passes Core IPC, forced Core crash/reconnect, Shell startup, background workspace, Process Loopback, sherpa native runtime loading, and native offline ASR smoke tests before publishing.
          * Models, ONNX Runtime, sherpa native runtime, FFmpeg and user Data are excluded from the base package.

          Requirements:
          * Windows x64
          * .NET 8 Desktop Runtime
          * Existing ASR models/runtime remain external to the base package.

          Validation note:
          Automated Windows fault-injection and native smoke tests passed for this source. User-specific high-load GUI responsiveness with real media/models remains a real-machine validation item and is not represented as completed by CI.

          Release commit: $env:GITHUB_SHA
          "@ | Set-Content 'release/RELEASE_NOTES.md' -Encoding utf8

      - name: Create LocalSub GitHub Release from current main commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='${{ steps.identity.outputs.version }}'
          $tag='${{ steps.identity.outputs.tag }}'
          gh release create $tag `
            "release/LocalSub-v$version-win-x64-net8.zip" `
            "release/LocalSub-v$version-incremental-two-exe.zip" `
            "release/LocalSub-v$version-SHA256.txt" `
            --target "$env:GITHUB_SHA" `
            --title "LocalSub v$version" `
            --notes-file 'release/RELEASE_NOTES.md'

      - name: Verify published P105 Release state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='${{ steps.identity.outputs.tag }}'
          gh release view $tag --json tagName,name,isDraft,isPrerelease,url,assets | Write-Host

  branch_hygiene:
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize P105 branches and clean known obsolete refs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          foreach ($branch in @('p105-stable','p105-exp')) {
            gh api --method PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$env:GITHUB_SHA" -F force=false | Out-Null
            Write-Host "Fast-forwarded $branch to $env:GITHUB_SHA"
          }
          foreach ($branch in @('p103-localsub-ci-bootstrap','p103-localsub-exp','_should_not_create')) {
            $PSNativeCommandUseErrorActionPreference=$false
            $ref=gh api "repos/$repo/git/ref/heads/$branch" 2>$null | ConvertFrom-Json
            $lookupExit=$LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference=$true
            if ($lookupExit -ne 0) {
              Write-Host "Branch already absent: $branch"
              continue
            }
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" --quiet
            git merge-base --is-ancestor "refs/remotes/origin/$branch" "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Refusing to delete branch with unique commits: $branch" }
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" | Out-Null
            Write-Host "Deleted obsolete branch: $branch"
          }
          exit 0

      - name: Verify final P105 branch hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $refs=gh api "repos/$repo/git/matching-refs/heads/p105" | ConvertFrom-Json
          $names=@($refs | ForEach-Object { $_.ref -replace '^refs/heads/','' } | Sort-Object)
          $unexpected=@($names | Where-Object { $_ -notin @('p105-exp','p105-stable') })
          if ($unexpected.Count -gt 0) { throw ('Unexpected P105 branches remain: ' + ($unexpected -join ', ')) }
          if ($names.Count -ne 2) { throw ('Expected exactly p105-exp and p105-stable, got: ' + ($names -join ', ')) }
          foreach ($branch in @('p105-exp','p105-stable')) {
            $sha=(gh api "repos/$repo/git/ref/heads/$branch" | ConvertFrom-Json).object.sha
            if ($sha -ne $env:GITHUB_SHA) { throw "$branch is not synchronized to main $env:GITHUB_SHA" }
          }
          foreach ($branch in @('p103-localsub-ci-bootstrap','p103-localsub-exp','_should_not_create')) {
            $PSNativeCommandUseErrorActionPreference=$false
            gh api "repos/$repo/git/ref/heads/$branch" *> $null
            $existsExit=$LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference=$true
            if ($existsExit -eq 0) { throw "Obsolete branch still exists: $branch" }
            if ($existsExit -ne 1) { throw "Unable to verify obsolete branch absence: $branch ExitCode=$existsExit" }
          }
          Write-Host ('P105 active branches: ' + ($names -join ', '))
          exit 0