name: P101 Rebuild v4.5.2 Round 2 LF Manifest

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'p101-v452-round2-list-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round2-list-lifecycle
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Rebuild LF source manifest and validate
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          cd projects/1-桌面软件/101-Mediova/代码
          python - <<'PY'
          from pathlib import Path
          import hashlib

          code = Path('.')
          manifest = Path('SOURCE_FILES_SHA256.txt')
          rows = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) != 2:
                  raise SystemExit(f'invalid source manifest row: {line!r}')
              rel = parts[1]
              target = code / rel
              if not target.is_file():
                  raise SystemExit(f'missing source manifest target: {target}')
              rows.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {rel}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_round2_tests.exe
          test -s /tmp/Mediova_round2_tests.exe
          cd ../../../..

          rm -f .github/workflows/p101_v452_round2_lf_manifest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜以 LF 工作树同步总源码清单'
          git push origin HEAD:p101-v452-round2-list-lifecycle
