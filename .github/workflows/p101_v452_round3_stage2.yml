}

func v452BeginImportToastClose(hwnd uintptr) {
\tif hwnd == 0 || v452ImportToastAnimation.closing {
\t\treturn
\t}
\tv452ImportToastAnimation.closing = true
\tv452ImportToastAnimation.closingAt = time.Now()
\tprocKillTimer.Call(hwnd, v452ImportToastTimerClose)
\tprocSetTimer.Call(hwnd, v452ImportToastTimerAnimate, 15, 0)
}

func v452UpdateImportToastFrame(hwnd uintptr) {
\tif hwnd == 0 {
\t\treturn
\t}
\telapsed := time.Since(v452ImportToastAnimation.shownAt)
\tif v452ImportToastAnimation.closing {
\t\telapsed = time.Since(v452ImportToastAnimation.closingAt)
\t}
\tframe := v452ImportToastFrameAt(elapsed, v452ImportToastDuration, v452ImportToastAnimation.closing)
\ty := v452ImportToastAnimation.targetY + frame.OffsetY
\tv452SetLayeredAttributes.Call(hwnd, 0, uintptr(frame.Alpha), v452LWAAlpha)
\tprocSetWindowPos.Call(hwnd, HWND_TOPMOST, uintptr(v452ImportToastAnimation.targetX), uintptr(y), 432, 88, SWP_NOACTIVATE)
\tif !frame.Done {
\t\treturn
\t}
\tprocKillTimer.Call(hwnd, v452ImportToastTimerAnimate)
\tif v452ImportToastAnimation.closing {
\t\tprocDestroyWindow.Call(hwnd)
\t}
}

func v452ShowImportToast(a *application, text string) {
\tif a == nil {
\t\treturn
\t}
\tsetText(a.hStatusText, text)
\tif a.hImportToast != 0 {
\t\tprocDestroyWindow.Call(a.hImportToast)
\t}
\thInst, _, _ := procGetModuleHandleW.Call(0)
\trc := workArea()
\tconst w, h = int32(432), int32(88)
\tx := rc.Right - w - 14
\ty := rc.Bottom - h - 14
\tif a.hFloating != 0 {
\t\tif visible, _, _ := procIsWindowVisible.Call(a.hFloating); visible != 0 {
\t\t\ty -= 100
\t\t}
\t}
\tif a.hToast != 0 {
\t\tif visible, _, _ := procIsWindowVisible.Call(a.hToast); visible != 0 {
\t\t\ty -= 126
\t\t}
\t}
\tv452ImportToastAnimation.shownAt = time.Now()
\tv452ImportToastAnimation.closingAt = time.Time{}
\tv452ImportToastAnimation.targetX = x
\tv452ImportToastAnimation.targetY = y
\tv452ImportToastAnimation.closing = false
\thwnd, _, _ := procCreateWindowExW.Call(
\t\tuintptr(WS_EX_TOOLWINDOW|WS_EX_TOPMOST|WS_EX_NOACTIVATE|v452WSExLayered),
\t\tuintptr(unsafe.Pointer(v452ImportToastClassName)),
\t\tuintptr(unsafe.Pointer(p("Mediova 导入"))),
\t\tWS_POPUP|WS_BORDER|WS_CLIPCHILDREN,
\t\tuintptr(x), uintptr(y+16), uintptr(w), uintptr(h),
\t\ta.hwnd, 0, hInst, 0,
\t)
\tif hwnd == 0 {
\t\treturn
\t}
\ta.hImportToast = hwnd
\tsetText(a.hImportToastText, text)
\tv452SetLayeredAttributes.Call(hwnd, 0, 0, v452LWAAlpha)
\tprocSetWindowPos.Call(hwnd, HWND_TOPMOST, uintptr(x), uintptr(y+16), uintptr(w), uintptr(h), SWP_NOACTIVATE)
\tprocShowWindow.Call(hwnd, SW_SHOWNOACTIVATE)
\tprocSetTimer.Call(hwnd, v452ImportToastTimerAnimate, 15, 0)
\tprocSetTimer.Call(hwnd, v452ImportToastTimerClose, 5000, 0)
}

func v452HideImportToast(a *application) {
\tif a == nil || a.hImportToast == 0 {
\t\treturn
\t}
\tv452BeginImportToastClose(a.hImportToast)
}
