          write(CMD / 'v452_import_windows.go', r'''//go:build windows

package main

import (
\t"os"

\t"mediaworkbench/internal/media"
)

func (a *application) v452ImportGroups(groups []media.DroppedImportGroup, result v452ImportResult) v452ImportResult {
\tfor _, group := range groups {
\t\tvideo, image, duplicate := a.addPaths(group.Paths, group.Root, group.OutputPrefix)
\t\tresult.add(video, image, duplicate)
\t}
\treturn result
}

func (a *application) v452ImportDirectPaths(paths []string) {
\tresult := v452ImportResult{}
\tsupported := make([]string, 0, len(paths))
\tfor _, path := range paths {
\t\tst, err := os.Stat(path)
\t\tif err != nil || st.IsDir() {
\t\t\tresult.Unreadable++
\t\t\tcontinue
\t\t}
\t\tif _, ok := media.DetectKind(path); !ok {
\t\t\tresult.Unsupported++
\t\t\tcontinue
\t\t}
\t\tsupported = append(supported, path)
\t}
\tresult = a.v452ImportGroups(media.GroupDirectMediaFiles(supported), result)
\ta.v452PresentImportResult(result)
}

func (a *application) v452PresentImportResult(result v452ImportResult) {
\tmessage := result.Message()
\tif result.Added() == 0 {
\t\tsetText(a.hStatusText, message)
\t}
\ta.showImportToast(message)
}
''')

          write(CMD / 'v452_import_toast_logic.go', r'''package main

import "time"

type v452ImportToastFrame struct {
\tAlpha   byte
\tOffsetY int32
\tDone    bool
}

func v452ImportToastFrameAt(elapsed, duration time.Duration, closing bool) v452ImportToastFrame {
\tif duration <= 0 {
\t\tduration = time.Millisecond
\t}
\tprogress := float64(elapsed) / float64(duration)
\tif progress < 0 {
\t\tprogress = 0
\t}
\tif progress > 1 {
\t\tprogress = 1
\t}
\tif closing {
\t\treturn v452ImportToastFrame{
\t\t\tAlpha:   byte(255 * (1 - progress)),
\t\t\tOffsetY: -int32(8 * progress),
\t\t\tDone:    progress >= 1,
\t\t}
\t}
\treturn v452ImportToastFrame{
\t\tAlpha:   byte(255 * progress),
\t\tOffsetY: int32(16 * (1 - progress)),
\t\tDone:    progress >= 1,
\t}
}
''')

          write(CMD / 'v452_import_toast_logic_test.go', r'''package main

import (
\t"testing"
\t"time"
)

func TestV452ImportToastFramesFadeAndRise(t *testing.T) {
\tduration := 200 * time.Millisecond
\tstart := v452ImportToastFrameAt(0, duration, false)
\tmiddle := v452ImportToastFrameAt(duration/2, duration, false)
\tend := v452ImportToastFrameAt(duration, duration, false)
\tif start.Alpha != 0 || start.OffsetY != 16 || start.Done {
\t\tt.Fatalf("opening start=%+v", start)
\t}
\tif middle.Alpha <= start.Alpha || middle.Alpha >= end.Alpha || middle.OffsetY >= start.OffsetY {
\t\tt.Fatalf("opening middle=%+v", middle)
\t}
\tif end.Alpha != 255 || end.OffsetY != 0 || !end.Done {
\t\tt.Fatalf("opening end=%+v", end)
\t}
\tclosing := v452ImportToastFrameAt(duration, duration, true)
\tif closing.Alpha != 0 || closing.OffsetY != -8 || !closing.Done {
\t\tt.Fatalf("closing end=%+v", closing)
\t}
}
''')

          write(CMD / 'v452_import_toast_windows.go', r'''//go:build windows

package main

import (
\t"syscall"
\t"time"
\t"unsafe"
)

const (
\tv452ImportToastTimerAnimate uintptr = 0x4521
\tv452ImportToastTimerClose   uintptr = 0x4522
\tv452ImportToastDuration             = 180 * time.Millisecond
\tv452WSExLayered              uint32  = 0x00080000
\tv452LWAAlpha                 uintptr = 0x00000002
)

var (
\tv452ImportToastClassName = p("MediovaImportToast452")
\tv452ImportToastCallback  = syscall.NewCallback(v452ImportToastWndProc)
\tv452SetLayeredAttributes = user32.NewProc("SetLayeredWindowAttributes")
\tv452ImportToastAnimation struct {
\t\tshownAt, closingAt time.Time
\t\ttargetX, targetY   int32
\t\tclosing            bool
\t}
)

func v452ImportToastClass(hInst, hIcon, cursor uintptr) wndClassEx {
\treturn wndClassEx{
\t\tCbSize:        uint32(unsafe.Sizeof(wndClassEx{})),
\t\tLpfnWndProc:   v452ImportToastCallback,
\t\tHInstance:     hInst,
\t\tHIcon:         hIcon,
\t\tHIconSm:       hIcon,
\t\tHCursor:       cursor,
\t\tHbrBackground: COLOR_WINDOW + 1,
\t\tLpszClassName: v452ImportToastClassName,
\t}
}

//go:nocheckptr
func v452ImportToastWndProc(hwnd uintptr, message uint32, wParam, lParam uintptr) uintptr {
\tswitch message {
\tcase WM_CREATE:
\t\tif app != nil {
\t\t\tapp.hImportToast = hwnd
\t\t\tapp.hImportToastText = createControl("STATIC", "", WS_CHILD|WS_VISIBLE|SS_LEFT, 16, 13, 370, 58, hwnd, 0)
\t\t\tapp.hImportToastClose = createControl("BUTTON", "×", WS_CHILD|WS_VISIBLE, 397, 8, 25, 25, hwnd, IDC_IMPORT_CLOSE)
\t\t\tsend(app.hImportToastText, WM_SETFONT, uiFont, 1)
\t\t\tsend(app.hImportToastClose, WM_SETFONT, uiFont, 1)
\t\t}
\t\treturn 0
\tcase WM_COMMAND:
\t\tif int(loWord(wParam)) == IDC_IMPORT_CLOSE {
\t\t\tv452BeginImportToastClose(hwnd)
\t\t\treturn 0
\t\t}
\tcase WM_TIMER:
\t\tswitch wParam {
\t\tcase v452ImportToastTimerAnimate:
\t\t\tv452UpdateImportToastFrame(hwnd)
\t\t\treturn 0
\t\tcase v452ImportToastTimerClose:
\t\t\tv452BeginImportToastClose(hwnd)
\t\t\treturn 0
\t\t}
\tcase WM_CLOSE:
\t\tv452BeginImportToastClose(hwnd)
\t\treturn 0
\tcase WM_NCHITTEST:
\t\treturn HTCAPTION
\tcase WM_DESTROY:
\t\tprocKillTimer.Call(hwnd, v452ImportToastTimerAnimate)
\t\tprocKillTimer.Call(hwnd, v452ImportToastTimerClose)
\t\tif app != nil && app.hImportToast == hwnd {
\t\t\tapp.hImportToast = 0
\t\t\tapp.hImportToastText = 0
\t\t\tapp.hImportToastClose = 0
\t\t}
\t\treturn 0
\t}
\tr, _, _ := procDefWindowProcW.Call(hwnd, uintptr(message), wParam, lParam)
