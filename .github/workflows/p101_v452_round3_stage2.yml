          def refresh_manifest(path: Path):
              rows = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  parts = line.split(maxsplit=1)
                  if len(parts) != 2:
                      raise SystemExit(f'invalid manifest row in {path}: {line!r}')
