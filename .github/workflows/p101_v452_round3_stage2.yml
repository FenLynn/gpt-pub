type v452ImportResult struct {
\tVideoAdded int
\tImageAdded int
\tDuplicates int
\tUnsupported int
\tUnreadable int
\tScanErrors int
}

func (r *v452ImportResult) add(video, image, duplicate int) {
\tif r == nil {
\t\treturn
\t}
\tr.VideoAdded += video
\tr.ImageAdded += image
\tr.Duplicates += duplicate
}

func (r v452ImportResult) Added() int { return r.VideoAdded + r.ImageAdded }

func (r v452ImportResult) Message() string {
\tparts := []string{fmt.Sprintf("导入完成：视频 %d 个，图片 %d 个", r.VideoAdded, r.ImageAdded)}
\tif r.Duplicates > 0 {
\t\tparts = append(parts, fmt.Sprintf("重复 %d 个", r.Duplicates))
\t}
\tif r.Unsupported > 0 {
\t\tparts = append(parts, fmt.Sprintf("不支持 %d 个", r.Unsupported))
\t}
\tif r.Unreadable > 0 {
\t\tparts = append(parts, fmt.Sprintf("无法读取 %d 项", r.Unreadable))
\t}
\tif r.ScanErrors > 0 {
\t\tparts = append(parts, fmt.Sprintf("文件夹扫描失败 %d 个", r.ScanErrors))
\t}
\treturn strings.Join(parts, "，")
}
''')

