name: P101 Apply v4.5.2 Round 3 Stage 2

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p101-v452-round3-import-output-toast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round3-import-output-toast
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply stage 2, validate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('projects/1-桌面软件/101-Mediova/代码')
          CMD = ROOT / 'cmd/mediaworkbench'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          model = ROOT / 'internal/model/model.go'
