          write(ROOT / 'internal/media/output_prefix.go', r'''package media

import (
\t"path/filepath"
\t"strings"
\t"unicode"
)

// NormalizeOutputPrefix converts a generated or restored volume label into one
// safe output-directory component. It deliberately rejects path semantics so a
// session file can never escape the configured output root.
func NormalizeOutputPrefix(value string) string {
\tvalue = strings.TrimSpace(value)
\tif value == "" {
\t\treturn ""
\t}
\tvar b strings.Builder
\tlastSeparator := false
\tfor _, r := range value {
\t\tallowed := unicode.IsLetter(r) || unicode.IsNumber(r) || r == ' ' || r == '-' || r == '_' || r == '(' || r == ')' || r == '.'
\t\tif allowed {
\t\t\tb.WriteRune(r)
\t\t\tlastSeparator = false
\t\t\tcontinue
\t\t}
\t\tif !lastSeparator {
\t\t\tb.WriteByte('_')
\t\t\tlastSeparator = true
\t\t}
\t}
\tresult := strings.Trim(b.String(), " ._-")
\tfor strings.Contains(result, "..") {
\t\tresult = strings.ReplaceAll(result, "..", ".")
\t}
\trunes := []rune(result)
\tif len(runes) > 64 {
\t\tresult = string(runes[:64])
\t}
\treturn strings.Trim(result, " ._-")
}

// OutputRootWithPrefix returns the frozen root used by one task. Empty or
// invalid prefixes retain the caller's configured output root.
func OutputRootWithPrefix(outputRoot, prefix string) string {
\toutputRoot = strings.TrimSpace(outputRoot)
\tclean := NormalizeOutputPrefix(prefix)
\tif clean == "" {
\t\treturn outputRoot
\t}
\treturn filepath.Join(outputRoot, clean)
}
''')

          write(ROOT / 'internal/media/output_prefix_test.go', r'''package media

import (
\t"path/filepath"
\t"testing"
)

func TestNormalizeOutputPrefixRejectsPathSemantics(t *testing.T) {
\tfor input, want := range map[string]string{
\t\t"C盘":                    "C盘",
\t\t"server_share":           "server_share",
\t\t`..\\outside/child`:     "outside_child",
\t\t`  D:盘  `:               "D_盘",
\t\t"":                       "",
\t} {
\t\tif got := NormalizeOutputPrefix(input); got != want {
\t\t\tt.Fatalf("NormalizeOutputPrefix(%q)=%q want=%q", input, got, want)
\t\t}
\t}
}

func TestOutputRootWithPrefixStaysUnderRoot(t *testing.T) {
\troot := filepath.Join(t.TempDir(), "output")
\tgot := OutputRootWithPrefix(root, `..\\outside`)
\twant := filepath.Join(root, "outside")
\tif got != want {
\t\tt.Fatalf("root=%q want=%q", got, want)
\t}
\tif got := OutputRootWithPrefix(root, ""); got != root {
\t\tt.Fatalf("empty prefix changed root: %q", got)
\t}
}
''')

