name: Publish P101 Mediova v4.2.0 light package once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-light-release-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'repo-p101-v420-light-release-trigger2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view p101-v4.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view p101-v4.2.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = 'false'
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/p101-v4.2.0")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          while [[ "$object_type" == 'tag' ]]; do
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = 'commit'
          test "$object_sha" = 'c8ea2b904a59aa9416763c3397088fd803d24e15'

      - name: Build lightweight package without FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download p101-v4.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Mediova-v4.2.0-Runtime.zip' \
            --dir source
          mkdir -p full light
          unzip -q source/Mediova-v4.2.0-Runtime.zip -d full
          test "$(sha256sum full/Mediova.exe | awk '{print $1}')" = '1261c158d35d5fd3ae97ebfd36a25e72094d2f5d65f8cc091a331c1955d2a72f'
          cp full/Mediova.exe light/Mediova.exe
          cat > light/README.txt <<'EOF'
          Mediova v4.2.0 轻量包（不含 FFmpeg）

          直接运行 Mediova.exe。

          本包不包含 ffmpeg.exe 和 ffprobe.exe。使用媒体转换功能前，请任选一种方式提供 FFmpeg：
          1. 若原 Mediova 目录已有 Components\FFmpeg\bin，请保留该目录，仅覆盖本轻量包中的文件；
          2. 在软件中选择已有的 FFmpeg/FFprobe 路径；
          3. 自行将 ffmpeg.exe 与 ffprobe.exe 放入 Components\FFmpeg\bin。

          配置、历史和缓存仍保存在 AppData（便携模式除外）。轻量更新不得覆盖或删除用户 Data。
          EOF
          cat > light/THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-party notices

          This lightweight Mediova package does not bundle FFmpeg or FFprobe.
          Mediova can use user-provided FFmpeg/FFprobe components or an existing `Components\FFmpeg\bin` directory.

          - Project: FFmpeg
          - Homepage: https://ffmpeg.org/
          - Source and license information: https://ffmpeg.org/legal.html

          The Runtime/Data boundary remains unchanged:

          - Runtime: Mediova.exe, optional Components, notices and manifest.
          - Roaming Data: configuration, history, session and backups.
          - Local Data: cache, temporary files, thumbnails, logs, state and crash reports.

          Runtime updates must never contain user Data.
          EOF
          python - <<'PY'
          import hashlib, json, os
          root = 'light'
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          files = []
          for name in ('Mediova.exe', 'README.txt', 'THIRD_PARTY_NOTICES.md'):
              path = os.path.join(root, name)
              files.append({'path': name, 'size': os.path.getsize(path), 'sha256': digest(path)})
          manifest = {
              'product': 'Mediova',
              'version': '4.2.0',
              'platform': 'Windows x64',
              'deployment': 'folder-runtime',
              'files': files,
              'external_components': [{
                  'name': 'FFmpeg/FFprobe',
                  'required_for': 'media conversion',
                  'bundled': False,
                  'expected_default_path': 'Components\\FFmpeg\\bin'
              }]
          }
          with open(os.path.join(root, 'runtime-manifest.json'), 'w', encoding='utf-8', newline='\n') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY
          (
            cd light
            zip -X -9 ../Mediova-v4.2.0-Light.zip Mediova.exe README.txt runtime-manifest.json THIRD_PARTY_NOTICES.md
          )
          test "$(unzip -Z1 Mediova-v4.2.0-Light.zip | grep -Eic '(^|/)(ffmpeg|ffprobe)(\.exe)?$' || true)" = '0'
          test "$(stat -c %s Mediova-v4.2.0-Light.zip)" -lt 10000000
          {
            sha256sum Mediova-v4.2.0-Light.zip
            sha256sum light/Mediova.exe | sed 's#  light/#  #'
          } > Mediova-v4.2.0-Light-SHA256.txt
          cat Mediova-v4.2.0-Light-SHA256.txt
          unzip -l Mediova-v4.2.0-Light.zip

      - name: Upload light package to formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload p101-v4.2.0 \
            Mediova-v4.2.0-Light.zip \
            Mediova-v4.2.0-Light-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view p101-v4.2.0 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "Mediova-v4.2.0-Light.zip" or .name == "Mediova-v4.2.0-Light-SHA256.txt") | [.name, .size, .url] | @tsv'
