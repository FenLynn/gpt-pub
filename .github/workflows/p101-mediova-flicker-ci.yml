name: P101 Mediova Flicker Gate

on:
  pull_request:
    branches: [p101-stable, main]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-flicker-ci.yml'

permissions:
  contents: read

concurrency:
  group: p101-mediova-flicker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-idle-frame-stability:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build probe
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          New-Item build/flicker-evidence -ItemType Directory -Force | Out-Null
          go test -count=1 ./cmd/mediaworkbench
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed.' }
          go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o build/flicker-evidence/Mediova.exe ./cmd/mediaworkbench
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/flicker-evidence/Mediova.exe)) { throw 'Probe build failed.' }
          python -m pip install --disable-pip-version-check --no-input pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed.' }

      - name: Verify idle frame and native chrome stability
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          python scripts/round11_flicker_gate_runner.py `
            --exe build/flicker-evidence/Mediova.exe `
            --evidence build/flicker-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Round-11 flicker gate failed.' }

      - name: Upload flicker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-Round11-Flicker-Evidence
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/flicker-evidence/*.png
            projects/1-桌面软件/101-Mediova/代码/build/flicker-evidence/flicker-report.json
          if-no-files-found: error
          retention-days: 14
