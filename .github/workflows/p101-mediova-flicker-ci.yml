name: P101 Mediova Flicker Gate

on:
  pull_request:
    branches: [p101-stable, main]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-flicker-ci.yml'

permissions:
  contents: read

concurrency:
  group: p101-mediova-flicker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-idle-frame-stability:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build flicker probe
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          New-Item build/flicker-evidence -ItemType Directory -Force | Out-Null
          go test -count=1 ./cmd/mediaworkbench
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed.' }
          go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o build/flicker-evidence/Mediova.exe ./cmd/mediaworkbench
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/flicker-evidence/Mediova.exe)) { throw 'Probe build failed.' }

      - name: Verify critical regions are pixel stable
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class MediovaFlickerNative {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int count);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool MoveWindow(IntPtr hwnd, int x, int y, int width, int height, bool repaint);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);

              public static IntPtr FindWindow(uint processId, string titlePrefix) {
                  IntPtr result = IntPtr.Zero;
                  EnumWindows((hwnd, state) => {
                      uint candidate;
                      GetWindowThreadProcessId(hwnd, out candidate);
                      if (candidate != processId || !IsWindowVisible(hwnd)) return true;
                      var text = new StringBuilder(1024);
                      GetWindowText(hwnd, text, text.Capacity);
                      if (text.ToString().StartsWith(titlePrefix, StringComparison.Ordinal)) {
                          result = hwnd;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }
          }
          "@

          $evidence=Join-Path $PWD 'build/flicker-evidence'
          $exe=Join-Path $evidence 'Mediova.exe'
          $reportPath=Join-Path $evidence 'flicker-report.json'
          '[]' | Set-Content $reportPath -Encoding UTF8
          $records=@()
          $failures=New-Object System.Collections.Generic.List[string]

          function Wait-Window([System.Diagnostics.Process]$Process, [string]$Prefix, [int]$TimeoutMs) {
            $deadline=[DateTime]::UtcNow.AddMilliseconds($TimeoutMs)
            while ([DateTime]::UtcNow -lt $deadline) {
              $Process.Refresh()
              if ($Process.HasExited) { throw "Mediova exited while waiting for '$Prefix'." }
              $handle=[MediovaFlickerNative]::FindWindow([uint32]$Process.Id, $Prefix)
              if ($handle -ne [IntPtr]::Zero) { return $handle }
              Start-Sleep -Milliseconds 50
            }
            throw "Window '$Prefix' was not created."
          }

          function Capture-WindowBitmap([IntPtr]$Handle) {
            $rect=New-Object MediovaFlickerNative+RECT
            if (-not [MediovaFlickerNative]::GetWindowRect($Handle, [ref]$rect)) { throw 'GetWindowRect failed.' }
            $width=$rect.Right-$rect.Left
            $height=$rect.Bottom-$rect.Top
            if ($width -lt 100 -or $height -lt 100) { throw "Invalid capture geometry ${width}x${height}." }
            $bitmap=New-Object System.Drawing.Bitmap($width, $height)
            $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $hdc=$graphics.GetHdc()
              try {
                if (-not [MediovaFlickerNative]::PrintWindow($Handle, $hdc, 2)) { throw 'PrintWindow failed.' }
              } finally { $graphics.ReleaseHdc($hdc) }
            } finally { $graphics.Dispose() }
            return $bitmap
          }

          function Get-BitmapHash([System.Drawing.Bitmap]$Bitmap) {
            $stream=New-Object System.IO.MemoryStream
            try {
              $Bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Bmp)
              $sha=[System.Security.Cryptography.SHA256]::Create()
              try {
                return ([BitConverter]::ToString($sha.ComputeHash($stream.ToArray()))).Replace('-', '').ToLowerInvariant()
              } finally { $sha.Dispose() }
            } finally { $stream.Dispose() }
          }

          function Assert-RegionsStable([IntPtr]$Handle, [string]$Name, [int]$Width, [int]$Height, [int]$SettleMs, [array]$Regions) {
            if (-not [MediovaFlickerNative]::MoveWindow($Handle, 0, 0, $Width, $Height, $true)) { throw "MoveWindow failed for $Name." }
            [void][MediovaFlickerNative]::SetCursorPos([int]($Width/2), [int]($Height/2))
            Start-Sleep -Milliseconds $SettleMs

            $regionHashes=@{}
            $regionSeen=@{}
            foreach ($region in $Regions) {
              $regionHashes[$region.name]=New-Object System.Collections.Generic.List[string]
              $regionSeen[$region.name]=@{}
            }

            for ($index=0; $index -lt 40; $index++) {
              $bitmap=Capture-WindowBitmap $Handle
              try {
                foreach ($region in $Regions) {
                  $x=[Math]::Max(0, [int][Math]::Floor($bitmap.Width * [double]$region.x))
                  $y=[Math]::Max(0, [int][Math]::Floor($bitmap.Height * [double]$region.y))
                  $w=[Math]::Min($bitmap.Width-$x, [Math]::Max(1, [int][Math]::Floor($bitmap.Width * [double]$region.w)))
                  $h=[Math]::Min($bitmap.Height-$y, [Math]::Max(1, [int][Math]::Floor($bitmap.Height * [double]$region.h)))
                  $crop=$bitmap.Clone((New-Object System.Drawing.Rectangle($x,$y,$w,$h)), $bitmap.PixelFormat)
                  try {
                    $hash=Get-BitmapHash $crop
                    $regionHashes[$region.name].Add($hash)
                    if (-not $regionSeen[$region.name].ContainsKey($hash)) {
                      $uniqueIndex=$regionSeen[$region.name].Count+1
                      $regionSeen[$region.name][$hash]=$index
                      $crop.Save((Join-Path $evidence "$Name-$($region.name)-unique-$uniqueIndex-frame-$index.png"), [System.Drawing.Imaging.ImageFormat]::Png)
                    }
                  } finally { $crop.Dispose() }
                }
              } finally { $bitmap.Dispose() }
              Start-Sleep -Milliseconds 50
            }

            foreach ($region in $Regions) {
              $hashes=$regionHashes[$region.name]
              $unique=@($hashes | Select-Object -Unique)
              $script:records += [ordered]@{
                window=$Name
                region=$region.name
                frames=40
                unique_hashes=$unique.Count
                first_hash=$hashes[0]
                last_hash=$hashes[39]
                representative_frames=$regionSeen[$region.name]
              }
              if ($unique.Count -ne 1) {
                $script:failures.Add("$Name/$($region.name): $($unique.Count) distinct hashes")
              }
            }
            $script:records | ConvertTo-Json -Depth 8 | Set-Content $reportPath -Encoding UTF8
          }

          $mainRegions=@(
            @{ name='list-and-bars'; x=0.00; y=0.13; w=0.84; h=0.70 },
            @{ name='output-path'; x=0.00; y=0.84; w=0.74; h=0.06 }
          )
          $editorRegions=@(
            @{ name='file-title'; x=0.58; y=0.00; w=0.41; h=0.08 },
            @{ name='timeline'; x=0.00; y=0.54; w=0.62; h=0.27 },
            @{ name='preview'; x=0.00; y=0.04; w=0.62; h=0.50 }
          )

          $oldAppData=$env:APPDATA
          $oldLocal=$env:LOCALAPPDATA
          $root=Join-Path $env:RUNNER_TEMP ('Mediova-Flicker-' + [guid]::NewGuid().ToString('N'))
          New-Item $root -ItemType Directory -Force | Out-Null
          try {
            $env:APPDATA=$root
            $env:LOCALAPPDATA=$root

            $main=Start-Process -FilePath $exe -WorkingDirectory $evidence -ArgumentList '--ui-preview=video' -PassThru
            try {
              $mainHandle=Wait-Window $main 'Mediova' 15000
              Assert-RegionsStable $mainHandle 'main-idle' 1450 820 2200 $mainRegions
            } finally {
              if (-not $main.HasExited) { Stop-Process -Id $main.Id -Force -ErrorAction SilentlyContinue }
            }

            $editor=Start-Process -FilePath $exe -WorkingDirectory $evidence -ArgumentList '--round11-editor-preview' -PassThru
            try {
              $editorHandle=Wait-Window $editor '剪裁 · Round11-Flicker-Probe.mp4' 20000
              Assert-RegionsStable $editorHandle 'editor-idle' 1080 760 3200 $editorRegions
            } finally {
              if (-not $editor.HasExited) { Stop-Process -Id $editor.Id -Force -ErrorAction SilentlyContinue }
            }
          } finally {
            $env:APPDATA=$oldAppData
            $env:LOCALAPPDATA=$oldLocal
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            $records | ConvertTo-Json -Depth 8 | Set-Content $reportPath -Encoding UTF8
          }

          if ($failures.Count -gt 0) {
            throw ('Idle pixel stability failed: ' + ($failures -join '; '))
          }

      - name: Upload flicker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-Round11-Flicker-Evidence
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/flicker-evidence/*-unique-*.png
            projects/1-桌面软件/101-Mediova/代码/build/flicker-evidence/flicker-report.json
          if-no-files-found: error
          retention-days: 14
