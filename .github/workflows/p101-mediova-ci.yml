name: P101 Mediova CI

on:
  pull_request:
    branches: [main, p101-stable, p101-exp]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-ci.yml'
      - '目录.md'
      - 'projects/1-桌面软件/README.md'
  push:
    branches: [p101-exp, p101-stable]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-ci.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Validate source and cross-build
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./internal/config ./internal/media
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

  windows-native:
    if: github.base_ref == 'p101-stable' || github.base_ref == 'main' || github.ref == 'refs/heads/p101-stable'
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'projects/1-桌面软件/101-Mediova/代码'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows go test failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows go vet failed' }
          ./build_v4.0.0.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Mediova build failed' }
          $exe=Resolve-Path 'build/Mediova_v4.0.0.exe'
          $info=(Get-Item $exe).VersionInfo
          if (($info.FileVersion -notlike '4.0.0*') -or ($info.ProductVersion -notlike '4.0.0*') -or ($info.ProductName -notlike '*Mediova*')) { throw 'Version resource mismatch' }
      - name: Provide real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          $tools=Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg=Get-ChildItem $tools -Recurse -Filter ffmpeg.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          $ffprobe=Get-ChildItem $tools -Recurse -Filter ffprobe.exe -File | Where-Object {$_.Length -gt 1MB} | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real FFmpeg not found' }
          $build='projects/1-桌面软件/101-Mediova/代码/build'
          Copy-Item $ffmpeg.FullName (Join-Path $build 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $build 'ffprobe.exe') -Force
      - name: Run native self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $PWD 'projects/1-桌面软件/101-Mediova/代码/build'
          $exe=Join-Path $build 'Mediova_v4.0.0.exe'
          $report=Join-Path $build 'ci_self_test.json'
          $proc=Start-Process -FilePath $exe -ArgumentList @('--self-test', "--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(420000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Native self-test timeout' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.0.0' -or $checks.Count -lt 57) { throw 'Native self-test failed' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'Native self-test contains failed checks' }
      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-CI
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova_v4.0.0.exe
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/ci_self_test.json
          if-no-files-found: error
          retention-days: 14
