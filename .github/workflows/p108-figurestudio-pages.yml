name: P108 FigureStudio CI

on:
  push:
    branches:
      - p108-exp
    paths:
      - "projects/1-桌面软件/108-FigureStudio/**"
      - ".github/workflows/p108-figurestudio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p108-figurestudio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: P108 scope gate
        shell: bash
        run: |
          git fetch origin main
          while IFS= read -r file; do
            case "$file" in
              projects/1-桌面软件/108-FigureStudio/*|.github/workflows/p108-figurestudio-pages.yml)
                ;;
              *)
                echo "::error file=$file::P108 branch contains an out-of-scope change"
                exit 1
                ;;
            esac
          done < <(git -c core.quotepath=false diff --name-only origin/main...HEAD)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        shell: bash
        env:
          APP_DIR: projects/1-桌面软件/108-FigureStudio/web
        run: |
          npm --prefix "$APP_DIR" install --no-audit --no-fund
          npm --prefix "$APP_DIR" run build
          npm --prefix "$APP_DIR" run test:gallery

      - name: Check Nature gallery in headless Chromium
        shell: bash
        env:
          APP_DIR: projects/1-桌面软件/108-FigureStudio/web
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Chromium not available for P108 browser smoke"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/p108-site/gpt-pub/p108" "$RUNNER_TEMP/p108-screenshots"
          cp -a "$APP_DIR/dist/." "$RUNNER_TEMP/p108-site/gpt-pub/p108/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/p108-site" > "$RUNNER_TEMP/p108-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" > /dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" > /dev/null
          for number in 1 5 7 8 14; do
            printf -v label 'N%02d' "$number"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=8000 \
              --screenshot="$RUNNER_TEMP/p108-screenshots/$label.png" \
              --dump-dom "http://127.0.0.1:4173/gpt-pub/p108/?gallery=1&sample=$number" \
              > "$RUNNER_TEMP/p108-screenshots/$label.html" 2>"$RUNNER_TEMP/p108-screenshots/$label.stderr"
            test -s "$RUNNER_TEMP/p108-screenshots/$label.png"
            if ! grep -q "aria-label=\"$label" "$RUNNER_TEMP/p108-screenshots/$label.html"; then
              echo "::error::$label precision SVG did not render in browser"
              tail -n 25 "$RUNNER_TEMP/p108-screenshots/$label.stderr"
              exit 1
            fi
            echo "Browser preview $label OK"
          done

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: p108-nature-visual-qa
          path: ${{ runner.temp }}/p108-screenshots/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Keep validated P108 preview build
        uses: actions/upload-artifact@v4
        with:
          name: p108-preview-build
          path: projects/1-桌面软件/108-FigureStudio/web/dist
          retention-days: 7
          if-no-files-found: error
