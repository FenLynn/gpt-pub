name: P108 FigureStudio CI

on:
  push:
    branches:
      - p108-exp
    paths:
      - "projects/1-桌面软件/108-FigureStudio/**"
      - ".github/workflows/p108-figurestudio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p108-figurestudio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: P108 scope gate
        shell: bash
        run: |
          git fetch origin main
          while IFS= read -r file; do
            case "$file" in
              projects/1-桌面软件/108-FigureStudio/*|.github/workflows/p108-figurestudio-pages.yml)
                ;;
              *)
                echo "::error file=$file::P108 branch contains an out-of-scope change"
                exit 1
                ;;
            esac
          done < <(git -c core.quotepath=false diff --name-only origin/main...HEAD)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        shell: bash
        env:
          APP_DIR: projects/1-桌面软件/108-FigureStudio/web
        run: |
          npm --prefix "$APP_DIR" install --no-audit --no-fund
          npm --prefix "$APP_DIR" run build
          npm --prefix "$APP_DIR" run test:gallery

      - name: Install CJK fonts for visual QA
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\\n' 'Noto Sans CJK SC'

      - name: Check Nature gallery in headless Chromium
        shell: bash
        env:
          APP_DIR: projects/1-桌面软件/108-FigureStudio/web
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::Chromium not available for P108 browser smoke"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/p108-site/gpt-pub/p108" "$RUNNER_TEMP/p108-screenshots"
          cp -a "$APP_DIR/dist/." "$RUNNER_TEMP/p108-site/gpt-pub/p108/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/p108-site" > "$RUNNER_TEMP/p108-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" > /dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" > /dev/null
          for number in 1 5 7 8 14; do
            printf -v label 'N%02d' "$number"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=8000 \
              --screenshot="$RUNNER_TEMP/p108-screenshots/$label.png" \
              --dump-dom "http://127.0.0.1:4173/gpt-pub/p108/?gallery=1&sample=$number" \
              > "$RUNNER_TEMP/p108-screenshots/$label.html" 2>"$RUNNER_TEMP/p108-screenshots/$label.stderr"
            test -s "$RUNNER_TEMP/p108-screenshots/$label.png"
            if ! grep -q "aria-label=\"$label" "$RUNNER_TEMP/p108-screenshots/$label.html"; then
              echo "::error::$label precision SVG did not render in browser"
              tail -n 25 "$RUNNER_TEMP/p108-screenshots/$label.stderr"
              exit 1
            fi
            if [[ "$number" == "1" ]]; then
              grep -q 'data-math-rendered="true"' "$RUNNER_TEMP/p108-screenshots/$label.html"
              if grep -q 'data-math-pending="true"' "$RUNNER_TEMP/p108-screenshots/$label.html"; then
                echo "::error::N01 still contains pending LaTeX instead of MathJax SVG"
                exit 1
              fi
              echo "Browser preview N01 MathJax SVG OK"
            fi
            echo "Browser preview $label OK"
          done

      - name: Check Lorentz in the actual FigureStudio Graph editor
        shell: bash
        run: |
          set -euo pipefail
          # The Nature smoke step kills its server on exit; start a new one here.
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/p108-site" > "$RUNNER_TEMP/p108-lorentz-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent "http://127.0.0.1:4173/gpt-pub/p108/index.html" >/dev/null
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1600,1050 --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.png" \
            --dump-dom "http://127.0.0.1:4173/gpt-pub/p108/?golden=lorentz" \
            > "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html" 2>"$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.stderr"
          test -s "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.png"
          echo "Lorentz DOM bytes: $(wc -c < "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html")"
          for pattern in 'Lorentz oscillator editable' 'data-series-id="lorentz-real"' 'data-testid="lorentz-inspector"'; do
            if ! grep -q "$pattern" "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"; then
              echo "::error::Lorentz browser DOM missing: $pattern"
              grep -oE '(<title>[^<]+|aria-label="[^"]+"|data-testid="[^"]+"|data-series-id="[^"]+")' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html" | head -n 25 || true
              tail -n 30 "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.stderr" || true
              exit 1
            fi
          done
          grep -q 'aria-label="FigureStudio Lorentz oscillator editable two-panel scientific figure"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          grep -q 'data-series-id="lorentz-real"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          grep -q 'data-series-id="lorentz-phase"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          grep -q 'data-testid="lorentz-inspector"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          grep -q '双面板 · 线图' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          grep -q 'Nature 双栏 · 183 mm' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"
          test "$(grep -o 'data-math-rendered="true"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html" | wc -l)" -ge 8
          if grep -q 'data-math-pending="true"' "$RUNNER_TEMP/p108-screenshots/Lorentz-Golden.html"; then
            echo "::error::Lorentz Golden still contains pending LaTeX instead of MathJax SVG"
            exit 1
          fi
          echo "Lorentz Golden: real two-panel Graph editor + MathJax SVG labels/annotations OK"

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p108-nature-visual-qa
          path: |
            ${{ runner.temp }}/p108-screenshots/*.png
            ${{ runner.temp }}/p108-screenshots/*.html
            ${{ runner.temp }}/p108-screenshots/*.stderr
          retention-days: 7
          if-no-files-found: warn

      - name: Keep validated P108 preview build
        uses: actions/upload-artifact@v4
        with:
          name: p108-preview-build
          path: projects/1-桌面软件/108-FigureStudio/web/dist
          retention-days: 7
          if-no-files-found: error
