name: P101 Fix DiskPart Script Syntax

on:
  push:
    branches: [p101-v451-verification]
    paths:
      - '.github/workflows/p101-v451-fix-diskpart-syntax.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v451-verification
          fetch-depth: 0
      - name: Replace indented PowerShell here-strings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p101-mediova-v451-verification.yml')
          source = path.read_text(encoding='utf-8')
          old_create = '''          @"
          create vdisk file="$vhd" maximum=64 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=MEDIOVAFULL
          assign letter=$letter
          "@ | Set-Content $diskpart -Encoding Ascii
          '''
          new_create = '''          @(
            "create vdisk file=`"$vhd`" maximum=64 type=fixed",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick label=MEDIOVAFULL",
            "assign letter=$letter"
          ) | Set-Content $diskpart -Encoding Ascii
          '''
          old_detach = '''            @"
            select vdisk file="$vhd"
            detach vdisk
            "@ | Set-Content $diskpart -Encoding Ascii
            '''
          new_detach = '''            @(
              "select vdisk file=`"$vhd`"",
              "detach vdisk"
            ) | Set-Content $diskpart -Encoding Ascii
            '''
          if source.count(old_create) != 1:
              raise SystemExit(f'expected one create DiskPart here-string, found {source.count(old_create)}')
          if source.count(old_detach) != 1:
              raise SystemExit(f'expected one detach DiskPart here-string, found {source.count(old_detach)}')
          source = source.replace(old_create, new_create).replace(old_detach, new_detach)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/p101-v451-fix-diskpart-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p101-mediova-v451-verification.yml \
                  .github/workflows/p101-v451-fix-diskpart-syntax.yml
          git diff --cached --check
          git commit -m 'Mediova｜修复真实磁盘满 DiskPart 脚本语法'
          git push origin HEAD:p101-v451-verification
