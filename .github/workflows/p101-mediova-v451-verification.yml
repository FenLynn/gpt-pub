name: P101 Mediova v4.5.1 Verification

on:
  push:
    branches: [p101-v451-verification]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-v451-verification.yml'
  pull_request:
    branches: [p101-stable]
    paths:
      - 'projects/1-桌面软件/101-Mediova/**'
      - '.github/workflows/p101-mediova-v451-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p101-v451-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-verification:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Record candidate identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "Candidate commit=$(git rev-parse HEAD)"
          Write-Host "Candidate tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Validate source and Windows race behavior
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('Mediova-Source-' + [guid]::NewGuid().ToString('N'))
          New-Item $root -ItemType Directory -Force | Out-Null
          $oldAppData=$env:APPDATA
          $oldLocalAppData=$env:LOCALAPPDATA
          $oldXdg=$env:XDG_CONFIG_HOME
          $oldRuntime=$env:MEDIOVA_RUNTIME_DIR
          try {
            $env:APPDATA=Join-Path $root 'Roaming'
            $env:LOCALAPPDATA=Join-Path $root 'Local'
            $env:XDG_CONFIG_HOME=Join-Path $root 'Xdg'
            $env:MEDIOVA_RUNTIME_DIR=Join-Path $root 'Runtime'
            go test -count=1 ./...
            if ($LASTEXITCODE -ne 0) { throw 'Windows go test failed' }
            go test -race -count=1 ./...
            if ($LASTEXITCODE -ne 0) { throw 'Windows race test failed' }
            go vet -unsafeptr=false ./...
            if ($LASTEXITCODE -ne 0) { throw 'Windows go vet failed' }
          } finally {
            $env:APPDATA=$oldAppData
            $env:LOCALAPPDATA=$oldLocalAppData
            $env:XDG_CONFIG_HOME=$oldXdg
            $env:MEDIOVA_RUNTIME_DIR=$oldRuntime
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build native persistence fault probe
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'MediovaNativeFaultCheck.exe'
          go build -buildvcs=false -trimpath -o $out ./cmd/nativefaultcheck
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $out)) { throw 'Native fault probe build failed' }
          "MEDIOVA_FAULT_PROBE=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run NTFS lock ACL and portable authority probes
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('Mediova-Native-Faults-' + [guid]::NewGuid().ToString('N'))
          $report=Join-Path $PWD 'native-fault-core.json'
          & $env:MEDIOVA_FAULT_PROBE --mode core --root $root --report $report
          if ($LASTEXITCODE -ne 0) { throw 'Native lock/ACL/portable probe failed' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.passed -or @($json.checks.PSObject.Properties | Where-Object {-not [bool]$_.Value}).Count -gt 0) {
            throw 'Native lock/ACL/portable report contains failed checks'
          }
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run real NTFS disk-full preservation probe
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $vhd=Join-Path $env:RUNNER_TEMP ('Mediova-Full-' + [guid]::NewGuid().ToString('N') + '.vhd')
          $used=@(Get-Volume | Where-Object {$_.DriveLetter} | ForEach-Object {$_.DriveLetter.ToString().ToUpperInvariant()})
          $letter=@('R','S','T','U','V','W','X','Y','Z') | Where-Object {$used -notcontains $_} | Select-Object -First 1
          if (-not $letter) { throw 'No free drive letter is available for disk-full probe' }
          $diskpart=Join-Path $env:RUNNER_TEMP ('Mediova-Diskpart-' + [guid]::NewGuid().ToString('N') + '.txt')
          @"
          create vdisk file="$vhd" maximum=64 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=MEDIOVAFULL
          assign letter=$letter
          "@ | Set-Content $diskpart -Encoding Ascii
          try {
            diskpart /s $diskpart | Write-Host
            if ($LASTEXITCODE -ne 0 -or !(Test-Path "$letter`:\")) { throw 'Unable to create the disk-full VHD' }
            $probeRoot="$letter`:\Probe"
            $prepare=Join-Path $PWD 'native-fault-disk-prepare.json'
            $probe=Join-Path $PWD 'native-fault-disk-full.json'
            & $env:MEDIOVA_FAULT_PROBE --mode disk-prepare --root $probeRoot --report $prepare
            if ($LASTEXITCODE -ne 0) { throw 'Disk-full baseline preparation failed' }

            $fill="$letter`:\fill.bin"
            $stream=[System.IO.File]::Open($fill,[System.IO.FileMode]::Create,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
            try {
              $buffer=New-Object byte[] (1024*1024)
              while ($true) {
                $free=[int64](Get-PSDrive -Name $letter).Free
                if ($free -le 2048) { break }
                $count=[int][Math]::Min([int64]$buffer.Length,$free-1024)
                if ($count -le 0) { break }
                $stream.Write($buffer,0,$count)
              }
              $stream.Flush()
            } finally {
              $stream.Dispose()
            }
            $remaining=[int64](Get-PSDrive -Name $letter).Free
            Write-Host "Disk-full probe remaining bytes=$remaining"
            if ($remaining -gt 8192) { throw 'VHD was not filled sufficiently for the disk-full probe' }

            & $env:MEDIOVA_FAULT_PROBE --mode disk-probe --root $probeRoot --report $probe
            if ($LASTEXITCODE -ne 0) { throw 'Disk-full preservation probe failed' }
            $json=Get-Content $probe -Raw | ConvertFrom-Json
            if (-not $json.passed -or -not [bool]$json.checks.disk_full_returns_error -or -not [bool]$json.checks.disk_full_preserves_primary) {
              throw 'Disk-full report did not confirm failure and primary preservation'
            }
          } finally {
            @"
            select vdisk file="$vhd"
            detach vdisk
            "@ | Set-Content $diskpart -Encoding Ascii
            diskpart /s $diskpart | Out-Null
            Remove-Item $diskpart -Force -ErrorAction SilentlyContinue
            Remove-Item $vhd -Force -ErrorAction SilentlyContinue
          }

      - name: Download fixed-channel real FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archive=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl.zip'
          $expanded=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl'
          $downloaded=$false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $archive -Headers @{'User-Agent'='Mediova-v4.5.1-Verification'}
              $downloaded=$true
              break
            } catch {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $downloaded) { throw 'Unable to download the BtbN FFmpeg Runtime package' }
          Expand-Archive $archive -DestinationPath $expanded -Force
          $ffmpeg=Get-ChildItem $expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem $expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or $ffmpeg.Directory.FullName -ne $ffprobe.Directory.FullName) {
            throw 'Downloaded package does not contain a colocated FFmpeg/FFprobe pair'
          }
          @(& $ffmpeg.FullName -version 2>&1) | Select-Object -First 1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded FFmpeg is not runnable' }
          "FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Mediova v4.5.1 verification Runtime
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.5.1_verification.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          if ($LASTEXITCODE -ne 0) { throw 'Mediova v4.5.1 verification build failed' }

      - name: Verify Runtime identity boundary and provenance
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $PWD 'build-v4.5.1-verification'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $zip=Join-Path $build 'Mediova-v4.5.1-Verification-Runtime.zip'
          if (!(Test-Path $exe) -or !(Test-Path $zip)) { throw 'Verification EXE or ZIP is missing' }
          $info=(Get-Item $exe).VersionInfo
          if (($info.FileVersion -notlike '4.5.1*') -or ($info.ProductVersion -notlike '4.5.1*') -or ($info.ProductName -notlike '*Mediova*')) {
            throw 'v4.5.1 Windows version resource mismatch'
          }
          $manifest=Get-Content (Join-Path $runtime 'runtime-manifest.json') -Raw | ConvertFrom-Json
          $provenance=Get-Content (Join-Path $runtime 'build-provenance.json') -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.5.1' -or $manifest.channel -ne 'verification') {
            throw 'Runtime manifest identity mismatch'
          }
          if ($provenance.artifact_version -ne '4.5.1' -or $provenance.source_declared_version -ne '4.5.0' -or $provenance.channel -ne 'verification') {
            throw 'Build provenance mismatch'
          }
          foreach ($entry in $manifest.files) {
            $path=Join-Path $runtime ($entry.path -replace '/', '\\')
            if (!(Test-Path $path -PathType Leaf)) { throw "Manifest file missing: $($entry.path)" }
            $actual=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256) { throw "Manifest hash mismatch: $($entry.path)" }
            if ((Get-Item $path).Length -ne [int64]$entry.size) { throw "Manifest size mismatch: $($entry.path)" }
          }
          foreach ($required in @('Mediova.exe','Components/FFmpeg/bin/ffmpeg.exe','Components/FFmpeg/bin/ffprobe.exe','build-provenance.json','THIRD_PARTY_NOTICES.md','README.txt')) {
            if (!(Test-Path (Join-Path $runtime $required))) { throw "Required Runtime file missing: $required" }
          }
          foreach ($private in @('config.json','history.json','session.json','session.json.bak','crash.log','settings.json','task-history.json','security.json','vault.bin')) {
            if (Get-ChildItem $runtime -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) {
              throw "Private Data leaked into Runtime: $private"
            }
          }

      - name: Run native v4.5.1 self-test
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $PWD 'build-v4.5.1-verification'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $report=Join-Path $build 'ci_self_test.json'
          $data=Join-Path $env:RUNNER_TEMP ('Mediova-SelfTest-' + [guid]::NewGuid().ToString('N'))
          $oldAppData=$env:APPDATA
          $oldLocalAppData=$env:LOCALAPPDATA
          $oldRuntime=$env:MEDIOVA_RUNTIME_DIR
          try {
            $env:APPDATA=Join-Path $data 'Roaming'
            $env:LOCALAPPDATA=Join-Path $data 'Local'
            $env:MEDIOVA_RUNTIME_DIR=$runtime
            $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test', "--self-test-output=$report") -PassThru
            if (-not $proc.WaitForExit(480000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Native self-test timeout' }
          } finally {
            $env:APPDATA=$oldAppData
            $env:LOCALAPPDATA=$oldLocalAppData
            $env:MEDIOVA_RUNTIME_DIR=$oldRuntime
            Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (!(Test-Path $report)) { throw 'Native self-test report missing' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          $failed=@($checks | Where-Object {-not [bool]$_.Value})
          Write-Host "Native checks: total=$($checks.Count), failed=$($failed.Count), passed=$($json.passed), version=$($json.version)"
          foreach ($item in $failed) { Write-Host "FAILED CHECK: $($item.Name)" }
          if ($json.version -ne '4.5.1' -or $checks.Count -lt 62) { throw 'Native self-test identity or check-count mismatch' }
          if (-not $json.passed -or $failed.Count -gt 0) { throw 'Native self-test contains failed checks' }

      - name: Capture Windows verification previews
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class MediovaV451Capture {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [DllImport("user32.dll", SetLastError=true)] public static extern bool MoveWindow(IntPtr hWnd, int x, int y, int width, int height, bool repaint);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint flags);
          }
          "@
          $build=Join-Path $PWD 'build-v4.5.1-verification'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $previewDir=Join-Path $build 'ui-preview'
          New-Item $previewDir -ItemType Directory -Force | Out-Null
          function Save-Preview([string]$mode,[int]$width,[int]$height,[string]$name) {
            $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @("--ui-preview=$mode") -PassThru
            try {
              $handle=[IntPtr]::Zero
              for ($i=0; $i -lt 80; $i++) {
                Start-Sleep -Milliseconds 250
                $proc.Refresh()
                if ($proc.HasExited) { throw "Mediova exited before $mode preview capture" }
                if ($proc.MainWindowHandle -ne 0) { $handle=[IntPtr]$proc.MainWindowHandle; break }
              }
              if ($handle -eq [IntPtr]::Zero) { throw "Mediova main window was not created for $mode preview" }
              if (-not [MediovaV451Capture]::MoveWindow($handle,0,0,$width,$height,$true)) { throw "MoveWindow failed for $mode" }
              Start-Sleep -Milliseconds 800
              $rect=New-Object MediovaV451Capture+RECT
              if (-not [MediovaV451Capture]::GetWindowRect($handle,[ref]$rect)) { throw "GetWindowRect failed for $mode" }
              $actualWidth=$rect.Right-$rect.Left
              $actualHeight=$rect.Bottom-$rect.Top
              $path=Join-Path $previewDir $name
              $bmp=New-Object System.Drawing.Bitmap($actualWidth,$actualHeight)
              $graphics=[System.Drawing.Graphics]::FromImage($bmp)
              try {
                $hdc=$graphics.GetHdc()
                try {
                  if (-not [MediovaV451Capture]::PrintWindow($handle,$hdc,2)) { throw "PrintWindow failed for $mode" }
                } finally { $graphics.ReleaseHdc($hdc) }
                $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $graphics.Dispose(); $bmp.Dispose() }
              if (!(Test-Path $path) -or (Get-Item $path).Length -lt 10000) { throw "UI preview is missing or too small: $path" }
            } finally {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          Save-Preview 'video' 1650 930 'Mediova-v4.5.1-video-wide-1650x930.png'
          Save-Preview 'video' 1120 720 'Mediova-v4.5.1-video-compact-1120x720.png'
          Save-Preview 'image' 1450 820 'Mediova-v4.5.1-image-1450x820.png'
          Save-Preview 'held' 1450 820 'Mediova-v4.5.1-held-1450x820.png'

      - name: Upload v4.5.1 verification package
        uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.5.1-Verification
          path: |
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/Runtime/Mediova.exe
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/Mediova-v4.5.1-Verification-Runtime.zip
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/ci_self_test.json
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/ui-preview/*.png
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/Runtime/runtime-manifest.json
            projects/1-桌面软件/101-Mediova/代码/build-v4.5.1-verification/Runtime/build-provenance.json
            projects/1-桌面软件/101-Mediova/代码/native-fault-*.json
          if-no-files-found: error
          retention-days: 14
