name: Release Mediova v4.1.0 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-release-trigger.txt'

permissions:
  contents: write

concurrency:
  group: p101-v410-release-once
  cancel-in-progress: false

env:
  SOURCE_SHA: 27435598978ec8e16944742ce0de7c56f489dded
  TAG_NAME: p101-v4.1.0

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-v410-release-trigger'
    runs-on: windows-latest
    timeout-minutes: 110

    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify formal source identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Source mismatch: $actual" }
          Write-Host "Release source commit: $actual"
          Write-Host "Release source tree: $((git rev-parse 'HEAD^{tree}').Trim())"

      - name: Validate source with isolated Data roots
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-WithIsolatedData([scriptblock]$Action) {
            $root=Join-Path $env:RUNNER_TEMP ('Mediova-Release-Test-' + [guid]::NewGuid().ToString('N'))
            New-Item $root -ItemType Directory -Force | Out-Null
            $oldAppData=$env:APPDATA
            $oldLocalAppData=$env:LOCALAPPDATA
            $oldXdg=$env:XDG_CONFIG_HOME
            $oldRuntime=$env:MEDIOVA_RUNTIME_DIR
            try {
              $env:APPDATA=$root
              $env:LOCALAPPDATA=$root
              $env:XDG_CONFIG_HOME=$root
              $env:MEDIOVA_RUNTIME_DIR=Join-Path $root 'Runtime'
              & $Action
              if ($LASTEXITCODE -ne 0) { throw "command failed with exit code $LASTEXITCODE" }
            } finally {
              $env:APPDATA=$oldAppData
              $env:LOCALAPPDATA=$oldLocalAppData
              $env:XDG_CONFIG_HOME=$oldXdg
              $env:MEDIOVA_RUNTIME_DIR=$oldRuntime
              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Get-Command sha256sum -ErrorAction SilentlyContinue)) {
            throw 'sha256sum is required for the source manifest check.'
          }
          sha256sum -c SOURCE_FILES_SHA256.txt
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest check failed.' }
          Invoke-WithIsolatedData { go test -count=1 ./... }
          Invoke-WithIsolatedData { go test -race -count=1 ./internal/config ./internal/media }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed.' }

      - name: Download real FFmpeg Runtime component
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archive=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl.zip'
          $expanded=Join-Path $env:RUNNER_TEMP 'btbn-ffmpeg-win64-gpl'
          $downloaded=$false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $archive -Headers @{'User-Agent'='Mediova-v4.1.0-Release'}
              $downloaded=$true
              break
            } catch {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $downloaded) { throw 'Unable to download the FFmpeg Runtime package.' }
          Expand-Archive $archive -DestinationPath $expanded -Force
          $ffmpeg=Get-ChildItem $expanded -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          $ffprobe=Get-ChildItem $expanded -Recurse -Filter ffprobe.exe -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or $ffmpeg.Directory.FullName -ne $ffprobe.Directory.FullName) {
            throw 'Downloaded package does not contain a colocated FFmpeg/FFprobe pair.'
          }
          $versionOutput=@(& $ffmpeg.FullName -version 2>&1)
          $ffmpegExit=$LASTEXITCODE
          $versionOutput | Select-Object -First 1
          if ($ffmpegExit -ne 0) { throw 'Downloaded FFmpeg is not runnable.' }
          "FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and verify formal Runtime
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        run: |
          $ErrorActionPreference='Stop'
          ./build_v4.1.0.ps1 -FFmpegBin $env:FFMPEG_BIN -SkipTests
          if ($LASTEXITCODE -ne 0) { throw 'Formal Runtime build failed.' }

          $build=Join-Path $PWD 'build'
          $runtime=Join-Path $build 'Runtime'
          $exe=Join-Path $runtime 'Mediova.exe'
          $zip=Join-Path $build 'Mediova-v4.1.0-Runtime.zip'
          $manifestPath=Join-Path $runtime 'runtime-manifest.json'
          $report=Join-Path $build 'release_self_test.json'

          foreach ($required in @($exe,$zip,$manifestPath,(Join-Path $runtime 'Components/FFmpeg/bin/ffmpeg.exe'),(Join-Path $runtime 'Components/FFmpeg/bin/ffprobe.exe'),(Join-Path $runtime 'THIRD_PARTY_NOTICES.md'),(Join-Path $runtime 'README.txt'))) {
            if (!(Test-Path $required -PathType Leaf)) { throw "Required Runtime file missing: $required" }
          }

          $info=(Get-Item $exe).VersionInfo
          if (($info.FileVersion -notlike '4.1.0*') -or ($info.ProductVersion -notlike '4.1.0*') -or ($info.ProductName -notlike '*Mediova*')) {
            throw 'Version resource mismatch.'
          }

          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.1.0' -or $manifest.platform -ne 'Windows x64' -or $manifest.deployment -ne 'folder-runtime') {
            throw 'Runtime manifest identity mismatch.'
          }
          foreach ($entry in $manifest.files) {
            $path=Join-Path $runtime ($entry.path -replace '/', '\')
            if (!(Test-Path $path -PathType Leaf)) { throw "Manifest file missing: $($entry.path)" }
            $actual=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256) { throw "Manifest hash mismatch: $($entry.path)" }
            if ((Get-Item $path).Length -ne [int64]$entry.size) { throw "Manifest size mismatch: $($entry.path)" }
          }
          foreach ($private in @('config.json','history.json','session.json','crash.log','settings.json','task-history.json','security.json','vault.bin')) {
            if (Get-ChildItem $runtime -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) {
              throw "Private Data leaked into Runtime: $private"
            }
          }

          $proc=Start-Process -FilePath $exe -WorkingDirectory $runtime -ArgumentList @('--self-test',"--self-test-output=$report") -PassThru
          if (-not $proc.WaitForExit(480000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native self-test timeout.'
          }
          if (!(Test-Path $report)) { throw 'Native self-test report missing.' }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          $checks=@($json.checks.PSObject.Properties)
          if (-not $json.passed -or $json.version -ne '4.1.0' -or $checks.Count -lt 57) { throw 'Native self-test failed.' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'Native self-test contains failed checks.' }

          $exeHash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSize=(Get-Item $exe).Length
          $zipSize=(Get-Item $zip).Length
          $signature=(Get-AuthenticodeSignature $exe).Status.ToString()
          $record=[ordered]@{
            product='Mediova'
            version='4.1.0'
            tag=$env:TAG_NAME
            source_commit=$env:SOURCE_SHA
            formal_pr_ci_run='30727129758'
            release_workflow_run=$env:GITHUB_RUN_ID
            native_self_test_checks=$checks.Count
            exe_path='Runtime/Mediova.exe'
            exe_size=[int64]$exeSize
            exe_sha256=$exeHash
            runtime_zip='Mediova-v4.1.0-Runtime.zip'
            runtime_zip_size=[int64]$zipSize
            runtime_zip_sha256=$zipHash
            runtime_manifest='verified'
            private_data_scan='passed'
            authenticode_status=$signature
          }
          $recordPath=Join-Path $build 'release-record.json'
          $record | ConvertTo-Json -Depth 6 | Set-Content $recordPath -Encoding UTF8

          $notes=@"
          # Mediova v4.1.0

          Mediova v4.1.0 完成界面统一与轻量透明 Runtime / 独立 Data 架构升级。

          ## 主要变化

          - 统一底色、按钮五态、输出母目录、进度条和真实体积比例；
          - FFmpeg/FFprobe 进入 `Components/FFmpeg/bin`；
          - 增加 Runtime 清单、第三方说明和保守旧组件迁移；
          - 工作记录、阶段记录和项目约束按 A＞B＞C 单一职责收敛；
          - 长期 CI 增加范围门禁、准确 head SHA、跨平台源码哈希和完整 Runtime 验证。

          ## 正式来源与验证

          - Source commit: `$env:SOURCE_SHA`
          - Formal PR CI run: `30727129758`
          - Release workflow run: `$env:GITHUB_RUN_ID`
          - Native self-test: `$($checks.Count)/$($checks.Count)`
          - Runtime manifest: verified
          - Private Data scan: passed
          - Authenticode: `$signature`

          ## 完整性

          - `Runtime/Mediova.exe`
            - Size: `$exeSize` bytes
            - SHA-256: `$exeHash`
          - `Mediova-v4.1.0-Runtime.zip`
            - Size: `$zipSize` bytes
            - SHA-256: `$zipHash`

          首次部署必须解压完整 Runtime ZIP，不要只复制 `Mediova.exe`。
          "@
          $notesPath=Join-Path $build 'release-notes.md'
          Set-Content $notesPath $notes -Encoding UTF8

          Write-Host "Mediova.exe size: $exeSize"
          Write-Host "Mediova.exe SHA-256: $exeHash"
          Write-Host "Runtime ZIP size: $zipSize"
          Write-Host "Runtime ZIP SHA-256: $zipHash"
          Write-Host "Native self-test checks: $($checks.Count)"
          Write-Host "Authenticode status: $signature"

      - name: Create immutable tag and GitHub Release
        shell: pwsh
        working-directory: projects/1-桌面软件/101-Mediova/代码
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $repoRoot=(git rev-parse --show-toplevel).Trim()
          Set-Location $repoRoot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --tags --force

          $existing=(git ls-remote --tags origin "refs/tags/$env:TAG_NAME").Trim()
          if ($existing) {
            git fetch origin "refs/tags/$env:TAG_NAME:refs/tags/$env:TAG_NAME" --force
            $tagCommit=(git rev-list -n 1 $env:TAG_NAME).Trim()
            if ($tagCommit -ne $env:SOURCE_SHA) { throw "Existing tag points to $tagCommit" }
          } else {
            git tag -a $env:TAG_NAME $env:SOURCE_SHA -m 'Mediova v4.1.0'
            git push origin "refs/tags/$env:TAG_NAME"
          }

          $build=Join-Path $repoRoot 'projects/1-桌面软件/101-Mediova/代码/build'
          $assets=@(
            (Join-Path $build 'Mediova-v4.1.0-Runtime.zip'),
            (Join-Path $build 'SHA256.txt'),
            (Join-Path $build 'Runtime/runtime-manifest.json'),
            (Join-Path $build 'release_self_test.json'),
            (Join-Path $build 'release-record.json')
          )
          $notes=Join-Path $build 'release-notes.md'

          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists=($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release upload $env:TAG_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            gh release edit $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --title 'Mediova v4.1.0' --notes-file $notes --target $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Release update failed.' }
          } else {
            gh release create $env:TAG_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:SOURCE_SHA --title 'Mediova v4.1.0' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: P101-Mediova-v4.1.0-formal-release
          path: |
            projects/1-桌面软件/101-Mediova/代码/build/Mediova-v4.1.0-Runtime.zip
            projects/1-桌面软件/101-Mediova/代码/build/SHA256.txt
            projects/1-桌面软件/101-Mediova/代码/build/release_self_test.json
            projects/1-桌面软件/101-Mediova/代码/build/release-record.json
            projects/1-桌面软件/101-Mediova/代码/build/release-notes.md
            projects/1-桌面软件/101-Mediova/代码/build/Runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 30
