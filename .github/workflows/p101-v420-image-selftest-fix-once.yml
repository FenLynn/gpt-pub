name: Fix P101 Mediova v4.2.0 image self-test once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-image-selftest-fix-once
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v420-image-selftest-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact P101 candidate
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0

      - name: Apply exact image self-test correction
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova'
          python3 .v420-fix-image-selftest.py
          rm .v420-fix-image-selftest.py
          cd 代码
          gofmt -w cmd/mediaworkbench/main_windows.go
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths = subprocess.check_output(['git','ls-files','--','.'], text=True).splitlines()
          include = []
          for raw in paths:
              p = Path(raw)
              if raw == 'SOURCE_FILES_SHA256.txt' or not p.is_file():
                  continue
              if p.parts and p.parts[0] == 'build':
                  continue
              if p.suffix.lower() in {'.go','.py','.ps1','.mod','.sum','.mwrsrc','.ico'}:
                  include.append(raw)
          lines = []
          for raw in sorted(include):
              lines.append(f"{hashlib.sha256(Path(raw).read_bytes()).hexdigest()}  {raw}")
          Path('SOURCE_FILES_SHA256.txt').write_text('\n'.join(lines)+'\n', encoding='ascii')
          PY

      - name: Validate corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          cd 'projects/1-桌面软件/101-Mediova/代码'
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          mkdir -p build/check
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -o build/check/Mediova-v4.2.0-check.exe ./cmd/mediaworkbench
          test -s build/check/Mediova-v4.2.0-check.exe

      - name: Enforce exact P101 scope
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotepath false
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          test ${#changed[@]} -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              projects/1-桌面软件/101-Mediova/*) ;;
              *) echo "Out-of-scope path: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              *.v420-fix-image-selftest.py|*__pycache__*)
                if [[ -e "$path" ]]; then
                  echo "Temporary file remains: $path" >&2
                  exit 1
                fi
                ;;
            esac
          done

      - name: Commit validated correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/1-桌面软件/101-Mediova'
          git diff --cached --quiet && { echo 'No validated correction to commit'; exit 1; }
          git commit -m 'P101: 修正 v4.2.0 图片自检显式参数'
          git push origin HEAD:p101-exp
