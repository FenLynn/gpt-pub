name: Finalize Mediova v4.1.0 Release once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-release-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: p101-v410-release-finalize-once
  cancel-in-progress: false

env:
  SOURCE_SHA: 27435598978ec8e16944742ce0de7c56f489dded
  SOURCE_TREE: 8021b5621eb0db7a0a054e3e41d07cec35ebc593
  FORMAL_RUN_ID: '30727129758'
  FORMAL_ARTIFACT: P101-Mediova-v4.1.0-CI
  TAG_NAME: p101-v4.1.0
  EXPECTED_EXE_SHA256: f4a084b365b50712dbffb45f19b4098782212caf25dcc9d61eb8defe8a894d81
  EXPECTED_ZIP_SHA256: df4ec8c4db0b84b501faefebf81da84b1463fe69f8c53b234ad24d9e882f4f04
  EXPECTED_ZIP_SIZE: '116138263'

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-v410-release-trigger'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify formal source identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $commit=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if ($commit -ne $env:SOURCE_SHA) { throw "Source commit mismatch: $commit" }
          if ($tree -ne $env:SOURCE_TREE) { throw "Source tree mismatch: $tree" }
          Write-Host "Formal source commit: $commit"
          Write-Host "Formal source tree: $tree"

      - name: Download formal CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FORMAL_RUN_ID }}

      - name: Re-verify Runtime, manifest, Data boundary and self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $assets=Join-Path $PWD 'release-assets'
          $zip=Join-Path $assets 'Mediova-v4.1.0-Runtime.zip'
          $shaFile=Join-Path $assets 'SHA256.txt'
          $ciReport=Join-Path $assets 'ci_self_test.json'
          $artifactManifest=Join-Path $assets 'Runtime/runtime-manifest.json'
          foreach ($required in @($zip,$shaFile,$ciReport,$artifactManifest)) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf)) { throw "Formal artifact file missing: $required" }
          }

          $zipInfo=Get-Item -LiteralPath $zip
          $zipHash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipInfo.Length -ne [int64]$env:EXPECTED_ZIP_SIZE) { throw "Runtime ZIP size mismatch: $($zipInfo.Length)" }
          if ($zipHash -ne $env:EXPECTED_ZIP_SHA256) { throw "Runtime ZIP SHA-256 mismatch: $zipHash" }

          $shaText=Get-Content -LiteralPath $shaFile -Raw
          if ($shaText -notmatch [regex]::Escape($env:EXPECTED_EXE_SHA256)) { throw 'SHA256.txt does not contain the expected EXE hash.' }
          if ($shaText -notmatch [regex]::Escape($env:EXPECTED_ZIP_SHA256)) { throw 'SHA256.txt does not contain the expected ZIP hash.' }

          $expanded=Join-Path $env:RUNNER_TEMP 'Mediova-v4.1.0-formal-runtime'
          Remove-Item $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          $exe=Join-Path $expanded 'Mediova.exe'
          $manifestPath=Join-Path $expanded 'runtime-manifest.json'
          foreach ($required in @($exe,$manifestPath,(Join-Path $expanded 'Components/FFmpeg/bin/ffmpeg.exe'),(Join-Path $expanded 'Components/FFmpeg/bin/ffprobe.exe'),(Join-Path $expanded 'THIRD_PARTY_NOTICES.md'),(Join-Path $expanded 'README.txt'))) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf)) { throw "Runtime file missing: $required" }
          }

          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne $env:EXPECTED_EXE_SHA256) { throw "Mediova.exe SHA-256 mismatch: $exeHash" }

          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'Mediova' -or $manifest.version -ne '4.1.0' -or $manifest.platform -ne 'Windows x64' -or $manifest.deployment -ne 'folder-runtime') {
            throw 'Runtime manifest identity mismatch.'
          }
          foreach ($entry in $manifest.files) {
            $path=Join-Path $expanded ($entry.path -replace '/', '\')
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Manifest file missing: $($entry.path)" }
            $actual=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256) { throw "Manifest hash mismatch: $($entry.path)" }
            if ((Get-Item -LiteralPath $path).Length -ne [int64]$entry.size) { throw "Manifest size mismatch: $($entry.path)" }
          }
          foreach ($private in @('config.json','history.json','session.json','crash.log','settings.json','task-history.json','security.json','vault.bin')) {
            if (Get-ChildItem $expanded -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) { throw "Private Data leaked into Runtime: $private" }
          }

          $report=Get-Content -LiteralPath $ciReport -Raw | ConvertFrom-Json
          $checks=@($report.checks.PSObject.Properties)
          if (-not $report.passed -or $report.version -ne '4.1.0' -or $checks.Count -ne 57) { throw 'Formal native self-test record is invalid.' }
          if (@($checks | Where-Object {-not [bool]$_.Value}).Count -gt 0) { throw 'Formal native self-test record contains a failed check.' }

          Copy-Item -LiteralPath $ciReport -Destination (Join-Path $assets 'release_self_test.json') -Force
          $record=[ordered]@{
            product='Mediova'
            version='4.1.0'
            tag=$env:TAG_NAME
            source_commit=$env:SOURCE_SHA
            source_tree=$env:SOURCE_TREE
            formal_pr_ci_run=$env:FORMAL_RUN_ID
            formal_artifact=$env:FORMAL_ARTIFACT
            release_workflow_run=$env:GITHUB_RUN_ID
            native_self_test_checks=57
            exe_size=(Get-Item -LiteralPath $exe).Length
            exe_sha256=$exeHash
            runtime_zip_size=$zipInfo.Length
            runtime_zip_sha256=$zipHash
            runtime_manifest='verified'
            private_data_scan='passed'
            authenticode_status='NotSigned'
          }
          $record | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $assets 'release-record.json') -Encoding UTF8

          $notes=@"
          # Mediova v4.1.0

          Mediova v4.1.0 完成界面统一、透明 Runtime / 独立 Data 架构升级，并按 A＞B＞C 收敛项目记录体系。

          ## 正式来源与验证

          - Source commit: `$env:SOURCE_SHA`
          - Source tree: `$env:SOURCE_TREE`
          - Formal PR CI run: `$env:FORMAL_RUN_ID`
          - Release workflow run: `$env:GITHUB_RUN_ID`
          - Native self-test: 57/57
          - Runtime manifest: verified
          - Private Data scan: passed
          - Authenticode: NotSigned

          ## 完整性

          - `Mediova.exe`: `$((Get-Item -LiteralPath $exe).Length)` bytes; SHA-256 `$exeHash`
          - `Mediova-v4.1.0-Runtime.zip`: `$($zipInfo.Length)` bytes; SHA-256 `$zipHash`

          首次部署必须解压完整 Runtime ZIP，不要只复制 `Mediova.exe`。
          "@
          Set-Content -LiteralPath (Join-Path $assets 'release-notes.md') -Value $notes -Encoding UTF8
          Write-Host "Verified formal Runtime ZIP: $($zipInfo.Length) bytes, $zipHash"
          Write-Host "Verified Mediova.exe: $((Get-Item -LiteralPath $exe).Length) bytes, $exeHash"
          Write-Host 'Verified native self-test: 57/57'

      - name: Create immutable tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --tags --force

          $tagLines=@(git ls-remote --tags origin "refs/tags/$env:TAG_NAME")
          if ($tagLines.Count -gt 0) {
            git fetch origin "refs/tags/$env:TAG_NAME:refs/tags/$env:TAG_NAME" --force
            $tagCommitLines=@(git rev-list -n 1 $env:TAG_NAME)
            $tagCommit=($tagCommitLines -join "`n").Trim()
            if ($tagCommit -ne $env:SOURCE_SHA) { throw "Existing tag points to $tagCommit" }
          } else {
            git tag -a $env:TAG_NAME $env:SOURCE_SHA -m 'Mediova v4.1.0'
            git push origin "refs/tags/$env:TAG_NAME"
          }

          $assets=Join-Path $PWD 'release-assets'
          $files=@(
            (Join-Path $assets 'Mediova-v4.1.0-Runtime.zip'),
            (Join-Path $assets 'SHA256.txt'),
            (Join-Path $assets 'Runtime/runtime-manifest.json'),
            (Join-Path $assets 'release_self_test.json'),
            (Join-Path $assets 'release-record.json')
          )
          $notes=Join-Path $assets 'release-notes.md'

          & gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists=($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            & gh release upload $env:TAG_NAME @files --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            & gh release edit $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --title 'Mediova v4.1.0' --notes-file $notes --target $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Release update failed.' }
          } else {
            & gh release create $env:TAG_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:SOURCE_SHA --title 'Mediova v4.1.0' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }

          $tagCommitLines=@(git rev-list -n 1 $env:TAG_NAME)
          $tagCommit=($tagCommitLines -join "`n").Trim()
          if ($tagCommit -ne $env:SOURCE_SHA) { throw "Final tag verification failed: $tagCommit" }
          & gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Final Release verification failed.' }
