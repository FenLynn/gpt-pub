name: P103 DavBridge Branch Hygiene

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

# DavBridge branch policy:
# - persistent working branches: p103-exp, p103-stable
# - p103-localsub-* belongs to the historical LocalSub project and is outside DavBridge governance
# - any other p103-* branch is transient and may be cleaned only when it is fully merged

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'p103-') &&
      !startsWith(github.event.pull_request.head.ref, 'p103-localsub-') &&
      github.event.pull_request.head.ref != 'p103-exp' &&
      github.event.pull_request.head.ref != 'p103-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged transient DavBridge head branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true

  sweep-fully-merged:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branch graph
        shell: bash
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete only fully merged transient DavBridge branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/p103- | sort -u)
          for branch in "${branches[@]}"; do
            [[ "$branch" == 'p103-exp' || "$branch" == 'p103-stable' ]] && continue
            [[ "$branch" == p103-localsub-* ]] && { echo "Ignoring LocalSub branch outside DavBridge governance: $branch"; continue; }
            if git merge-base --is-ancestor "refs/remotes/origin/$branch" origin/main; then
              echo "Deleting fully merged transient DavBridge branch: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
            else
              echo "Keeping branch with unique commits: $branch"
            fi
          done

      - name: Report remaining DavBridge and LocalSub-prefixed branches
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/p103" --jq '.[].ref' | sed 's#refs/heads/##' | sort
