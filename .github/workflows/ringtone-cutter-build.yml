name: Build Ringtone Cutter APK

on:
  push:
    branches: [ "ringtone-cutter-build-20261007" ]
    paths:
      - "RingtoneCutter/**"
      - ".github/workflows/ringtone-cutter-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: RingtoneCutter
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RingtoneCutter/app/build/outputs/apk/debug/app-debug.apk out/RingtoneCutter-v1.0.0-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RingtoneCutter-v1.0.0-arm64
          path: out/RingtoneCutter-v1.0.0-arm64.apk
          if-no-files-found: error
