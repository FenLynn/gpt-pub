name: Build Ringtone Cutter APK

on:
  push:
    branches: [ "ringtone-cutter-build-20261007" ]
    paths:
      - "RingtoneCutter/**"
      - ".github/workflows/ringtone-cutter-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch source tarball
        shell: bash
        run: |
          curl -fL --retry 5 --retry-delay 2             "https://codeload.github.com/FenLynn/gpt-pub/tar.gz/refs/heads/ringtone-cutter-build-20261007"             -o /tmp/repo.tar.gz
          mkdir -p /tmp/repo
          tar -xzf /tmp/repo.tar.gz --strip-components=1 -C /tmp/repo
          cp -a /tmp/repo/RingtoneCutter "$GITHUB_WORKSPACE/RingtoneCutter"

      - name: Prepare Gradle
        shell: bash
        run: |
          java -version
          curl -fL --retry 5 --retry-delay 2             "https://services.gradle.org/distributions/gradle-8.9-bin.zip"             -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Show Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Build debug APK
        working-directory: RingtoneCutter
        run: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RingtoneCutter/app/build/outputs/apk/debug/app-debug.apk out/RingtoneCutter-v1.1.1-arm64.apk
          sha256sum out/RingtoneCutter-v1.1.1-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RingtoneCutter-v1.1.1-arm64
          path: out/RingtoneCutter-v1.1.1-arm64.apk
          if-no-files-found: error
