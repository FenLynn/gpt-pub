name: Import P102 AtlasDesk public history

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

jobs:
  import:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'FenLynn' &&
      startsWith(github.event.comment.body, 'P102_IMPORT_URL=')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate exact import pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.data.head.ref !== 'p102-import-v073' ||
                pr.data.base.ref !== 'main') {
              core.setFailed('P102 import comment is not attached to the exact same-repository import PR.');
            }

      - name: Checkout P102 import branch
        uses: actions/checkout@v4
        with:
          ref: p102-import-v073
          fetch-depth: 0

      - name: Download and verify audited public bundle
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          url=${COMMENT_BODY#P102_IMPORT_URL=}
          url=$(printf '%s' "$url" | tr -d '\r\n')
          test -n "$url"

          rm -rf /tmp/p102-import
          mkdir -p /tmp/p102-import/outer /tmp/p102-import/inner
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/p102-import/artifact.zip
          echo 'ca2f18cf915b0dfe28cff4472b1c8ef85fea5d193dd1788b6a7b2681d5654bbd  /tmp/p102-import/artifact.zip' | sha256sum -c -
          unzip -q /tmp/p102-import/artifact.zip -d /tmp/p102-import/outer
          echo '57b43be7c6c7744e8b45ce43c08aa11cff27215a74d53047a8b72032f3702205  /tmp/p102-import/outer/P102-AtlasDesk-v0.7.3-public-history.zip' | sha256sum -c -
          unzip -q /tmp/p102-import/outer/P102-AtlasDesk-v0.7.3-public-history.zip -d /tmp/p102-import/inner
          echo 'b7d777a65628de42f1fe5b3290d83f8c94ad56d52e31333b4cc83ec44cc2d177  /tmp/p102-import/inner/p102-atlasdesk-v0.7.3-public-history.bundle' | sha256sum -c -

      - name: Validate audit evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/p102-import/inner')
          manifest = json.loads((root / 'source-files-sha256.json').read_text(encoding='utf-8'))
          assert manifest['source_repository'] == 'FenLynn/gpt-hub'
          assert manifest['source_commit'] == 'c48180a2ac74b6336220bce484c8051551d4e2fb'
          assert manifest['source_version'] == '0.7.3'
          assert manifest['public_project_number'] == 'P102'
          assert manifest['target_path'] == 'projects/1-桌面软件/102-AtlasDesk/'
          assert manifest['filtered_head'] == 'f8493a0bcb73ed0e05f039144890dc07b5d885fb'
          assert manifest['v072_public_mapped_head'] == '397e142b1160d8065dc39670864cba38b592fec2'
          assert manifest['commit_count'] == 86
          assert manifest['file_count'] == 108
          assert manifest['total_bytes'] == 925277

          audit = json.loads((root / 'public-safety-audit.json').read_text(encoding='utf-8'))
          assert audit['commit_message_scope_scan'] == 'passed'
          assert audit['current_and_historical_blob_path_scope'] == 'passed'
          assert audit['full_history_blob_scan']['unique_blob_count'] > 0
          assert len(audit['current_tree_secret_scan']['accepted_test_fixtures']) == 3

          sanitization = (root / 'history-sanitization.txt').read_text(encoding='utf-8')
          assert '迁移载荷/**' in sanitization
          assert '9024248+FenLynn@users.noreply.github.com' in sanitization
          print('P102 audit evidence verified.')
          PY

      - name: Import preserved public history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.quotePath false
          git bundle verify /tmp/p102-import/inner/p102-atlasdesk-v0.7.3-public-history.bundle
          git fetch /tmp/p102-import/inner/p102-atlasdesk-v0.7.3-public-history.bundle \
            p102-atlasdesk-public-history:refs/remotes/p102/history
          test "$(git rev-parse refs/remotes/p102/history)" = 'f8493a0bcb73ed0e05f039144890dc07b5d885fb'
          git merge --allow-unrelated-histories --no-ff --no-commit refs/remotes/p102/history

      - name: Verify imported current files byte for byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/p102-import/inner/source-files-sha256.json').read_text(encoding='utf-8'))
          failures = []
          actual_paths = set()
          for row in manifest['files']:
              path = Path(row['path'])
              actual_paths.add(path.as_posix())
              if not path.is_file():
                  failures.append(f'missing: {path}')
                  continue
              data = path.read_bytes()
              if len(data) != row['bytes'] or hashlib.sha256(data).hexdigest() != row['sha256']:
                  failures.append(f'mismatch: {path}')

          root = Path('projects/1-桌面软件/102-AtlasDesk')
          current = {
              path.as_posix()
              for path in root.rglob('*')
              if path.is_file()
          }
          if current != actual_paths:
              failures.append(f'file set mismatch: expected={len(actual_paths)} actual={len(current)}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f"Verified {len(actual_paths)} imported files byte for byte.")
          PY

      - name: Commit imported public history
        shell: bash
        run: |
          set -euo pipefail
          rm -f .migration/p102-import-trigger.txt
          rmdir .migration 2>/dev/null || true
          git add -A
          git commit -m 'P102: import AtlasDesk v0.7.3 audited public history'
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" = '3'

          bad=$(git diff --name-only origin/main...HEAD | grep -Ev '^projects/1-桌面软件/102-AtlasDesk/' || true)
          if [[ -n "$bad" ]]; then
            echo 'Out-of-scope public import changes:'
            echo "$bad"
            exit 1
          fi
          if git diff --name-only origin/main...HEAD | grep -Eq '^(projects/1-桌面软件/101-|GPT_RULES\.md$|\.github/workflows/)'; then
            echo 'Protected public repository path changed.'
            exit 1
          fi
          git push origin HEAD:p102-import-v073

      - name: Report import result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'P102_PUBLIC_IMPORT status=success source=c48180a2ac74b6336220bce484c8051551d4e2fb filtered_head=f8493a0bcb73ed0e05f039144890dc07b5d885fb v072=397e142b1160d8065dc39670864cba38b592fec2 commits=86 files=108 bytes=925277'
            });
