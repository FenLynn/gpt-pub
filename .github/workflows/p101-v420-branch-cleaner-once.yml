name: Clean P101 Mediova v4.2.0 temporary branches once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v420-branch-cleaner-once
  cancel-in-progress: false

jobs:
  clean:
    if: github.head_ref == 'repo-p101-v420-branch-cleaner-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view p101-v4.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view p101-v4.2.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = 'false'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/p101-v4.2.0" --jq .object.sha)" != ''

      - name: Delete exact P101 v4.2.0 temporary branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branches=(
            p101-v420-queue-workflow
            repo-p101-v420-apply
            repo-p101-v420-apply-cleanup
            repo-p101-v420-apply-fix1
            repo-p101-v420-apply-fix2
            repo-p101-v420-apply-fix3
            repo-p101-v420-apply-fix4
            repo-p101-v420-apply-trigger
            repo-p101-v420-bottom-control-cleanup
            repo-p101-v420-candidate
            repo-p101-v420-candidate-fix1
            repo-p101-v420-final-cleanup
            repo-p101-v420-harden
            repo-p101-v420-harden-fix1
            repo-p101-v420-image-selftest-fix
            repo-p101-v420-image-selftest-trigger
            repo-p101-v420-release-register
            repo-p101-v420-release-trigger
            repo-p101-v420-selftest-diagnostic
            repo-p101-v420-selftest-diagnostic-trigger
            repo-p101-v420-selftest-results
            repo-p101-v420-branch-cleaner-register
            repo-p101-v420-branch-cleaner-trigger
          )
          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

      - name: Verify protected P101 branches remain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for branch in main p101-stable p101-exp; do
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .ref
          done
