name: Apply P101 Mediova v4.2.2 contrast hotfix once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v422-contrast-hotfix-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'repo-p101-v422-contrast-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest P101 experiment branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix filled-region text clipping and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          helper = code / 'cmd/mediaworkbench/v422_windows.go'
          contract = code / 'cmd/mediaworkbench/v422_source_contract_test.go'
          hashes = code / 'SOURCE_FILES_SHA256.txt'

          helper_text = helper.read_text(encoding='utf-8')
          old = 'withRoundedClip(hdc, fill, 1, func() {'
          new = 'withRoundedClip(hdc, fill, 4, func() {'
          if helper_text.count(old) != 1:
              raise SystemExit(f'expected one 1px contrast clip, found {helper_text.count(old)}')
          helper.write_text(helper_text.replace(old, new, 1), encoding='utf-8', newline='\n')

          contract_text = contract.read_text(encoding='utf-8')
          old_contract = '`withRoundedClip(hdc, fill, 1`'
          new_contract = '`withRoundedClip(hdc, fill, 4`'
          if contract_text.count(old_contract) != 1:
              raise SystemExit(f'expected one old contrast contract, found {contract_text.count(old_contract)}')
          contract.write_text(contract_text.replace(old_contract, new_contract, 1), encoding='utf-8', newline='\n')

          subprocess.run(['gofmt', '-w', str(helper), str(contract)], check=True)
          paths = []
          for line in hashes.read_text(encoding='utf-8').splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2:
                  paths.append(parts[1])
          refreshed = []
          for rel in sorted(set(paths)):
              path = code / rel
              if not path.is_file():
                  raise SystemExit(f'hash source path missing: {rel}')
              refreshed.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}')
          hashes.write_text('\n'.join(refreshed) + '\n', encoding='utf-8', newline='\n')
          PY
          cd projects/1-桌面软件/101-Mediova/代码
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_v422_contrast_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova_v422_contrast.exe ./cmd/mediaworkbench

      - name: Verify scope and push
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changes:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_source_contract_test.go projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/v422_windows.go
          git commit -m 'P101: 修复 v4.2.2 蓝底白字真实绘制'
          git push origin HEAD:p101-exp
