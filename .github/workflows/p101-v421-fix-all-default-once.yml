name: Fix P101 Mediova v4.2.1 all-default references once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-fix-all-default-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v421-all-default-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P101 v4.2.1 candidate branch
        uses: actions/checkout@v4
        with:
          ref: repo-p101-v421-ci-identity
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact all-default references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          source = code / 'cmd/mediaworkbench/main_windows.go'
          manifest = code / 'SOURCE_FILES_SHA256.txt'

          text = source.read_text(encoding='utf-8')
          broken = 'a.a.hAllDefault'
          fixed = 'a.hAllDefault'
          count = text.count(broken)
          if count != 3:
              raise SystemExit(f'expected exactly 3 broken all-default references, found {count}')
          text = text.replace(broken, fixed)
          if broken in text:
              raise SystemExit('broken all-default reference still remains')
          source.write_text(text, encoding='utf-8', newline='\n')

          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          lines = manifest.read_text(encoding='utf-8').splitlines()
          target = 'cmd/mediaworkbench/main_windows.go'
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target)]
          if len(matches) != 1:
              raise SystemExit(f'expected one hash entry for {target}, found {len(matches)}')
          lines[matches[0]] = f'{digest}  {target}'
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'updated {count} references; main_windows.go sha256={digest}')
          PY
          gofmt -w projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          python - <<'PY'
          from pathlib import Path
          import hashlib
          code = Path('projects/1-桌面软件/101-Mediova/代码')
          source = code / 'cmd/mediaworkbench/main_windows.go'
          manifest = code / 'SOURCE_FILES_SHA256.txt'
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          lines = manifest.read_text(encoding='utf-8').splitlines()
          target = 'cmd/mediaworkbench/main_windows.go'
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target)]
          if len(matches) != 1:
              raise SystemExit(f'expected one hash entry for {target}, found {len(matches)}')
          lines[matches[0]] = f'{digest}  {target}'
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'post-gofmt main_windows.go sha256={digest}')
          PY

      - name: Verify source and Windows cross-build
        working-directory: projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Enforce exact scope and push candidate repair
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          if grep -RFn 'a.a.hAllDefault' projects/1-桌面软件/101-Mediova/代码; then
            echo 'Broken all-default reference remains.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          git commit -m 'P101: 修正 v4.2.1 全部默认按钮引用'
          git push origin HEAD:repo-p101-v421-ci-identity
