name: P101 Fix ACL Probe Order

on:
  push:
    branches: [p101-v451-verification]
    paths:
      - '.github/workflows/p101-v451-fix-acl-probe.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v451-verification
          fetch-depth: 0
      - name: Restore ACL before preservation read and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/1-桌面软件/101-Mediova/代码/cmd/nativefaultcheck/main_windows.go')
          source = path.read_text(encoding='utf-8')
          old = '''\taclBefore, _ := os.ReadFile(path)
          \taclSaveErr := config.Save(settingsWithOutput("acl-change"))
          \taclAfter, aclReadErr := os.ReadFile(path)
          \trestoreOut, restoreErr := exec.Command("icacls", dataDir, "/remove:d", identity).CombinedOutput()
          \tif restoreErr != nil {
          \t\treturn fmt.Errorf("icacls restore failed: %v: %s", restoreErr, strings.TrimSpace(string(restoreOut)))
          \t}
          \tr.Checks["ntfs_acl_denial_returns_error"] = aclSaveErr != nil
          \tr.Checks["ntfs_acl_denial_preserves_primary"] = aclReadErr == nil && bytes.Equal(aclBefore, aclAfter)
          \tif aclSaveErr == nil || aclReadErr != nil || !bytes.Equal(aclBefore, aclAfter) {
          \t\treturn errors.New("NTFS ACL denial did not preserve the primary config")
          \t}
          '''
          new = '''\taclBefore, _ := os.ReadFile(path)
          \taclSaveErr := config.Save(settingsWithOutput("acl-change"))
          \t// Restore access before reading the file for comparison. Reading while
          \t// the explicit deny ACE is active only proves that the ACL is effective;
          \t// it does not prove that the primary file was removed or changed.
          \trestoreOut, restoreErr := exec.Command("icacls", dataDir, "/remove:d", identity).CombinedOutput()
          \tif restoreErr != nil {
          \t\treturn fmt.Errorf("icacls restore failed: %v: %s", restoreErr, strings.TrimSpace(string(restoreOut)))
          \t}
          \taclAfter, aclReadErr := os.ReadFile(path)
          \tr.Checks["ntfs_acl_denial_returns_error"] = aclSaveErr != nil
          \tr.Checks["ntfs_acl_denial_preserves_primary"] = aclReadErr == nil && bytes.Equal(aclBefore, aclAfter)
          \tif aclSaveErr == nil || aclReadErr != nil || !bytes.Equal(aclBefore, aclAfter) {
          \t\treturn errors.New("NTFS ACL denial did not preserve the primary config")
          \t}
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one ACL probe block, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/p101-v451-fix-acl-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/1-桌面软件/101-Mediova/代码/cmd/nativefaultcheck/main_windows.go \
                  .github/workflows/p101-v451-fix-acl-probe.yml
          git diff --cached --check
          git commit -m 'Mediova｜修正 ACL 原位保护探针读取顺序'
          git push origin HEAD:p101-v451-verification
