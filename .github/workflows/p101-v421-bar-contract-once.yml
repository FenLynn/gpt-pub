name: Fix P101 Mediova v4.2.1 bar geometry contract once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-bar-contract-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v421-bar-test-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact P101 experimental branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace obsolete Windows bar contract
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          test = root / 'cmd/mediaworkbench/windows_safety_test.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          source = test.read_text(encoding='utf-8')
          old = '''\trow := rect{Left: 800, Top: 100, Right: 940, Bottom: 150}
          \tbar := fullCellBarRect(row)
          \tif bar.Top != 105 || bar.Bottom != 145 || bar.Bottom-bar.Top != 40 {
          \t\tt.Fatalf("bar rect=%+v, want full-height inset", bar)
          \t}
          '''
          new = '''\tcheckCentered := func(name string, row rect) {
          \t\tt.Helper()
          \t\tbar := fullCellBarRect(row)
          \t\tinsets := listCellBarInsets()
          \t\twantLeft := row.Left + scaleDPI(insets.Horizontal)
          \t\twantRight := row.Right - scaleDPI(insets.Horizontal)
          \t\tavailable := row.Bottom - row.Top - 2*scaleDPI(insets.Vertical)
          \t\twantHeight := scaleDPI(24)
          \t\tif wantHeight > available {
          \t\t\twantHeight = available
          \t\t}
          \t\tif minimum := scaleDPI(insets.MinimumHeight); wantHeight < minimum && available >= minimum {
          \t\t\twantHeight = minimum
          \t\t}
          \t\tif wantHeight < 1 {
          \t\t\twantHeight = 1
          \t\t}
          \t\ttopGap := bar.Top - row.Top
          \t\tbottomGap := row.Bottom - bar.Bottom
          \t\tgapDelta := topGap - bottomGap
          \t\tif gapDelta < 0 {
          \t\t\tgapDelta = -gapDelta
          \t\t}
          \t\tif bar.Left != wantLeft || bar.Right != wantRight || bar.Bottom-bar.Top != wantHeight || gapDelta > 1 {
          \t\t\tt.Fatalf("%s bar=%+v row=%+v gaps=%d/%d, want horizontal inset, height %d and vertical centring", name, bar, row, topGap, bottomGap, wantHeight)
          \t\t}
          \t}
          \tcheckCentered("synthetic-50px-row", rect{Left: 800, Top: 100, Right: 940, Bottom: 150})
          \tcheckCentered("realistic-30px-row", rect{Left: 800, Top: 100, Right: 940, Bottom: 130})
          '''
          if source.count(old) != 1:
              raise SystemExit(f'old bar contract expected once, found {source.count(old)}')
          source = source.replace(old, new, 1)
          test.write_text(source, encoding='utf-8', newline='\n')
          PY
          gofmt -w cmd/mediaworkbench/windows_safety_test.go
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          root = Path('.')
          rel = 'cmd/mediaworkbench/windows_safety_test.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          text = hashes.read_text(encoding='utf-8')
          digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          pattern = rf'^[0-9a-f]{{64}}  {re.escape(rel)}$'
          text, count = re.subn(pattern, f'{digest}  {rel}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('windows safety hash entry is not unique')
          hashes.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run full portable gates and Windows compilation
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Verify P101-only scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/windows_safety_test.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/windows_safety_test.go
          git commit -m 'P101: 更新 v4.2.1 条形垂直居中契约'
          git push origin HEAD:p101-exp
