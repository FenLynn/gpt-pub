name: Repository Branch Hygiene

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  delete-merged-temporary-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete exact merged temporary head
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH" == 'main' || "$BRANCH" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
            echo "Persistent branch, not deleting: $BRANCH"
            exit 0
          fi

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          ref="refs/remotes/origin/${BRANCH}"
          if ! git show-ref --verify --quiet "$ref"; then
            echo "Merged temporary branch already absent: $BRANCH"
            exit 0
          fi

          actual="$(git rev-parse "$ref")"
          [[ "$actual" == "$HEAD_SHA" ]] || {
            echo "::error::Branch moved after PR merge, refusing deletion: $BRANCH expected=$HEAD_SHA actual=$actual"
            exit 1
          }

          base_ref="refs/remotes/origin/${BASE_BRANCH}"
          git show-ref --verify --quiet "$base_ref" || {
            echo "::error::Target branch is unavailable: $BASE_BRANCH"
            exit 1
          }
          git merge-base --is-ancestor "$ref" "$base_ref" || {
            echo "::error::Merged head is not contained in current target branch: $BRANCH -> $BASE_BRANCH"
            exit 1
          }

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null
          echo "Deleted merged temporary branch: $BRANCH"

  audit-branch-policy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit long-lived branch allowlist without deleting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t branches < <(git branch -r --format='%(refname:short)' --list 'origin/*' | sed 's#^origin/##' | grep -v '^HEAD$' | sort -u)
          failed=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == 'main' || "$branch" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
              echo "ALLOWED $branch"
            else
              echo "::error::TEMP_OR_UNEXPECTED $branch"
              failed=1
            fi
          done
          exit "$failed"
