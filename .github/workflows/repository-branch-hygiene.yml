name: Repository Branch Hygiene

on:
  push:
    branches:
      - main
      - repo-branch-policy
    paths:
      - 'GPT_RULES.md'
      - 'projects/1-桌面软件/开发约束.md'
      - '.github/workflows/repository-branch-hygiene.yml'
      - '.github/workflows/p102-atlasdesk-branch-hygiene.yml'
      - '.github/workflows/p103-davbridge-branch-hygiene.yml'
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate-policy-change:
    if: github.event_name == 'push' && github.ref == 'refs/heads/repo-branch-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact current retirement plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          declare -A expected_sha=(
            [p102-v081-dashboard-dialog-fix]='61e266ee0dd993ca0003455d77e98ea152482cf1'
            [p104-alpha4-ci]='8ae0f8e6b8d7ed7cdeeff817f82173c03d1ad1a3'
            [p104-ui-ci]='17d68aa9445914d0635f62f648d796fd6e4dba92'
          )

          for branch in p104-alpha4-ci p104-ui-ci; do
            ref="refs/remotes/origin/${branch}"
            actual="$(git rev-parse "$ref")"
            [[ "$actual" == "${expected_sha[$branch]}" ]] || {
              echo "::error::Unexpected tip for $branch: $actual"
              exit 1
            }
            git merge-base --is-ancestor "$ref" origin/main || {
              echo "::error::$branch is no longer fully contained in main"
              exit 1
            }
            echo "SAFE_MERGED $branch $actual"
          done

          branch='p102-v081-dashboard-dialog-fix'
          ref="refs/remotes/origin/${branch}"
          actual="$(git rev-parse "$ref")"
          [[ "$actual" == "${expected_sha[$branch]}" ]] || {
            echo "::error::Unexpected tip for $branch: $actual"
            exit 1
          }

          merge_base="$(git merge-base origin/main "$ref")"
          mapfile -t unique_files < <(git -c core.quotePath=false diff --name-only "${merge_base}...${ref}")
          expected_file='projects/1-桌面软件/102-AtlasDesk/.maintenance/apply_dashboard_dialog_fix.py'
          [[ "${#unique_files[@]}" -eq 1 && "${unique_files[0]}" == "$expected_file" ]] || {
            printf '::error::Unexpected unique files on %s:\n' "$branch"
            printf '%s\n' "${unique_files[@]}"
            exit 1
          }

          grep -Fq 'Dashboard = DashboardSimplicityCoordinator.Attach(window, ShellResilience)' \
            'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/WorkbenchFeaturePipeline.cs'
          grep -Fq 'WorkbenchFeaturePipeline no longer attaches DashboardLifecycleCoordinator, DashboardScriptDiagnostics or DashboardInteractionCoordinator.' \
            'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/RELEASE_NOTES.txt'
          echo "SAFE_RETIRE $branch $actual unique_file=$expected_file"

          mapfile -t branches < <(git branch -r --format='%(refname:short)' --list 'origin/*' | sed 's#^origin/##' | grep -v '^HEAD$' | sort -u)
          failed=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == 'main' || "$branch" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
              continue
            fi
            case "$branch" in
              repo-branch-policy|p102-v081-dashboard-dialog-fix|p104-alpha4-ci|p104-ui-ci)
                echo "EXPECTED_TEMP $branch"
                ;;
              *)
                echo "::error::Unexpected extra branch during policy migration: $branch"
                failed=1
                ;;
            esac
          done
          exit "$failed"

  retire-audited-legacy-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight exact audited legacy refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          check_exact_merged() {
            local branch="$1"
            local expected="$2"
            local ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Already absent: $branch"
              return 0
            fi
            local actual
            actual="$(git rev-parse "$ref")"
            [[ "$actual" == "$expected" ]] || {
              echo "::error::Refusing to delete moved branch $branch: $actual"
              exit 1
            }
            git merge-base --is-ancestor "$ref" origin/main || {
              echo "::error::Refusing to delete unmerged branch $branch"
              exit 1
            }
            echo "PRECHECK_MERGED $branch $actual"
          }

          check_exact_merged 'p104-alpha4-ci' '8ae0f8e6b8d7ed7cdeeff817f82173c03d1ad1a3'
          check_exact_merged 'p104-ui-ci' '17d68aa9445914d0635f62f648d796fd6e4dba92'

          branch='p102-v081-dashboard-dialog-fix'
          ref="refs/remotes/origin/${branch}"
          if git show-ref --verify --quiet "$ref"; then
            actual="$(git rev-parse "$ref")"
            expected='61e266ee0dd993ca0003455d77e98ea152482cf1'
            [[ "$actual" == "$expected" ]] || {
              echo "::error::Refusing to delete moved branch $branch: $actual"
              exit 1
            }
            merge_base="$(git merge-base origin/main "$ref")"
            mapfile -t unique_files < <(git -c core.quotePath=false diff --name-only "${merge_base}...${ref}")
            expected_file='projects/1-桌面软件/102-AtlasDesk/.maintenance/apply_dashboard_dialog_fix.py'
            [[ "${#unique_files[@]}" -eq 1 && "${unique_files[0]}" == "$expected_file" ]] || {
              echo "::error::Refusing to retire $branch because unique content changed"
              printf '%s\n' "${unique_files[@]}"
              exit 1
            }
            grep -Fq 'Dashboard = DashboardSimplicityCoordinator.Attach(window, ShellResilience)' \
              'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/WorkbenchFeaturePipeline.cs'
            grep -Fq 'WorkbenchFeaturePipeline no longer attaches DashboardLifecycleCoordinator, DashboardScriptDiagnostics or DashboardInteractionCoordinator.' \
              'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/RELEASE_NOTES.txt'
            echo "PRECHECK_EXPLICIT_RETIRE $branch $actual"
          else
            echo "Already absent: $branch"
          fi

          bootstrap='repo-branch-policy'
          bootstrap_ref="refs/remotes/origin/${bootstrap}"
          if git show-ref --verify --quiet "$bootstrap_ref"; then
            git merge-base --is-ancestor "$bootstrap_ref" origin/main || {
              echo "::error::Refusing to delete bootstrap branch not contained in main"
              exit 1
            }
            echo "PRECHECK_BOOTSTRAP $bootstrap $(git rev-parse "$bootstrap_ref")"
          fi

      - name: Delete only exact audited refs
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            p104-alpha4-ci \
            p104-ui-ci \
            p102-v081-dashboard-dialog-fix \
            repo-branch-policy
          do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
              echo "DELETED $branch"
            else
              echo "ABSENT $branch"
            fi
          done

      - name: Verify long-lived branch allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/" --jq '.[].ref' | sed 's#refs/heads/##' | sort -u)
          failed=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == 'main' || "$branch" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
              echo "ALLOWED $branch"
            else
              echo "::error::Unexpected branch remains after cleanup: $branch"
              failed=1
            fi
          done
          exit "$failed"

  delete-merged-temporary-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete exact merged temporary head
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH" == 'main' || "$BRANCH" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
            echo "Persistent branch, not deleting: $BRANCH"
            exit 0
          fi

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          ref="refs/remotes/origin/${BRANCH}"
          if ! git show-ref --verify --quiet "$ref"; then
            echo "Merged temporary branch already absent: $BRANCH"
            exit 0
          fi

          actual="$(git rev-parse "$ref")"
          [[ "$actual" == "$HEAD_SHA" ]] || {
            echo "::error::Branch moved after PR merge, refusing deletion: $BRANCH expected=$HEAD_SHA actual=$actual"
            exit 1
          }

          base_ref="refs/remotes/origin/${BASE_BRANCH}"
          git show-ref --verify --quiet "$base_ref" || {
            echo "::error::Target branch is unavailable: $BASE_BRANCH"
            exit 1
          }
          git merge-base --is-ancestor "$ref" "$base_ref" || {
            echo "::error::Merged head is not contained in current target branch: $BRANCH -> $BASE_BRANCH"
            exit 1
          }

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null
          echo "Deleted merged temporary branch: $BRANCH"

  audit-branch-policy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit long-lived branch allowlist without deleting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t branches < <(git branch -r --format='%(refname:short)' --list 'origin/*' | sed 's#^origin/##' | grep -v '^HEAD$' | sort -u)
          failed=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == 'main' || "$branch" =~ ^p[0-9]{3}-(exp|stable)$ ]]; then
              echo "ALLOWED $branch"
            else
              echo "::error::TEMP_OR_UNEXPECTED $branch"
              failed=1
            fi
          done
          exit "$failed"
