name: P101 Sync v4.5.2 Round 2 Windows Tests

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-tests:
    if: github.event.pull_request.head.ref == 'p101-v452-round2-list-lifecycle'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round2-list-lifecycle
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Windows column tests, validate natively and commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import hashlib

          code = Path('projects/1-桌面软件/101-Mediova/代码')
          test = code / 'cmd/mediaworkbench/windows_safety_test.go'
          text = test.read_text(encoding='utf-8')

          replacements = {
              'compareTaskColumn(a, b, 0)': 'compareTaskColumn(a, b, taskColFile)',
              'compareTaskColumn(a, b, 2)': 'compareTaskColumn(a, b, taskColDuration)',
              'compareTaskColumn(a, b, 7)': 'compareTaskColumn(a, b, taskColInputSize)',
              'compareTaskColumn(a, b, 9)': 'compareTaskColumn(a, b, taskColProgress)',
              'compareTaskColumn(a, b, 10)': 'compareTaskColumn(a, b, taskColStatus)',
              'taskSortLabel(8)': 'taskSortLabel(taskColOutputSize)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one Windows column test reference, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          old_width = '''func TestNormalizedTaskColumnWidths(t *testing.T) {
          	got := normalizedTaskColumnWidths([]int{400, 10, 901, 160})
          	want := []int{400, 100, 76, 160, 116, 58, 90, 92, 140, 105, 124}
          	if len(got) != len(want) {
          		t.Fatalf("column widths len=%d want=%d", len(got), len(want))
          	}
          	for i := range want {
          		if got[i] != want[i] {
          			t.Fatalf("column width[%d]=%d want=%d", i, got[i], want[i])
          		}
          	}
          	legacy := normalizedTaskColumnWidths([]int{290, 105, 74, 120, 60, 94, 96, 140, 105, 124})
          	if len(legacy) != 11 || legacy[0] != 290 || legacy[1] != 105 || legacy[2] != 76 || legacy[3] != 74 || legacy[10] != 124 {
          		t.Fatalf("legacy column migration failed: %#v", legacy)
          	}
          }'''
          new_width = '''func TestNormalizedTaskColumnWidths(t *testing.T) {
          	got := normalizedTaskColumnWidths([]int{40, 400, 10, 901, 160})
          	want := []int{40, 400, 100, 76, 160, 116, 58, 90, 92, 140, 105, 124}
          	if len(got) != len(want) {
          		t.Fatalf("column widths len=%d want=%d", len(got), len(want))
          	}
          	for i := range want {
          		if got[i] != want[i] {
          			t.Fatalf("column width[%d]=%d want=%d", i, got[i], want[i])
          		}
          	}
          	legacy := normalizedTaskColumnWidths([]int{290, 105, 74, 120, 60, 94, 96, 140, 105, 124})
          	wantLegacy := []int{48, 290, 105, 76, 74, 120, 60, 94, 96, 140, 105, 124}
          	if len(legacy) != len(wantLegacy) {
          		t.Fatalf("legacy column widths len=%d want=%d: %#v", len(legacy), len(wantLegacy), legacy)
          	}
          	for i := range wantLegacy {
          		if legacy[i] != wantLegacy[i] {
          			t.Fatalf("legacy column width[%d]=%d want=%d: %#v", i, legacy[i], wantLegacy[i], legacy)
          		}
          	}
          }'''
          count = text.count(old_width)
          if count != 1:
              raise SystemExit(f'expected one legacy normalized-width test block, found {count}')
          test.write_text(text.replace(old_width, new_width, 1), encoding='utf-8', newline='\n')
          '@ | python -

          Push-Location 'projects/1-桌面软件/101-Mediova/代码'
          gofmt -w cmd/mediaworkbench/windows_safety_test.go
          @'
          from pathlib import Path
          import hashlib

          code = Path('.')
          manifest = Path('SOURCE_FILES_SHA256.txt')
          rows = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) != 2:
                  raise SystemExit(f'invalid source manifest row: {line!r}')
              rel = parts[1]
              rows.append(f'{hashlib.sha256((code / rel).read_bytes()).hexdigest()}  {rel}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          '@ | python -

          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows native go test failed' }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows native race test failed' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows native go vet failed' }
          Pop-Location

          Remove-Item '.github/workflows/p101_v452_round2_windows_test_sync.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜同步 Windows 安全测试到十二列模型'
          git push origin HEAD:p101-v452-round2-list-lifecycle
