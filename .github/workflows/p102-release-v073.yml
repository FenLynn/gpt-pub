name: Release P102 AtlasDesk v0.7.3

on:
  push:
    branches:
      - main
    paths:
      - '.release/p102-v0.7.3.txt'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - '.release/p102-v0.7.3-run.txt'

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.actor == 'FenLynn' &&
       github.head_ref == 'repo-run-p102-release-v073' &&
       github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == 'FenLynn/gpt-pub')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact public CI Artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_p102_v073_release_v2.py

      - name: Create fixed tag and public Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='df66c9246706439c35f082027a82eb34e827de69'
          tag='p102-v0.7.3'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')" = "$target"
          else
            git tag "$tag" "$target"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" --repo FenLynn/gpt-pub >/dev/null 2>&1; then
            echo 'Release already exists; verifying target tag only.'
          else
            gh release create "$tag" \
              /tmp/p102-release/files/AtlasDesk_v0.7.3_Lightweight.zip \
              /tmp/p102-release/files/AtlasDesk.exe \
              /tmp/p102-release/files/SHA256.txt \
              /tmp/p102-release/files/build-manifest.txt \
              --repo FenLynn/gpt-pub \
              --target "$target" \
              --title 'P102 AtlasDesk v0.7.3' \
              --notes 'First audited public baseline of AtlasDesk in GPT-Pub. Preserves the PersonalWorkbench compatibility identity and the verified lightweight Windows x64 build. Source migration PR: #5. Windows verification run: 30696517002.'
          fi
          gh release view "$tag" --repo FenLynn/gpt-pub --json url,tagName,targetCommitish > /tmp/p102-release/release.json

      - name: Record public release result
        uses: actions/github-script@v7
        env:
          TARGET_SHA: df66c9246706439c35f082027a82eb34e827de69
          TAG_NAME: p102-v0.7.3
        with:
          script: |
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync('/tmp/p102-release/release.json', 'utf8'));
            const verified = JSON.parse(fs.readFileSync('/tmp/p102-release/verified-release.json', 'utf8'));
            const body = [
              'P102_RELEASE_RESULT status=success',
              `run_id=${context.runId}`,
              `target=${process.env.TARGET_SHA}`,
              `tag=${process.env.TAG_NAME}`,
              `release=${release.url}`,
              'verified_pr_run=30696517002',
              `artifact_id=${verified.artifact_id}`,
              `artifact_sha256=${verified.artifact_sha256}`,
              `portable_zip_sha256=${verified.portable_zip_sha256}`,
              `atlasdesk_exe_sha256=${verified.atlasdesk_exe_sha256}`,
              `atlasdesk_exe_bytes=${verified.atlasdesk_exe_bytes}`,
              `compatibility_identity=${verified.compatibility_identity}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body
            });
