name: Clean P101 v4.1.0 temporary branches once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.maintenance/p101-v410-branch-cleanup-trigger.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: p101-v410-branch-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p101-v410-branch-cleanup-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release and delete exact temporary branch whitelist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release view p101-v4.1.0 --repo "$repo" --json tagName,isDraft,isPrerelease,targetCommitish >/tmp/p101-release.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/p101-release.json', encoding='utf-8'))
          assert data['tagName']=='p101-v4.1.0'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert data['targetCommitish']=='27435598978ec8e16944742ce0de7c56f489dded'
          PY

          branches=(
            p101-v410-exp-reconcile
            p101-v410-lineage-reconcile
            p101-v410-record-refresh
            p101-v410-release-fix1
            p101-v410-release-fix2
            p101-v410-release-fix3
            p101-v410-release-fix4
            p101-v410-release-records-cleanup
            p101-v410-release-records-final
            p101-v410-release-runner
            p101-v410-release-trigger
            p101-v410-release-workflow-cleanup
            p101-v410-branch-cleanup-runner
            agent/p101-v410-ci-cleanup
            agent/p101-v410-cleanup-runner
            agent/p101-v410-cleanup-trigger
            agent/p101-v410-execute-v3
            agent/p101-v410-execute-v4
            agent/p101-v410-finalize-runner
            agent/p101-v410-finalize-trigger
            agent/p101-v410-fix-escape-test-runner
            agent/p101-v410-main-runner
            agent/p101-v410-observable-pr-runner
            agent/p101-v410-prepatch-runner
            agent/p101-v410-prepatch-v1
            agent/p101-v410-run-trigger
            agent/p101-v410-run-v2-trigger
            agent/p101-v410-runner-diagnostics
            agent/p101-v410-update-working-runner
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              p101-v410-*|agent/p101-v410-*) ;;
              *) echo "Refusing unexpected branch: $branch"; exit 1 ;;
            esac
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote("heads/"+sys.argv[1], safe=""))' "$branch")
            if gh api "repos/$repo/git/ref/$encoded" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api -X DELETE "repos/$repo/git/refs/$encoded"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove this workflow through a normal PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          remove_branch=p101-v410-branch-cleanup-remove
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B "$remove_branch" origin/main
          rm .github/workflows/p101-v410-branch-cleanup-once.yml
          git add .github/workflows/p101-v410-branch-cleanup-once.yml
          git commit -m 'P101｜移除已完成的临时分支清理器'
          git push --force-with-lease origin "$remove_branch"

          pr_url=$(gh pr create --repo "$repo" --base main --head "$remove_branch" \
            --title 'P101｜移除已完成的临时分支清理器' \
            --body 'P101 v4.1.0 临时分支已按精确白名单清理。本 PR 只删除一次性清理工作流；不修改产品、记录、长期 CI 或其他项目。')
          pr_number=${pr_url##*/}
          gh pr merge "$pr_number" --repo "$repo" --merge --delete-branch

          for i in {1..30}; do
            state=$(gh pr view "$pr_number" --repo "$repo" --json state --jq .state)
            if [[ "$state" == MERGED ]]; then break; fi
            sleep 2
          done
          state=$(gh pr view "$pr_number" --repo "$repo" --json state --jq .state)
          [[ "$state" == MERGED ]] || { echo "Self-removal PR did not merge: $state"; exit 1; }

      - name: Fast-forward long-term branches and remove trigger branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          final_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)
          for branch in p101-stable p101-exp; do
            gh api -X PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$final_sha" -F force=false >/dev/null
          done

          trigger=p101-v410-branch-cleanup-trigger
          encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote("heads/"+sys.argv[1], safe=""))' "$trigger")
          if gh api "repos/$repo/git/ref/$encoded" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/$encoded"
          fi

          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)
          stable_sha=$(gh api "repos/$repo/git/ref/heads/p101-stable" --jq .object.sha)
          exp_sha=$(gh api "repos/$repo/git/ref/heads/p101-exp" --jq .object.sha)
          [[ "$main_sha" == "$stable_sha" && "$main_sha" == "$exp_sha" ]] || {
            echo "Long-term refs are not aligned"; exit 1;
          }

          remaining=$(gh api --paginate "repos/$repo/git/matching-refs/heads/p101-v410" --jq '.[].ref' || true)
          remaining_agent=$(gh api --paginate "repos/$repo/git/matching-refs/heads/agent/p101-v410" --jq '.[].ref' || true)
          if [[ -n "$remaining" || -n "$remaining_agent" ]]; then
            echo "Remaining P101 temporary refs:"
            printf '%s\n%s\n' "$remaining" "$remaining_agent"
            exit 1
          fi
          echo "P101 long-term refs aligned at $main_sha; temporary refs removed."
