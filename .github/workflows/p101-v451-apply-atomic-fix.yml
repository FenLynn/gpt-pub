name: P101 Apply Atomic Save Fix

on:
  push:
    branches: [p101-v451-verification]
    paths:
      - '.github/workflows/p101-v451-apply-atomic-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v451-verification
          fetch-depth: 0
      - name: Apply exact source replacement and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('projects/1-桌面软件/101-Mediova/代码')
          source_path = root / 'internal/config/config.go'
          source = source_path.read_text(encoding='utf-8')
          old = '''\t// Windows cannot atomically replace an existing file with os.Rename. Keep a
          \t// short-lived backup so a power loss never leaves a half-written JSON file.
          \tbak := path + ".bak"
          \t_ = os.Remove(bak)
          \tif _, err := os.Stat(path); err == nil {
          \t\tif err := os.Rename(path, bak); err != nil {
          \t\t\treturn err
          \t\t}
          \t}
          \tif err := os.Rename(tmpName, path); err != nil {
          \t\t_ = os.Rename(bak, path)
          \t\treturn err
          \t}
          \t_ = os.Remove(bak)
          \tok = true
          \treturn nil
          }
          '''
          new = '''\t// Install the fully written temporary file without first moving the
          \t// current primary out of place. On Windows, ReplaceFileW keeps the
          \t// destination intact when permissions, disk state or security software
          \t// reject the replacement. On Unix-like systems os.Rename provides the
          \t// corresponding atomic replacement semantics.
          \tif err := replaceAtomicFile(path, tmpName); err != nil {
          \t\treturn err
          \t}
          \t// A stale recovery backup from an earlier interrupted save is no longer
          \t// authoritative after a successful atomic replacement.
          \t_ = os.Remove(path + ".bak")
          \tok = true
          \treturn nil
          }
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one unsafe atomicWrite block, found {count}')
          source = source.replace(old, new)
          source_path.write_text(source, encoding='utf-8', newline='\n')

          digest = hashlib.sha256(source_path.read_bytes()).hexdigest()
          manifest_path = root / 'SOURCE_FILES_SHA256.txt'
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest, replacements = re.subn(
              r'^[0-9a-f]{64}  internal/config/config\.go$',
              f'{digest}  internal/config/config.go',
              manifest,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit(f'expected one config.go manifest entry, found {replacements}')
          manifest_path.write_text(manifest, encoding='utf-8', newline='\n')
          print(f'config.go sha256={digest}')
          PY
          rm .github/workflows/p101-v451-apply-atomic-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/1-桌面软件/101-Mediova/代码/internal/config/config.go \
                  projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt \
                  .github/workflows/p101-v451-apply-atomic-fix.yml
          git diff --cached --check
          git commit -m 'Mediova｜修复 ACL 拒写时主配置原位保护'
          git push origin HEAD:p101-v451-verification
