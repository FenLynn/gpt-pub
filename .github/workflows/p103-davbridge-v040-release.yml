name: P103 DavBridge v0.4.0 Release

on:
  push:
    branches: [main]
    paths:
      - 'projects/1-桌面软件/103-DavBridge/**'
      - '.github/workflows/p103-davbridge-v040-release.yml'
      - '.github/workflows/p103-davbridge-branch-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: p103-davbridge-v040-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Guard release identity
        id: guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'
          [xml]$xml=Get-Content $project -Raw
          $version=@($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($version -ne '0.4.0') { throw "Expected DavBridge version 0.4.0, got $version" }
          $existing = gh release view p103-v0.4.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            'skip=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'p103-v0.4.0 Release already exists; build/publish steps will be skipped.'
          } else {
            'skip=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Run frozen core smoke
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet restore 'projects/1-桌面软件/103-DavBridge/代码/DavBridge.Smoke/DavBridge.Smoke.csproj'
          dotnet run --project 'projects/1-桌面软件/103-DavBridge/代码/DavBridge.Smoke/DavBridge.Smoke.csproj' -c Release --no-restore

      - name: Build Vue Web UI
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        working-directory: projects/1-桌面软件/103-DavBridge/代码/DavBridge/WebUi
        run: |
          npm install --no-audit --no-fund
          npm run build
          if (!(Test-Path 'dist/index.html' -PathType Leaf)) { throw 'WebUi dist/index.html missing' }

      - name: Restore Windows host
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: dotnet restore 'projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'

      - name: Publish Windows x64 single EXE
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: >-
          dotnet publish 'projects/1-桌面软件/103-DavBridge/代码/DavBridge/DavBridge.csproj'
          -c Release -r win-x64 --self-contained false --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded
          -o build/DavBridge

      - name: Verify release Runtime boundary
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='build/DavBridge/DavBridge.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'DavBridge.exe missing' }
          $unexpected=Get-ChildItem 'build/DavBridge' -File | Where-Object { $_.Name -ne 'DavBridge.exe' }
          if ($unexpected) {
            $unexpected | Select-Object Name,Length | Format-Table
            throw 'DavBridge release Runtime must remain a single-file delivery.'
          }
          foreach ($private in @('config.json','state.json','state.json.bak','secrets.dat','reconcile.json','reconcile.json.bak','DavBridge.log')) {
            if (Get-ChildItem 'build/DavBridge' -Recurse -Force -Filter $private -ErrorAction SilentlyContinue) {
              throw "Private Data leaked into release Runtime: $private"
            }
          }

      - name: Run isolated native-host self-test
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('DavBridge-Release-SelfTest-' + [guid]::NewGuid().ToString('N'))
          $roaming=Join-Path $root 'Roaming'; $local=Join-Path $root 'Local'; $report=Join-Path $root 'self-test.json'
          New-Item $roaming,$local -ItemType Directory -Force | Out-Null
          $oldAppData=$env:APPDATA; $oldLocal=$env:LOCALAPPDATA
          try {
            $env:APPDATA=$roaming; $env:LOCALAPPDATA=$local
            $proc=Start-Process -FilePath (Resolve-Path 'build/DavBridge/DavBridge.exe') -ArgumentList "--self-test=$report" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
              throw "DavBridge release self-test exit code $($proc.ExitCode)"
            }
            if (!(Test-Path $report)) { throw 'DavBridge release self-test report missing' }
            $json=(Get-Content $report -Raw) | ConvertFrom-Json
            if (-not $json.ok -or -not $json.webUiEmbedded -or -not $json.bridgeWhitelistValidated -or $json.coreLogicMovedToJavaScript) {
              throw 'DavBridge v0.4.0 release native-host self-test failed'
            }
          } finally {
            $env:APPDATA=$oldAppData; $env:LOCALAPPDATA=$oldLocal
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare immutable release assets
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item 'release/package' -ItemType Directory -Force | Out-Null
          Copy-Item 'build/DavBridge/DavBridge.exe' 'release/DavBridge-v0.4.0.exe' -Force
          Copy-Item 'build/DavBridge/DavBridge.exe' 'release/package/DavBridge.exe' -Force
          $exeHash=(Get-FileHash 'release/DavBridge-v0.4.0.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "DavBridge.exe  $exeHash" | Set-Content 'release/package/SHA256.txt' -Encoding utf8
          Compress-Archive -Path 'release/package/*' -DestinationPath 'release/DavBridge-v0.4.0-win-x64.zip' -CompressionLevel Optimal -Force
          $zipHash=(Get-FileHash 'release/DavBridge-v0.4.0-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "DavBridge-v0.4.0.exe  $exeHash",
            "DavBridge-v0.4.0-win-x64.zip  $zipHash"
          ) | Set-Content 'release/DavBridge-v0.4.0-SHA256.txt' -Encoding utf8
          @"
          ## DavBridge v0.4.0

          DavBridge v0.4.0 is the first formal release using the Vue 3 + TypeScript + WebView2 UI while retaining the previously verified C#/.NET migration core and safety semantics.

          Highlights:
          * Modern Vue 3 desktop UI hosted by WebView2.
          * Existing DavBridge.Core migration, StrongVerified, SourceChanged, quota/Cycle, reconciliation and controlled-delete logic remains in C#.
          * InfiniCLOUD remains authoritative and read-only.
          * Zotero `.zip + .prop` groups and dual-end SHA-256 verification remain unchanged.
          * Windows x64 framework-dependent single-EXE delivery.
          * Release build re-runs Core Smoke, Vue production build, Runtime privacy boundary and isolated native-host self-test from the tagged main commit.

          Requirements:
          * Windows x64
          * .NET 8 Desktop Runtime
          * Microsoft Edge WebView2 Evergreen Runtime

          Release commit: $env:GITHUB_SHA
          "@ | Set-Content 'release/RELEASE_NOTES.md' -Encoding utf8

      - name: Create GitHub Release from current main commit
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release create p103-v0.4.0 `
            'release/DavBridge-v0.4.0.exe' `
            'release/DavBridge-v0.4.0-win-x64.zip' `
            'release/DavBridge-v0.4.0-SHA256.txt' `
            --target "$env:GITHUB_SHA" `
            --title 'DavBridge v0.4.0' `
            --notes-file 'release/RELEASE_NOTES.md' `
            --verify-tag:$false

      - name: Archive unique LocalSub misnumber history before branch cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $archiveRef='refs/tags/archive/localsub-p103-localsub-exp-20260905'
          $existing=gh api "repos/$repo/git/ref/tags/archive/localsub-p103-localsub-exp-20260905" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $branch=gh api "repos/$repo/git/ref/heads/p103-localsub-exp" --jq '.object.sha' 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($branch)) {
              gh api --method POST "repos/$repo/git/refs" -f ref="$archiveRef" -f sha="$branch" | Out-Null
              Write-Host "Archived p103-localsub-exp at $archiveRef"
            }
          }

      - name: Fast-forward persistent P103 branches to released main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          foreach ($branch in @('p103-stable','p103-exp')) {
            gh api --method PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$env:GITHUB_SHA" -F force=false | Out-Null
            Write-Host "Fast-forwarded $branch to $env:GITHUB_SHA"
          }

      - name: Remove obsolete P103 branches
        shell: pwsh
        run: |
          $repo=$env:GITHUB_REPOSITORY
          $branches=@(
            'p103-do-not-use',
            'p103-stable-safety-anchor',
            'p103-v010-candidate-check',
            'p103-localsub-ci-bootstrap',
            'p103-localsub-exp',
            'integration/main-p103-v040-release'
          )
          foreach ($branch in $branches) {
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "Deleted $branch" }
            else { Write-Host "Branch already absent or not deletable: $branch" }
          }

      - name: Verify final P103 branch set and Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view p103-v0.4.0 --json tagName,name,isDraft,isPrerelease,url,assets | Write-Host
          $refs=gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/heads/p103" | ConvertFrom-Json
          $names=@($refs | ForEach-Object { $_.ref -replace '^refs/heads/','' } | Sort-Object)
          $unexpected=@($names | Where-Object { $_ -notin @('p103-exp','p103-stable') })
          Write-Host ('P103 branches: ' + ($names -join ', '))
          if ($unexpected.Count -gt 0) { throw ('Unexpected P103 branches remain: ' + ($unexpected -join ', ')) }

      - name: Release summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## P103 DavBridge v0.4.0 Release
          - Source branch: main
          - Source commit: ${{ github.sha }}
          - Tag: p103-v0.4.0
          - Product logic: unchanged; release rebuild only
          - Persistent branches after cleanup: p103-exp, p103-stable
          - Global delete-head-branch repository setting: intentionally remains disabled
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
