name: Materialize and verify P102 AtlasDesk v0.8.0

on:
  pull_request:
    branches: [p102-stable]
    paths:
      - 'projects/1-桌面软件/102-AtlasDesk/**'
      - '.github/workflows/p102-atlasdesk-ci.yml'

permissions:
  contents: write

jobs:
  materialize-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize exact v0.8.0 source on p102-exp base
        shell: bash
        run: |
          set -euo pipefail
          chunks='projects/1-桌面软件/102-AtlasDesk/.maintenance/v080'
          cat "$chunks"/chunk-*.txt | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/p102-v080.patch.gz"
          gzip -t "$RUNNER_TEMP/p102-v080.patch.gz"
          gzip -dc "$RUNNER_TEMP/p102-v080.patch.gz" > "$RUNNER_TEMP/p102-v080.patch"
          echo 'de74cc5ea4b50715ef121580dc9cf6fefab409ea1b5d441a2660c534b19065aa  '"$RUNNER_TEMP"'/p102-v080.patch' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin p102-exp
          git switch --detach f8493a0bcb73ed0e05f039144890dc07b5d885fb
          git switch -c p102-v080-source
          git apply --index "$RUNNER_TEMP/p102-v080.patch"
          rm -rf 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-launcher'
          rm -f 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/AtlasDeskIdentitySmoke.cs'
          git add -A
          git diff --cached --check
          git commit -m 'P102｜建立 AtlasDesk v0.8.0 完整项目树'
          git switch -C p102-v080-built origin/p102-exp
          git checkout p102-v080-source -- 'projects/1-桌面软件/102-AtlasDesk'
          rm -rf 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-launcher'
          rm -f 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/AtlasDeskIdentitySmoke.cs'
          rm -rf 'projects/1-桌面软件/102-AtlasDesk/.maintenance'
          git add -A
          git diff --cached --check
          git commit -m 'P102｜重构 AtlasDesk v0.8.0 Runtime/Data 与本地安全'

      - name: Read version
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/Version.props'
          $version = [string]$props.Project.PropertyGroup.WorkbenchVersion
          if ([version]$version -lt [version]'0.8.0') { throw "Unexpected version: $version" }
          "WORKBENCH_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native terminal host
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build\terminal-host mkdir build\terminal-host
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE "projects\1-桌面软件\102-AtlasDesk\代码\personal-workbench-terminal-host\terminal_host.cpp" /link /SUBSYSTEM:WINDOWS /OUT:"build\terminal-host\AtlasDesk.TerminalHost.exe"
          if errorlevel 1 exit /b %errorlevel%
          echo PWB_TERMINAL_HOST_PATH=%CD%\build\terminal-host\AtlasDesk.TerminalHost.exe>>"%GITHUB_ENV%"

      - name: Prepare Runtime terminal assets
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'atlasdesk-xterm'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          npm install --prefix $temp @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0 --ignore-scripts --no-audit --no-fund
          $vendor = 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/TerminalAssets/vendor'
          New-Item -ItemType Directory -Path $vendor -Force | Out-Null
          Copy-Item (Join-Path $temp 'node_modules/@xterm/xterm/lib/xterm.js') (Join-Path $vendor 'xterm.js') -Force
          Copy-Item (Join-Path $temp 'node_modules/@xterm/xterm/css/xterm.css') (Join-Path $vendor 'xterm.css') -Force
          Copy-Item (Join-Path $temp 'node_modules/@xterm/addon-fit/lib/addon-fit.js') (Join-Path $vendor 'addon-fit.js') -Force

      - name: Restore
        run: dotnet restore projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/PersonalWorkbench.Smoke.csproj

      - name: Stamp smoke version
        shell: pwsh
        run: |
          $path = 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/Program.cs'
          $content = Get-Content $path -Raw
          $pattern = 'Check\(WorkbenchVersion\.Current == "[^"]+", "assembly version matches Version\.props"\);'
          $replacement = "Check(WorkbenchVersion.Current == `"$env:WORKBENCH_VERSION`", `"assembly version matches Version.props`");"
          $updated = [regex]::Replace($content, $pattern, $replacement, 1)
          if ($updated -eq $content) { throw 'Smoke version assertion could not be stamped.' }
          Set-Content $path $updated -Encoding UTF8

      - name: Run smoke suite
        run: dotnet run --project projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/PersonalWorkbench.Smoke.csproj -c Release --no-restore

      - name: Verify architecture boundary
        shell: pwsh
        run: |
          $root = 'projects/1-桌面软件/102-AtlasDesk/代码'
          if (Test-Path "$root/personal-workbench-launcher") { throw 'Self-extracting launcher remains.' }
          $identity = Get-Content "$root/personal-workbench-native/ProductIdentity.cs" -Raw
          foreach ($required in @('RuntimeDirectory','RoamingDataDirectory','LocalDataDirectory','TerminalAssetsDirectory')) {
            if ($identity -notmatch $required) { throw "Missing architecture path: $required" }
          }
          if ($identity -match 'MigrateLegacy|LegacyAppData') { throw 'Legacy migration entered product code.' }
          $project = Get-Content "$root/personal-workbench-native/PersonalWorkbench.csproj" -Raw
          if ($project -notmatch '<AssemblyName>AtlasDesk</AssemblyName>') { throw 'Direct AtlasDesk.exe output is not configured.' }
          $all = Get-ChildItem "$root/personal-workbench-native" -Recurse -File | ForEach-Object { Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue }
          if (($all -join "`n") -match '%LOCALAPPDATA%\\AtlasDesk\\App|AtlasDesk\.App\.exe') { throw 'Old AppData Runtime architecture remains.' }

      - name: Publish direct Runtime
        run: >-
          dotnet publish projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/PersonalWorkbench.csproj
          -c Release -r win-x64 --self-contained false --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false
          -o build/runtime

      - name: Assemble and verify Runtime
        shell: pwsh
        run: |
          Copy-Item build/terminal-host/AtlasDesk.TerminalHost.exe build/runtime/AtlasDesk.TerminalHost.exe -Force
          Copy-Item projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/RELEASE_NOTES.txt build/runtime/README.txt -Force
          if (!(Test-Path build/runtime/AtlasDesk.exe)) { throw 'AtlasDesk.exe missing.' }
          foreach ($required in @('terminal.html','terminal-host.js','vendor/xterm.js','vendor/xterm.css','vendor/addon-fit.js')) {
            if (!(Test-Path (Join-Path 'build/runtime/Assets/Terminal' $required))) { throw "Runtime asset missing: $required" }
          }
          foreach ($private in @('settings.json','security.json','vault.bin','task-history.json','atlasdesk.log','WebView2','Cache','Logs')) {
            if (Test-Path (Join-Path build/runtime $private)) { throw "Private Data leaked into Runtime: $private" }
          }
          $folder = "artifacts/AtlasDesk_v$env:WORKBENCH_VERSION`_Runtime"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item build/runtime/* $folder -Recurse -Force
          $files = Get-ChildItem $folder -Recurse -File | Sort-Object FullName | ForEach-Object {
            [pscustomobject]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path $folder), $_.FullName).Replace('\','/')
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [pscustomobject]@{
            product='AtlasDesk'; version=$env:WORKBENCH_VERSION; architecture='win-x64';
            deployment='folder-runtime'; data_roaming='%APPDATA%\AtlasDesk'; data_local='%LOCALAPPDATA%\AtlasDesk'; files=$files
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $folder 'runtime-manifest.json') -Encoding UTF8
          Compress-Archive -Path "$folder/*" -DestinationPath "$folder.zip" -Force

      - name: Push verified source to p102-exp
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:p102-exp

      - name: Upload Runtime
        uses: actions/upload-artifact@v4
        with:
          name: AtlasDesk-v${{ env.WORKBENCH_VERSION }}-Runtime
          path: |
            artifacts/AtlasDesk_v${{ env.WORKBENCH_VERSION }}_Runtime.zip
            artifacts/AtlasDesk_v${{ env.WORKBENCH_VERSION }}_Runtime/runtime-manifest.json
          if-no-files-found: error
