name: Build P102 AtlasDesk

on:
  push:
    branches:
      - main
      - p102-stable
      - p102-exp
    paths:
      - 'projects/1-桌面软件/102-AtlasDesk/代码/**'
      - '.github/workflows/p102-atlasdesk-ci.yml'
  pull_request:
    branches:
      - main
      - p102-stable
    paths:
      - 'projects/1-桌面软件/102-AtlasDesk/**'
      - 'projects/1-桌面软件/README.md'
      - '目录.md'
      - '.github/workflows/p102-atlasdesk-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce P102 pull-request scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" main --depth=1
          bad=()
          while IFS= read -r path; do
            if [[ "$path" =~ ^(projects/1-桌面软件/102-AtlasDesk/|projects/1-桌面软件/README\.md$|目录\.md$|\.github/workflows/p102-atlasdesk-ci\.yml$) ]]; then
              continue
            fi
            if git diff --quiet origin/main -- "$path"; then
              echo "Inherited unchanged from main: $path"
              continue
            fi
            bad+=("$path")
          done < <(git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if (( ${#bad[@]} > 0 )); then
            echo 'Out-of-scope P102 changes that differ from main:'
            printf '%s\n' "${bad[@]}"
            exit 1
          fi

  build:
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read version and verification mode
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/Version.props'
          $version = [string]$props.Project.PropertyGroup.WorkbenchVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'WorkbenchVersion is missing.' }
          try { $parsedVersion = [version]$version }
          catch { throw "WorkbenchVersion is not a valid version: $version" }
          if ($parsedVersion -lt [version]'0.8.0') { throw "AtlasDesk version must not move below 0.8.0: $version" }

          $event = '${{ github.event_name }}'
          $base = '${{ github.base_ref }}'
          $ref = '${{ github.ref_name }}'
          $full = ($event -eq 'workflow_dispatch') -or
                  ($base -eq 'p102-stable') -or
                  ($base -eq 'main') -or
                  ($ref -eq 'p102-stable') -or
                  ($ref -eq 'main')

          "WORKBENCH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FULL_VERIFICATION=$($full.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version=$version FullVerification=$full Event=$event Base=$base Ref=$ref"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native terminal host
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build\terminal-host mkdir build\terminal-host
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE "projects\1-桌面软件\102-AtlasDesk\代码\personal-workbench-terminal-host\terminal_host.cpp" /link /SUBSYSTEM:WINDOWS /OUT:"build\terminal-host\AtlasDesk.TerminalHost.exe"
          if errorlevel 1 exit /b %errorlevel%
          if not exist "build\terminal-host\AtlasDesk.TerminalHost.exe" exit /b 1
          echo PWB_TERMINAL_HOST_PATH=%CD%\build\terminal-host\AtlasDesk.TerminalHost.exe>>"%GITHUB_ENV%"

      - name: Prepare Runtime terminal assets
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'atlasdesk-xterm'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          npm install --prefix $temp @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0 --ignore-scripts --no-audit --no-fund
          $vendor = 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/TerminalAssets/vendor'
          New-Item -ItemType Directory -Path $vendor -Force | Out-Null
          Copy-Item (Join-Path $temp 'node_modules/@xterm/xterm/lib/xterm.js') (Join-Path $vendor 'xterm.js') -Force
          Copy-Item (Join-Path $temp 'node_modules/@xterm/xterm/css/xterm.css') (Join-Path $vendor 'xterm.css') -Force
          Copy-Item (Join-Path $temp 'node_modules/@xterm/addon-fit/lib/addon-fit.js') (Join-Path $vendor 'addon-fit.js') -Force
          foreach ($file in @('xterm.js','xterm.css','addon-fit.js')) {
            if (!(Test-Path (Join-Path $vendor $file))) { throw "Missing terminal asset: $file" }
          }

      - name: Restore app and smoke tests
        shell: pwsh
        run: |
          dotnet restore projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/PersonalWorkbench.Smoke.csproj
          dotnet restore projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-dashboard-isolation-smoke/AtlasDesk.DashboardIsolationSmoke.csproj

      - name: Stamp smoke expected version
        shell: pwsh
        run: |
          $path = 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/Program.cs'
          $content = Get-Content $path -Raw
          $pattern = 'Check\(WorkbenchVersion\.Current == "[^"]+", "assembly version matches Version\.props"\);'
          if (-not [regex]::IsMatch($content, $pattern)) {
            throw 'Smoke-test version assertion could not be located.'
          }
          $replacement = "Check(WorkbenchVersion.Current == `"$env:WORKBENCH_VERSION`", `"assembly version matches Version.props`");"
          $updated = [regex]::Replace($content, $pattern, $replacement, 1)
          if ($updated -ne $content) {
            Set-Content $path $updated -Encoding UTF8
            Write-Host "Stamped smoke expected version: $env:WORKBENCH_VERSION"
          } else {
            Write-Host "Smoke expected version already matches: $env:WORKBENCH_VERSION"
          }

      - name: Run complete smoke suite
        run: dotnet run --project projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-smoke/PersonalWorkbench.Smoke.csproj -c Release --no-restore

      - name: Run isolated startup residency
        timeout-minutes: 2
        run: dotnet run --project projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-residency-smoke/AtlasDesk.ResidencySmoke.csproj -c Release --no-restore

      - name: Run real Dashboard process isolation
        timeout-minutes: 3
        run: dotnet run --project projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-dashboard-isolation-smoke/AtlasDesk.DashboardIsolationSmoke.csproj -c Release --no-restore

      - name: Verify Runtime/Data and security boundary
        shell: pwsh
        run: |
          $root = 'projects/1-桌面软件/102-AtlasDesk/代码'
          if (Test-Path "$root/personal-workbench-launcher") { throw 'Self-extracting launcher remains.' }

          $identity = Get-Content "$root/personal-workbench-native/ProductIdentity.cs" -Raw
          foreach ($required in @('RuntimeDirectory','RoamingDataDirectory','LocalDataDirectory','TerminalAssetsDirectory')) {
            if ($identity -notmatch $required) { throw "Missing architecture path: $required" }
          }
          if ($identity -match 'MigrateLegacy|LegacyAppData') { throw 'Legacy migration entered product code.' }

          $project = Get-Content "$root/personal-workbench-native/PersonalWorkbench.csproj" -Raw
          if ($project -notmatch '<AssemblyName>AtlasDesk</AssemblyName>') { throw 'Direct AtlasDesk.exe output is not configured.' }
          if ($project -notmatch 'QRCoder' -or $project -notmatch 'Konscious.Security.Cryptography.Argon2') {
            throw 'Security dependencies are incomplete.'
          }

          $security = Get-Content "$root/personal-workbench-native/SecurityService.cs" -Raw
          foreach ($required in @('Argon2id','AesGcm','HMACSHA1','MasterPasswordMinimumLength = 20','PinEnabled')) {
            if ($security -notmatch [regex]::Escape($required)) { throw "Missing security boundary: $required" }
          }

          $all = Get-ChildItem "$root/personal-workbench-native" -Recurse -File |
            ForEach-Object { Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue }
          if (($all -join "`n") -match '%LOCALAPPDATA%\\AtlasDesk\\App|AtlasDesk\.App\.exe') {
            throw 'Old AppData Runtime architecture remains.'
          }

      - name: Publish direct Runtime
        if: env.FULL_VERIFICATION == 'true'
        run: >-
          dotnet publish projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native/PersonalWorkbench.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false
          -o build/runtime

      - name: Assemble and verify Runtime
        if: env.FULL_VERIFICATION == 'true'
        shell: pwsh
        run: |
          Copy-Item build/terminal-host/AtlasDesk.TerminalHost.exe build/runtime/AtlasDesk.TerminalHost.exe -Force
          $releaseNotesRoot = 'projects/1-桌面软件/102-AtlasDesk/代码/personal-workbench-native'
          $versionNotes = Join-Path $releaseNotesRoot "RELEASE_NOTES_v$env:WORKBENCH_VERSION.txt"
          $releaseNotes = if (Test-Path $versionNotes) { $versionNotes } else { Join-Path $releaseNotesRoot 'RELEASE_NOTES.txt' }
          Copy-Item $releaseNotes build/runtime/README.txt -Force
          $readmeFirstLine = Get-Content build/runtime/README.txt -TotalCount 1
          if ($readmeFirstLine -notmatch [regex]::Escape("v$env:WORKBENCH_VERSION")) {
            throw "Runtime README version mismatch: $readmeFirstLine"
          }

          # Documentation XML files are build-time reference material, not Runtime dependencies.
          Get-ChildItem build/runtime -File -Filter '*.xml' -ErrorAction SilentlyContinue |
            Remove-Item -Force

          if (!(Test-Path build/runtime/AtlasDesk.exe)) { throw 'AtlasDesk.exe missing.' }
          if (!(Test-Path build/runtime/AtlasDesk.TerminalHost.exe)) { throw 'AtlasDesk.TerminalHost.exe missing.' }

          foreach ($required in @('terminal.html','terminal-host.js','vendor/xterm.js','vendor/xterm.css','vendor/addon-fit.js')) {
            if (!(Test-Path (Join-Path 'build/runtime/Assets/Terminal' $required))) {
              throw "Runtime asset missing: $required"
            }
          }

          foreach ($private in @('settings.json','security.json','vault.bin','task-history.json','atlasdesk.log','WebView2','Cache','Logs','Crash')) {
            if (Test-Path (Join-Path build/runtime $private)) { throw "Private Data leaked into Runtime: $private" }
          }

          if (Get-ChildItem build/runtime -Recurse -File -Filter 'AtlasDesk.App.exe' -ErrorAction SilentlyContinue) {
            throw 'Old extracted application leaked into Runtime.'
          }

          $folder = "artifacts/AtlasDesk_v$env:WORKBENCH_VERSION`_Runtime"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item build/runtime/* $folder -Recurse -Force

          $files = Get-ChildItem $folder -Recurse -File | Sort-Object FullName | ForEach-Object {
            [pscustomobject]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path $folder), $_.FullName).Replace('\','/')
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          [pscustomobject]@{
            product = 'AtlasDesk'
            version = $env:WORKBENCH_VERSION
            architecture = 'win-x64'
            deployment = 'folder-runtime'
            data_roaming = '%APPDATA%\AtlasDesk'
            data_local = '%LOCALAPPDATA%\AtlasDesk'
            files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $folder 'runtime-manifest.json') -Encoding UTF8

          $zip = "$folder.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -Force
          "RUNTIME_ZIP_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "ATLASDESK_EXE_SHA256=$((Get-FileHash (Join-Path $folder 'AtlasDesk.exe') -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Runtime ZIP consistency
        if: env.FULL_VERIFICATION == 'true'
        shell: pwsh
        run: |
          $folder = "artifacts/AtlasDesk_v$env:WORKBENCH_VERSION`_Runtime"
          $zip = "$folder.zip"
          $expanded = Join-Path $env:RUNNER_TEMP 'atlasdesk-runtime-check'
          Remove-Item $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath $expanded -Force

          $manifest = Get-Content (Join-Path $expanded 'runtime-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.product -ne 'AtlasDesk' -or $manifest.version -ne $env:WORKBENCH_VERSION) {
            throw 'Runtime manifest identity mismatch.'
          }
          if ($manifest.deployment -ne 'folder-runtime') { throw 'Runtime deployment mode mismatch.' }

          foreach ($entry in $manifest.files) {
            $path = Join-Path $expanded ($entry.path -replace '/', '\')
            if (!(Test-Path $path -PathType Leaf)) { throw "Manifest file missing: $($entry.path)" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256) { throw "Manifest hash mismatch: $($entry.path)" }
          }

      - name: Upload Runtime
        if: env.FULL_VERIFICATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AtlasDesk-v${{ env.WORKBENCH_VERSION }}-Runtime
          path: |
            artifacts/AtlasDesk_v${{ env.WORKBENCH_VERSION }}_Runtime.zip
            artifacts/AtlasDesk_v${{ env.WORKBENCH_VERSION }}_Runtime/runtime-manifest.json
          if-no-files-found: error

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## AtlasDesk P102
          - Version: $env:WORKBENCH_VERSION
          - Full verification: $env:FULL_VERIFICATION
          - Deployment: folder-runtime
          - Runtime root: user-selected AtlasDesk folder
          - Roaming Data: %APPDATA%\AtlasDesk
          - Local Data: %LOCALAPPDATA%\AtlasDesk
          - Runtime ZIP SHA-256: $env:RUNTIME_ZIP_SHA256
          - AtlasDesk.exe SHA-256: $env:ATLASDESK_EXE_SHA256
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
