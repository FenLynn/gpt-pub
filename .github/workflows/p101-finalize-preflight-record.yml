name: P101 finalize preflight record

on:
  pull_request:
    branches: [p101-exp]
    types: [opened]
    paths:
      - '.github/triggers/p101-finalize-preflight-record.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0

      - name: Finalize Mediova work record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/1-桌面软件/101-Mediova/工作记录.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '当前没有正式启动新的产品版本。`p101-exp` 已完成第一轮不改变媒体处理功能、配置或会话格式的自适应稳定性增强，并正在收口第二阶段恢复协议审查。':
              '当前没有正式启动新的产品版本。`p101-exp` 已完成第一轮不改变媒体处理功能、配置或会话格式的自适应稳定性增强，并已完成第二阶段恢复协议审查。',
              '- 最终长期 P101 CI 以 PR 当前头提交的同步运行结果为合并门槛。':
              '- 最终长期 P101 CI：`30784984858`，在修复头提交 `7d9b891c0301e7c808d8048c6bbde0996a303a31` 上通过；\n- 修复已通过 PR `#289` 合并至 `p101-exp`，合并提交为 `e755ec094897f38088707f831bb1c62d9832de27`。',
              '| 终态结果恢复 | 修复候选 | 完成、跳过和失败结果不因源文件后来移动而被改写 | 专项回归与一次性完整门禁通过；等待长期 P101 CI 和合并 |':
              '| 终态结果恢复 | 已并入实验分支 | 完成、跳过和失败结果不因源文件后来移动而被改写 | 专项回归、一次性完整门禁和长期 P101 CI 均通过；已合并至 `p101-exp` |',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- 'projects/1-桌面软件/101-Mediova/工作记录.md'

      - name: Commit record closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'projects/1-桌面软件/101-Mediova/工作记录.md'
          git commit -m 'Mediova｜收口预备稳定性工作记录'
          git push origin HEAD:p101-exp
