name: P101 Retry v4.5.2 Round 1 Apply

on:
  pull_request:
    branches: [p101-stable]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p101-v452-round1-ui-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-v452-round1-ui-state
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Relax the unique start-glyph matcher and apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round1.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacement = '''        r'\\tglyph := "[^"]*E768"\\n\\tif dis\\.HwndItem != a\\.hStart \\{\\n\\t\\tglyph = secondaryButtonGlyph\\(dis\\.HwndItem\\)\\n\\t\\}\\n\\tlabel := getText\\(dis\\.HwndItem\\)\\n','''
          matches = 0
          for i, line in enumerate(lines):
              if 'glyph :=' in line and 'E768' in line and 'secondaryButtonGlyph' in line:
                  lines[i] = replacement
                  matches += 1
          if matches != 1:
              raise SystemExit(f'expected one start-glyph matcher line, found {matches}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          python projects/1-桌面软件/101-Mediova/代码/tools/apply_v452_round1.py
          rm -f .github/workflows/p101-v452-round1-retry.yml
          cd projects/1-桌面软件/101-Mediova/代码
          go test -count=1 ./...
          cd ../../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mediova｜完成 v4.5.2 第一轮 UI 状态接线'
          git push origin HEAD:p101-v452-round1-ui-state
