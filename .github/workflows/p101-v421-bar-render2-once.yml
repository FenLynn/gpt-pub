name: Fix P101 Mediova v4.2.1 visible list bars current once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p101-v421-bar-render2-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'repo-p101-v421-bar-render2-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current P101 experimental branch
        uses: actions/checkout@v4
        with:
          ref: p101-exp
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair visible list bars and append draw-activity gate
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          main = root / 'cmd/mediaworkbench/main_windows.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          source = main.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected once, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'var taskbarCreatedMessage uint32\nvar uiDPI uint32 = 96\n',
              'var taskbarCreatedMessage uint32\nvar uiDPI uint32 = 96\nvar listCompressionDrawCount atomic.Int64\nvar listProgressDrawCount atomic.Int64\n',
              'drawing counters',
          )

          replace_once(
              '''\tbar := fullCellBarRect(rc)
          \twithRoundedClip(hdc, bar, 3, func() {
          \t\tfillSolid(hdc, bar, colorRef(247, 249, 252))
          \t\tif fraction > 0 {
          \t\t\tfill := bar
          \t\t\tfill.Right = fill.Left + int32(float64(fill.Right-fill.Left)*fraction)
          \t\t\tif fill.Right < fill.Left+3 {
          \t\t\t\tfill.Right = fill.Left + 3
          \t\t\t}
          \t\t\tdrawHorizontalGradient(hdc, fill, colorRef(169, 204, 243), colorRef(76, 138, 220))
          \t\t}
          \t})
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 74))
          ''',
              '''\tbar := fullCellBarRect(rc)
          \t// Draw directly in the ListView custom-draw HDC. Region clipping can
          \t// disappear in PrintWindow and some themed ListView paint paths.
          \tfillSolid(hdc, bar, colorRef(239, 243, 248))
          \tif fraction > 0 {
          \t\tfill := bar
          \t\tfill.Right = fill.Left + int32(float64(fill.Right-fill.Left)*fraction)
          \t\tif fill.Right < fill.Left+3 {
          \t\t\tfill.Right = fill.Left + 3
          \t\t}
          \t\tdrawHorizontalGradient(hdc, fill, colorRef(169, 204, 243), colorRef(76, 138, 220))
          \t}
          \tdrawRoundedBorder(hdc, bar, 3, colorRef(218, 225, 234))
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 74))
          ''',
              'progress render block',
          )

          replace_once(
              '''\tbar := fullCellBarRect(rc)
          \twithRoundedClip(hdc, bar, 3, func() {
          \t\tif task == nil || task.InputSize <= 0 || task.OutputSize <= 0 {
          \t\t\tfillSolid(hdc, bar, colorRef(247, 249, 252))
          \t\t\treturn
          \t\t}
          \t\tvisual := compressionVisualFor(task.InputSize, task.OutputSize)
          \t\tsplit := bar.Left + int32(float64(bar.Right-bar.Left)*visual.InputFraction)
          \t\tif split <= bar.Left {
          \t\t\tsplit = bar.Left + 1
          \t\t}
          \t\tif split >= bar.Right {
          \t\t\tsplit = bar.Right - 1
          \t\t}
          \t\tleft := bar
          \t\tleft.Right = split
          \t\tright := bar
          \t\tright.Left = split
          \t\tfillSolid(hdc, left, colorRef(247, 249, 251))
          \t\tstart, finish := compressionColorPair(visual)
          \t\tdrawHorizontalGradient(hdc, right, start, finish)
          \t})
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 70))
          ''',
              '''\tbar := fullCellBarRect(rc)
          \tfillSolid(hdc, bar, colorRef(239, 243, 248))
          \tif task != nil && task.InputSize > 0 && task.OutputSize > 0 {
          \t\tvisual := compressionVisualFor(task.InputSize, task.OutputSize)
          \t\tsplit := bar.Left + int32(float64(bar.Right-bar.Left)*visual.InputFraction)
          \t\tif split <= bar.Left {
          \t\t\tsplit = bar.Left + 1
          \t\t}
          \t\tif split >= bar.Right {
          \t\t\tsplit = bar.Right - 1
          \t\t}
          \t\tleft := bar
          \t\tleft.Right = split
          \t\tright := bar
          \t\tright.Left = split
          \t\tfillSolid(hdc, left, colorRef(247, 249, 251))
          \t\tstart, finish := compressionColorPair(visual)
          \t\tdrawHorizontalGradient(hdc, right, start, finish)
          \t}
          \tdrawRoundedBorder(hdc, bar, 3, colorRef(218, 225, 234))
          \tdrawCenteredText(hdc, label, bar, uiFontSmall, colorRef(35, 51, 70))
          ''',
              'compression render block',
          )

          replace_once(
              '''\t\tcell := cd.NMCD.Rc
          \t\tif exact, ok := listSubItemBounds(a.hList, int(cd.NMCD.ItemSpec), int(cd.ISubItem)); ok {
          \t\t\tcell = exact
          \t\t}
          ''',
              '''\t\tcell := cd.NMCD.Rc
          \t\tif exact, ok := listSubItemBounds(a.hList, int(cd.NMCD.ItemSpec), int(cd.ISubItem)); ok {
          \t\t\t// Keep the custom-draw vertical band because it matches the HDC
          \t\t\t// clipping band; use exact ListView bounds only for columns.
          \t\t\tcell.Left = exact.Left
          \t\t\tcell.Right = exact.Right
          \t\t}
          ''',
              'custom draw cell bounds',
          )

          replace_once(
              '\t\tif cd.ISubItem == 7 {\n\t\t\t_, label, _ := compressionCellMetrics(&task)\n',
              '\t\tif cd.ISubItem == 7 {\n\t\t\tlistCompressionDrawCount.Add(1)\n\t\t\t_, label, _ := compressionCellMetrics(&task)\n',
              'compression draw counter',
          )
          replace_once(
              '\t\tif cd.ISubItem == 8 {\n\t\t\tfraction, label := progressCellMetrics(&task)\n',
              '\t\tif cd.ISubItem == 8 {\n\t\t\tlistProgressDrawCount.Add(1)\n\t\t\tfraction, label := progressCellMetrics(&task)\n',
              'progress draw counter',
          )

          anchor = '''\tif !report.Checks["list_progress_cells_centered_preferred_height"] {
          \t\treport.Details["list_progress_cells_centered_preferred_height"] = fmt.Sprintf("row=%+v compression=%+v bar=%+v progress=%+v bar=%+v", row, compressionCell, compressionBar, progressCell, progressBar)
          \t}
          \treport.Checks["status_grid_two_rows"] = func() bool {
          '''
          insertion = '''\tif !report.Checks["list_progress_cells_centered_preferred_height"] {
          \t\treport.Details["list_progress_cells_centered_preferred_height"] = fmt.Sprintf("row=%+v compression=%+v bar=%+v progress=%+v bar=%+v", row, compressionCell, compressionBar, progressCell, progressBar)
          \t}
          \tcompressionDrawBefore := listCompressionDrawCount.Load()
          \tprogressDrawBefore := listProgressDrawCount.Load()
          \tprocRedrawWindow.Call(a.hList, 0, 0, RDW_INVALIDATE|RDW_ERASE|RDW_UPDATENOW|RDW_ALLCHILDREN)
          \tcompressionDrawAfter := listCompressionDrawCount.Load()
          \tprogressDrawAfter := listProgressDrawCount.Load()
          \treport.Checks["list_progress_cells_custom_draw_active"] = compressionDrawAfter > compressionDrawBefore && progressDrawAfter > progressDrawBefore
          \tif !report.Checks["list_progress_cells_custom_draw_active"] {
          \t\treport.Details["list_progress_cells_custom_draw_active"] = fmt.Sprintf("compression=%d->%d progress=%d->%d", compressionDrawBefore, compressionDrawAfter, progressDrawBefore, progressDrawAfter)
          \t}
          \treport.Checks["status_grid_two_rows"] = func() bool {
          '''
          replace_once(anchor, insertion, 'native custom draw activity gate')

          main.write_text(source, encoding='utf-8', newline='\n')
          PY
          gofmt -w cmd/mediaworkbench/main_windows.go
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          root = Path('.')
          rel = 'cmd/mediaworkbench/main_windows.go'
          hashes = root / 'SOURCE_FILES_SHA256.txt'
          text = hashes.read_text(encoding='utf-8')
          digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          pattern = rf'^[0-9a-f]{{64}}  {re.escape(rel)}$'
          text, count = re.subn(pattern, f'{digest}  {rel}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('main_windows.go hash entry is not unique')
          hashes.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run full portable gates and Windows compilation
        working-directory: work/projects/1-桌面软件/101-Mediova/代码
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_FILES_SHA256.txt
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./cmd/mediaworkbench -o /tmp/Mediova_tests.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o /tmp/Mediova.exe ./cmd/mediaworkbench
          test -s /tmp/Mediova_tests.exe
          test -s /tmp/Mediova.exe

      - name: Verify exact scope and push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only)"
          expected=$'projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt\nprojects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go'
          if [[ "$changed" != "$expected" ]]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/1-桌面软件/101-Mediova/代码/SOURCE_FILES_SHA256.txt projects/1-桌面软件/101-Mediova/代码/cmd/mediaworkbench/main_windows.go
          git commit -m 'P101: 修复 v4.2.1 列表条形真实绘制'
          git push origin HEAD:p101-exp
