name: Release P101 Mediova v4.2.0 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

concurrency:
  group: p101-v420-release-once
  cancel-in-progress: false

jobs:
  release:
    if: github.head_ref == 'repo-p101-v420-release-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: c8ea2b904a59aa9416763c3397088fd803d24e15
      CI_HEAD: e46a37cc76b30dccfe8349e322d118adf70f46b8
      CI_RUN_ID: '30740707877'
      ARTIFACT_NAME: P101-Mediova-v4.2.0-CI
      TAG_NAME: p101-v4.2.0
      EXE_SHA256: 1261c158d35d5fd3ae97ebfd36a25e72094d2f5d65f8cc091a331c1955d2a72f
      ZIP_SHA256: daf2f9e9f527530c170281fe1bc64e16a23b0d6fbb0bf8a1686f7c32a696bacc
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          ref: c8ea2b904a59aa9416763c3397088fd803d24e15
          fetch-depth: 0

      - name: Verify formal P101 source and CI identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin "$CI_HEAD" --depth=1
          git diff --quiet "$CI_HEAD" "$SOURCE_COMMIT" -- \
            'projects/1-桌面软件/101-Mediova' \
            '.github/workflows/p101-mediova-ci.yml'
          run_head=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .head_sha)
          run_conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .conclusion)
          test "$run_head" = "$CI_HEAD"
          test "$run_conclusion" = 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download fixed formal CI Artifact
        uses: actions/download-artifact@v4
        with:
          name: P101-Mediova-v4.2.0-CI
          path: release-input
          repository: FenLynn/gpt-pub
          run-id: 30740707877
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-verify Runtime, self-test and UI screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -f release-input/Mediova-v4.2.0-Runtime.zip
          test -f release-input/SHA256.txt
          test -f release-input/ci_self_test.json
          test -f release-input/Runtime/runtime-manifest.json
          test -f release-input/ui-preview/Mediova-v4.2.0-video-wide-1650x930.png
          test -f release-input/ui-preview/Mediova-v4.2.0-video-compact-1120x720.png
          test -f release-input/ui-preview/Mediova-v4.2.0-image-1450x820.png
          test -f release-input/ui-preview/Mediova-v4.2.0-held-1450x820.png
          echo "$ZIP_SHA256  release-input/Mediova-v4.2.0-Runtime.zip" | sha256sum -c -
          rm -rf runtime-check release-assets
          mkdir -p runtime-check release-assets
          unzip -q release-input/Mediova-v4.2.0-Runtime.zip -d runtime-check
          echo "$EXE_SHA256  runtime-check/Mediova.exe" | sha256sum -c -
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          root = Path('runtime-check')
          manifest = json.loads((root / 'runtime-manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['product'] == 'Mediova'
          assert manifest['version'] == '4.2.0'
          assert manifest['platform'] == 'Windows x64'
          assert manifest['deployment'] == 'folder-runtime'
          for entry in manifest['files']:
              rel = entry['path'].replace('\\', '/')
              path = root / rel
              assert path.is_file(), rel
              data = path.read_bytes()
              assert len(data) == int(entry['size']), rel
              assert hashlib.sha256(data).hexdigest() == entry['sha256'], rel
          for private in ('config.json','history.json','session.json','crash.log','settings.json','task-history.json','security.json','vault.bin'):
              assert not list(root.rglob(private)), private

          report = json.loads(Path('release-input/ci_self_test.json').read_text(encoding='utf-8-sig'))
          assert report['version'] == '4.2.0'
          assert report['passed'] is True
          checks = report['checks']
          assert len(checks) == 61
          assert all(checks.values())

          def png_size(path: Path):
              data = path.read_bytes()[:24]
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              return struct.unpack('>II', data[16:24])

          expected = {
              'Mediova-v4.2.0-video-wide-1650x930.png': (1650, 930),
              'Mediova-v4.2.0-video-compact-1120x720.png': (1120, 720),
              'Mediova-v4.2.0-image-1450x820.png': (1450, 820),
              'Mediova-v4.2.0-held-1450x820.png': (1450, 820),
          }
          for name, size in expected.items():
              assert png_size(Path('release-input/ui-preview') / name) == size, name

          sha_lines = Path('release-input/SHA256.txt').read_text(encoding='ascii').splitlines()
          assert '1261c158d35d5fd3ae97ebfd36a25e72094d2f5d65f8cc091a331c1955d2a72f  Runtime/Mediova.exe' in sha_lines
          assert 'daf2f9e9f527530c170281fe1bc64e16a23b0d6fbb0bf8a1686f7c32a696bacc  Mediova-v4.2.0-Runtime.zip' in sha_lines
          PY
          cp runtime-check/Mediova.exe release-assets/Mediova.exe
          cp release-input/Mediova-v4.2.0-Runtime.zip release-assets/
          cp release-input/SHA256.txt release-assets/
          cp release-input/ci_self_test.json release-assets/
          cp release-input/Runtime/runtime-manifest.json release-assets/
          cp release-input/ui-preview/*.png release-assets/

      - name: Create immutable tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P101 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            tagged=$(git rev-list -n 1 "$TAG_NAME")
            test "$tagged" = "$SOURCE_COMMIT"
          else
            git tag -a "$TAG_NAME" "$SOURCE_COMMIT" -m 'Mediova v4.2.0'
            git push origin "refs/tags/$TAG_NAME"
          fi
          cat > release-assets/RELEASE_NOTES.md <<'EOF'
          # Mediova v4.2.0

          v4.2.0 重点重构任务状态机与批处理工作流，使“准备中、已入队、转换中、暂停、搁置修改、完成和失败”之间的行为明确且可验证。

          ## 核心变化

          - 视频与图片分别保存输出母目录、最近目录和默认参数。
          - 文件夹导入会在输出母目录下复刻原始相对目录结构。
          - 底部默认参数按字段立即作用于同类型准备中任务；已经入队的任务继续使用冻结快照。
          - 右侧个体编辑支持多选混合值，并仅提交实际修改字段。
          - 转换过程中可继续导入，并向当前活动队列动态追加任务。
          - 队列中、转换中和暂停任务可安全搁置后单独修改；恢复时从 0% 重新开始并保持并发名额。
          - 锁定任务可安全移除，不删除源文件和已经完成的输出文件。
          - 压缩比例与进度轨道保持常驻，总进度按真实任务分母更新。

          ## 安装

          请下载并完整解压 `Mediova-v4.2.0-Runtime.zip`，然后运行其中的 `Mediova.exe`。不要只单独复制 EXE，因为完整 Runtime 还包含 FFmpeg 与 FFprobe 组件。

          ## 正式验证

          - 正式源提交：`c8ea2b904a59aa9416763c3397088fd803d24e15`
          - 固定正式 CI：`30740707877`
          - Linux 与 Windows 原生全测、全量竞态和 go vet：通过
          - 真实 FFmpeg/FFprobe Runtime：通过
          - Runtime manifest 与私人 Data 边界：通过
          - 原生自检：61/61
          - 四套真实 Windows UI 截图：通过尺寸校验
          - Authenticode：未签名

          125%～175% DPI、多显示器和不同 Windows 主题仍保留为真实桌面观察项。
          EOF
          assets=(
            release-assets/Mediova-v4.2.0-Runtime.zip
            release-assets/Mediova.exe
            release-assets/SHA256.txt
            release-assets/ci_self_test.json
            release-assets/runtime-manifest.json
            release-assets/Mediova-v4.2.0-video-wide-1650x930.png
            release-assets/Mediova-v4.2.0-video-compact-1120x720.png
            release-assets/Mediova-v4.2.0-image-1450x820.png
            release-assets/Mediova-v4.2.0-held-1450x820.png
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            gh release edit "$TAG_NAME" --title 'Mediova v4.2.0' --notes-file release-assets/RELEASE_NOTES.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG_NAME" "${assets[@]}" --verify-tag --title 'Mediova v4.2.0' --notes-file release-assets/RELEASE_NOTES.md --latest
          fi
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = 'false'
          test "$(gh release view "$TAG_NAME" --json isPrerelease --jq .isPrerelease)" = 'false'
          test "$(gh release view "$TAG_NAME" --json tagName --jq .tagName)" = "$TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
