name: PUB-P301

on:
  push:
    branches:
      - p301-exp
    paths:
      - "projects/3-文献复核/301-HUB-P302/**"
      - ".github/workflows/p301.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/3-文献复核/301-HUB-P302/**"
      - ".github/workflows/p301.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/3-文献复核/301-HUB-P302

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/3-文献复核/301-HUB-P302/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Compute
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/pub-p301
        run: |
          python src/run_benchmark.py --config config/benchmark.json
          python src/run_transport.py --config config/transport.json
          python src/run_power_flow.py --config config/power_flow.json
          python src/run_curved_gap.py --config config/curved_gap.json
          python src/run_distributed_power.py --config config/distributed_power.json
          python src/run_closed_loop.py --config config/closed_loop.json
          python src/run_thermoelastic_cell.py --config config/thermoelastic_cell.json
